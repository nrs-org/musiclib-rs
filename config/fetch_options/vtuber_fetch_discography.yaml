# Fetch the full discography of a VTuber artist.
#
# Fetching an entity always records all of its structural children (a
# playlist's videos, a track's credits and album); rules only decide which of
# them are also fetched. Children that aren't fetched are stored as stubs. A
# channel's (artist's) children are its discography, and are recorded only
# when fetched.
#
# - YouTube videos are skipped at channel level; only playlists are traversed.
# - Playlists are whitelisted/blacklisted by title (priority order, first match wins).
# - Whitelisted playlists fetch all their tracks via `playlist_all`.
# - Non-YouTube releases (MusicBrainz, Spotify, …) are fetched with `main`.
# - Every discography track fetches its album(s), credited artists and, for a
#   cover, its original, each as a leaf (`track`). An album reached this way
#   records its other tracks as stubs.
# - Releases the artist only appears on (various-artists compilations) are
#   leaves: fetched with their tracklist as stubs.
# - Artist children are stored as leaves (no recursive discography fetch).

main:
  child_rules:
    # Skip all YouTube videos at channel level — only playlists are wanted
    - match: { external_type: "youtube:video" }
      fetch: null

    # Same for a Niconico account's uploads: mostly stream archives, and can
    # run to tens of thousands (Roboco's: 14,000+), each a separate yt-dlp
    # fetch. Under a non-artist parent (e.g. a mylist reached with `main`)
    # these become stubs rather than being dropped.
    - match: { external_type: "nicovideo:video" }
      fetch: null

    # Playlist title filters (priority order, first match wins)

    # Priority 50 — blacklist singing streams
    - match:
        all:
          - { external_type: "youtube:playlist" }
          - { name_regex: "歌枠" }
      fetch: null

    # Priority 50 — blacklist Hakui Koyori's FF7 let's-play playlist: it's not
    # music, but its Japanese description contains "オリジナル" ("original"),
    # a false-positive match against the generic whitelist below.
    - match:
        all:
          - { external_type: "youtube:playlist" }
          - { name_regex: "FINAL FANTASY" }
      fetch: null

    # Priority 20 — per-artist whitelists/blacklists
    - match:
        all:
          - { external_type: "youtube:playlist" }
          - { name_regex: "歌🎶" }              # Usada Pekora
      fetch: playlist_all
    - match:
        all:
          - { external_type: "youtube:playlist" }
          - { name_regex: "Song Introduction" } # AZKi
      fetch: null
    - match:
        all:
          - { external_type: "youtube:playlist" }
          - { name_regex: "お歌の動画だよ" }    # Tokino Sora
      fetch: playlist_all

    # Exact music playlist titles from the Hololive audit (2026-10-23).
    # Anchors matter: game titles, radio shows and music-making streams
    # also contain words such as "music" and "song".
    - match:
        all:
          - { external_type: "youtube:playlist" }
          - any:
              # JP: Botan, Towa (covers), La+ (solo/collaboration covers)
              - { name_regex: "^(歌/song|SONG|歌|コラボうた)$" }
              # ReGLOSS / FLOW GLOW: Ao, Su, Chihaya
              - { name_regex: "^歌った動画／SingingMove$" }
              - { name_regex: "^(歌みた|コラボ 歌みた)$" }
              - { name_regex: "^(official|1st single Flat out)$" }
              # ID: Moona, Ollie (solo/group songs), Kaela
              - { name_regex: "^Moona Music Playlist$" }
              - { name_regex: "^KUREIJI OLLIE - (SOLO|GROUP) SONGS$" }
              - { name_regex: "^Music 🎵$" }
              # EN: Calliope, Ina, Kiara
              - { name_regex: "^Mori Calliope Music$" }
              - { name_regex: "^🎤$" }
              - { name_regex: "^❁(ORIGINALS|MUSIC)❁$" }
              # Gura/Baelz originals; IRyS/Kronii/Cecilia music; Bijou covers
              - { name_regex: "(?i)^((original )?music!?|songs|cover)$" }
              # Fauna, Mumei (Music above), Shiori, Nerissa, FUWAMOCO
              - { name_regex: "^✿ Music ✿$" }
              - { name_regex: "^Music uploads$" }
              - { name_regex: "^(MY MUSIC|FUWAMOCO MUSIC)$" }
              # Elizabeth originals/covers; Gigi
              - { name_regex: "^(ORIGINAL MUSIC|MUSIC) - Elizabeth Rose Bloodflame$" }
              - { name_regex: "^🎵 Music$" }
      fetch: playlist_all

    # Priority 10 — generic music keywords whitelist
    - match:
        all:
          - { external_type: "youtube:playlist" }
          - { name_regex: "(?i)(original song|cover song|楽曲|歌唱|うた動画|歌ってみた|オリジナル曲|オリ曲|music video|カバー曲|covers|オリジナル|MV|歌動画|official music)" }
      fetch: playlist_all

    # Priority 0 — drop all other playlists
    - match: { external_type: "youtube:playlist" }
      fetch: null

    - match: { entry_type: artist }
      fetch: ./no_fetch_discography.yaml::main  # artists fetched as leaves
    - match: { appears_on: true }
      fetch: ./no_fetch_discography.yaml::main  # releases they only appear on: tracklist as stubs
    - match: { entry_type: track }
      fetch: track
    - match: always
      fetch: main                               # non-YouTube releases: their tracklists

playlist_all:
  child_rules:
    - match: { entry_type: artist }
      fetch: ./no_fetch_discography.yaml::main  # artists fetched as leaves

    # Don't fetch full-length stream VODs that slip into whitelisted playlists
    # (they stay in the playlist as stubs) — title matching alone can't tell a
    # short song upload from a raw stream.
    - match:
        all:
          - { entry_type: track }
          - { duration_range: { min: 3600001 } }  # > 1h, in ms
      fetch: null

    - match: { entry_type: track }
      fetch: track                              # every other track in the playlist
    - match: always
      fetch: playlist_all

track:
  child_rules:
    - match: always
      fetch: ./no_fetch_discography.yaml::main  # album(s), credits, original: one hop
