[package]
name = "inference"
version = "0.1.1"
edition = "2024"

[lib]
# cdylib exporting the stable C ABI (bound at runtime via the host's generic
# `ffi` module); rlib so the crate stays unit-testable and can be linked
# directly by the host if desired.
crate-type = ["cdylib", "rlib"]

[features]
# Baseline build is LangID + romaji detection only: no embedding backend, so
# `embed`/`embed_batch` fail and the host script falls back to its own path.
default = []

# MiniLM transformer embeddings via candle (CPU). Heavyweight: pulls candle
# (core/nn/transformers), tokenizers and hf-hub. The only backend behind
# `embed`/`embed_batch`.
minilm = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:hf-hub",
    "dep:anyhow",
    "dep:serde_json",
]

# CPU BLAS backends for candle's float GEMMs (MiniLM) — CPU-only, no CUDA. `mkl`
# links Intel MKL (Linux/Windows), `accelerate` links Apple's Accelerate (macOS).
# Both imply `minilm` (they only accelerate the MiniLM matmuls).
mkl = ["minilm", "candle-core/mkl", "candle-nn/mkl", "candle-transformers/mkl"]
accelerate = [
    "minilm",
    "candle-core/accelerate",
    "candle-nn/accelerate",
    "candle-transformers/accelerate",
]
# Route the LangID int8 FullyConnected layers through MKL's int8 GEMM
# (cblas_gemm_s8u8s32) instead of the pure-Rust loop. Bit-exact with the Rust
# path, ~2.5x faster on the batched workload. NOTE: MKL is currently linked via
# candle's `intel-mkl-src`, so this implies `mkl` (and thus `minilm`/candle).
# Decoupling it would mean a direct intel-mkl-src dep; not done yet.
mkl-langid = ["mkl"]

[dependencies]
fancy-regex = "0.13"

# MiniLM embeddings — CPU-only candle (feature `minilm`; BLAS via `mkl`/`accelerate`).
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
candle-transformers = { version = "0.9", optional = true }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"], optional = true }
hf-hub = { version = "0.4", default-features = false, features = ["ureq"], optional = true }
anyhow = { version = "1", optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
