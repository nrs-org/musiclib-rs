[package]
name = "inference"
version = "0.1.1"
edition = "2024"

[lib]
# cdylib exporting the stable C ABI (bound at runtime via the host's generic
# `ffi` module); rlib so the crate stays unit-testable and can be linked
# directly by the host if desired.
crate-type = ["cdylib", "rlib"]

[features]
# The two parts the soft-dedup scripts bind (config/match.learned.rhai).
default = ["matcher", "typesafe"]

# Learned pair matcher (v17 + rel-v8; docs/plan-v15-runtime.md): LightGBM
# evaluator, pair-facts features and the jp-music-title-encoder (a
# hand-written BERT forward on candle's gemm kernels; candle-core only loads
# the safetensors). Loads its models from a bundle directory at runtime.
matcher = [
    "dep:candle-core",
    "dep:fancy-regex",
    "dep:gemm",
    "dep:rayon",
    "dep:libm",
    "dep:tokenizers",
    "dep:anyhow",
    "dep:serde_json",
    "dep:serde",
    "dep:unicode-normalization",
    "dep:caseless",
    "dep:unicode-general-category",
]

# TypeSafe System One client (src/typesafe.rs): HTTP transport, retry,
# concurrency and a SQLite response cache. Scripts build the requests.
typesafe = [
    "dep:ureq",
    "dep:rusqlite",
    "dep:sha2",
    "dep:anyhow",
    "dep:serde_json",
    "serde_json/raw_value",
    "dep:serde",
]

# Run the matcher's title encoder on a Vulkan GPU via llama.cpp (the bundle's
# encoder/model-f16.gguf), falling back to the CPU encoder when there is no
# discrete GPU. Links the system llama.cpp found by pkg-config (the dev shell
# provides nixpkgs' `llama-cpp-vulkan`) through a small C shim (build.rs).
vulkan = ["matcher", "dep:cc", "dep:pkg-config"]

[dependencies]
# Learned matcher (feature `matcher`): safetensors loading, encoder kernels
# (same versions candle uses), facts JSON and Python-compatible text handling.
candle-core = { version = "0.9", optional = true }
fancy-regex = { version = "0.13", optional = true }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"], optional = true }
anyhow = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
gemm = { version = "0.19", optional = true }
rayon = { version = "1", optional = true }
libm = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
unicode-normalization = { version = "0.1", optional = true }
caseless = { version = "0.2", optional = true }
unicode-general-category = { version = "1", optional = true }

# TypeSafe client (feature `typesafe`), same versions as the host.
ureq = { version = "3.3.0", features = ["json"], optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
sha2 = { version = "0.10", optional = true }

[build-dependencies]
# Feature `vulkan`: compile src/matcher/llama_shim.c against llama.cpp.
cc = { version = "1", optional = true }
pkg-config = { version = "0.3", optional = true }

[dev-dependencies]
serde_json = "1"
