<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Library</title>
<script>
  // YouTube's embed-permission check treats a raw IP-literal origin
  // differently from a named host, so this app only actually embeds videos
  // when browsed via `localhost` — bounce there immediately, before the
  // rest of the page (fonts, app script) even loads. Skipped mid-Spotify-
  // callback (code/state/error present): that round trip has to land back
  // on the same origin (127.0.0.1) its PKCE verifier was stored under —
  // Spotify.handleRedirect() does its own bounce to localhost once it's
  // done, after the token exchange completes.
  (function () {
    if (location.hostname !== "127.0.0.1") return;
    const params = new URLSearchParams(location.search);
    if (params.has("code") || params.has("state") || params.has("error") || params.has("spotify_connect")) return;
    const port = location.port ? ":" + location.port : "";
    location.replace(location.protocol + "//localhost" + port + location.pathname + location.search + location.hash);
  })();
</script>

<style>
  :root {
    color-scheme: light;
    --paper: #e7e1cc;
    --paper-deep: #dbd3b8;
    --paper-deeper: #cfc6a6;
    --ink: #24281f;
    --ink-soft: #5b5e4f;
    --ink-faint: #85886f;
    --rail: #c7bc9c;
    --brass: #8a6a34;
    --brass-ink: #6b4f21;
    --verdigris: #4b6b5e;
    --danger: #8c3b2e;
    --type-artist: #6d5788;
    --type-release-group: #3f6690;
    --type-release: #5f7a30;
    --type-track: #9c4f74;
    --serif: "Fraunces", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --sans: "IBM Plex Sans", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", ui-monospace, monospace;
    --player-bar-h: 92px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --paper: #1b1f18;
      --paper-deep: #242820;
      --paper-deeper: #2f342a;
      --ink: #e7e2d1;
      --ink-soft: #a8ab97;
      --ink-faint: #767a65;
      --rail: #3a3e30;
      --brass: #cda45c;
      --brass-ink: #e3c079;
      --verdigris: #7fa391;
      --danger: #d98b7a;
      --type-artist: #b79ad1;
      --type-release-group: #8fb4dd;
      --type-release: #a3c26e;
      --type-track: #d692ae;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--paper);
  }

  button, input {
    font: inherit;
    color: inherit;
  }

  :focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  .app {
    display: grid;
    grid-template-columns: 320px 1fr;
    height: 100vh;
  }

  /* ---------- rail: the drawer ---------- */

  .rail {
    border-right: 1px solid var(--rail);
    display: flex;
    flex-direction: column;
    min-width: 0;
    /* Grid items don't clip their own overflow by default — without this,
       a rail-foot taller than the available height (a short/narrow
       viewport, or the Spotify setup form) bleeds past the grid cell and
       overlaps `main` instead of scrolling within the rail. */
    overflow-y: auto;
  }

  .rail-head {
    padding: 20px 18px 14px;
    border-bottom: 1px solid var(--rail);
  }

  .rail-head-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 0 0 12px;
  }

  .wordmark {
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 500;
    margin: 0;
    letter-spacing: 0.01em;
  }

  /* ---------- mode switcher: Library / Graph / Player ---------- */

  .mode-switcher {
    display: flex;
    gap: 6px;
    margin: 0 0 12px;
  }

  .mode-switcher button {
    flex: 1;
    border: 1px solid var(--rail);
    background: var(--paper-deep);
    color: var(--ink-soft);
    padding: 6px 4px;
    font-size: 12px;
    cursor: pointer;
  }

  .mode-switcher button:hover { color: var(--ink); }

  .mode-switcher button[aria-pressed="true"] {
    border-color: var(--brass);
    background: var(--paper);
    color: var(--brass-ink);
  }

  .search-slot {
    border: 1px solid var(--rail);
    background: var(--paper-deep);
    display: flex;
    align-items: center;
    padding: 0 10px;
  }

  .search-slot svg {
    flex: none;
    opacity: 0.6;
  }

  #search {
    flex: 1;
    background: transparent;
    border: none;
    padding: 9px 8px;
    font-size: 14px;
    min-width: 0;
  }

  #search:focus { outline: none; }
  #search::placeholder { color: var(--ink-faint); }

  .results {
    list-style: none;
    margin: 0;
    padding: 0;
    overflow-y: auto;
    flex: 1;
  }

  .result {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--rail);
    padding: 10px 18px 10px 15px;
    cursor: pointer;
    position: relative;
  }

  .result::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: transparent;
  }

  .result:hover { background: var(--paper-deep); }

  .result[aria-selected="true"] {
    background: var(--paper-deep);
  }

  .result[aria-selected="true"]::before {
    background: var(--brass);
  }

  .result-title {
    display: block;
    overflow-wrap: anywhere;
  }

  .result-group-label {
    padding: 10px 18px 4px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
  }

  .result-group-label:first-child {
    padding-top: 14px;
  }

  .rail-status {
    margin: 0;
    padding: 14px 18px;
    color: var(--ink-soft);
  }

  .rail-foot {
    border-top: 1px solid var(--rail);
    padding: 12px 18px 16px;
    flex: none;
  }

  .rail-foot-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    margin: 0 0 8px;
  }

  .rail-foot-label .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ink-faint);
    flex: none;
  }

  .rail-foot-label .dot.on { background: var(--verdigris); }

  .rail-foot p.hint {
    margin: 0 0 8px;
    color: var(--ink-soft);
    font-size: 12px;
    line-height: 1.4;
  }

  .rail-foot-row {
    display: flex;
    gap: 6px;
  }

  .rail-foot input[type="text"] {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--rail);
    background: var(--paper-deep);
    padding: 6px 8px;
    font-size: 12px;
    font-family: var(--mono);
  }

  .ghost-btn {
    border: 1px solid var(--rail);
    background: transparent;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }

  .ghost-btn:hover { border-color: var(--brass); color: var(--brass-ink); }

  .rail-head-actions { display: inline-flex; gap: 4px; }

  #shuffle-mix {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: var(--mono);
    font-size: 11px;
  }

  .ghost-btn[disabled] {
    opacity: 0.4;
    cursor: default;
  }

  .ghost-btn[disabled]:hover {
    border-color: var(--rail);
    color: inherit;
  }

  .redirect-box {
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--rail);
    background: var(--paper-deep);
    padding: 5px 6px 5px 8px;
  }

  .redirect-box code {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: var(--mono);
    font-size: 11px;
  }

  .rail-foot-error {
    margin: 8px 0 0;
    color: var(--danger);
    font-size: 12px;
  }

  /* ---------- ingest: "add a song" panel + its job list ---------- */

  .ingest-jobs {
    list-style: none;
    margin: 10px 0 0;
    padding: 0;
  }

  .ingest-job {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 7px 0;
    border-top: 1px solid var(--rail);
  }

  .ingest-job-status {
    flex: none;
    width: 14px;
    height: 14px;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ingest-job-spinner {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 2px solid var(--rail);
    border-top-color: var(--brass);
    animation: ingest-spin 800ms linear infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    .ingest-job-spinner { animation: none; }
  }

  @keyframes ingest-spin {
    to { transform: rotate(360deg); }
  }

  .ingest-job-status.done { color: var(--verdigris); }
  .ingest-job-status.error { color: var(--danger); }

  .ingest-job-body {
    flex: 1;
    min-width: 0;
  }

  .ingest-job-query {
    overflow-wrap: anywhere;
    color: var(--ink-soft);
    font-size: 12px;
  }

  .ingest-job-detail {
    margin: 2px 0 0;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
  }

  .ingest-job-detail.error { color: var(--danger); }

  /* live activity panel: fetched/failed counters, recent fetch-event log,
     per-domain HTTP in-flight/done — the server-side answer to the `import`
     CLI's progress bars, rendered from `JobProgress.detail` (see
     `ingest_progress::JobProgressSink`). */
  .ingest-job-activity {
    margin-top: 4px;
    padding: 6px 8px;
    background: var(--paper-deep);
    border: 1px solid var(--rail);
  }

  .ingest-job-counters {
    margin: 0 0 4px;
    display: flex;
    gap: 10px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
  }

  .ingest-job-counter-failed { color: var(--danger); }

  .ingest-job-failures {
    margin: 0 0 4px;
    font-family: var(--mono);
    font-size: 10.5px;
  }

  .ingest-job-failures summary {
    cursor: pointer;
    color: var(--danger);
    list-style: none;
  }

  .ingest-job-failures summary::-webkit-details-marker { display: none; }
  .ingest-job-failures summary::before { content: "▸ "; }
  .ingest-job-failures[open] summary::before { content: "▾ "; }

  .ingest-job-failures-list {
    list-style: none;
    margin: 4px 0 0;
    padding: 0;
    max-height: 160px;
    overflow-y: auto;
    line-height: 1.5;
    color: var(--ink-soft);
  }

  .ingest-job-failures-list li {
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    border-top: 1px solid var(--rail);
    padding: 2px 0;
  }

  .ingest-job-failures-list li:first-child { border-top: none; }

  .ingest-job-log {
    list-style: none;
    margin: 0 0 4px;
    padding: 0;
    max-height: 96px;
    overflow-y: auto;
    font-family: var(--mono);
    font-size: 10.5px;
    line-height: 1.5;
    color: var(--ink-faint);
  }

  .ingest-job-log li {
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }

  .ingest-job-log li:last-child { color: var(--ink-soft); }

  .ingest-job-domains {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 10px;
    font-family: var(--mono);
    font-size: 10.5px;
  }

  .ingest-job-domains li {
    display: flex;
    gap: 5px;
    color: var(--ink-faint);
  }

  .ingest-job-domains li.active { color: var(--brass); }

  .ingest-job-domain-host { overflow-wrap: anywhere; }

  .ingest-job-cancel {
    flex: none;
    border: 1px solid var(--rail);
    background: none;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 11px;
    padding: 3px 8px;
    line-height: 1;
    align-self: flex-start;
  }

  .ingest-job-cancel:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }
  .ingest-job-cancel:disabled { opacity: 0.6; cursor: default; }

  .ingest-job-download {
    flex: none;
    border: 1px solid var(--rail);
    background: none;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 11px;
    padding: 3px 8px;
    line-height: 1;
    align-self: flex-start;
  }

  .ingest-job-download:hover { border-color: var(--brass); color: var(--brass); }

  .ingest-job-link {
    display: inline-block;
    margin-top: 2px;
    border: none;
    background: none;
    padding: 0;
    font: inherit;
    font-size: 12px;
    color: var(--verdigris);
    text-decoration: none;
    cursor: pointer;
  }

  .ingest-job-link:hover { text-decoration: underline; }

  .ingest-job-dismiss {
    flex: none;
    border: none;
    background: none;
    color: var(--ink-faint);
    cursor: pointer;
    font-size: 13px;
    padding: 0 2px;
    line-height: 1;
  }

  .ingest-job-dismiss:hover { color: var(--ink); }

  /* ---------- import mode: dedicated full-page "add a song" screen,
     replacing the old rail-foot mini box — same job-row markup/CSS above,
     just given room to breathe ---------- */

  .import-view {
    max-width: 640px;
    margin: 0 auto;
    padding: 44px 28px 40px;
  }

  .import-form {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 4px 0 6px;
  }

  .import-url-input {
    flex: 1 1 280px;
    min-width: 0;
    border: 1px solid var(--rail);
    background: var(--paper-deep);
    padding: 10px 12px;
    font-size: 14px;
  }

  .import-url-input:focus { outline: none; border-color: var(--brass); }

  .import-select {
    flex: none;
    border: 1px solid var(--rail);
    background: var(--paper-deep);
    color: var(--ink);
    padding: 0 8px;
    font-size: 13px;
    font-family: var(--mono);
  }

  .import-jobs .ingest-job {
    padding: 10px 0;
  }

  .import-jobs .ingest-job-query {
    font-size: 13px;
  }

  .import-jobs .ingest-job-detail,
  .import-jobs .ingest-job-link {
    font-size: 12px;
  }

  /* ---------- settings mode ---------- */

  .settings-view {
    max-width: 640px;
    margin: 0 auto;
    padding: 44px 28px 40px;
  }

  .settings-section + .settings-section {
    margin-top: 36px;
  }

  .settings-section h2 {
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 500;
    margin: 0 0 4px;
  }

  .settings-section p.sub {
    color: var(--ink-soft);
    margin: 0 0 16px;
  }

  .provider-pref-list {
    list-style: none;
    margin: 0;
    padding: 0;
    border: 1px solid var(--rail);
  }

  .provider-pref-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    background: var(--paper-deep);
  }

  .provider-pref-row + .provider-pref-row {
    border-top: 1px solid var(--rail);
  }

  .provider-pref-rank {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
    width: 1.4em;
    flex: none;
  }

  .provider-pref-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex: none;
  }

  .provider-pref-name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .provider-pref-moves {
    display: flex;
    gap: 4px;
    flex: none;
  }

  .provider-pref-moves button {
    border: 1px solid var(--rail);
    background: transparent;
    color: inherit;
    width: 24px;
    height: 24px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .provider-pref-moves button:hover:not([disabled]) { border-color: var(--brass); color: var(--brass-ink); }

  .provider-pref-moves button[disabled] {
    opacity: 0.3;
    cursor: default;
  }

  /* ---------- settings mode: shuffle mix ---------- */

  .settings-view.has-mix { max-width: 720px; }

  .mix-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .mix-seg {
    display: inline-flex;
    border: 1px solid var(--rail);
  }

  .mix-seg button {
    border: 0;
    background: transparent;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
  }

  .mix-seg button + button { border-left: 1px solid var(--rail); }
  .mix-seg button:hover { color: var(--brass-ink); }

  .mix-seg button[aria-pressed="true"] {
    background: var(--paper-deeper);
    color: var(--brass-ink);
  }

  .mix-pool {
    font-size: 12px;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin: 0 0 14px;
  }

  .mix-pool .ghost-btn { padding: 2px 8px; }
  .mix-pool.is-error { color: var(--danger); }

  .mix-pool details { flex-basis: 100%; }
  .mix-pool summary { cursor: pointer; color: var(--ink-faint); }

  .mix-pool details ul {
    margin: 6px 0 0;
    padding-left: 18px;
    max-height: 160px;
    overflow-y: auto;
  }

  .mix-bar {
    display: flex;
    height: 16px;
    border: 1px solid var(--rail);
    background: var(--paper-deep);
    overflow: hidden;
  }

  .mix-bar span { transition: flex-grow 120ms ease-out; min-width: 0; }

  .mix-legend {
    display: flex;
    gap: 6px 14px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--ink-soft);
    margin: 6px 0 4px;
  }

  .mix-legend b {
    font-family: var(--mono);
    font-weight: 500;
    color: var(--ink);
  }

  .mix-swatch {
    display: inline-block;
    width: 9px;
    height: 9px;
    margin-right: 5px;
    vertical-align: 0;
  }

  .mix-new {
    background: repeating-linear-gradient(135deg, var(--ink-faint) 0 1.5px, transparent 1.5px 5px);
  }

  .mix-group { margin-top: 22px; }

  .mix-group h3 {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 6px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--rail);
  }

  .mix-row {
    display: grid;
    grid-template-columns: 190px minmax(0, 1fr) 64px;
    align-items: center;
    gap: 2px 12px;
    padding: 5px 0;
  }

  .mix-row > label,
  .mix-row > .mix-label {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
  }

  .mix-row input[type="range"] {
    width: 100%;
    margin: 0;
    accent-color: var(--brass);
  }

  .mix-row input[type="range"]:disabled { opacity: 0.35; }

  .mix-row input[type="checkbox"],
  .mix-check input {
    accent-color: var(--brass);
    margin: 0;
  }

  .mix-row output {
    font-family: var(--mono);
    font-size: 12px;
    text-align: right;
  }

  .mix-count {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
  }

  .mix-hint {
    grid-column: 2 / -1;
    font-size: 12px;
    color: var(--ink-faint);
  }

  .mix-check {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .mix-row.is-off > label { color: var(--ink-faint); }

  .mix-chart svg {
    display: block;
    width: 100%;
    height: 120px;
    overflow: visible;
  }

  .mix-chart .bin { fill: var(--paper-deeper); }
  .mix-chart .curve { fill: none; stroke: var(--brass); stroke-width: 1.6; }
  .mix-chart .axis { stroke: var(--rail); }
  .mix-chart .floor { stroke: var(--danger); stroke-dasharray: 3 3; }

  .mix-chart text {
    font-family: var(--mono);
    font-size: 10px;
    fill: var(--ink-faint);
  }

  .mix-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px;
    margin-top: 10px;
  }

  .mix-stat {
    border: 1px solid var(--rail);
    background: var(--paper-deep);
    padding: 7px 9px;
  }

  .mix-stat b {
    display: block;
    font-family: var(--serif);
    font-size: 19px;
    font-weight: 500;

    padding: 0;

  .mix-list li {

  .mix-list .n {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
  }

  .mix-list .t {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .mix-list .why {
    font-size: 11px;
    color: var(--ink-soft);
    max-width: 240px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;

  .mix-list .p {

    font-size: 11px;

    bottom: 0;

    height: 7px;

  @media (max-width: 560px) {
    .mix-row { grid-template-columns: minmax(0, 1fr) 56px; }
    .mix-row > label,
    .mix-row > .mix-label { grid-column: 1 / -1; }
    .mix-hint { grid-column: 1 / -1; }
    .mix-list .why { display: none; }
    .mix-list li { grid-template-columns: 1.8em minmax(0, 1fr) 46px; }
  }

  /* ---------- main: browsing / entry detail ---------- */

  .edition-btn {

  }

  .edition-btn:hover { border-color: var(--ink-soft); color: var(--ink); }

  .edition-btn[aria-current="true"] {
    border-color: var(--verdigris);

  /* ---------- manual soft-merge (dedup calibration) ---------- */

  .merge-section {
    margin-bottom: 28px;
  }

  .merge-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--verdigris);
    margin: 0 0 8px;
  }

  .dedup-graph {
    position: relative;
    border: 1px solid var(--rail);
    background: var(--paper-deep);
    margin-bottom: 10px;
    width: 100%;
    height: 320px;
    overflow: hidden;
  }

  .dedup-graph.drag-over {
    border-color: var(--brass);
    box-shadow: inset 0 0 0 1px var(--brass);
  }

  /* ---------- graph mode: the same editor, given a full screen instead of
     a 320px box inside the entry-detail card ---------- */

  #view-graph {
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 24px 28px;
    overflow: hidden;
  }

  #view-graph[hidden] { display: none; }

  #view-graph .merge-section {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    margin-bottom: 0;
    /* Positioning context for `.graph-detail-panel` below, which floats
       over the canvas rather than sitting in the flex flow. */
    position: relative;
  }

  #view-graph .dedup-graph {
    /* The canvas is now the *only* flex item competing for height here —
       the detail panel is taken out of flow (see below) — so its size
       stays constant regardless of how much the panel's content grows or
       shrinks (a long edge/relation-kind picker used to visibly steal
       height from the canvas since both were flex siblings). */
    flex: 1;
    min-height: 0;
    height: auto;
  }

  #view-graph .graph-detail-panel {
    /* Floats over the bottom of the canvas instead of pushing it — its own
       content (node details, edge actions, the create-link kind picker)
       can grow or shrink freely without ever resizing the graph beneath
       it. Scrolls internally past `max-height` rather than growing further. */
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    max-height: 28vh;
    overflow-y: auto;
    box-shadow: 0 -6px 16px rgba(0, 0, 0, 0.18);
  }

  .graph-empty {
    max-width: 420px;
    margin: 14vh auto 0;
    padding: 0 24px;
    text-align: left;
    color: var(--ink-soft);
  }

  .graph-svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  .node circle,
  .node rect {
    fill: var(--paper);
    stroke: var(--ink-faint);
    stroke-width: 1.5px;
    cursor: pointer;
  }

  /* Fill hue is the entry's type (track/release/release_group/artist);
     shape (circle vs. square, set in JS by `.node.structural`) and stroke
     stay reserved for dedup-graph role, so the two encodings never fight
     over the same channel. Nodes with no known type keep the plain paper
     fill from the base rule above. */
  .node.type-artist circle,
  .node.type-artist rect {
    fill: var(--type-artist);
  }
  .node.type-release_group circle,
  .node.type-release_group rect {
    fill: var(--type-release-group);
  }
  .node.type-release circle,
  .node.type-release rect {
    fill: var(--type-release);
  }
  .node.type-track circle,
  .node.type-track rect {
    fill: var(--type-track);
  }

  /* Structural nodes stay visually "recessed" relative to dedup-graph
     members — same type hue, just faded — rather than losing the type
     color to a flat override. */
  .node.structural circle,
  .node.structural rect {
    fill-opacity: 0.45;
  }

  .node.self circle {
    stroke: var(--brass-ink);
    stroke-width: 3px;
  }

  .node.selected-for-link circle,
  .node.selected-for-link rect {
    stroke: var(--verdigris);
    stroke-width: 3px;
  }

  /* `paint-order: stroke` + a wide stroke in the page background color fakes
     a label background halo without measuring text width for a real <rect>
     behind it — the text itself is unaffected since fill paints on top.
     Labels live in their own layer stacked above every node shape (see
     labelLayer), not nested in their own node's <g>, so one node's shape
     can never paint over a different node's label. */
  .node-label {
    font-family: var(--mono);
    font-size: 10px;
    fill: var(--ink);
    paint-order: stroke;
    stroke: var(--paper-deep);
    stroke-width: 3px;
    stroke-linejoin: round;
    pointer-events: none;
    user-select: none;
  }

  /* Culled by updateLabelVisibility() when it would overlap a
     higher-priority label — the node shape stays put, only the text goes;
     hovering still shows the title via the floating .graph-hover-label. */
  .node-label.label-hidden {
    display: none;
  }

  .edge {
    stroke: var(--ink-faint);
    stroke-width: 2px;
    /* Purely decorative now — all pointer events go to the wider
       `.edge-hit` line stacked on the same path (see the edge join in
       `update()`), so a 1.5–4px visible stroke doesn't also mean a
       1.5–4px-wide click/hover target. */
    pointer-events: none;
  }

  .edge.dedup {
    cursor: pointer;
  }

  .edge-hit {
    fill: none;
    stroke: transparent;
    stroke-width: 14px;
    pointer-events: stroke;
    /* Every edge opens its details on click now, structural included (see
       the edge join in `update()`), so every edge gets the pointer cursor —
       not just dedup edges like before the click behavior was unified. */
    cursor: pointer;
  }

  /* active: a live link. hover hints "click unlinks" (red). */
  .edge.dedup.active-manual {
    stroke: var(--verdigris);
  }
  .edge.dedup.active-heuristic {
    stroke: var(--verdigris);
    stroke-dasharray: 5 3;
  }
  /* The visible line is `pointer-events: none` (see `.edge` above) so it can
     never itself match `:hover` — the interactive element is `.edge-hit`,
     a sibling under the same `.edge-item` group, so hover state has to key
     off that ancestor instead of the line being recolored. */
  .edge-item:hover .edge.dedup.active-manual,
  .edge-item:hover .edge.dedup.active-heuristic {
    stroke: var(--danger);
  }

  /* suggested: plain-unlinked, disabled but the row survives — dashed,
     faint, one click from being restored. hover hints "click re-links". */
  .edge.dedup.suggested {
    stroke-dasharray: 3 4;
    opacity: 0.6;
  }
  .edge-item:hover .edge.dedup.suggested {
    stroke: var(--verdigris);
    opacity: 1;
  }

  /* blocked: force-unlinked (different_identity) — a hard "no", shown
     solid red. hover hints "click softens it back", not "click restores". */
  .edge.dedup.blocked {
    stroke: var(--danger);
    stroke-width: 2.5px;
  }
  .edge-item:hover .edge.dedup.blocked {
    stroke: var(--brass);
  }

  /* related: a RELATE_KINDS version-kind annotation (cover/remix/same_artist/…)
     — a real connection, but not an identity assertion, so it gets its own
     hue (brass) rather than borrowing active's verdigris. */
  .edge.dedup.related {
    stroke: var(--brass-ink);
    stroke-dasharray: 2 3;
  }
  .edge-item:hover .edge.dedup.related {
    stroke: var(--brass);
  }

  /* cleared: a disabled different_identity or RELATE_KINDS row — asserts
     nothing right now, but the row survives and is one click from being
     restored, so it still gets a (very faint) line rather than vanishing. */
  .edge.dedup.cleared {
    stroke-dasharray: 1 4;
    opacity: 0.35;
  }
  .edge-item:hover .edge.dedup.cleared {
    stroke: var(--ink-faint);
    opacity: 0.8;
  }

  .edge.structural {
    stroke-dasharray: 5 3;
    stroke-width: 1.5px;
  }
  .edge-item:hover .edge.structural {
    stroke: var(--brass-ink);
  }

  /* The dangling "creating a link" line — see `pendingLine` — is purely
     decorative (the real hit-testing for picking the second node stays on
     the node shapes themselves), so it never intercepts pointer events. */
  .pending-link-line {
    stroke: var(--verdigris);
    stroke-width: 2px;
    stroke-dasharray: 4 3;
    pointer-events: none;
    opacity: 0;
  }
  .pending-link-line.visible {
    opacity: 0.85;
  }

  .graph-arrowhead path {
    fill: var(--ink-faint);
  }

  .graph-hover-label {
    position: absolute;
    z-index: 5;
    pointer-events: none;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--mono);
    font-size: 11px;
    padding: 3px 6px;
    max-width: 220px;

    overflow: hidden;

  }

  .graph-detail-panel {
    border: 1px solid var(--rail);
    background: var(--paper-deep);
    padding: 10px;
    margin-bottom: 10px;
  }

  .graph-detail-title {
    font-size: 14px;

  }

  .graph-detail-type {

  }

  .graph-detail-empty {

  .graph-detail-actions {
    display: flex;
    flex-wrap: wrap;

  }

  .graph-detail-relate {

    gap: 6px;

  .graph-detail-relate-select {

  }

  .merge-picker {
    margin-top: 10px;
    border: 1px solid var(--rail);
    background: var(--paper-deep);
    padding: 10px;
  }

  .merge-picker-hint {

  .merge-picker-results {

  }

  .merge-picker-option {

  .merge-picker-empty {

  .merge-picker-error {

  /* ---------- play call-to-action (on an entry's own page) ---------- */

  .play-cta-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 4px 0 28px;
  }

  .play-cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: none;
    border-radius: 999px;
    background: var(--verdigris);

    padding: 10px 22px 10px 18px;

    cursor: pointer;

  .play-cta.is-playing {

    color: var(--ink);

  .play-cta-icon { font-size: 13px; }

  .queue-cta {

    align-items: center;
    gap: 5px;
    border-radius: 999px;
  }

  .manifest-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    margin: 0 0 4px;
    padding-top: 4px;
    border-top: 1px solid var(--rail);
  }

  .manifest {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .manifest-row {
    display: flex;
    width: 100%;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--rail);
    padding: 6px 4px;
  }

  .manifest-no {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-faint);
    flex: none;
    width: 2em;
    text-align: right;
  }

  .manifest-play,
  .manifest-queue {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    padding: 0;
    background: transparent;
    border: none;
    border-radius: 50%;
    color: var(--ink-soft);
    cursor: pointer;
  }

  .manifest-play:hover,
  .manifest-queue:hover { background: var(--paper-deeper); color: var(--ink); }

  .manifest-play[disabled],
  .manifest-queue[disabled] {
    color: var(--ink-faint);
    cursor: default;
  }

  .manifest-play[disabled]:hover,
  .manifest-queue[disabled]:hover { background: transparent; }

  .manifest-title {
    flex: 1;
    text-align: left;
    background: transparent;
    border: none;

    margin: -4px;

    color: inherit;
    cursor: pointer;
    overflow-wrap: anywhere;
  }

  .manifest-title:hover { text-decoration: underline; }

  .manifest-row.is-playing .manifest-no,
  .manifest-row.is-playing .manifest-play,
  .manifest-row.is-playing .manifest-title {
    color: var(--verdigris);
  }

  .manifest-row.is-playing .manifest-title {
    font-weight: 500;
  }

  /* ---------- persistent player: floating dock + bottom bar ---------- */
  /*
   * Deliberately kept OUTSIDE `.app` and never touched by an entry-view
   * re-render: browsing the library only ever rewrites `main`'s contents,
   * so whatever's mounted here — the YouTube iframe, the Spotify SDK
   * connection — keeps running undisturbed while you look around.
   */

  #player-dock {
    position: fixed;
    right: 20px;
    bottom: calc(var(--player-bar-h) + 20px);
    width: min(400px, calc(100vw - 40px));
    z-index: 60;
    border: 1px solid var(--rail);
    background: var(--ink);
    box-shadow: 0 20px 44px rgba(0, 0, 0, 0.35);
  }

  #player-dock[hidden] { display: none; }

  .player-dock-surface {
    position: relative;
    overflow: hidden;
  }

  .player-dock-surface.video {
    aspect-ratio: 16 / 9;
  }

  .player-dock-surface.video iframe,
  .player-dock-surface.video .yt-mount,
  .player-dock-surface.video .yt-mount iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  .player-dock-surface.video .yt-mount {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 16px;
    text-align: center;
  }

  .player-dock-surface.video .yt-mount .note {
    color: var(--paper);
    border-left: none;
    margin: 0;
    padding: 0;
    font-size: 12px;
  }

  .player-dock-surface.compact {
    padding: 20px 16px;
    background: var(--paper-deep);
    color: var(--ink);
  }

  .player-dock-spotify-title {
    font-weight: 500;
    overflow-wrap: anywhere;
    margin: 0 0 4px;
  }

  .player-dock-spotify-sub {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    margin: 0;
  }

  .player-dock-switch {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px;
    border-top: 1px solid var(--rail);
    background: var(--paper-deep);
  }

  .player-dock-switch button {
    border: 1px solid var(--rail);
    background: var(--paper);
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
  }

  .player-dock-switch button[aria-pressed="true"] {
    border-color: var(--brass);
    color: var(--brass-ink);
  }

  /* Edition switcher for the playing track — same buttons as the entry
     page's `.editions`, laid out as a dock strip like the source switcher. */
  .player-dock-editions {
    gap: 6px;
    margin: 0;
    padding: 8px;
    border-top: 1px solid var(--rail);
    background: var(--paper-deep);
  }

  /* Another device is playing: the dock shows what and where instead of an
     embed (see `Player.renderRemoteCard`). */
  .player-dock-remote {
    display: flex;
    gap: 14px;
    align-items: center;
  }

  .player-dock-remote img {
    flex: none;
    width: 64px;
    height: 64px;
    object-fit: cover;
    border: 1px solid var(--rail);
  }

  .player-dock-remote-text { min-width: 0; flex: 1; }

  .player-dock-remote button {
    margin-top: 10px;
    border: 1px solid var(--rail);
    background: var(--paper);
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
  }

  .player-dock-remote button:hover { border-color: var(--ink-soft); }

  /* Under a remote's muted video mirror: where the audio is, and a way to
     take it over (the card carries this when there's no mirror). */
  .player-dock-remote-strip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 6px 8px 6px 12px;
    border-top: 1px solid var(--rail);
    background: var(--paper-deep);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
  }

  .player-dock-remote-strip[hidden] { display: none; }

  .player-dock-remote-strip span {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .player-dock-remote-strip button {
    flex: none;
    border: 1px solid var(--rail);
    background: var(--paper);
    padding: 3px 10px;
    font-size: 12px;
    cursor: pointer;
  }

  .player-dock-remote-strip button:hover { border-color: var(--ink-soft); }

  /* The bar's device button turns brass while another device is playing —
     the "you're a remote right now" cue. */
  #player-bar-devices.is-remote { color: var(--brass-ink); }

  .player-devices {
    position: fixed;
    right: 16px;
    bottom: calc(var(--player-bar-h) + 8px);
    width: min(280px, calc(100vw - 32px));
    z-index: 80;
    border: 1px solid var(--rail);
    background: var(--paper);
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
    padding: 6px 0;
  }

  .player-devices[hidden] { display: none; }

  .player-devices-label {
    margin: 4px 12px 6px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .player-devices button {
    display: flex;
    width: 100%;
    gap: 8px;
    align-items: baseline;
    border: none;
    background: transparent;
    padding: 6px 12px;
    text-align: left;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
  }

  .player-devices button:hover { background: var(--paper-deeper); }

  .player-devices button[aria-checked="true"] { color: var(--brass-ink); font-weight: 500; }

  .player-devices-note {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-soft);
  }

  /* ---------- dock "up next" queue list ---------- */

  .player-dock-queue {
    max-height: 240px;
    overflow-y: auto;
    border-top: 1px solid var(--rail);
    background: var(--paper);
  }

  .player-dock-queue[hidden] { display: none; }

  .player-dock-queue-label {
    margin: 0;
    padding: 8px 10px 4px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .player-dock-queue-empty {
    margin: 0;
    padding: 0 10px 10px;
    font-size: 11px;
    color: var(--ink-soft);
  }

  .player-dock-queue-row {
    display: flex;
    align-items: center;
    gap: 4px;
    border-bottom: 1px solid var(--rail);
  }

  .player-dock-queue-row:last-child { border-bottom: none; }

  .player-dock-queue-jump {
    flex: 1;
    min-width: 0;
    display: block;
    border: none;
    background: none;
    text-align: left;
    padding: 7px 4px 7px 10px;
    font-size: 12px;
    color: var(--ink);
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .player-dock-queue-jump:hover { text-decoration: underline; }

  /* Divider between the explicitly-queued layer and Post-queue (the
     background playlist — shuffle-all/tracklist continuation/auto-recommend
     filler) in the "up next" panel — see `renderDockQueue`. */
  .player-dock-queue-divider {
    margin: 0;
    padding: 6px 10px 2px;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--ink-faint);
    border-top: 1px solid var(--rail);
  }

  .player-dock-queue-remove {
    flex: none;
    border: none;
    background: none;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 12px;
    padding: 6px 10px;
  }

  .player-dock-queue-remove:hover { color: var(--danger); }

  .player-dock-queue-row.is-current .player-dock-queue-jump {
    color: var(--brass-ink);
    font-weight: 500;
  }

  .player-dock-queue-row.is-current .player-dock-queue-remove {
    visibility: hidden;
  }

  /* ---------- player mode: the same dock, reparented and given the whole
     screen instead of floating in a corner ---------- */

  #view-player {
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 32px 28px;
  }

  #view-player[hidden] { display: none; }

  .player-stage-wrap {
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }

  .player-stage-wrap[hidden] { display: none; }

  /* Still `position: fixed` in stage mode — see `syncStagePosition` in
     `Player` for why the dock is never actually reparented into
     `#player-stage-mount`, only overlaid on top of it. */
  #player-dock.stage {
    box-shadow: none;
  }

  #player-dock.stage .player-dock-spotify {
    padding: 36px 24px;
  }

  #player-dock.stage .player-dock-spotify-title {
    font-size: 22px;
  }

  #player-dock.stage .player-dock-spotify-sub {
    font-size: 13px;
  }

  #player-dock.stage .player-dock-queue {
    max-height: none;
  }

  /* The expand/collapse chevron toggles `dockEl.hidden`, which would just
     blank the stage on a dedicated Player-mode page — disabled there in
     favor of the mode switcher as the only way in/out. */
  body.player-stage #player-bar-expand {
    visibility: hidden;
    pointer-events: none;
  }

  .player-stage-empty {
    max-width: 420px;
    margin: 14vh auto 0;
    padding: 0 24px;
    text-align: left;
    color: var(--ink-soft);
  }

  .player-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: var(--player-bar-h);
    display: grid;
    /* Art and info lead; every later control gets its own auto column on
       the same row, so adding a bar button never wraps it off the bar. */
    grid-template-columns: auto minmax(0, 1fr);
    grid-auto-flow: column;
    grid-auto-columns: auto;
    align-items: center;
    gap: 16px;
    padding: 0 16px;
    background: var(--paper-deeper);
    border-top: 1px solid var(--rail);
    z-index: 70;
  }

  .player-bar[hidden] { display: none; }

  body.has-player #main,
  body.has-player .rail {
    padding-bottom: var(--player-bar-h);
  }

  .player-bar-art {
    flex: none;
    width: 44px;
    height: 44px;
    border: 1px solid var(--rail);
    padding: 0;
    cursor: pointer;
    background: var(--paper-deep);
    overflow: hidden;
  }

  .player-bar-art img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .player-bar-art img[hidden] { display: none; }

  .player-bar-info {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .player-bar-title {
    background: none;
    border: none;
    padding: 0;
    text-align: left;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .player-bar-title:hover { text-decoration: underline; }

  .player-bar-sub {
    margin: 0;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .player-bar-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    min-width: 220px;
  }

  .player-bar-transport {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .bar-btn {
    flex: none;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
  }

  .bar-btn:hover:not(:disabled) { color: var(--ink); }

  .bar-btn:disabled { opacity: 0.35; cursor: default; }

  .bar-btn[aria-pressed="true"] { color: var(--brass-ink); }

  /* The score button's dot (`NowPlaying.renderBadge`): filled when the
     playing track is unranked in NRS, a ring when it fails NRS checks. */
  #player-bar-np { position: relative; }

  .bar-btn-badge {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 9px;
    height: 9px;
    box-sizing: border-box;
    border-radius: 50%;
    background: var(--brass);
    box-shadow: 0 0 0 2px var(--paper-deeper);
    pointer-events: none;
  }

  .bar-btn-badge[hidden] { display: none; }

  .bar-btn-badge[data-state="incomplete"] {
    background: var(--paper-deeper);
    border: 2px solid var(--brass);
  }

  .bar-btn-toggle {
    width: 26px;
    height: 26px;
    font-size: 12px;
  }

  .bar-btn-accent {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--paper);
    font-size: 13px;
  }

  .bar-btn-accent:hover:not(:disabled) { filter: brightness(1.2); }
  .bar-btn-accent:disabled { background: var(--rail); color: var(--paper); }

  .player-bar-progress {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
  }

  .player-bar-progress[hidden] { display: none; }

  .player-bar-time {
    flex: none;
    width: 32px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-soft);
    text-align: center;
  }

  .player-bar-seek {
    flex: 1;
    min-width: 0;
    height: 3px;
    accent-color: var(--verdigris);
    cursor: pointer;
  }

  .player-bar-volume {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
  }

  .player-bar-volume[hidden] { display: none; }

  .player-bar-volume-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .player-bar-volume-icon {
    flex: none;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    width: 16px;
    height: 16px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .player-bar-volume-mute { cursor: pointer; }
  .player-bar-volume-mute:hover:not(:disabled) { color: var(--ink); }
  .player-bar-volume-mute:disabled { opacity: 0.35; cursor: default; }
  .player-bar-volume-mute[aria-pressed="true"] { color: var(--brass-ink); }

  .player-bar-volume-slider {
    width: 64px;
    height: 3px;
    accent-color: var(--verdigris);
    cursor: pointer;
  }

  .player-bar-volume-slider:disabled {
    opacity: 0.35;
    cursor: default;
  }

  /* ---------- now-playing drawer: score, NRS relations, library fixes ---------- */
  /*
   * Floats over the left of the page above the bar (the video dock owns the
   * right). Like the dock it lives outside `.app`, so browsing never
   * re-renders it.
   */

  .np-drawer {
    position: fixed;
    left: 20px;
    bottom: calc(var(--player-bar-h) + 20px);
    width: min(380px, calc(100vw - 40px));
    max-height: calc(100vh - var(--player-bar-h) - 40px);
    display: flex;
    flex-direction: column;
    z-index: 60;
    border: 1px solid var(--rail);
    background: var(--paper);
    box-shadow: 0 20px 44px rgba(0, 0, 0, 0.25);
  }

  .np-drawer[hidden] { display: none; }

  .np-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 8px 8px 12px;
    border-bottom: 1px solid var(--rail);
    background: var(--paper-deep);
  }

  .np-head .mix-seg { flex: 1; min-width: 0; }
  .np-head .mix-seg button { flex: 1; }
  .np-head .mix-seg button[hidden] { display: none; }

  .np-body {
    overflow-y: auto;
    padding: 12px 14px 14px;
    font-size: 13px;
  }

  .np-title {
    font-family: var(--serif);
    font-size: 17px;
    line-height: 1.25;
    margin: 0 0 4px;
    overflow-wrap: anywhere;
  }

  .np-sub {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    margin: 0 0 10px;
  }

  .np-sub a { color: var(--brass-ink); }

  .np-fold {
    font-size: 12px;
    color: var(--verdigris);
    margin: 0 0 6px;
  }

  .np-section {
    border-top: 1px solid var(--rail);
    padding-top: 10px;
    margin-top: 12px;
  }

  .np-section-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--verdigris);
    margin: 0 0 6px;
  }

  .np-body .mix-row { grid-template-columns: 74px minmax(0, 1fr) 44px; padding: 3px 0; }

  .np-body select {
    font: inherit;
    font-size: 12px;
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--rail);
    padding: 3px 4px;
    min-width: 0;
  }

  .np-anchors {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 64px;
    gap: 4px 8px;
    margin: 4px 0 0;
  }

  .np-anchors input { width: 100%; }

  .np-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 10px;
  }

  .np-actions .ghost-btn[aria-busy="true"] { opacity: 0.6; cursor: progress; }

  .np-status {
    font-size: 12px;
    color: var(--ink-faint);
  }

  .np-status.is-error { color: var(--danger); }

  .np-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .np-list li {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 4px 0;
    border-bottom: 1px dashed var(--rail);
  }

  .np-list li:last-child { border-bottom: 0; }

  .np-list .t {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
  }

  .np-list .k {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
    white-space: nowrap;
  }

  .np-list li.is-done .t { color: var(--ink-faint); }

  /* An MV thumbnail: YouTube's `hqdefault` is 4:3 with the 16:9 frame
     letterboxed inside, so cropping to 16:9 shows exactly the video. */
  .np-media {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    border: 1px solid var(--rail);
    margin: 4px 0 6px;
  }

  .np-media[hidden] { display: none; }

  /* Album art is graded as it is: full width at its own aspect ratio,
     uncropped; unusually tall art is capped and centered instead. */
  .np-media.np-art {
    height: auto;
    max-height: 420px;
    aspect-ratio: auto;
    object-fit: contain;
    background: var(--paper-deep);
  }

  .np-album {
    padding: 8px 0;
    border-bottom: 1px solid var(--rail);
  }

  .np-album:last-child { border-bottom: 0; }

  .np-link {
    background: none;
    border: 0;
    padding: 0;
    text-align: left;
    cursor: pointer;
    font: inherit;
    color: inherit;
  }

  .np-link:hover { text-decoration: underline; }

  .np-album-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .np-album-head .t { flex: 1; min-width: 0; font-weight: 500; overflow-wrap: anywhere; }

  .np-hint {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-faint);
    margin: 12px 0 0;
  }

  @media (max-width: 760px) {
    .np-drawer { left: 10px; right: 10px; width: auto; }
  }

  @media (max-width: 900px) {
    .player-bar-volume { display: none; }
  }

  @media (max-width: 760px) {
    .app {
      grid-template-columns: 1fr;
      grid-template-rows: 46vh 1fr;
    }
    .rail { border-right: none; border-bottom: 1px solid var(--rail); }
    .invite { margin-top: 8vh; }
    :root { --player-bar-h: 76px; }
    .player-bar { gap: 10px; padding: 0 10px; }
    .player-bar-transport { gap: 0; }
    .player-bar-center { min-width: 0; }
    .player-bar-time { display: none; }
    #player-dock { right: 10px; left: 10px; width: auto; }
  }
</style>
</head>
<body>
  <div class="app">
    <aside class="rail" aria-label="Library">
      <div class="rail-head">
        <div class="rail-head-row">
          <p class="wordmark">Library</p>
          <span class="rail-head-actions">
            <button id="shuffle-library" class="ghost-btn" type="button" title="Play a shuffle of your library, mixing familiar and new tracks">Shuffle all</button>
            <button id="shuffle-mix" class="ghost-btn" type="button" title="Shuffle mix settings" aria-label="Shuffle mix settings"></button>
          </span>
        </div>
        <nav class="mode-switcher" id="mode-switcher" aria-label="View">
          <button type="button" data-mode="library" aria-pressed="true">Library</button>
          <button type="button" data-mode="graph" aria-pressed="false">Graph</button>
          <button type="button" data-mode="player" aria-pressed="false">Player</button>
          <button type="button" data-mode="import" aria-pressed="false">Import</button>
          <button type="button" data-mode="settings" aria-pressed="false">Settings</button>
        </nav>
        <div class="search-slot">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.3"/>
            <line x1="11" y1="11" x2="15" y2="15" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          <input id="search" type="search" placeholder="Search your library" aria-label="Search your library" autocomplete="off" />
        </div>
      </div>
      <ul id="results" class="results" role="listbox" aria-label="Search results"></ul>
      <p id="rail-status" class="rail-status" aria-live="polite" hidden></p>
      <div id="spotify-panel" class="rail-foot"></div>
    </aside>
    <main id="main">
      <div id="view-library">
        <div class="invite" id="invite">
          <p class="lede">Find something to play.</p>
          <p class="sub">Search across every source you've catalogued — press <kbd>/</kbd> to jump to search.</p>
        </div>
      </div>
      <div id="view-graph" hidden></div>
      <div id="view-player" hidden>
        <div class="player-stage-wrap" id="player-stage-wrap" hidden>
          <div id="player-stage-mount"></div>
        </div>
        <div class="player-stage-empty" id="player-stage-empty">
          <p class="lede">Nothing playing.</p>
          <p class="sub">Search your library or hit <strong>Shuffle all</strong> to start a queue.</p>
        </div>
      </div>
      <div id="view-import" hidden></div>
      <div id="view-settings" hidden></div>
    </main>
  </div>

  <div id="player-dock" class="player-dock" hidden>
    <div id="player-dock-surface" class="player-dock-surface"></div>
    <div id="player-dock-remote-strip" class="player-dock-remote-strip" hidden>
      <span class="player-dock-remote-strip-where"></span>
      <button type="button" id="player-dock-remote-strip-take">Play here</button>
    </div>
    <div id="player-dock-switch" class="player-dock-switch"></div>
    <div id="player-dock-editions" class="editions player-dock-editions" hidden></div>
    <div id="player-dock-queue" class="player-dock-queue" hidden></div>
  </div>
  <div id="player-devices" class="player-devices" hidden role="menu" aria-label="Play on"></div>
  <aside id="np-drawer" class="np-drawer" hidden aria-label="Score and fix what's playing">
    <div class="np-head">
      <div id="np-tabs" class="mix-seg" role="tablist"></div>
      <button id="np-close" class="bar-btn bar-btn-toggle" type="button" aria-label="Close"></button>
    </div>
    <div id="np-body" class="np-body"></div>
  </aside>
  <footer id="player-bar" class="player-bar" hidden aria-label="Now playing">
    <button id="player-bar-art" class="player-bar-art" type="button" aria-label="Toggle player">
      <img id="player-bar-thumb" alt="" hidden />
    </button>
    <div class="player-bar-info">
      <button id="player-bar-title" class="player-bar-title" type="button"></button>
      <p id="player-bar-sub" class="player-bar-sub"></p>
    </div>
    <div class="player-bar-center">
      <div class="player-bar-transport">
        <button id="player-bar-shuffle" class="bar-btn bar-btn-toggle" type="button" aria-label="Shuffle" aria-pressed="false"></button>
        <button id="player-bar-prev" class="bar-btn" type="button" aria-label="Previous" disabled></button>
        <button id="player-bar-playpause" class="bar-btn bar-btn-accent" type="button" aria-label="Play">
          <span id="player-bar-playpause-icon"></span>
        </button>
        <button id="player-bar-next" class="bar-btn" type="button" aria-label="Next" disabled></button>
        <button id="player-bar-repeat" class="bar-btn bar-btn-toggle" type="button" aria-label="Repeat off" aria-pressed="false"></button>
      </div>
      <div id="player-bar-progress" class="player-bar-progress" hidden>
        <span id="player-bar-time-elapsed" class="player-bar-time">0:00</span>
        <input id="player-bar-seek" class="player-bar-seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek" />
        <span id="player-bar-time-total" class="player-bar-time">0:00</span>
      </div>
    </div>
    <div id="player-bar-volume" class="player-bar-volume">
      <div class="player-bar-volume-row">
        <span id="player-bar-volume-player-icon" class="player-bar-volume-icon" aria-hidden="true"></span>
        <input id="player-bar-volume-player-slider" class="player-bar-volume-slider" type="range" min="0" max="100" value="100" step="1" aria-label="Player volume" title="Player volume — balance between sources" />
      </div>
      <div class="player-bar-volume-row">
        <button id="player-bar-mute" class="player-bar-volume-icon player-bar-volume-mute" type="button" aria-label="Mute" aria-pressed="false"></button>
        <input id="player-bar-volume-global-slider" class="player-bar-volume-slider" type="range" min="0" max="100" value="80" step="1" aria-label="Global volume" title="Global volume — scales everything" />
      </div>

<!-- The relations graph renders as plain SVG driven by d3-force/d3-drag/
     d3-zoom — only d3-force's own dist bundle expects d3-quadtree/
     d3-dispatch/d3-timer as separate globals rather than bundling them, so
     the full d3 bundle (self-contained, one script tag) is what's loaded
     rather than stitching those together by hand for one module. -->
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
(() => {
  "use strict";

  const railStatus = document.getElementById("rail-status");
  const resultsEl = document.getElementById("results");
  const searchEl = document.getElementById("search");
  // `mainEl` is the Library-mode content area specifically — Graph and
  // Player each got their own permanent sibling view once the app grew
  // dedicated modes (see `setMode` below); Library-mode functions
  // (`viewEntry`/`renderError`/`showInvite`) still just wholesale-replace
  // this one, same as before.
  const mainEl = document.getElementById("view-library");
  const modeSwitcherEl = document.getElementById("mode-switcher");
  const viewLibraryEl = mainEl;
  const viewGraphEl = document.getElementById("view-graph");
  const viewPlayerEl = document.getElementById("view-player");
  const viewImportEl = document.getElementById("view-import");
  const viewSettingsEl = document.getElementById("view-settings");
  const playerStageWrapEl = document.getElementById("player-stage-wrap");
  const playerStageMountEl = document.getElementById("player-stage-mount");
  const playerStageEmptyEl = document.getElementById("player-stage-empty");
  const shuffleLibraryBtn = document.getElementById("shuffle-library");
  const shuffleMixBtn = document.getElementById("shuffle-mix");

  const PLATFORM_COLOR = {
    youtube: "#b5342f",
    spotify: "#3c8c5b",
    soundcloud: "#b5651d",
    nicovideo: "#5b5b52",
  };

  const PROVIDER_LABEL = {
    youtube: "YouTube",
    spotify: "Spotify",
    soundcloud: "SoundCloud",
    nicovideo: "Niconico",
  };

  function providerLabel(provider) {
    return PROVIDER_LABEL[provider] || provider;
  }

  // ---------- playback source preference ----------
  //
  // When a track is playable from more than one source, the player mounts
  // whichever comes first in this order (`sortByProviderPreference`, used by
  // `Player.mountEngine`) — configured from Settings mode. Persisted per
  // browser (localStorage), unlike the shared playback session: each device
  // knows best what it can play (its own Spotify connection, say), and only
  // the active device picks a source. `PLATFORM_COLOR`'s keys are this
  // app's current universe of known providers; that list is expected to grow
  // (more direct-playback backends), so a stored preference that predates a
  // new one just doesn't mention it — `sortByProviderPreference` sorts any
  // provider absent from the list after every provider present in it, rather
  // than erroring or ignoring the whole preference.
  const PROVIDER_PREFERENCE_KEY = "provider_preference";

  function getProviderPreference() {
    try {
      const raw = JSON.parse(localStorage.getItem(PROVIDER_PREFERENCE_KEY) || "null");
      if (Array.isArray(raw) && raw.every((p) => typeof p === "string")) return raw;
    } catch {}
    return Object.keys(PLATFORM_COLOR);
  }

  function setProviderPreference(list) {
    try {
      localStorage.setItem(PROVIDER_PREFERENCE_KEY, JSON.stringify(list));
    } catch {}
  }

  function sortByProviderPreference(sources) {
    const order = getProviderPreference();
    const rank = (provider) => {
      const idx = order.indexOf(provider);
      return idx === -1 ? order.length : idx;
    };
    return sources
      .map((s, i) => ({ s, i }))
      .sort((a, b) => rank(a.s.provider) - rank(b.s.provider) || a.i - b.i)
      .map(({ s }) => s);
  }

  const TYPE_ORDER = ["track", "release", "release_group", "artist"];
  const TYPE_LABEL = {
    track: "Tracks",
    release: "Releases",
    release_group: "Release groups",
    artist: "Artists",
  };

  let searchToken = 0;
  let activeId = null;
  // The card header elements (kicker/title/meta/stamps) currently mounted
  // for `activeId`, kept around so a dedup edit can patch their text/stamps
  // in place (`refreshAfterEdit`) instead of tearing down and rebuilding the
  // whole detail view — see that function for why.
  let cardEls = null;

  // Graph mode's anchor is kept separately from Library's open entry so
  // its persistent editor survives mode switches. Returning to Library
  // from Graph opens this anchor, including after a focus change.
  let graphActiveId = null;

  // ---------- modes: Library / Graph / Player / Import ----------
  //
  // One `main` element, four permanent view containers (see the body HTML)
  // instead of one that gets wholesale-replaced per screen. Switching modes
  // never touches the other views' DOM, which is what lets Graph mode's
  // d3 simulation and Player mode's reparented dock (see `Player.setStageMode`
  // below) survive a mode switch instead of being torn down and rebuilt —
  // and, for Import mode, means in-flight job polling keeps running
  // undisturbed while you look elsewhere (see the `Ingest` module).
  let currentMode = "library";

  function setMode(mode) {
    currentMode = mode;
    viewLibraryEl.hidden = mode !== "library";
    viewGraphEl.hidden = mode !== "graph";
    viewPlayerEl.hidden = mode !== "player";
    viewImportEl.hidden = mode !== "import";
    viewSettingsEl.hidden = mode !== "settings";
    for (const btn of modeSwitcherEl.querySelectorAll("button[data-mode]")) {
      btn.setAttribute("aria-pressed", String(btn.dataset.mode === mode));
    }
    Player.setStageMode(mode === "player", playerStageMountEl);
    if (mode === "player") refreshPlayerStageVisibility();
  }

  modeSwitcherEl.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-mode]");
    if (!btn) return;
    goToMode(btn.dataset.mode);
  });

  function goToMode(mode) {
    if (mode === "library") {
      const entryId = (currentMode === "graph" && graphActiveId) || activeId;
      if (entryId) viewEntry(entryId);
      else {
        history.pushState({}, "", "/");
        setMode("library");
      }
    } else if (mode === "graph") {
      if (graphActiveId) viewGraph(graphActiveId);
      else {
        history.pushState({}, "", "/graph");
        setMode("graph");
      }
    } else if (mode === "player") {
      history.pushState({}, "", "/player");
      setMode("player");
    } else if (mode === "import") {
      history.pushState({}, "", "/import");
      setMode("import");
    } else if (mode === "settings") {
      history.pushState({}, "", "/settings");
      setMode("settings");
    }
  }

  function el(tag, attrs, children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined) continue;
      if (k === "text") node.textContent = v;
      else if (k === "className") node.className = v;
      else if (k.startsWith("on") && typeof v === "function") node[k] = v;
      else if (typeof v === "boolean" && !k.startsWith("aria-")) {
        // Plain HTML boolean attributes (disabled, allowfullscreen, ...) are
        // presence-based: any value, including the string "false", means
        // true. ARIA state attributes are the opposite — they need the
        // literal "true"/"false" string — so those still fall through below.
        if (v) node.setAttribute(k, "");
      } else {
        node.setAttribute(k, typeof v === "boolean" ? String(v) : v);
      }
    }
    for (const c of children || []) {
      if (c) node.appendChild(c);
    }
    return node;
  }

  // ---------- transport icons: inline SVG, no icon font/CDN ----------

  const ICON_PATHS = {
    play: '<polygon points="6 3 20 12 6 21 6 3"></polygon>',

    repeat:
      '<polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path>',
    "repeat-1":
      '<polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path><text x="12.5" y="15.5" text-anchor="middle" font-size="8" font-family="sans-serif" font-weight="700" stroke="none" fill="currentColor">1</text>',
    "chevron-down": '<polyline points="6 9 12 15 18 9"></polyline>',
    "chevron-up": '<polyline points="18 15 12 9 6 15"></polyline>',
    sliders:
      '<line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line><circle cx="9" cy="6" r="2" fill="var(--paper)"></circle><circle cx="15" cy="12" r="2" fill="var(--paper)"></circle><circle cx="7" cy="18" r="2" fill="var(--paper)"></circle>',
    x: '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>',
    plus: '<line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>',
    "volume-2":
      '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 5a10 10 0 0 1 0 14"></path>',
    "volume-x":
      '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>',
    // Feather's "speaker" — the device picker (Spotify Connect's own
    // affordance is a speaker-and-screen glyph).
    speaker:
      '<rect x="4" y="2" width="16" height="20" rx="2"></rect><circle cx="12" cy="14" r="4"></circle><line x1="12" y1="6" x2="12.01" y2="6"></line>',
    star: '<polygon points="12 2 15.1 8.6 22 9.3 16.8 14 18.2 21 12 17.3 5.8 21 7.2 14 2 9.3 8.9 8.6 12 2"></polygon>',
    headphones:
      '<path d="M4 13v-1a8 8 0 0 1 16 0v1"></path><rect x="2" y="13" width="5" height="7" rx="2"></rect><rect x="17" y="13" width="5" height="7" rx="2"></rect>',
    // Simplified, hand-drawn nods to each provider's mark (rounded-rect +
    // play triangle / circle + rising bars) rather than a traced reproduction
    // of the real logo — enough to read as "YouTube" / "Spotify" at a glance
    // in the per-player volume dial, in the same outline style as every
    // other icon here.
    youtube:
      '<rect x="2" y="5" width="20" height="14" rx="5"></rect><polygon points="10 9 16 12 10 15 10 9" fill="currentColor" stroke="none"></polygon>',
    spotify:
      '<circle cx="12" cy="12" r="10"></circle><path d="M6.5 9.5c3.5-1.2 8-1.2 11.5 1"></path><path d="M7 13c2.8-0.9 6.2-0.9 9.5 1"></path><path d="M7.5 16.3c2.2-0.6 5-0.6 7.5 0.8"></path>',
    soundcloud:
      '<path d="M4.5 16a3 3 0 0 1 .3-6 5 5 0 0 1 9.6-1.4A4 4 0 0 1 19.5 12.5 3.3 3.3 0 0 1 19 16H4.5z"></path><line x1="7" y1="16" x2="7" y2="12.5"></line><line x1="9.5" y1="16" x2="9.5" y2="10.5"></line><line x1="12" y1="16" x2="12" y2="9.5"></line>',
    // "Nico nico" is a Japanese onomatopoeia for smiling — the outline mark
    // nods to that rather than to the actual logotype.
    nicovideo:
      '<circle cx="12" cy="12" r="10"></circle><circle cx="8.5" cy="10" r="1" fill="currentColor" stroke="none"></circle><circle cx="15.5" cy="10" r="1" fill="currentColor" stroke="none"></circle><path d="M7.5 14a5 5 0 0 0 9 0"></path>',
  };

  function svgIcon(name, size = 16) {
    return (
      `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" ` +
      `stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[name]}</svg>`
    );
  }

  // ---------- import mode: dedicated "add a song" screen — POST
  // /api/ingest, then poll GET /api/jobs/:id ----------
  //
  // The webapp's own import affordance, an alternative to the `import` CLI:
  // submits a URL (plus a fetch-options depth preset, from GET
  // /api/fetch-options) to the server, which runs it through the exact same
  // fetch/flush/dedup pipeline as a background job (see player.rs `ingest`).
  // Jobs are tracked client-side only (`jobs`, newest first) — a page reload
  // loses the list, same as every other bit of client-side-only UI state in
  // this app — and each job polls its own status independently, so queuing
  // several imports back-to-back shows all of their progress at once rather
  // than serializing them in the UI (the server itself still processes one
  // connection at a time — see main.rs's single-threaded `LocalSet` — so
  // "independent" here is about polling, not actual concurrency). Lives in
  // its own permanent `#view-import` container (see the mode-switching
  // section above) precisely so that polling keeps running while you're
  // looking at Library/Graph/Player instead — mirrors how Player's dock
  // survives a mode switch.
  const Ingest = (() => {
    const viewEl = document.getElementById("view-import");
    const POLL_MS = 1000;
    const MAX_SHOWN = 30;

    // Built-in fallback so the form works even before (or if)
    // GET /api/fetch-options/files responds — matches the server's own
    // always-present `__shallow__` choice (see fetch_options.rs `shallow`).
    // `<config_dir>/fetch_options/` is otherwise entirely user-managed: no
    // file here is bundled or assumed, the list is whatever `files` gets
    // replaced with once the request above resolves.
    let files = [{ id: "__shallow__", label: "Quick (1 level deep, no config file)" }];
    let selectedFile = "__shallow__";
    // Entry-point names the currently selected file offers (its YAML
    // document's own top-level keys — see fetch_options.rs's module doc on
    // why one file can define more than one). Empty for `__shallow__` (not
    // a real file) and for any file that only defines `main` — the picker
    // below only renders when this has more than one name.
    let entryPoints = [];
    let selectedEntryPoint = "main";

    // { id, query, status, stage, message, detail, entryId, errorMessage, canceling }
    let jobs = [];
    let inputValue = "";
    let submitError = null;

    function findJob(id) {
      return jobs.find((j) => j.id === id);
    }

    const RUNNING = (job) => job.status === "pending" || job.status === "running";

    // Renders `job.detail` (see `ingest_progress::JobProgressSink` on the
    // server) as a CLI-import-style panel: fetched/failed counters, the
    // handful of most recent per-pair fetch lines, and live per-domain HTTP
    // in-flight/done counts — everything the `import` binary's terminal
    // shows, minus the log-level-gated debug lines. Returns `null` while a
    // job hasn't reported a detail payload yet (still `pending`, or a job
    // kind that never sends one).
    // The specific failures, not just a count — collapsed by default since
    // there can be up to 100 of them (see `MAX_FAILURES` server-side), but
    // present and searchable instead of scrolling out of a 6-line rolling
    // log the moment the next successful fetch comes in. This is the record
    // that was missing when a big `@ShirakamiFubuki` import had ~180
    // failures no one could identify afterwards.
    function renderFailures(detail) {
      const failures = detail.failures;
      if (!Array.isArray(failures) || !failures.length) return null;
      const truncated = detail.entries_failed > failures.length;
      const label =
        `${detail.entries_failed} failed request${detail.entries_failed === 1 ? "" : "s"}` +
        (truncated ? ` (first ${failures.length} shown)` : "");
      return el("details", { className: "ingest-job-failures" }, [
        el("summary", { text: label }),
        el(
          "ul",
          { className: "ingest-job-failures-list" },
          failures.map((line) => el("li", { text: line }))
        ),
      ]);
    }

    function renderActivity(detail, { compact = false } = {}) {
      if (!detail) return null;

      const counters = el("p", { className: "ingest-job-counters" }, [
        el("span", { text: `${detail.entries_fetched ?? 0} fetched` }),
        detail.entries_failed
          ? el("span", { className: "ingest-job-counter-failed", text: `${detail.entries_failed} failed` })
          : null,
        detail.youtube_quota_units
          ? el("span", {
              text: `${detail.youtube_quota_units} YouTube quota unit${detail.youtube_quota_units === 1 ? "" : "s"}`,
            })
          : null,
      ]);
      const failures = renderFailures(detail);

      // Once a job is done, the live fetch log and per-domain in-flight
      // counts are just noise (frozen at whatever they were mid-flight) —
      // the running totals are what's worth keeping around. Failed/canceled
      // jobs are the exception: what was happening right before it stopped
      // is exactly the forensic detail worth keeping visible. The failure
      // list itself is worth keeping in every case, compact included — it's
      // the one thing here that isn't just a snapshot of transient activity.
      if (compact) {
        return el("div", { className: "ingest-job-activity" }, [counters, failures]);
      }

      const recent = Array.isArray(detail.recent) && detail.recent.length
        ? el(
            "ul",
            { className: "ingest-job-log" },
            detail.recent.slice(-6).map((line) => el("li", { text: line }))
          )
        : null;

      const domains = Array.isArray(detail.http) && detail.http.length
        ? el(
            "ul",
            { className: "ingest-job-domains" },
            detail.http.slice(0, 6).map((d) =>
              el("li", { className: d.in_flight ? "active" : "" }, [
                el("span", { className: "ingest-job-domain-host", text: d.host }),
                el("span", {
                  className: "ingest-job-domain-count",
                  text: d.in_flight ? `${d.in_flight} in flight · ${d.done} done` : `${d.done} done`,
                }),
              ])
            )
          )
        : null;

      return el("div", { className: "ingest-job-activity" }, [counters, failures, recent, domains]);
    }

    function renderJob(job) {
      let statusEl;
      if (job.status === "succeeded") {
        statusEl = el("span", { className: "ingest-job-status done", text: "✓" });
      } else if (job.status === "failed" || job.status === "canceled") {
        statusEl = el("span", { className: "ingest-job-status error", text: "✕" });
      } else {
        statusEl = el("span", { className: "ingest-job-status" }, [
          el("span", { className: "ingest-job-spinner" }),
        ]);
      }

      const body = el("div", { className: "ingest-job-body" }, [
        el("p", { className: "ingest-job-query", text: job.query }),
      ]);

      if (job.status === "succeeded") {
        body.appendChild(
          el("button", {
            className: "ingest-job-link",
            type: "button",
            text: "Open →",
            onclick: () => viewEntry(job.entryId),
          })
        );
        const summary = renderActivity(job.detail, { compact: true });
        if (summary) body.appendChild(summary);
      } else if (job.status === "failed" || job.status === "canceled") {
        body.appendChild(
          el("p", {
            className: "ingest-job-detail error",
            text: job.errorMessage || (job.status === "canceled" ? "canceled" : "import failed"),
          })
        );
        // A canceled/failed job can still carry a `detail` snapshot from its
        // last tick before it stopped — worth keeping visible as a record of
        // how far it got, not just clearing it.
        const activity = renderActivity(job.detail);
        if (activity) body.appendChild(activity);
      } else {
        body.appendChild(
          el("p", { className: "ingest-job-detail", text: job.message || job.stage || "queued…" })
        );
        const activity = renderActivity(job.detail);
        if (activity) body.appendChild(activity);
      }

      const actions = [];
      if (RUNNING(job)) {
        actions.push(
          el("button", {
            className: "ingest-job-cancel",
            type: "button",
            text: job.canceling ? "Canceling…" : "Cancel",
            disabled: job.canceling,
            onclick: () => cancelJob(job.id),
          })
        );
      }
      if (job.detail) {
        actions.push(
          el("button", {
            className: "ingest-job-download",
            type: "button",
            title: "Download this job's log as a text file",
            text: "Log",
            onclick: () => downloadJobLog(job),
          })
        );
      }
      actions.push(
        el("button", {
          className: "ingest-job-dismiss",
          type: "button",
          "aria-label": "Dismiss",
          text: "×",
          onclick: () => {
            jobs = jobs.filter((j) => j.id !== job.id);
            render();
          },
        })
      );

      return el("li", { className: "ingest-job" }, [statusEl, body, ...actions]);
    }

    // Plain-text rendering of everything a job's card knows, for people who'd
    // rather read the outcome in a text editor / paste it somewhere than dig
    // through the server's own log output (which needs shell access, and
    // only has whatever the process's stdout was redirected to) or click
    // open the collapsed failures list. This is the entire point of keeping
    // `detail.failures` around uncapped-in-spirit (well, capped at 100, but
    // far more than the 6-line activity log shows) — it's finally readable.
    function jobLogText(job) {
      const lines = [];
      lines.push(`musiclib-rs import log`);
      lines.push(`query: ${job.query}`);
      lines.push(`job id: ${job.id}`);
      lines.push(`status: ${job.status}`);
      if (job.createdAt) lines.push(`started: ${job.createdAt}`);
      if (job.updatedAt) lines.push(`last update: ${job.updatedAt}`);
      if (job.status === "succeeded") lines.push(`entry id: ${job.entryId}`);
      if (job.errorMessage) lines.push(`error: ${job.errorMessage}`);
      lines.push("");

      const d = job.detail;
      if (!d) {
        lines.push("(no progress was reported for this job)");
        return lines.join("\n");
      }

      lines.push(
        `summary: ${d.entries_fetched ?? 0} fetched, ${d.entries_failed ?? 0} failed` +
          (d.youtube_quota_units ? `, ${d.youtube_quota_units} YouTube quota unit(s)` : "")
      );
      lines.push("");

      lines.push(`failed requests (${d.entries_failed ?? 0}):`);
      if (Array.isArray(d.failures) && d.failures.length) {
        if (d.entries_failed > d.failures.length) {
          lines.push(`  (showing the first ${d.failures.length})`);
        }
        for (const f of d.failures) lines.push(`  ${f}`);
      } else {
        lines.push("  (none)");
      }
      lines.push("");

      if (Array.isArray(d.recent) && d.recent.length) {
        lines.push("most recent activity:");
        for (const r of d.recent) lines.push(`  ${r}`);
        lines.push("");
      }

      if (Array.isArray(d.http) && d.http.length) {
        lines.push("HTTP activity by domain:");
        for (const h of d.http) {
          lines.push(
            `  ${h.host}: ${h.in_flight ? `${h.in_flight} in flight, ` : ""}${h.done} done`
          );
        }
      }

      return lines.join("\n");
    }

    function downloadJobLog(job) {
      const blob = new Blob([jobLogText(job)], { type: "text/plain" });
