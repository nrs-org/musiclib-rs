     d3-dispatch/d3-timer as separate globals rather than bundling them, so
     the full d3 bundle (self-contained, one script tag) is what's loaded
     rather than stitching those together by hand for one module. -->
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
(() => {
  "use strict";

  const railStatus = document.getElementById("rail-status");
  const resultsEl = document.getElementById("results");
  const searchEl = document.getElementById("search");
  // `mainEl` is the Library-mode content area specifically — Graph and
  // Player each got their own permanent sibling view once the app grew
  // dedicated modes (see `setMode` below); Library-mode functions
  // (`viewEntry`/`renderError`/`showInvite`) still just wholesale-replace
  // this one, same as before.
  const mainEl = document.getElementById("view-library");
  const modeSwitcherEl = document.getElementById("mode-switcher");
  const viewLibraryEl = mainEl;
  const viewGraphEl = document.getElementById("view-graph");
  const viewPlayerEl = document.getElementById("view-player");
  const viewImportEl = document.getElementById("view-import");
  const viewSettingsEl = document.getElementById("view-settings");
  const playerStageWrapEl = document.getElementById("player-stage-wrap");
  const playerStageMountEl = document.getElementById("player-stage-mount");
  const playerStageEmptyEl = document.getElementById("player-stage-empty");
  const shuffleLibraryBtn = document.getElementById("shuffle-library");
  const shuffleMixBtn = document.getElementById("shuffle-mix");

  const PLATFORM_COLOR = {
    youtube: "#b5342f",
    spotify: "#3c8c5b",
    soundcloud: "#b5651d",
    nicovideo: "#5b5b52",
  };

  const PROVIDER_LABEL = {
    youtube: "YouTube",
    spotify: "Spotify",
    soundcloud: "SoundCloud",
    nicovideo: "Niconico",
  };

  function providerLabel(provider) {
    return PROVIDER_LABEL[provider] || provider;
  }

  // ---------- playback source preference ----------
  //
  // When a track is playable from more than one source, the player mounts
  // whichever comes first in this order (`sortByProviderPreference`, used by
  // `Player.mountEngine`) — configured from Settings mode. Persisted per
  // browser (localStorage), unlike the shared playback session: each device
  // knows best what it can play (its own Spotify connection, say), and only
  // the active device picks a source. `PLATFORM_COLOR`'s keys are this
  // app's current universe of known providers; that list is expected to grow
  // (more direct-playback backends), so a stored preference that predates a
  // new one just doesn't mention it — `sortByProviderPreference` sorts any
  // provider absent from the list after every provider present in it, rather
  // than erroring or ignoring the whole preference.
  const PROVIDER_PREFERENCE_KEY = "provider_preference";

  function getProviderPreference() {
    try {
      const raw = JSON.parse(localStorage.getItem(PROVIDER_PREFERENCE_KEY) || "null");
      if (Array.isArray(raw) && raw.every((p) => typeof p === "string")) return raw;
    } catch {}
    return Object.keys(PLATFORM_COLOR);
  }

  function setProviderPreference(list) {
    try {
      localStorage.setItem(PROVIDER_PREFERENCE_KEY, JSON.stringify(list));
    } catch {}
  }

  function sortByProviderPreference(sources) {
    const order = getProviderPreference();
    const rank = (provider) => {
      const idx = order.indexOf(provider);
      return idx === -1 ? order.length : idx;
    };
    return sources
      .map((s, i) => ({ s, i }))
      .sort((a, b) => rank(a.s.provider) - rank(b.s.provider) || a.i - b.i)
      .map(({ s }) => s);
  }

  const TYPE_ORDER = ["track", "release", "release_group", "artist"];
  const TYPE_LABEL = {
    track: "Tracks",
    release: "Releases",
    release_group: "Release groups",
    artist: "Artists",
  };

  let searchToken = 0;
  let activeId = null;
  // The card header elements (kicker/title/meta/stamps) currently mounted
  // for `activeId`, kept around so a dedup edit can patch their text/stamps
  // in place (`refreshAfterEdit`) instead of tearing down and rebuilding the
  // whole detail view — see that function for why.
  let cardEls = null;

  // Graph mode's anchor is kept separately from Library's open entry so
  // its persistent editor survives mode switches. Returning to Library
  // from Graph opens this anchor, including after a focus change.
  let graphActiveId = null;

  // ---------- modes: Library / Graph / Player / Import ----------
  //
  // One `main` element, four permanent view containers (see the body HTML)
  // instead of one that gets wholesale-replaced per screen. Switching modes
  // never touches the other views' DOM, which is what lets Graph mode's
  // d3 simulation and Player mode's reparented dock (see `Player.setStageMode`
  // below) survive a mode switch instead of being torn down and rebuilt —
  // and, for Import mode, means in-flight job polling keeps running
  // undisturbed while you look elsewhere (see the `Ingest` module).
  let currentMode = "library";

  function setMode(mode) {
    currentMode = mode;
    viewLibraryEl.hidden = mode !== "library";
    viewGraphEl.hidden = mode !== "graph";
    viewPlayerEl.hidden = mode !== "player";
    viewImportEl.hidden = mode !== "import";
    viewSettingsEl.hidden = mode !== "settings";
    for (const btn of modeSwitcherEl.querySelectorAll("button[data-mode]")) {
      btn.setAttribute("aria-pressed", String(btn.dataset.mode === mode));
    }
    Player.setStageMode(mode === "player", playerStageMountEl);
    if (mode === "player") refreshPlayerStageVisibility();
  }

  modeSwitcherEl.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-mode]");
    if (!btn) return;
    goToMode(btn.dataset.mode);
  });

  function goToMode(mode) {
    if (mode === "library") {
      const entryId = (currentMode === "graph" && graphActiveId) || activeId;
      if (entryId) viewEntry(entryId);
      else {
        history.pushState({}, "", "/");
        setMode("library");
      }
    } else if (mode === "graph") {
      if (graphActiveId) viewGraph(graphActiveId);
      else {
        history.pushState({}, "", "/graph");
        setMode("graph");
      }
    } else if (mode === "player") {
      history.pushState({}, "", "/player");
      setMode("player");
    } else if (mode === "import") {
      history.pushState({}, "", "/import");
      setMode("import");
    } else if (mode === "settings") {
      history.pushState({}, "", "/settings");
      setMode("settings");
    }
  }

  function el(tag, attrs, children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined) continue;
      if (k === "text") node.textContent = v;
      else if (k === "className") node.className = v;
      else if (k.startsWith("on") && typeof v === "function") node[k] = v;
      else if (typeof v === "boolean" && !k.startsWith("aria-")) {
        // Plain HTML boolean attributes (disabled, allowfullscreen, ...) are
        // presence-based: any value, including the string "false", means
        // true. ARIA state attributes are the opposite — they need the
        // literal "true"/"false" string — so those still fall through below.
        if (v) node.setAttribute(k, "");
      } else {
        node.setAttribute(k, typeof v === "boolean" ? String(v) : v);
      }
    }
    for (const c of children || []) {
      if (c) node.appendChild(c);
    }
    return node;
  }

  // ---------- transport icons: inline SVG, no icon font/CDN ----------
  //
  // Hand-drawn (not pulled from a specific library's asset file) in a plain
  // Feather/Lucide-style stroke — 24x24 viewBox, currentColor, no fills —
  // so buttons stay crisp at any size and recolor with the surrounding
  // text/hover state for free. Kept inline rather than fetched from a CDN:
  // this is a self-hosted, single-file app meant to work without a network
  // round trip just to render its own chrome.
  const ICON_PATHS = {
    play: '<polygon points="6 3 20 12 6 21 6 3"></polygon>',
    pause: '<rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect>',
    "skip-back": '<polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line>',
    "skip-forward": '<polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line>',
    shuffle:
      '<polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line>',
    repeat:
      '<polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path>',
    "repeat-1":
      '<polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path><text x="12.5" y="15.5" text-anchor="middle" font-size="8" font-family="sans-serif" font-weight="700" stroke="none" fill="currentColor">1</text>',
    "chevron-down": '<polyline points="6 9 12 15 18 9"></polyline>',
    "chevron-up": '<polyline points="18 15 12 9 6 15"></polyline>',
    sliders:
      '<line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line><circle cx="9" cy="6" r="2" fill="var(--paper)"></circle><circle cx="15" cy="12" r="2" fill="var(--paper)"></circle><circle cx="7" cy="18" r="2" fill="var(--paper)"></circle>',
    x: '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>',
    plus: '<line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>',
    search: '<circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>',
    "volume-2":
      '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 5a10 10 0 0 1 0 14"></path>',
    "volume-x":
      '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>',
    // Feather's "speaker" — the device picker (Spotify Connect's own
    // affordance is a speaker-and-screen glyph).
    speaker:
      '<rect x="4" y="2" width="16" height="20" rx="2"></rect><circle cx="12" cy="14" r="4"></circle><line x1="12" y1="6" x2="12.01" y2="6"></line>',
    star: '<polygon points="12 2 15.1 8.6 22 9.3 16.8 14 18.2 21 12 17.3 5.8 21 7.2 14 2 9.3 8.9 8.6 12 2"></polygon>',
    headphones:
      '<path d="M4 13v-1a8 8 0 0 1 16 0v1"></path><rect x="2" y="13" width="5" height="7" rx="2"></rect><rect x="17" y="13" width="5" height="7" rx="2"></rect>',
    // Simplified, hand-drawn nods to each provider's mark (rounded-rect +
    // play triangle / circle + rising bars) rather than a traced reproduction
    // of the real logo — enough to read as "YouTube" / "Spotify" at a glance
    // in the per-player volume dial, in the same outline style as every
    // other icon here.
    youtube:
      '<rect x="2" y="5" width="20" height="14" rx="5"></rect><polygon points="10 9 16 12 10 15 10 9" fill="currentColor" stroke="none"></polygon>',
    spotify:
      '<circle cx="12" cy="12" r="10"></circle><path d="M6.5 9.5c3.5-1.2 8-1.2 11.5 1"></path><path d="M7 13c2.8-0.9 6.2-0.9 9.5 1"></path><path d="M7.5 16.3c2.2-0.6 5-0.6 7.5 0.8"></path>',
    soundcloud:
      '<path d="M4.5 16a3 3 0 0 1 .3-6 5 5 0 0 1 9.6-1.4A4 4 0 0 1 19.5 12.5 3.3 3.3 0 0 1 19 16H4.5z"></path><line x1="7" y1="16" x2="7" y2="12.5"></line><line x1="9.5" y1="16" x2="9.5" y2="10.5"></line><line x1="12" y1="16" x2="12" y2="9.5"></line>',
    // "Nico nico" is a Japanese onomatopoeia for smiling — the outline mark
    // nods to that rather than to the actual logotype.
    nicovideo:
      '<circle cx="12" cy="12" r="10"></circle><circle cx="8.5" cy="10" r="1" fill="currentColor" stroke="none"></circle><circle cx="15.5" cy="10" r="1" fill="currentColor" stroke="none"></circle><path d="M7.5 14a5 5 0 0 0 9 0"></path>',
  };

  function svgIcon(name, size = 16) {
    return (
      `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" ` +
      `stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[name]}</svg>`
    );
  }

  // ---------- import mode: dedicated "add a song" screen — POST
  // /api/ingest, then poll GET /api/jobs/:id ----------
  //
  // The webapp's own import affordance, an alternative to the `import` CLI:
  // submits a URL (plus a fetch-options depth preset, from GET
  // /api/fetch-options) to the server, which runs it through the exact same
  // fetch/flush/dedup pipeline as a background job (see player.rs `ingest`).
  // Jobs are tracked client-side only (`jobs`, newest first) — a page reload
  // loses the list, same as every other bit of client-side-only UI state in
  // this app — and each job polls its own status independently, so queuing
  // several imports back-to-back shows all of their progress at once rather
  // than serializing them in the UI (the server itself still processes one
  // connection at a time — see main.rs's single-threaded `LocalSet` — so
  // "independent" here is about polling, not actual concurrency). Lives in
  // its own permanent `#view-import` container (see the mode-switching
  // section above) precisely so that polling keeps running while you're
  // looking at Library/Graph/Player instead — mirrors how Player's dock
  // survives a mode switch.
  const Ingest = (() => {
    const viewEl = document.getElementById("view-import");
    const POLL_MS = 1000;
    const MAX_SHOWN = 30;

    // Built-in fallback so the form works even before (or if)
    // GET /api/fetch-options/files responds — matches the server's own
    // always-present `__shallow__` choice (see fetch_options.rs `shallow`).
    // `<config_dir>/fetch_options/` is otherwise entirely user-managed: no
    // file here is bundled or assumed, the list is whatever `files` gets
    // replaced with once the request above resolves.
    let files = [{ id: "__shallow__", label: "Quick (1 level deep, no config file)" }];
    let selectedFile = "__shallow__";
    // Entry-point names the currently selected file offers (its YAML
    // document's own top-level keys — see fetch_options.rs's module doc on
    // why one file can define more than one). Empty for `__shallow__` (not
    // a real file) and for any file that only defines `main` — the picker
    // below only renders when this has more than one name.
    let entryPoints = [];
    let selectedEntryPoint = "main";

    // { id, query, status, stage, message, detail, entryId, errorMessage, canceling }
    let jobs = [];
    let inputValue = "";
    let submitError = null;

    function findJob(id) {
      return jobs.find((j) => j.id === id);
    }

    const RUNNING = (job) => job.status === "pending" || job.status === "running";

    // Renders `job.detail` (see `ingest_progress::JobProgressSink` on the
    // server) as a CLI-import-style panel: fetched/failed counters, the
    // handful of most recent per-pair fetch lines, and live per-domain HTTP
    // in-flight/done counts — everything the `import` binary's terminal
    // shows, minus the log-level-gated debug lines. Returns `null` while a
    // job hasn't reported a detail payload yet (still `pending`, or a job
    // kind that never sends one).
    // The specific failures, not just a count — collapsed by default since
    // there can be up to 100 of them (see `MAX_FAILURES` server-side), but
    // present and searchable instead of scrolling out of a 6-line rolling
    // log the moment the next successful fetch comes in. This is the record
    // that was missing when a big `@ShirakamiFubuki` import had ~180
    // failures no one could identify afterwards.
    function renderFailures(detail) {
      const failures = detail.failures;
      if (!Array.isArray(failures) || !failures.length) return null;
      const truncated = detail.entries_failed > failures.length;
      const label =
        `${detail.entries_failed} failed request${detail.entries_failed === 1 ? "" : "s"}` +
        (truncated ? ` (first ${failures.length} shown)` : "");
      return el("details", { className: "ingest-job-failures" }, [
        el("summary", { text: label }),
        el(
          "ul",
          { className: "ingest-job-failures-list" },
          failures.map((line) => el("li", { text: line }))
        ),
      ]);
    }

    function renderActivity(detail, { compact = false } = {}) {
      if (!detail) return null;

      const counters = el("p", { className: "ingest-job-counters" }, [
        el("span", { text: `${detail.entries_fetched ?? 0} fetched` }),
        detail.entries_failed
          ? el("span", { className: "ingest-job-counter-failed", text: `${detail.entries_failed} failed` })
          : null,
        detail.youtube_quota_units
          ? el("span", {
              text: `${detail.youtube_quota_units} YouTube quota unit${detail.youtube_quota_units === 1 ? "" : "s"}`,
            })
          : null,
      ]);
      const failures = renderFailures(detail);

      // Once a job is done, the live fetch log and per-domain in-flight
      // counts are just noise (frozen at whatever they were mid-flight) —
      // the running totals are what's worth keeping around. Failed/canceled
      // jobs are the exception: what was happening right before it stopped
      // is exactly the forensic detail worth keeping visible. The failure
      // list itself is worth keeping in every case, compact included — it's
      // the one thing here that isn't just a snapshot of transient activity.
      if (compact) {
        return el("div", { className: "ingest-job-activity" }, [counters, failures]);
      }

      const recent = Array.isArray(detail.recent) && detail.recent.length
        ? el(
            "ul",
            { className: "ingest-job-log" },
            detail.recent.slice(-6).map((line) => el("li", { text: line }))
          )
        : null;

      const domains = Array.isArray(detail.http) && detail.http.length
        ? el(
            "ul",
            { className: "ingest-job-domains" },
            detail.http.slice(0, 6).map((d) =>
              el("li", { className: d.in_flight ? "active" : "" }, [
                el("span", { className: "ingest-job-domain-host", text: d.host }),
                el("span", {
                  className: "ingest-job-domain-count",
                  text: d.in_flight ? `${d.in_flight} in flight · ${d.done} done` : `${d.done} done`,
                }),
              ])
            )
          )
        : null;

      return el("div", { className: "ingest-job-activity" }, [counters, failures, recent, domains]);
    }

    function renderJob(job) {
      let statusEl;
      if (job.status === "succeeded") {
        statusEl = el("span", { className: "ingest-job-status done", text: "✓" });
      } else if (job.status === "failed" || job.status === "canceled") {
        statusEl = el("span", { className: "ingest-job-status error", text: "✕" });
      } else {
        statusEl = el("span", { className: "ingest-job-status" }, [
          el("span", { className: "ingest-job-spinner" }),
        ]);
      }

      const body = el("div", { className: "ingest-job-body" }, [
        el("p", { className: "ingest-job-query", text: job.query }),
      ]);

      if (job.status === "succeeded") {
        body.appendChild(
          el("button", {
            className: "ingest-job-link",
            type: "button",
            text: "Open →",
            onclick: () => viewEntry(job.entryId),
          })
        );
        const summary = renderActivity(job.detail, { compact: true });
        if (summary) body.appendChild(summary);
      } else if (job.status === "failed" || job.status === "canceled") {
        body.appendChild(
          el("p", {
            className: "ingest-job-detail error",
            text: job.errorMessage || (job.status === "canceled" ? "canceled" : "import failed"),
          })
        );
        // A canceled/failed job can still carry a `detail` snapshot from its
        // last tick before it stopped — worth keeping visible as a record of
        // how far it got, not just clearing it.
        const activity = renderActivity(job.detail);
        if (activity) body.appendChild(activity);
      } else {
        body.appendChild(
          el("p", { className: "ingest-job-detail", text: job.message || job.stage || "queued…" })
        );
        const activity = renderActivity(job.detail);
        if (activity) body.appendChild(activity);
      }

      const actions = [];
      if (RUNNING(job)) {
        actions.push(
          el("button", {
            className: "ingest-job-cancel",
            type: "button",
            text: job.canceling ? "Canceling…" : "Cancel",
            disabled: job.canceling,
            onclick: () => cancelJob(job.id),
          })
        );
      }
      if (job.detail) {
        actions.push(
          el("button", {
            className: "ingest-job-download",
            type: "button",
            title: "Download this job's log as a text file",
            text: "Log",
            onclick: () => downloadJobLog(job),
          })
        );
      }
      actions.push(
        el("button", {
          className: "ingest-job-dismiss",
          type: "button",
          "aria-label": "Dismiss",
          text: "×",
          onclick: () => {
            jobs = jobs.filter((j) => j.id !== job.id);
            render();
          },
        })
      );

      return el("li", { className: "ingest-job" }, [statusEl, body, ...actions]);
    }

    // Plain-text rendering of everything a job's card knows, for people who'd
    // rather read the outcome in a text editor / paste it somewhere than dig
    // through the server's own log output (which needs shell access, and
    // only has whatever the process's stdout was redirected to) or click
    // open the collapsed failures list. This is the entire point of keeping
    // `detail.failures` around uncapped-in-spirit (well, capped at 100, but
    // far more than the 6-line activity log shows) — it's finally readable.
    function jobLogText(job) {
      const lines = [];
      lines.push(`musiclib-rs import log`);
      lines.push(`query: ${job.query}`);
      lines.push(`job id: ${job.id}`);
      lines.push(`status: ${job.status}`);
      if (job.createdAt) lines.push(`started: ${job.createdAt}`);
      if (job.updatedAt) lines.push(`last update: ${job.updatedAt}`);
      if (job.status === "succeeded") lines.push(`entry id: ${job.entryId}`);
      if (job.errorMessage) lines.push(`error: ${job.errorMessage}`);
      lines.push("");

      const d = job.detail;
      if (!d) {
        lines.push("(no progress was reported for this job)");
        return lines.join("\n");
      }

      lines.push(
        `summary: ${d.entries_fetched ?? 0} fetched, ${d.entries_failed ?? 0} failed` +
          (d.youtube_quota_units ? `, ${d.youtube_quota_units} YouTube quota unit(s)` : "")
      );
      lines.push("");

      lines.push(`failed requests (${d.entries_failed ?? 0}):`);
      if (Array.isArray(d.failures) && d.failures.length) {
        if (d.entries_failed > d.failures.length) {
          lines.push(`  (showing the first ${d.failures.length})`);
        }
        for (const f of d.failures) lines.push(`  ${f}`);
      } else {
        lines.push("  (none)");
      }
      lines.push("");

      if (Array.isArray(d.recent) && d.recent.length) {
        lines.push("most recent activity:");
        for (const r of d.recent) lines.push(`  ${r}`);
        lines.push("");
      }

      if (Array.isArray(d.http) && d.http.length) {
        lines.push("HTTP activity by domain:");
        for (const h of d.http) {
          lines.push(
            `  ${h.host}: ${h.in_flight ? `${h.in_flight} in flight, ` : ""}${h.done} done`
          );
        }
      }

      return lines.join("\n");
    }

    function downloadJobLog(job) {
      const blob = new Blob([jobLogText(job)], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = el("a", { href: url, download: `musiclib-import-${job.id}.log.txt` });
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    async function cancelJob(id) {
      const job = findJob(id);
      if (!job || job.canceling) return;
      job.canceling = true;
      render();
      try {
        await del(`/api/jobs/${id}`);
      } catch (e) {
        job.canceling = false;
        submitError = e.message;
        render();
        return;
      }
      // Don't wait for the next scheduled poll tick (up to POLL_MS away) —
      // fetch the now-canceled status right away for snappier feedback. The
      // tick already in flight from the original `poll()` call still fires
      // too, but by then the status is terminal, so it's a no-op re-render.
      poll(id);
    }

    function render() {
      viewEl.innerHTML = "";

      const urlInput = el("input", {
        className: "import-url-input",
        type: "text",
        placeholder: "Paste a URL (YouTube, Spotify, MusicBrainz, Discogs, SoundCloud, NicoNico…)",
        value: inputValue,
        oninput: (e) => {
          inputValue = e.target.value;
        },
        onkeydown: (e) => {
          if (e.key === "Enter") submit();
        },
      });
      const fileSelect = el("select", {
        className: "import-select",
        title: "Which fetch-options file to use",
        onchange: (e) => {
          selectedFile = e.target.value;
          loadEntryPoints(selectedFile);
        },
      });
      for (const f of files) {
        fileSelect.appendChild(el("option", { value: f.id, text: f.label || `${f.id}.yaml` }));
      }
      fileSelect.value = selectedFile;

      // Only shown once a file is picked that actually defines more than
      // one entry point — most files just have `main`, and forcing a choice
      // of one option every time would be pure friction.
      let entryPointSelect = null;
      if (entryPoints.length > 1) {
        entryPointSelect = el(
          "select",
          {
            className: "import-select",
            title: "Which entry point in the file to start from",
            onchange: (e) => {
              selectedEntryPoint = e.target.value;
            },
          },
          entryPoints.map((name) => el("option", { value: name, text: name }))
        );
        entryPointSelect.value = selectedEntryPoint;
      }

      const submitBtn = el("button", {
        className: "play-cta",
        type: "button",
        text: "Start import",
        onclick: submit,
      });

      const jobsList = jobs.length
        ? el(
            "ul",
            { className: "ingest-jobs import-jobs" },
            jobs.slice(0, MAX_SHOWN).map(renderJob)
          )
        : null;

      viewEl.appendChild(
        el("div", { className: "import-view" }, [
          el("p", { className: "card-kicker", text: "Import" }),
          el("h1", { className: "card-title", text: "Add to your library" }),
          el("p", {
            className: "card-meta",
            text: "Paste a URL from any source musiclib-rs understands, pick a fetch-options file from your config directory (and which entry point in it to start from, if it defines more than one), and it runs through the same pipeline as the import CLI.",
          }),
          el("div", { className: "import-form" }, [urlInput, fileSelect, entryPointSelect, submitBtn]),
          submitError ? el("p", { className: "rail-foot-error", text: submitError }) : null,
          el("p", { className: "manifest-label", text: jobs.length ? "Recent imports" : "No imports yet" }),
          jobsList,
        ])
      );
    }

    // Polls one job until it reaches a terminal status. Stops silently if the
    // job was dismissed from `jobs` while in flight — nothing left to update.
    async function poll(id) {
      let view;
      try {
        view = await api(`/api/jobs/${id}`);
      } catch (e) {
        const job = findJob(id);
        if (job) {
          job.status = "failed";
          job.errorMessage = e.message;
          render();
        }
        return;
      }
      const job = findJob(id);
      if (!job) return;
      job.status = view.status;
      job.stage = view.progress?.stage || null;
      job.message = view.progress?.message || null;
      job.detail = view.progress?.detail || null;
      job.createdAt = job.createdAt || view.created_at || null;
      job.updatedAt = view.updated_at || null;
      if (view.status === "succeeded") {
        job.entryId = view.result?.entry_id ?? null;
      } else if (view.status === "failed" || view.status === "canceled") {
        job.errorMessage = view.error?.message || null;
      }
      render();
      if (view.status === "pending" || view.status === "running") {
        setTimeout(() => poll(id), POLL_MS);
      }
    }

    async function submit() {
      const query = inputValue.trim();
      if (!query) return;
      inputValue = "";
      submitError = null;
      let res;
      try {
        res = await postJson("/api/ingest", {
          query,
          fetch_options: { file: selectedFile, entry_point: selectedEntryPoint || "main" },
        });
      } catch (e) {
        submitError = e.message;
        render();
        return;
      }
      jobs = [
        { id: res.job_id, query, status: "pending", stage: null, message: null, detail: null },
        ...jobs,
      ];
      render();
      poll(res.job_id);
    }

    // Fetched once at startup; `render()` above already works off the
    // built-in `__shallow__` fallback in the meantime, so a slow or failed
    // request just means the file picker stays down to that one option.
    async function loadFiles() {
      try {
        const data = await api("/api/fetch-options/files");
        if (Array.isArray(data.files) && data.files.length) {
          files = data.files;
          if (!files.some((f) => f.id === selectedFile)) {
            selectedFile = files[0].id;
          }
        }
      } catch {
        // keep the built-in fallback — the form still works.
      }
      await loadEntryPoints(selectedFile);
    }

    // `__shallow__` isn't a real file, so it never has more than the one
    // implicit entry point — skip the network round trip and just clear the
    // picker. `render()` at the end covers both branches.
    async function loadEntryPoints(fileId) {
      if (fileId === "__shallow__") {
        entryPoints = [];
        selectedEntryPoint = "main";
        render();
        return;
      }
      try {
        const data = await api(`/api/fetch-options/entry-points?file=${encodeURIComponent(fileId)}`);
        entryPoints = Array.isArray(data.entry_points) ? data.entry_points : [];
      } catch {
        entryPoints = [];
      }
      selectedEntryPoint = entryPoints.includes("main") ? "main" : entryPoints[0] || "main";
      render();
    }

    function init() {
      render();
      loadFiles();
    }

    return { render: init };
  })();

  // ---------- shuffle mix: familiar vs new ----------
  //
  // "Shuffle all" and the auto-recommend top-up draw each batch from two
  // pools. Familiar tracks are the ones NRS has scored, directly or through
  // an album or artist (`/api/library/nrs-pool`, see `nrs_pool.rs`); new
  // tracks come from the server's uniform sampler with the familiar pool
  // excluded. The settings decide the split and how NRS scores become draw
  // odds; they live in localStorage like this player's other preferences.
  // The cooldown reads the server's play log (`/api/plays/last`, see
  // `PlayLog`), plus plays noted since it was last read. Without a
  // reachable NRS app every batch is new, which is the plain library
  // shuffle.
  const ShuffleMix = (() => {
    const SETTINGS_KEY = "shuffle_mix";
    // When "Clear" last reset the cooldown (ms): plays before it are ignored.
    const PLAYS_CLEARED_KEY = "shuffle_mix_plays_cleared";
    const PLAYS_MAX_AGE_MS = 10 * 60 * 1000;
    const POOL_MAX_AGE_MS = 10 * 60 * 1000;
    const SIM_RUNS = 150;
    const TIERS = ["direct", "album", "artist"];
    const TIER_LABEL = { direct: "Scored track", album: "Scored album", artist: "Scored artist", new: "New" };
    const TIER_COLOR = {
      direct: "var(--type-track)",
      album: "var(--type-release)",
      artist: "var(--type-artist)",
    };
    // Cooldown half-life choices in hours: a log-ish scale reads better on
    // one slider than linear hours.
    const HALF_LIVES = [0, 1, 2, 4, 6, 12, 24, 48, 72, 168, 336, 720];
    const DEFAULTS = {
      familiar: 0.7,
      directOn: true,
      direct: 1,
      albumOn: true,
      album: 0.6,
      artistOn: true,
      artist: 0.35,
      artistMainOnly: true,
      combine: "max",
      floor: 0,
      basis: "score",
      sharpness: 1.5,
      cooldownHours: 24,
      cooldownStrength: 0.85,
      perSourceCap: 4,
      placement: "spread",
      familiarFirst: true,
      batch: 100,
    };
    const PRESETS = [
      { id: "comfort", label: "Comfort", values: { familiar: 0.9, direct: 1, album: 0.5, artist: 0.2, sharpness: 2.5, cooldownHours: 12, cooldownStrength: 0.7 } },
      { id: "balanced", label: "Balanced", values: { familiar: 0.7, direct: 1, album: 0.6, artist: 0.35, sharpness: 1.5, cooldownHours: 24, cooldownStrength: 0.85 } },
      { id: "explore", label: "Explore", values: { familiar: 0.4, direct: 1, album: 0.8, artist: 0.6, sharpness: 0.8, cooldownHours: 48, cooldownStrength: 0.95 } },
      { id: "discover", label: "Discover", values: { familiar: 0.1, direct: 1, album: 1, artist: 1, sharpness: 0.5, cooldownHours: 72, cooldownStrength: 1 } },
    ];

    function readJson(key, fallback) {
      try {
        return JSON.parse(localStorage.getItem(key) || "null") ?? fallback;
      } catch {
        return fallback;
      }
    }

    function writeJson(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch {}
    }

    function loadSettings() {
      const saved = readJson(SETTINGS_KEY, {});
      const out = { ...DEFAULTS };
      for (const k of Object.keys(DEFAULTS)) {
        if (typeof saved[k] === typeof DEFAULTS[k]) out[k] = saved[k];
      }
      return out;
    }

    let settings = loadSettings();
    // entry id -> last time it started a counted play (ms).
    let plays = {};
    let playsLoadedAt = 0;
    // The old localStorage play log had no durations; it isn't migrated.
    try {
      localStorage.removeItem("shuffle_mix_plays");
    } catch {}

    // The longest cooldown window (two half-lives of the longest choice).
    const PLAYS_WINDOW_MS = 2 * HALF_LIVES[HALF_LIVES.length - 1] * 3.6e6;

    async function loadPlays(force) {
      if (!force && Date.now() - playsLoadedAt < PLAYS_MAX_AGE_MS) return;
      playsLoadedAt = Date.now();
      const since = Math.max(Date.now() - PLAYS_WINDOW_MS, readJson(PLAYS_CLEARED_KEY, 0));
      try {
        const res = await api(`/api/plays/last?since=${Math.floor(since / 1000)}`);
        const loaded = {};
        for (const [id, at] of res.plays) loaded[id] = at * 1000;
        // Keep plays noted here that the server answer may predate.
        for (const [id, at] of Object.entries(plays)) {
          if (!(loaded[id] >= at)) loaded[id] = at;
        }
        plays = loaded;
        schedule();
      } catch {
        playsLoadedAt = 0;
      }
    }

    function set(patch) {
      settings = { ...settings, ...patch };
      writeJson(SETTINGS_KEY, settings);
      syncControls();
      schedule();
    }

    /// A play just became a counted one (see `PlayLog`); the server has it
    /// too, this just doesn't wait for the next `loadPlays`.
    function notePlayed(entryId) {
      plays[entryId] = Date.now();
      schedule();
    }

    // ---- the familiar pool ----

    let pool = null;
    let poolLoadedAt = 0;
    let poolError = null;
    let nrsUrl = null;
    let poolLoading = null;

    function loadPool(refresh = false) {
      const fresh = pool && Date.now() - poolLoadedAt < POOL_MAX_AGE_MS;
      if (fresh && !refresh) return Promise.resolve(pool);
      if (poolLoading && !refresh) return poolLoading;
      poolLoading = (async () => {
        try {
          const res = await api(`/api/library/nrs-pool${refresh ? "?refresh=1" : ""}`);
          nrsUrl = res.nrs_url;
          if (res.available) {
            pool = res.pool;
            poolLoadedAt = Date.now();
            poolError = null;
          } else {
            poolError = res.error || "NRS is unavailable";
          }
        } catch (err) {
          poolError = err.message;
        } finally {
          poolLoading = null;
        }
        schedule();
        return pool;
      })();
      schedule();
      return poolLoading;
    }

    // ---- scores to odds ----

    function lowerBound(sorted, v) {
      let lo = 0;
      let hi = sorted.length;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (sorted[mid] < v) lo = mid + 1;
        else hi = mid;
      }
      return lo;
    }

    function upperBound(sorted, v) {
      let lo = 0;
      let hi = sorted.length;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (sorted[mid] <= v) lo = mid + 1;
        else hi = mid;
      }
      return lo;
    }

    // One row per familiar track that any enabled tier reaches: its value
    // (tier weight x NRS score, the strongest or the sum across tiers), the
    // tier and pool source that contributed most, and its draw weight. A
    // source below the score floor doesn't count. `base` is the value's
    // position on the chosen basis in (0, 1]; `w` is `base ^ sharpness`
    // times the cooldown factor `cool`.
    function weigh(s = settings) {
      const counts = { direct: 0, album: 0, artist: 0 };
      if (!pool) return { rows: [], all: [], counts, vmax: 0, sorted: [] };
      const src = pool.sources;
      const best = (indices) => {
        let b = null;
        for (const i of indices) {
          const score = src[i].score;
          if (score >= s.floor && (b === null || score > src[b].score)) b = i;
        }
        return b;
      };
      const all = [];
      for (const track of pool.tracks) {
        const picks = {
          direct: best(track.direct),
          album: best(track.albums),
          artist: best(track.artists.filter(([, main]) => main || !s.artistMainOnly).map(([i]) => i)),
        };
        let value = 0;
        let tier = null;
        let source = null;
        let top = 0;
        for (const k of TIERS) {
          if (picks[k] === null) continue;
          counts[k]++;
          if (!s[`${k}On`] || !(s[k] > 0)) continue;
          const c = src[picks[k]].score * s[k];
          value = s.combine === "sum" ? value + c : Math.max(value, c);
          if (c > top) {
            top = c;
            tier = k;
            source = picks[k];
          }
        }
        if (value > 0) all.push({ track, value, tier, source, base: 0, raw: 0, cool: 1, w: 0 });
      }
      const sorted = all.map((r) => r.value).sort((a, b) => a - b);
      const vmax = sorted.length ? sorted[sorted.length - 1] : 0;
      const now = Date.now();
      for (const r of all) {
        r.base =
          s.basis === "percentile"
            ? (lowerBound(sorted, r.value) + upperBound(sorted, r.value)) / 2 / sorted.length
            : r.value / vmax;
        r.raw = s.sharpness > 0 ? Math.pow(r.base, s.sharpness) : 1;
        const at = plays[r.track.entry_id];
        if (at && s.cooldownHours > 0 && s.cooldownStrength > 0) {
          const ageHours = (now - at) / 3.6e6;
          r.cool = 1 - s.cooldownStrength * Math.pow(2, -ageHours / s.cooldownHours);
        }
        r.w = r.raw * r.cool;
      }
      return { rows: all.filter((r) => r.w > 0), all, counts, vmax, sorted };
    }

    // `k` rows by weight, without replacement (Efraimidis-Spirakis: the
    // largest u^(1/w) wins, compared as log(u)/w), keeping at most
    // `perSourceCap` per album or artist the value came through.
    function drawFamiliar(rows, k, s, skip) {
      if (k <= 0 || !rows.length) return [];
      const keyed = [];
      for (const r of rows) {
        if (skip && skip.has(r.track.entry_id)) continue;
        keyed.push([Math.log(Math.random()) / r.w, r]);
      }
      keyed.sort((a, b) => b[0] - a[0]);
      const perSource = new Map();
      const out = [];
      for (const [, r] of keyed) {
        if (out.length >= k) break;
        if (s.perSourceCap > 0 && r.tier !== "direct") {
          const n = perSource.get(r.source) || 0;
          if (n >= s.perSourceCap) continue;
          perSource.set(r.source, n + 1);
        }
        out.push(r);
      }
      return out;
    }

    function shuffleInPlace(a) {
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // Draw order is weight order, so both lists are shuffled first. "Spread"
    // interleaves them at their own even, jittered spacing.
    function arrange(familiar, fresh, s) {
      shuffleInPlace(familiar);
      shuffleInPlace(fresh);
      let out;
      if (s.placement === "spread" && familiar.length && fresh.length) {
        const keyed = [
          ...familiar.map((x, i) => [(i + 0.15 + 0.7 * Math.random()) / familiar.length, x]),
          ...fresh.map((x, i) => [(i + 0.15 + 0.7 * Math.random()) / fresh.length, x]),
        ];
        keyed.sort((a, b) => a[0] - b[0]);
        out = keyed.map(([, x]) => x);
      } else {
        out = shuffleInPlace([...familiar, ...fresh]);
      }
      if (s.familiarFirst) {
        const i = out.findIndex((x) => x.mix !== "new");
        if (i > 0) out.unshift(out.splice(i, 1)[0]);
      }
      return out;
    }

    // Recently started tracks, newest first, within two cooldown half-lives
    // (a day when the cooldown is off): the new sampler skips these.
    function recentPlays(s) {
      const windowMs = (s.cooldownHours > 0 ? 2 * s.cooldownHours : 24) * 3.6e6;
      const now = Date.now();
      return Object.entries(plays)
        .filter(([, at]) => now - at < windowMs)
        .sort((a, b) => b[1] - a[1])
        .map(([id]) => Number(id));
    }

    /// One batch of `n` queue items (`{entry_id, title, mix}`, `mix` being
    /// the tier or "new"), arranged per the settings. `skip` ids (already
    /// queued) are never drawn.
    async function generate(n, { skip = [] } = {}) {
      const s = settings;
      await Promise.all([loadPool(), loadPlays()]);
      const skipSet = new Set(skip.map(Number));
      const { rows } = weigh(s);
      const want = pool ? Math.round(n * s.familiar) : 0;
      const familiar = drawFamiliar(rows, want, s, skipSet).map((r) => ({
        entry_id: r.track.entry_id,
        title: r.track.title,
        mix: r.tier,
      }));
      const need = n - familiar.length;
      let fresh = [];
      if (need > 0) {
        const params = new URLSearchParams({ limit: String(need) });
        const exclude = TIERS.filter((t) => s[`${t}On`]).map((t) => (t === "direct" ? "track" : t));
        if (pool && exclude.length) params.set("exclude", exclude.join(","));
        const avoid = [...new Set([...skipSet, ...recentPlays(s)])].slice(0, 400);
        if (avoid.length) params.set("skip", avoid.join(","));
        fresh = (await api(`/api/library/shuffle?${params}`)).tracks.map((t) => ({ ...t, mix: "new" }));
      }
      return arrange(familiar, fresh, s);
    }

    // ---- settings UI ----

    let sectionEl = null;
    const syncers = [];
    let refs = {};
    let renderHandle = null;
    let previewItems = [];

    function syncControls() {
      for (const sync of syncers) sync();
      updateRailButton();
    }

    function schedule() {
      if (!sectionEl || !sectionEl.isConnected) {
        updateRailButton();
        return;
      }
      clearTimeout(renderHandle);
      renderHandle = setTimeout(renderDerived, 90);
    }

    function updateRailButton() {
      const pct = Math.round(settings.familiar * 100);
      shuffleMixBtn.innerHTML = svgIcon("sliders", 13) + `<span>${pct}%</span>`;
      shuffleMixBtn.title = `Shuffle mix: ${pct}% familiar, ${100 - pct}% new. Click to adjust.`;
    }

    const fmtNum = (n) => Number(n).toLocaleString();
    const fmtPct = (x) => `${Math.round(x * 100)}%`;

    function slider(key, label, { min, max, step, fmt, hint, values, enabled }) {
      // `values`: the slider walks indices into a fixed list instead.
      const input = el("input", {
        type: "range",
        min: values ? 0 : min,
        max: values ? values.length - 1 : max,
        step: values ? 1 : step,
        "aria-label": label,
      });
      const out = el("output");
      input.oninput = () => set({ [key]: values ? values[Number(input.value)] : Number(input.value) });
      const row = el("div", { className: "mix-row" }, [
        el("span", { className: "mix-label", text: label }),
        input,
        out,
        hint ? el("span", { className: "mix-hint", text: hint }) : null,
      ]);
      syncers.push(() => {
        const v = settings[key];
        if (values) {
          let i = values.indexOf(v);
          if (i < 0) i = values.findIndex((x) => x >= v);
          input.value = String(i < 0 ? values.length - 1 : i);
        } else {
          input.value = String(v);
        }
        out.textContent = fmt(v);
        if (enabled) input.disabled = !enabled();
      });
      return row;
    }

    function seg(key, options, label) {
      const buttons = options.map(([value, text]) =>
        el("button", { type: "button", text, onclick: () => set({ [key]: value }) })
      );
      syncers.push(() => {
        options.forEach(([value], i) => buttons[i].setAttribute("aria-pressed", String(settings[key] === value)));
      });
      return el("span", { className: "mix-seg", role: "group", "aria-label": label }, buttons);
    }

    function check(key, label) {
      const box = el("input", { type: "checkbox" });
      box.onchange = () => set({ [key]: box.checked });
      syncers.push(() => {
        box.checked = settings[key];
      });
      return el("label", { className: "mix-check" }, [box, el("span", { text: label })]);
    }

    function tierRow(tier, label, extra) {
      const box = el("input", { type: "checkbox", "aria-label": `Use ${label.toLowerCase()}` });
      box.onchange = () => set({ [`${tier}On`]: box.checked });
      const count = el("span", { className: "mix-count" });
      refs[`count_${tier}`] = count;
      const input = el("input", { type: "range", min: 0, max: 2, step: 0.05, "aria-label": `${label} weight` });
      input.oninput = () => set({ [tier]: Number(input.value) });
      const out = el("output");
      const row = el("div", { className: "mix-row" }, [
        el("label", {}, [
          box,
          el("span", { className: "mix-tag", style: `background:${TIER_COLOR[tier]}` }),
          el("span", { text: label }),
          count,
        ]),
        input,
        out,
        extra ? el("span", { className: "mix-hint" }, [extra]) : null,
      ]);
      syncers.push(() => {
        const on = settings[`${tier}On`];
        box.checked = on;
        row.classList.toggle("is-off", !on);
        input.disabled = !on;
        input.value = String(settings[tier]);
        out.textContent = `×${settings[tier].toFixed(2)}`;
      });
      return row;
    }

    function group(title, children) {
      return el("div", { className: "mix-group" }, [el("h3", { text: title }), ...children]);
    }

    function presetMatches(p) {
      return Object.entries(p.values).every(([k, v]) => Math.abs(settings[k] - v) < 1e-9);
    }

    function section() {
      if (sectionEl) {
        schedule();
        return sectionEl;
      }
      const presetButtons = PRESETS.map((p) =>
        el("button", { type: "button", text: p.label, onclick: () => set(p.values) })
      );
      syncers.push(() => {
        PRESETS.forEach((p, i) => presetButtons[i].setAttribute("aria-pressed", String(presetMatches(p))));
      });

      refs.pool = el("div", { className: "mix-pool" });
      refs.bar = el("div", { className: "mix-bar", role: "img" });
      refs.legend = el("div", { className: "mix-legend" });
      refs.chart = el("div", { className: "mix-chart" });
      refs.stats = el("div", { className: "mix-stats" });
      refs.held = el("span", { className: "mix-count" });
      refs.likely = el("ol", { className: "mix-list" });
      refs.preview = el("ol", { className: "mix-list", hidden: true });
      refs.playPreview = el("button", {
        className: "ghost-btn",
        type: "button",
        text: "Play this batch",
        disabled: true,
        onclick: () => previewItems.length && playMixBatch(previewItems),
      });

      sectionEl = el("div", { className: "settings-section", id: "shuffle-mix-settings" }, [
        el("div", { className: "mix-head" }, [
          el("h2", { text: "Shuffle mix" }),
          el("span", { className: "mix-seg", role: "group", "aria-label": "Presets" }, presetButtons),
        ]),
        el("p", {
          className: "sub",
          text:
            "Shuffle all and auto-recommend fill each batch with familiar tracks (ones NRS has scored, directly or through an album or artist) and new tracks from the rest of your library.",
        }),
        refs.pool,
        refs.bar,
        refs.legend,
        slider("familiar", "Familiar share", {
          min: 0,
          max: 1,
          step: 0.01,
          fmt: fmtPct,
          hint: "The rest of each batch is new tracks. A small familiar pool tops up with new ones.",
        }),

        group("Where familiar tracks come from", [
          tierRow("direct", "Tracks you scored"),
          tierRow("album", "On albums you scored"),
          tierRow("artist", "By artists you scored", check("artistMainOnly", "Main artist credits only")),
          el("div", { className: "mix-row" }, [
            el("span", { className: "mix-label", text: "Reached more than one way" }),
            el("span", {}, [seg("combine", [["max", "Strongest"], ["sum", "Add up"]], "Combine tiers")]),
            el("span"),
            el("span", {
              className: "mix-hint",
              text: "A track's value is tier weight × NRS score: the strongest tier, or every tier added together.",
            }),
          ]),
          slider("floor", "Ignore scores below", {
            min: 0,
            max: 8,
            step: 0.05,
            fmt: (v) => v.toFixed(2),
            hint: "Scores under this don't make a track familiar.",
          }),
        ]),

        group("How scores become odds", [
          el("div", { className: "mix-row" }, [
            el("span", { className: "mix-label", text: "Rank by" }),
            el("span", {}, [seg("basis", [["score", "NRS score"], ["percentile", "Percentile"]], "Basis")]),
            el("span"),
            el("span", {
              className: "mix-hint",
              text: "Percentile spaces tracks evenly by rank, so a few very high scores don't dominate.",
            }),
          ]),
          slider("sharpness", "Favor top scores", {
            min: 0,
            max: 5,
            step: 0.05,
            fmt: (v) => v.toFixed(2),
            hint: "Odds ∝ value^this. 0: every familiar track equally likely. 1: proportional. Higher: mostly your favorites.",
          }),
          refs.chart,
          refs.stats,
        ]),

        group("Repetition", [
          slider("cooldownHours", "Cooldown half-life", {
            values: HALF_LIVES,
            fmt: (h) => (h === 0 ? "off" : h < 48 ? `${h} h` : `${Math.round(h / 24)} d`),
            hint: "A just-played familiar track's odds recover by half every this long.",
          }),
          slider("cooldownStrength", "Cooldown strength", {
            min: 0,
            max: 1,
            step: 0.01,
            fmt: fmtPct,
            hint: "How far a just-played track's odds drop. 100%: it can't come straight back.",
            enabled: () => settings.cooldownHours > 0,
          }),
          slider("perSourceCap", "Max per album or artist", {
            min: 0,
            max: 20,
            step: 1,
            fmt: (v) => (v === 0 ? "∞" : String(v)),
            hint: "Per batch, for tracks reached through one album or artist. Directly scored tracks aren't capped.",
          }),
          el("div", { className: "mix-row" }, [
            el("span", { className: "mix-label", text: "Play log" }),
            el("span", {}, [refs.held]),
            el("button", {
              className: "ghost-btn",
              type: "button",
              text: "Clear",
              title: "Reset the cooldown. The play log itself is kept.",
              onclick: () => {
                plays = {};
                writeJson(PLAYS_CLEARED_KEY, Date.now());
                schedule();
              },
            }),
          ]),
        ]),

        group("Order", [
          el("div", { className: "mix-row" }, [
            el("span", { className: "mix-label", text: "New tracks" }),
            el("span", {}, [seg("placement", [["spread", "Spread evenly"], ["random", "Anywhere"]], "Placement")]),
            el("span"),
          ]),
          el("div", { className: "mix-row" }, [
            el("span", { className: "mix-label", text: "Opening track" }),
            el("span", {}, [check("familiarFirst", "Start with a familiar track")]),
            el("span"),
          ]),
          slider("batch", "Shuffle all batch", {
            min: 20,
            max: 300,
            step: 10,
            fmt: (v) => String(v),
            hint: "Auto-recommend adds 20 at a time with the same mix.",
          }),
        ]),

        group("Most likely familiar picks per batch", [refs.likely]),

        group("Try it", [
          el("div", { className: "mix-actions" }, [
            el("button", {
              className: "ghost-btn",
              type: "button",
              text: "Preview a batch",
              onclick: async () => {
                try {
                  previewItems = await generate(settings.batch);
                } catch (err) {
                  setStatus(`Couldn't build a batch: ${err.message}`);
                  return;
                }
                renderPreview();
              },
            }),
            refs.playPreview,
          ]),
          refs.preview,
        ]),
      ]);
      syncControls();
      loadPool();
      loadPlays(true);
      schedule();
      return sectionEl;
    }

    function whyText(r) {
      const src = pool.sources[r.source];
      if (r.tier === "direct") return `scored ${src.score.toFixed(2)}`;
      return `${r.tier === "album" ? "on" : "by"} ${src.title} · ${src.score.toFixed(2)}`;
    }

    function renderPool() {
      const box = refs.pool;
      box.innerHTML = "";
      box.classList.toggle("is-error", !!poolError && !pool);
      const refresh = el("button", {
        className: "ghost-btn",
        type: "button",
        text: poolLoading ? "Loading…" : pool ? "Refresh" : "Retry",
        disabled: !!poolLoading,
        onclick: () => loadPool(true),
      });
      if (!pool) {
        box.append(
          el("span", {
            text: poolLoading
              ? "Reading scores from NRS…"
              : `Couldn't read NRS${nrsUrl ? ` at ${nrsUrl}` : ""}: ${poolError}. Shuffles are all new tracks until it's reachable.`,
          }),
          refresh
        );
        return;
      }
      const mins = Math.max(0, Math.round((Date.now() / 1000 - pool.built_at) / 60));
      box.append(
        el("span", {
          text:
            `${fmtNum(pool.nrs_entries)} NRS music entries → ${fmtNum(pool.tracks.length)} playable familiar tracks · ` +
            `read ${mins === 0 ? "just now" : `${mins} min ago`}` +
            (poolError ? ` · last refresh failed: ${poolError}` : ""),
        }),
        refresh
      );
      if (pool.unresolved.length || pool.unplayable) {
        box.append(
          el("details", {}, [
            el("summary", {
              text: [
                pool.unresolved.length ? `${fmtNum(pool.unresolved.length)} NRS entries aren't in this library` : null,
                pool.unplayable ? `${fmtNum(pool.unplayable)} reached tracks have no playable source` : null,
              ]
                .filter(Boolean)
                .join(" · "),
            }),
            el(
              "ul",
              {},
              pool.unresolved.map((u) =>
                el("li", {}, [el("a", { href: u.url, target: "_blank", rel: "noopener", text: u.title || u.nrs_id })])
              )
            ),
          ])
        );
      }
    }

    function renderChart(w) {
      const host = refs.chart;
      const { all, vmax, sorted } = w;
      if (!all.length) {
        host.innerHTML = "";
        return;
      }
      const W = Math.max(280, host.clientWidth || 600);
      const H = 120;
      const pad = { l: 4, r: 4, t: 8, b: 18 };
      const iw = W - pad.l - pad.r;
      const ih = H - pad.t - pad.b;
      const BINS = 40;
      const bins = new Array(BINS).fill(0);
      for (const r of all) bins[Math.min(BINS - 1, Math.floor((r.value / vmax) * BINS))]++;
      const bmax = Math.max(...bins);
      const x = (v) => pad.l + (v / vmax) * iw;
      let rects = "";
      bins.forEach((n, i) => {
        if (!n) return;
        const h = (n / bmax) * ih * 0.9;
        rects += `<rect class="bin" x="${(pad.l + (i / BINS) * iw).toFixed(1)}" y="${(pad.t + ih - h).toFixed(1)}" width="${Math.max(1, iw / BINS - 1).toFixed(1)}" height="${h.toFixed(1)}"></rect>`;
      });
      // Relative odds of one pick as a function of value, before cooldown.
      const s = settings;
      const curveAt = (v) => {
        const base =
          s.basis === "percentile"
            ? (lowerBound(sorted, v) + upperBound(sorted, v)) / 2 / sorted.length
            : v / vmax;
        return s.sharpness > 0 ? Math.pow(base, s.sharpness) : 1;
      };
      const pts = [];
      for (let i = 0; i <= 80; i++) {
        const v = (i / 80) * vmax;
        pts.push(`${x(v).toFixed(1)},${(pad.t + ih - curveAt(v) * ih).toFixed(1)}`);
      }
      host.innerHTML =
        `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Familiar tracks by value, with the odds curve">` +
        rects +
        `<line class="axis" x1="${pad.l}" y1="${pad.t + ih}" x2="${W - pad.r}" y2="${pad.t + ih}"></line>` +
        `<polyline class="curve" points="${pts.join(" ")}"></polyline>` +
        `<text x="${pad.l}" y="${H - 4}">0</text>` +
        `<text x="${W - pad.r}" y="${H - 4}" text-anchor="end">value ${vmax.toFixed(2)}</text>` +
        `<text x="${W - pad.r}" y="${pad.t + 2}" text-anchor="end" dominant-baseline="hanging">odds per pick</text>` +
        `</svg>`;
    }

    function stat(value, label) {
      return el("div", { className: "mix-stat" }, [el("b", { text: value }), el("span", { text: label })]);
    }

    function renderDerived() {
      if (!sectionEl) return;
      renderPool();
      const s = settings;
      const w = weigh(s);
      for (const t of TIERS) {
        refs[`count_${t}`].textContent = pool ? fmtNum(w.counts[t]) : "–";
      }

      const n = s.batch;
      const want = pool ? Math.round(n * s.familiar) : 0;
      const sim = { hits: new Map(), tiers: { direct: 0, album: 0, artist: 0 } };
      if (want > 0 && w.rows.length) {
        for (let i = 0; i < SIM_RUNS; i++) {
          for (const r of drawFamiliar(w.rows, want, s)) {
            sim.hits.set(r, (sim.hits.get(r) || 0) + 1);
            sim.tiers[r.tier]++;
          }
        }
      }
      const per = Object.fromEntries(TIERS.map((t) => [t, sim.tiers[t] / SIM_RUNS]));
      const familiarCount = TIERS.reduce((a, t) => a + per[t], 0);
      const newCount = n - familiarCount;

      refs.bar.innerHTML = "";
      for (const t of TIERS) {
        if (per[t] > 0) refs.bar.append(el("span", { style: `flex-grow:${per[t]};background:${TIER_COLOR[t]}` }));
      }
      if (newCount > 0) refs.bar.append(el("span", { className: "mix-new", style: `flex-grow:${newCount}` }));
      refs.bar.setAttribute(
        "aria-label",
        `Per batch of ${n}: ${Math.round(familiarCount)} familiar, ${Math.round(newCount)} new`
      );
      refs.legend.innerHTML = "";
      for (const t of TIERS) {
        refs.legend.append(
          el("span", {}, [
            el("span", { className: "mix-swatch", style: `background:${TIER_COLOR[t]}` }),
            document.createTextNode(`${TIER_LABEL[t]} `),
            el("b", { text: per[t].toFixed(per[t] < 10 ? 1 : 0) }),
          ])
        );
      }
      refs.legend.append(
        el("span", {}, [
          el("span", { className: "mix-swatch mix-new" }),
          document.createTextNode("New "),
          el("b", { text: newCount.toFixed(newCount < 10 ? 1 : 0) }),
        ]),
        el("span", { text: `per ${n}-track batch` })
      );

      renderChart(w);

      // Effective pool: exp(entropy) of one pick's distribution, i.e. the
      // size of a uniform pool that's as unpredictable.
      let total = 0;
      for (const r of w.rows) total += r.w;
      let entropy = 0;
      for (const r of w.rows) {
        const p = r.w / total;
        if (p > 0) entropy -= p * Math.log(p);
      }
      const effective = w.rows.length ? Math.exp(entropy) : 0;
      const byWeight = w.rows.map((r) => r.w).sort((a, b) => b - a);
      const topN = Math.max(1, Math.round(byWeight.length * 0.1));
      const topShare = total ? byWeight.slice(0, topN).reduce((a, b) => a + b, 0) / total : 0;
      const held = w.all.filter((r) => r.cool < 0.5).length;
      const distinct = sim.hits.size;
      refs.stats.innerHTML = "";
      refs.stats.append(
        stat(fmtNum(w.rows.length), "familiar tracks eligible"),
        stat(`≈ ${fmtNum(Math.round(effective))}`, "effective pool (as varied as a uniform pool this size)"),
        stat(fmtPct(topShare), "of the odds go to the top 10%"),
        stat(
          fmtNum(distinct),
          `different familiar tracks across ${SIM_RUNS} simulated batches`
        )
      );
      const logged = Object.keys(plays).length;
      refs.held.textContent = `${fmtNum(logged)} tracks played recently · ${fmtNum(held)} familiar tracks under half odds from cooldown`;

      const likely = [...sim.hits.entries()].sort((a, b) => b[1] - a[1]).slice(0, 15);
      refs.likely.innerHTML = "";
      if (!likely.length) {
        refs.likely.append(
          el("li", {}, [el("span"), el("span", { className: "t", text: pool ? "No familiar picks with these settings." : "No NRS scores loaded." })])
        );
      }
      likely.forEach(([r, hits], i) => {
        const p = hits / SIM_RUNS;
        refs.likely.append(
          el("li", {}, [
            el("span", { className: "n", text: String(i + 1) }),
            el("span", { className: "t" }, [
              el("span", { className: "mix-tag", style: `background:${TIER_COLOR[r.tier]}` }),
              document.createTextNode(r.track.title || `#${r.track.entry_id}`),
            ]),
            el("span", { className: "why", text: whyText(r) }),
            el("span", { className: "p", text: fmtPct(p) }),
            el("span", { className: "meter", style: `width:${(p * 100).toFixed(1)}%` }),
          ])
        );
      });
    }

    function renderPreview() {
      const list = refs.preview;
      list.innerHTML = "";
      list.hidden = !previewItems.length;
      refs.playPreview.disabled = !previewItems.length;
      previewItems.forEach((item, i) => {
        list.append(
          el("li", {}, [
            el("span", { className: "n", text: String(i + 1) }),
            el("span", { className: "t" }, [
              el("span", { className: `mix-tag${item.mix === "new" ? " mix-new" : ""}`, style: item.mix === "new" ? "" : `background:${TIER_COLOR[item.mix]}` }),
              document.createTextNode(item.title || `#${item.entry_id}`),
            ]),
            el("span", { className: "why", text: TIER_LABEL[item.mix] }),
            el("span"),
          ])
        );
      });
    }

    updateRailButton();
    return { generate, notePlayed, section, batchSize: () => settings.batch };
  })();

  // ---------- settings mode: playback source preference ----------
  //
  // Which provider the player should prefer when a track is playable from more than one (see
  // `sortByProviderPreference`, used by `Player.mountEngine`). A plain ordered
  // list rather than a single "preferred provider" dropdown so it keeps
  // making sense as more providers gain direct playback support — reordering
  // is what "prefer Spotify over YouTube, but fall back to YouTube" means
  // once there are more than two choices to fall back through.
  const Settings = (() => {
    const viewEl = document.getElementById("view-settings");

    function move(order, from, to) {
      const next = order.slice();
      const [item] = next.splice(from, 1);
      next.splice(to, 0, item);
      setProviderPreference(next);
      render();
    }

    function moveButton(label, disabled, iconName, onclick) {
      const btn = el("button", { type: "button", "aria-label": label, disabled, onclick });
      btn.innerHTML = svgIcon(iconName, 13);
      return btn;
    }

    function render() {
      viewEl.innerHTML = "";
      const order = getProviderPreference();

      const list = el(
        "ul",
        { className: "provider-pref-list" },
        order.map((provider, i) =>
          el("li", { className: "provider-pref-row" }, [
            el("span", { className: "provider-pref-rank", text: `${i + 1}.` }),
            el("span", {
              className: "provider-pref-dot",
              style: `background:${PLATFORM_COLOR[provider] || "var(--ink-faint)"}`,
            }),
            el("span", { className: "provider-pref-name", text: providerLabel(provider) }),
            el("span", { className: "provider-pref-moves" }, [
              moveButton(`Move ${providerLabel(provider)} up`, i === 0, "chevron-up", () => move(order, i, i - 1)),
              moveButton(
                `Move ${providerLabel(provider)} down`,
                i === order.length - 1,
                "chevron-down",
                () => move(order, i, i + 1)
              ),
            ]),
          ])
        )
      );

      viewEl.appendChild(
        el("div", { className: "settings-view has-mix" }, [
          ShuffleMix.section(),
          el("div", { className: "settings-section" }, [
            el("h2", { text: "Playback source" }),
            el("p", {
              className: "sub",
              text:
                "When a track is available from more than one source, the player uses the first one from this order. Move a source up to prefer it.",
            }),
            list,
          ]),
        ])
      );
    }

    return { render };
  })();

  // ---------- spotify: connect + playback ----------
  //
  // Authorization Code with PKCE (https://developer.spotify.com/documentation/web-api/tutorials/code-pkce-flow):
  // the browser runs the redirect, and the server (`spotify_auth.rs`)
  // trades the code for tokens and keeps the login, shared by every device.
  // Playback is the Web Playback SDK in this tab, on borrowed access tokens.
  const Spotify = (() => {
    const SCOPES = "streaming user-read-email user-read-private user-modify-playback-state user-read-playback-state";
    // YouTube's embed-permission check treats the raw IP-literal origin
    // differently from a named host, so the app is now browsed via
    // `localhost` (see Player's YouTube mount for its own localhost-only
    // trick) — but the Spotify app's redirect URI is registered as
    // `127.0.0.1`. Normalize back down to that so Connect keeps working
    // without having to re-register anything in the Spotify dashboard.
    //
    // Pinned to `/`, not `location.pathname`: a registered OAuth redirect
    // URI has to be a single static value, but the app now also serves
    // `/entry/{id}` deep links (see the URL-routing section near the bottom
    // of this file) — building this from whatever page happens to be open
    // would send Spotify a different redirect_uri per entry and break
    // Connect everywhere except whichever one URI got registered.
    const REDIRECT_URI = (location.origin + "/").replace("localhost", "127.0.0.1");
    const panelEl = document.getElementById("spotify-panel");

    let player = null;
    let playerReady = null;
    let deviceId = null;
    let lastError = "";
    let stateListener = null;
    // Whether the dock currently wants this device playing: set when a play
    // request goes out, cleared by `release`. A Web API play is only
    // *accepted* when its request returns — the device starts later, so a
    // pause sent in between lands on nothing and the track starts anyway,
    // under whatever replaced it. The state listener pauses any playback
    // that starts while this is false.
    let wanted = false;

    function b64url(buffer) {
      return btoa(String.fromCharCode(...new Uint8Array(buffer)))
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");
    }

    function randomToken(len) {
      const bytes = new Uint8Array(len);
      crypto.getRandomValues(bytes);
      return b64url(bytes.buffer).slice(0, len);
    }

    async function challengeFor(verifier) {
      const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier));
      return b64url(digest);
    }

    // The login lives on the server (`spotify_auth.rs`), shared by every
    // device: this tab knows only the Client ID and whether it's connected,
    // and borrows short-lived access tokens from `/api/spotify/token`.
    let status = { client_id: "", connected: false };
    let statusLoaded = false;
    let access = null;
    let accessRequest = null;

    function getClientId() {
      return status.client_id;
    }

    function isConnected() {
      return status.connected;
    }

    async function loadStatus() {
      try {
        status = await api("/api/spotify/status");
      } catch (e) {
        lastError = `Couldn't reach the server's Spotify login: ${e.message}`;
      }
      statusLoaded = true;
      if (!status.connected) access = null;
    }

    async function sendJson(method, path, payload) {
      const res = await fetch(path, {
        method,
        headers: { "Content-Type": "application/json" },
        body: payload === undefined ? undefined : JSON.stringify(payload),
      });
      if (!res.ok) {
        let message = res.statusText;
        try {
          message = (await res.json()).message || message;
        } catch {}
        throw new Error(message);
      }
    }

    // A browser that logged in before the server held the login still has
    // it in localStorage: hand it over once, then forget it here.
    async function adoptBrowserLogin() {
      let tokens = null;
      try {
        tokens = JSON.parse(localStorage.getItem("spotify_tokens") || "null");
      } catch {}
      const clientId = localStorage.getItem("spotify_client_id");
      const forget = () => {
        localStorage.removeItem("spotify_tokens");
        localStorage.removeItem("spotify_client_id");
      };
      if (!tokens?.refresh_token || !clientId) {
        if (!tokens) localStorage.removeItem("spotify_tokens");
        return;
      }
      if (status.connected) return forget();
      try {
        await sendJson("POST", "/api/spotify/import", { client_id: clientId, refresh_token: tokens.refresh_token });
        forget();
      } catch (e) {
        // Spotify no longer honors it: nothing worth keeping.
        if (/refused/i.test(e.message)) forget();
      }
      await loadStatus();
    }

    /// Resolves once this tab knows the server's login (and has handed over
    /// any old browser-held one), so playback mounting on load sees the real
    /// `isConnected()`.
    const ready = (async () => {
      await loadStatus();
      try {
        await adoptBrowserLogin();
      } catch {}
      render();
    })();

    // Another device may connect or disconnect while this tab sits idle.
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") loadStatus().then(render);
    });

    // connect() stores its PKCE verifier/state under whatever origin it
    // runs on, but the callback is forced to land on 127.0.0.1 (REDIRECT_URI
    // is pinned there — see above) since that's where the Spotify app's
    // redirect URI is registered. If connect() ran on localhost, the
    // callback would look for a verifier that only exists in localhost's
    // localStorage and never find it — a silent "state mismatch". So: hop to
    // 127.0.0.1 *before* generating the verifier, and resume the real
    // connect() once actually there.
    (function resumeConnectIfRequested() {
      if (!new URLSearchParams(location.search).has("spotify_connect")) return;
      history.replaceState({}, "", location.pathname);
      ready.then(connect);
    })();

    function startConnect() {
      // Any other host (a tailnet name, say) is its own redirect URI.
      if (location.hostname !== "localhost") {
        connect();
        return;
      }
      const port = location.port ? ":" + location.port : "";
      location.href = location.protocol + "//127.0.0.1" + port + location.pathname + "?spotify_connect=1";
    }

    async function getValidAccessToken() {
      if (access && access.expires_at - Date.now() > 60000) return access.access_token;
      if (!status.connected) return null;
      accessRequest ||= (async () => {
        try {
          const res = await fetch("/api/spotify/token");
          if (res.status === 409) {
            // Spotify revoked the login, or another device disconnected it.
            await loadStatus();
            render();
            return null;
          }
          if (!res.ok) throw new Error((await res.json().catch(() => ({}))).message || res.statusText);
          access = await res.json();
          return access.access_token;
        } catch (e) {
          lastError = `Spotify token: ${e.message}`;
          render();
          return null;
        } finally {
          accessRequest = null;
        }
      })();
      return accessRequest;
    }

    async function connect() {
      const clientId = getClientId();
      if (!clientId) return;
      const verifier = randomToken(64);
      const state = randomToken(16);
      localStorage.setItem("spotify_pkce_verifier", verifier);
      localStorage.setItem("spotify_pkce_state", state);
      const challenge = await challengeFor(verifier);
      const params = new URLSearchParams({
        client_id: clientId,
        response_type: "code",
        redirect_uri: REDIRECT_URI,
        scope: SCOPES,
        code_challenge_method: "S256",
        code_challenge: challenge,
        state,
      });
      location.href = `https://accounts.spotify.com/authorize?${params}`;
    }

    async function disconnect() {
      try {
        await sendJson("DELETE", "/api/spotify/token");
      } catch (e) {
        lastError = e.message;
      }
      access = null;
      player?.disconnect();
      player = null;
      playerReady = null;
      deviceId = null;
      await loadStatus();
      render();
    }

    async function handleRedirect() {
      const url = new URL(location.href);
      const code = url.searchParams.get("code");
      const state = url.searchParams.get("state");
      const error = url.searchParams.get("error");
      if (!code && !error) return;
      url.searchParams.delete("code");
      url.searchParams.delete("state");
      url.searchParams.delete("error");
      history.replaceState({}, "", url.pathname + url.search + url.hash);

      const expectedState = localStorage.getItem("spotify_pkce_state");
      const verifier = localStorage.getItem("spotify_pkce_verifier");
      localStorage.removeItem("spotify_pkce_state");
      localStorage.removeItem("spotify_pkce_verifier");

      if (error) {
        lastError = `Spotify declined: ${error}`;
      } else if (!verifier || state !== expectedState) {
        lastError = "Spotify connection failed (state mismatch). Try again.";
      } else {
        // The server makes the exchange and keeps the tokens.
        try {
          await sendJson("POST", "/api/spotify/connect", { code, code_verifier: verifier, redirect_uri: REDIRECT_URI });
        } catch (e) {
          lastError = `Spotify connection failed: ${e.message}`;
        }
      }

      // The callback had to land on 127.0.0.1 (REDIRECT_URI is pinned to
      // it), but the rest of the app wants localhost — bounce now that the
      // server holds the login. Nothing needs to cross the origin boundary.
      if (location.hostname === "127.0.0.1" && !lastError) {
        const port = location.port ? ":" + location.port : "";
        location.replace(location.protocol + "//localhost" + port + location.pathname + location.search);
        return;
      }
      await loadStatus();
      render();
    }

    function loadSdk() {
      if (window.Spotify) return Promise.resolve(window.Spotify);
      return new Promise((resolve) => {
        window.onSpotifyWebPlaybackSDKReady = () => resolve(window.Spotify);
        const script = document.createElement("script");
        script.src = "https://sdk.scdn.co/spotify-player.js";
        document.head.appendChild(script);
      });
    }

    function ensurePlayer() {
      if (playerReady) return playerReady;
      playerReady = (async () => {
        const SpotifySdk = await loadSdk();
        const p = new SpotifySdk.Player({
          name: "Library",
          getOAuthToken: async (cb) => cb(await getValidAccessToken()),
          volume: 0.8,
        });
        p.addListener("ready", ({ device_id }) => {
          deviceId = device_id;
        });
        p.addListener("not_ready", () => {
          deviceId = null;
        });
        p.addListener("initialization_error", ({ message }) => {
          lastError = message;
          render();
        });
        p.addListener("authentication_error", ({ message }) => {
          // Drop this tab's borrowed token; the server decides whether the
          // login itself is gone (its next refresh tells).
          lastError = message;
          access = null;
          loadStatus().then(render);
        });
        p.addListener("account_error", () => {
          lastError = "Spotify Premium is required for in-app playback.";
          render();
        });
        p.addListener("player_state_changed", (state) => {
          if (!wanted && state && !state.paused) {
            p.pause().catch(() => {});
            return;
          }
          stateListener?.(state);
        });
        await p.connect();
        player = p;
        return p;
      })();
      return playerReady;
    }

    async function waitForDevice(timeoutMs) {
      const start = Date.now();
      while (!deviceId && Date.now() - start < timeoutMs) {
