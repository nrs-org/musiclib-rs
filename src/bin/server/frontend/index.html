<style>
  :root {
    color-scheme: light;
    --paper: #e7e1cc;
    --paper-deep: #dbd3b8;
    --paper-deeper: #cfc6a6;
    --ink: #24281f;
    --ink-soft: #5b5e4f;
    --ink-faint: #85886f;
    --rail: #c7bc9c;
    --brass: #8a6a34;
    --brass-ink: #6b4f21;
    --verdigris: #4b6b5e;
    --danger: #8c3b2e;
    --type-artist: #6d5788;
    --type-release-group: #3f6690;
    --type-release: #5f7a30;
    --type-track: #9c4f74;
    --serif: "Fraunces", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --sans: "IBM Plex Sans", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", ui-monospace, monospace;
    --player-bar-h: 92px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --paper: #1b1f18;
      --paper-deep: #242820;
      --paper-deeper: #2f342a;
      --ink: #e7e2d1;
      --ink-soft: #a8ab97;
      --ink-faint: #767a65;
      --rail: #3a3e30;
      --brass: #cda45c;
      --brass-ink: #e3c079;
      --verdigris: #7fa391;
      --danger: #d98b7a;
      --type-artist: #b79ad1;
      --type-release-group: #8fb4dd;
      --type-release: #a3c26e;
      --type-track: #d692ae;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--paper);
  }

  button, input {
    font: inherit;
    color: inherit;
  }

  :focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  .app {
    display: grid;
    grid-template-columns: 320px 1fr;
    height: 100vh;
  }

  /* ---------- rail: the drawer ---------- */

  .rail {
    border-right: 1px solid var(--rail);
    display: flex;
    flex-direction: column;
    min-width: 0;
    /* Grid items don't clip their own overflow by default — without this,
       a rail-foot taller than the available height (a short/narrow
       viewport, or the Spotify setup form) bleeds past the grid cell and
       overlaps `main` instead of scrolling within the rail. */
    overflow-y: auto;
  }

  .rail-head {
    padding: 20px 18px 14px;
    border-bottom: 1px solid var(--rail);
  }

  .rail-head-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 0 0 12px;
  }

  .wordmark {
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 500;
    margin: 0;
    letter-spacing: 0.01em;
  }

  /* ---------- mode switcher: Library / Graph / Player ---------- */

  .mode-switcher {
    display: flex;
    gap: 6px;
    margin: 0 0 12px;
  }

  .mode-switcher button {
    flex: 1;
    border: 1px solid var(--rail);
    background: var(--paper-deep);
    color: var(--ink-soft);
    padding: 6px 4px;
    font-size: 12px;
    cursor: pointer;
  }

  .mode-switcher button:hover { color: var(--ink); }

  .mode-switcher button[aria-pressed="true"] {
    border-color: var(--brass);
    background: var(--paper);
    color: var(--brass-ink);
  }

  .search-slot {
    border: 1px solid var(--rail);
    background: var(--paper-deep);
    display: flex;
    align-items: center;
    padding: 0 10px;
  }

  .search-slot svg {
    flex: none;
    opacity: 0.6;
  }

  #search {
    flex: 1;
    background: transparent;
    border: none;
    padding: 9px 8px;
    font-size: 14px;
    min-width: 0;
  }

  #search:focus { outline: none; }
  #search::placeholder { color: var(--ink-faint); }

  .results {
    list-style: none;
    margin: 0;
    padding: 0;
    overflow-y: auto;
    flex: 1;
  }

  .result {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--rail);
    padding: 10px 18px 10px 15px;
    cursor: pointer;
    position: relative;
  }

  .result::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: transparent;
  }

  .result:hover { background: var(--paper-deep); }

  .result[aria-selected="true"] {
    background: var(--paper-deep);
  }

  .result[aria-selected="true"]::before {
    background: var(--brass);
  }

  .result-text {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-width: 0;
  }

  .result-title {
    display: block;
    overflow-wrap: anywhere;
  }

  /* The edition that matched, when it isn't the row's default one. */
  .result-edition {
    font-size: 12px;
    color: var(--ink-faint);
    overflow-wrap: anywhere;
  }

  .result-thumb {
    width: 32px;
    height: 32px;
    border-radius: 3px;
  }

  .result-thumb .art-initial { font-size: 14px; }

  .result-group-label {
    padding: 10px 18px 4px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
  }

  .result-group-label:first-child {
    padding-top: 14px;
  }

  .rail-status {
    margin: 0;
    padding: 14px 18px;
    color: var(--ink-soft);
  }

  .rail-foot {
    border-top: 1px solid var(--rail);
    padding: 12px 18px 16px;
    flex: none;
  }

  .rail-foot-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    margin: 0 0 8px;
  }

  .rail-foot-label .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ink-faint);
    flex: none;
  }

  .rail-foot-label .dot.on { background: var(--verdigris); }

  .rail-foot p.hint {
    margin: 0 0 8px;
    color: var(--ink-soft);
    font-size: 12px;
    line-height: 1.4;
  }

  .rail-foot-row {
    display: flex;
    gap: 6px;
  }

  .rail-foot input[type="text"] {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--rail);
    background: var(--paper-deep);
    padding: 6px 8px;
    font-size: 12px;
    font-family: var(--mono);
  }

  .ghost-btn {
    border: 1px solid var(--rail);
    background: transparent;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }

  .ghost-btn:hover { border-color: var(--brass); color: var(--brass-ink); }

  .rail-head-actions { display: inline-flex; gap: 4px; }

  #shuffle-mix {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: var(--mono);
    font-size: 11px;
  }

  .ghost-btn[disabled] {
    opacity: 0.4;
    cursor: default;
  }

  .ghost-btn[disabled]:hover {
    border-color: var(--rail);
    color: inherit;
  }

  .redirect-box {
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--rail);
    background: var(--paper-deep);
    padding: 5px 6px 5px 8px;
  }

  .redirect-box code {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: var(--mono);
    font-size: 11px;
  }

  .rail-foot-error {
    margin: 8px 0 0;
    color: var(--danger);
    font-size: 12px;
  }

  /* ---------- ingest: "add a song" panel + its job list ---------- */

  .ingest-jobs {
    list-style: none;
    margin: 10px 0 0;
    padding: 0;
  }

  .ingest-job {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 7px 0;
    border-top: 1px solid var(--rail);
  }

  .ingest-job-status {
    flex: none;
    width: 14px;
    height: 14px;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ingest-job-spinner {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 2px solid var(--rail);
    border-top-color: var(--brass);
    animation: ingest-spin 800ms linear infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    .ingest-job-spinner { animation: none; }
  }

  @keyframes ingest-spin {
    to { transform: rotate(360deg); }
  }

  .ingest-job-status.done { color: var(--verdigris); }
  .ingest-job-status.error { color: var(--danger); }

  .ingest-job-body {
    flex: 1;
    min-width: 0;
  }

  .ingest-job-query {
    overflow-wrap: anywhere;
    color: var(--ink-soft);
    font-size: 12px;
  }

  .ingest-job-detail {
    margin: 2px 0 0;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
  }

  .ingest-job-detail.error { color: var(--danger); }

  /* live activity panel: fetched/failed counters, recent fetch-event log,
     per-domain HTTP in-flight/done — the server-side answer to the `import`
     CLI's progress bars, rendered from `JobProgress.detail` (see
     `ingest_progress::JobProgressSink`). */
  .ingest-job-activity {
    margin-top: 4px;
    padding: 6px 8px;
    background: var(--paper-deep);
    border: 1px solid var(--rail);
  }

  .ingest-job-counters {
    margin: 0 0 4px;
    display: flex;
    gap: 10px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
  }

  .ingest-job-counter-failed { color: var(--danger); }

  .ingest-job-failures {
    margin: 0 0 4px;
    font-family: var(--mono);
    font-size: 10.5px;
  }

  .ingest-job-failures summary {
    cursor: pointer;
    color: var(--danger);
    list-style: none;
  }

  .ingest-job-failures summary::-webkit-details-marker { display: none; }
  .ingest-job-failures summary::before { content: "▸ "; }
  .ingest-job-failures[open] summary::before { content: "▾ "; }

  .ingest-job-failures-list {
    list-style: none;
    margin: 4px 0 0;
    padding: 0;
    max-height: 160px;
    overflow-y: auto;
    line-height: 1.5;
    color: var(--ink-soft);
  }

  .ingest-job-failures-list li {
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    border-top: 1px solid var(--rail);
    padding: 2px 0;
  }

  .ingest-job-failures-list li:first-child { border-top: none; }

  .ingest-job-log {
    list-style: none;
    margin: 0 0 4px;
    padding: 0;
    max-height: 96px;
    overflow-y: auto;
    font-family: var(--mono);
    font-size: 10.5px;
    line-height: 1.5;
    color: var(--ink-faint);
  }

  .ingest-job-log li {
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }

  .ingest-job-log li:last-child { color: var(--ink-soft); }

  .ingest-job-domains {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 10px;
    font-family: var(--mono);
    font-size: 10.5px;
  }

  .ingest-job-domains li {
    display: flex;
    gap: 5px;
    color: var(--ink-faint);
  }

  .ingest-job-domains li.active { color: var(--brass); }

  .ingest-job-domain-host { overflow-wrap: anywhere; }

  .ingest-job-cancel {
    flex: none;
    border: 1px solid var(--rail);
    background: none;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 11px;
    padding: 3px 8px;
    line-height: 1;
    align-self: flex-start;
  }

  .ingest-job-cancel:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }
  .ingest-job-cancel:disabled { opacity: 0.6; cursor: default; }

  .ingest-job-download {
    flex: none;
    border: 1px solid var(--rail);
    background: none;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 11px;
    padding: 3px 8px;
    line-height: 1;
    align-self: flex-start;
  }

  .ingest-job-download:hover { border-color: var(--brass); color: var(--brass); }

  .ingest-job-link {
    display: inline-block;
    margin-top: 2px;
    border: none;
    background: none;
    padding: 0;
    font: inherit;
    font-size: 12px;
    color: var(--verdigris);
    text-decoration: none;
    cursor: pointer;
  }

  .ingest-job-link:hover { text-decoration: underline; }

  .ingest-job-dismiss {
    flex: none;
    border: none;
    background: none;
    color: var(--ink-faint);
    cursor: pointer;
    font-size: 13px;
    padding: 0 2px;
    line-height: 1;
  }

  .ingest-job-dismiss:hover { color: var(--ink); }

  /* ---------- import mode: dedicated full-page "add a song" screen,
     replacing the old rail-foot mini box — same job-row markup/CSS above,
     just given room to breathe ---------- */

  .import-view {
    max-width: 640px;
    margin: 0 auto;
    padding: 44px 28px 40px;
  }

  .import-form {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 4px 0 6px;
  }

  .import-url-input {
    flex: 1 1 280px;
    min-width: 0;
    border: 1px solid var(--rail);
    background: var(--paper-deep);
    padding: 10px 12px;
    font-size: 14px;
  }

  .import-url-input:focus { outline: none; border-color: var(--brass); }

  .import-select {
    flex: none;
    border: 1px solid var(--rail);
    background: var(--paper-deep);
    color: var(--ink);
    padding: 0 8px;
    font-size: 13px;
    font-family: var(--mono);
  }

  .import-jobs .ingest-job {
    padding: 10px 0;
  }

  .import-jobs .ingest-job-query {
    font-size: 13px;
  }

  .import-jobs .ingest-job-detail,
  .import-jobs .ingest-job-link {
    font-size: 12px;
  }

  /* ---------- settings mode ---------- */

  .settings-view {
    max-width: 640px;
    margin: 0 auto;
    padding: 44px 28px 40px;
  }

  .settings-section + .settings-section {
    margin-top: 36px;
  }

  .settings-section h2 {
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 500;
    margin: 0 0 4px;
  }

  .settings-section p.sub {
    color: var(--ink-soft);
    margin: 0 0 16px;
  }

  .provider-pref-list {
    list-style: none;
    margin: 0;
    padding: 0;
    border: 1px solid var(--rail);
  }

  .provider-pref-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    background: var(--paper-deep);
  }

  .provider-pref-row + .provider-pref-row {
    border-top: 1px solid var(--rail);
  }

  .provider-pref-rank {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
    width: 1.4em;
    flex: none;
  }

  .provider-pref-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex: none;
  }

  .provider-pref-name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .provider-pref-moves {
    display: flex;
    gap: 4px;
    flex: none;
  }

  .provider-pref-moves button {
    border: 1px solid var(--rail);
    background: transparent;
    color: inherit;
    width: 24px;
    height: 24px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .provider-pref-moves button:hover:not([disabled]) { border-color: var(--brass); color: var(--brass-ink); }

  .provider-pref-moves button[disabled] {
    opacity: 0.3;
    cursor: default;
  }

  /* ---------- settings mode: shuffle mix ---------- */

  .settings-view.has-mix { max-width: 720px; }

  .mix-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .mix-seg {
    display: inline-flex;
    border: 1px solid var(--rail);
  }

  .mix-seg button {
    border: 0;
    background: transparent;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
  }

  .mix-seg button + button { border-left: 1px solid var(--rail); }
  .mix-seg button:hover { color: var(--brass-ink); }

  .mix-seg button[aria-pressed="true"] {
    background: var(--paper-deeper);
    color: var(--brass-ink);
  }

  .mix-pool {
    font-size: 12px;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin: 0 0 14px;
  }

  .mix-pool .ghost-btn { padding: 2px 8px; }
  .mix-pool.is-error { color: var(--danger); }

  .mix-pool details { flex-basis: 100%; }
  .mix-pool summary { cursor: pointer; color: var(--ink-faint); }

  .mix-pool details ul {
    margin: 6px 0 0;
    padding-left: 18px;
    max-height: 160px;
    overflow-y: auto;
  }

  .mix-bar {
    display: flex;
    height: 16px;
    border: 1px solid var(--rail);
    background: var(--paper-deep);
    overflow: hidden;
  }

  .mix-bar span { transition: flex-grow 120ms ease-out; min-width: 0; }

  .mix-legend {
    display: flex;
    gap: 6px 14px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--ink-soft);
    margin: 6px 0 4px;
  }

  .mix-legend b {
    font-family: var(--mono);
    font-weight: 500;
    color: var(--ink);
  }

  .mix-swatch {
    display: inline-block;
    width: 9px;
    height: 9px;
    margin-right: 5px;
    vertical-align: 0;
  }

  .mix-new {
    background: repeating-linear-gradient(135deg, var(--ink-faint) 0 1.5px, transparent 1.5px 5px);
  }

  .mix-group { margin-top: 22px; }

  .mix-group h3 {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 6px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--rail);
  }

  .mix-row {
    display: grid;
    grid-template-columns: 190px minmax(0, 1fr) 64px;
    align-items: center;
    gap: 2px 12px;
    padding: 5px 0;
  }

  .mix-row > label,
  .mix-row > .mix-label {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
  }

  .mix-row input[type="range"] {
    width: 100%;
    margin: 0;
    accent-color: var(--brass);
  }

  .mix-row input[type="range"]:disabled { opacity: 0.35; }

  .mix-row input[type="checkbox"],
  .mix-check input {
    accent-color: var(--brass);
    margin: 0;
  }

  .mix-row output {
    font-family: var(--mono);
    font-size: 12px;
    text-align: right;
  }

  .mix-count {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
  }

  .mix-hint {
    grid-column: 2 / -1;
    font-size: 12px;
    color: var(--ink-faint);
  }

  .mix-check {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .mix-row.is-off > label { color: var(--ink-faint); }

  .mix-chart svg {
    display: block;
    width: 100%;
    height: 120px;
    overflow: visible;
  }

  .mix-chart .bin { fill: var(--paper-deeper); }
  .mix-chart .curve { fill: none; stroke: var(--brass); stroke-width: 1.6; }
  .mix-chart .axis { stroke: var(--rail); }
  .mix-chart .floor { stroke: var(--danger); stroke-dasharray: 3 3; }

  .mix-chart text {
    font-family: var(--mono);
    font-size: 10px;
    fill: var(--ink-faint);
  }

  .mix-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px;
    margin-top: 10px;
  }

  .mix-stat {
    border: 1px solid var(--rail);
    background: var(--paper-deep);
    padding: 7px 9px;
  }

  .mix-stat b {
    display: block;
    font-family: var(--serif);
    font-size: 19px;
    font-weight: 500;
    line-height: 1.2;
  }

  .mix-stat span { font-size: 11px; color: var(--ink-soft); }

  .mix-list {
    list-style: none;
    margin: 0;
    padding: 0;
    border: 1px solid var(--rail);
  }

  .mix-list li {
    display: grid;
    grid-template-columns: 1.8em minmax(0, 1fr) auto 52px;
    align-items: center;
    gap: 8px;
    padding: 5px 9px;
    font-size: 13px;
    background: var(--paper-deep);
    position: relative;
  }

  .mix-list li + li { border-top: 1px solid var(--rail); }

  .mix-list .n {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
  }

  .mix-list .t {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .mix-list .why {
    font-size: 11px;
    color: var(--ink-soft);
    max-width: 240px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .mix-list .p {
    font-family: var(--mono);
    font-size: 11px;
    text-align: right;
  }

  .mix-list .meter {
    position: absolute;
    left: 0;
    bottom: 0;
    height: 2px;
    background: var(--brass);
    opacity: 0.6;
  }

  .mix-tag {
    display: inline-block;
    width: 7px;
    height: 7px;
    margin-right: 6px;
    vertical-align: 1px;
  }

  .mix-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 10px 0;
  }

  @media (max-width: 560px) {
    .mix-row { grid-template-columns: minmax(0, 1fr) 56px; }
    .mix-row > label,
    .mix-row > .mix-label { grid-column: 1 / -1; }
    .mix-hint { grid-column: 1 / -1; }
    .mix-list .why { display: none; }
    .mix-list li { grid-template-columns: 1.8em minmax(0, 1fr) 46px; }
  }

  /* ---------- main: browsing / entry detail ---------- */

  main {
    overflow-y: auto;
    min-width: 0;
  }

  .invite {
    max-width: 420px;
    margin: 14vh auto 0;
    padding: 0 24px;
    text-align: left;
  }

  .invite p.lede {
    font-family: var(--serif);
    font-size: 24px;
    font-weight: 400;
    line-height: 1.3;
    margin: 0 0 8px;
  }

  .invite p.sub {
    color: var(--ink-soft);
    margin: 0;
  }

  .invite.error p.lede {
    color: var(--danger);
  }

  .invite kbd {
    font-family: var(--mono);
    background: var(--paper-deep);
    border: 1px solid var(--rail);
    padding: 1px 5px;
    font-size: 12px;
  }

  .detail {
    max-width: 760px;
    margin: 0 auto;
    padding: 44px 28px 40px;
  }

  .detail.enter {
    animation: rise 260ms ease-out;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-kicker {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 18px;
  }

  .card-title {
    font-family: var(--serif);
    font-size: 30px;
    font-weight: 500;
    line-height: 1.25;
    margin: 0 0 10px;
    overflow-wrap: anywhere;
  }

  .card-meta {
    color: var(--ink-soft);
    margin: 0 0 20px;
  }

  /* ---------- renaming (`nameEditor`) ---------- */
  .rename {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px;
  }

  .card-rename { margin: -4px 0 14px; }

  .rename-toggle {
    background: none;
    border: none;
    padding: 0;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
    cursor: pointer;
  }

  .rename-toggle:hover,
  .rename-toggle:focus-visible {
    color: var(--ink);
    text-decoration: underline;
  }

  .rename-toggle[hidden] { display: none; }

  .rename-mark {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--brass-ink);
  }

  .rename-form {
    flex: 1 1 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
    border: 1px solid var(--rail);
    background: var(--paper-deep);
    padding: 10px;
  }

  .rename-input {
    border: 1px solid var(--rail);
    background: var(--paper);
    color: var(--ink);
    padding: 6px 8px;
    font: inherit;
    font-size: 14px;
    min-width: 0;
  }

  .rename-input:focus { outline: none; border-color: var(--brass); }

  .rename-aliases {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-height: 132px;
    overflow-y: auto;
  }

  .rename-alias {
    border: 1px solid var(--rail);
    background: transparent;
    color: var(--ink-soft);
    padding: 3px 8px;
    font-size: 12px;
    cursor: pointer;
    text-align: left;
    overflow-wrap: anywhere;
  }

  .rename-alias:hover { border-color: var(--ink-soft); color: var(--ink); }

  .rename-alias[aria-pressed="true"] { border-color: var(--brass); color: var(--brass-ink); }

  .rename-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }

  .rename-status {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
  }

  /* ---------- an entry's credited artists ---------- */
  .credits { margin-bottom: 20px; }

  .credits[hidden] { display: none; }

  /* The heading over each section of an entry's page (credits, editions,
     sources). */
  .section-label {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 6px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--rail);
  }

  .card-byline:not(:empty)::after,
  .card-from:not(:empty)::after {
    content: "·";
    margin: 0 8px;
    color: var(--ink-faint);
  }

  .card-byline .credit-name,
  .card-from .credit-name { color: var(--ink); }

  .byline-edit { margin-left: 8px; }

  .credit {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 10px;
    padding: 4px 0;
  }

  .credit-name {
    color: var(--ink);
    text-decoration: none;
  }

  .credit-name:hover,
  .credit-name:focus-visible { text-decoration: underline; }

  .credit-artist {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
  }

  .stamps {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 28px;
  }

  .stamp {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--rail);
    padding: 4px 9px 4px 7px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    text-decoration: none;
    background: var(--paper-deep);
  }

  a.stamp:hover { border-color: var(--ink-soft); color: var(--ink); }

  .stamp .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--ink-faint);
    flex: none;
  }

  .note {
    color: var(--ink-soft);
    border-left: 2px solid var(--rail);
    padding: 2px 0 2px 12px;
    margin-bottom: 28px;
  }

  .relations-link {
    display: inline-block;
    margin-bottom: 28px;
  }

  /* ---------- an entry's editions (`fillEditionList`) ---------- */
  .edition-list { margin-bottom: 28px; }

  .edition-list[hidden] { display: none; }

  .edition-group + .edition-group { margin-top: 10px; }

  .edition-group-label {
    display: flex;
    gap: 6px;
    align-items: baseline;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-soft);
    margin: 8px 0 2px;
  }

  .edition-group-count { color: var(--ink-faint); }

  .edition-rows {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .edition-rows li[hidden] { display: none; }

  .edition-row {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    border: none;
    border-left: 2px solid transparent;
    background: none;
    color: var(--ink);
    font: inherit;
    text-align: left;
    padding: 5px 6px 5px 8px;
    cursor: pointer;
  }

  .edition-row:hover { background: var(--paper-deep); }

  .edition-row[aria-current="true"] {
    border-left-color: var(--verdigris);
    background: var(--paper-deep);
    cursor: default;
  }

  .edition-body {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 2px 10px;
  }

  .edition-who { overflow-wrap: anywhere; }

  .edition-row[aria-current="true"] .edition-who { color: var(--verdigris); }

  .edition-title {
    font-size: 12px;
    color: var(--ink-soft);
    overflow-wrap: anywhere;
  }

  .edition-dots {
    display: flex;
    gap: 4px;
    flex: none;
  }

  .edition-dots .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
  }

  .edition-date {
    flex: none;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
    min-width: 10ch;
    text-align: right;
  }

  .edition-more {
    background: none;
    border: none;
    padding: 4px 8px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    cursor: pointer;
  }

  .edition-more:hover,
  .edition-more:focus-visible { color: var(--ink); text-decoration: underline; }

  /* ---------- an entry's sources (`fillSources`) ---------- */
  .sources { margin-bottom: 20px; }

  .sources[hidden] { display: none; }

  .source-section {
    display: flex;
    gap: 12px;
    align-items: baseline;
    margin-bottom: 8px;
  }

  .source-section-label {
    flex: none;
    width: 6em;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .source-section .stamps { margin-bottom: 0; }

  .stamp-tag { color: var(--ink-faint); }

  .stamp.is-via { border-style: dashed; }

  /* The provider reported this source deleted; its data is kept. */
  .stamp.is-gone { text-decoration: line-through; opacity: 0.6; }

  /* A playable source's privacy, beside its stamp (`privacyChip`). */
  .stamp-group { display: inline-flex; }

  .stamp-group .stamp { border-right: 0; }

  .privacy-chip {
    border: 1px solid var(--rail);
    background: var(--paper);
    padding: 4px 8px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--verdigris);
    cursor: pointer;
  }

  .privacy-chip:hover { color: var(--ink); border-color: var(--ink-soft); }

  .privacy-chip:focus-visible { outline: 2px solid var(--ink-soft); outline-offset: 1px; }

  .privacy-chip.is-hidden { color: var(--danger); }

  .privacy-chip.is-unknown { color: var(--ink-faint); }

  .privacy-chip.is-manual { border-color: var(--brass); }

  @media (max-width: 520px) {
    .source-section { flex-direction: column; gap: 4px; }
  }

  .editions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }

  .editions[hidden] { display: none; }

  .edition-btn {
    border: 1px solid var(--rail);
    background: var(--paper-deep);
    color: var(--ink-soft);
    font-family: var(--mono);
    font-size: 11px;
    padding: 5px 10px;
    cursor: pointer;
  }

  .edition-btn:hover { border-color: var(--ink-soft); color: var(--ink); }

  .edition-btn[aria-current="true"] {
    border-color: var(--verdigris);
    color: var(--verdigris);
    background: var(--paper-deeper);
    cursor: default;
  }

  /* The dock's editions the player can't switch to (`playability`): one
     that's only a local file is disabled; one without a platform link yet
     is dashed, and can still be picked. */
  .edition-btn[data-playability="unlinked"] { border-style: dashed; }
  .edition-btn[data-playability="unavailable"] { opacity: 0.45; cursor: not-allowed; }
  .edition-btn[data-playability="unavailable"]:hover { border-color: var(--rail); color: var(--ink-soft); }

  /* ---------- manual soft-merge (dedup calibration) ---------- */

  .merge-section {
    margin-bottom: 28px;
  }

  .merge-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--verdigris);
    margin: 0 0 8px;
  }

  .dedup-graph {
    position: relative;
    border: 1px solid var(--rail);
    background: var(--paper-deep);
    margin-bottom: 10px;
    width: 100%;
    height: 320px;
    overflow: hidden;
  }

  .dedup-graph.drag-over {
    border-color: var(--brass);
    box-shadow: inset 0 0 0 1px var(--brass);
  }

  /* ---------- graph mode: the same editor, given a full screen instead of
     a 320px box inside the entry-detail card ---------- */

  #view-graph {
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 24px 28px;
    overflow: hidden;
  }

  #view-graph[hidden] { display: none; }

  #view-graph .merge-section {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    margin-bottom: 0;
  }

  /* The canvas plus the detail panel floating over its bottom edge — the
     panel's positioning context. Kept apart from the toolbar and pickers
     above it, so the panel only ever covers the canvas, never a button. */
  #view-graph .graph-stage {
    position: relative;
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
  }

  #view-graph .dedup-graph {
    /* The canvas is now the *only* flex item competing for height here —
       the detail panel is taken out of flow (see below) — so its size
       stays constant regardless of how much the panel's content grows or
       shrinks (a long edge/relation-kind picker used to visibly steal
       height from the canvas since both were flex siblings). */
    flex: 1;
    min-height: 0;
    height: auto;
    margin-bottom: 0;
  }

  #view-graph .graph-detail-panel {
    /* Floats over the bottom of the canvas instead of pushing it — its own
       content (node details, edge actions, the create-link kind picker)
       can grow or shrink freely without ever resizing the graph beneath
       it. Scrolls internally past `max-height` rather than growing further. */
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    max-height: 28vh;
    overflow-y: auto;
    box-shadow: 0 -6px 16px rgba(0, 0, 0, 0.18);
  }

  .graph-empty {
    max-width: 420px;
    margin: 14vh auto 0;
    padding: 0 24px;
    text-align: left;
    color: var(--ink-soft);
  }

  .graph-svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  .node circle,
  .node rect {
    fill: var(--paper);
    stroke: var(--ink-faint);
    stroke-width: 1.5px;
    cursor: pointer;
  }

  /* Fill hue is the entry's type (track/release/release_group/artist);
     shape (circle vs. square, set in JS by `.node.structural`) and stroke
     stay reserved for dedup-graph role, so the two encodings never fight
     over the same channel. Nodes with no known type keep the plain paper
     fill from the base rule above. */
  .node.type-artist circle,
  .node.type-artist rect {
    fill: var(--type-artist);
  }
  .node.type-release_group circle,
  .node.type-release_group rect {
    fill: var(--type-release-group);
  }
  .node.type-release circle,
  .node.type-release rect {
    fill: var(--type-release);
  }
  .node.type-track circle,
  .node.type-track rect {
    fill: var(--type-track);
  }

  /* Structural nodes stay visually "recessed" relative to dedup-graph
     members — same type hue, just faded — rather than losing the type
     color to a flat override. */
  .node.structural circle,
  .node.structural rect {
    fill-opacity: 0.45;
  }

  .node.self circle {
    stroke: var(--brass-ink);
    stroke-width: 3px;
  }

  .node.selected-for-link circle,
  .node.selected-for-link rect {
    stroke: var(--verdigris);
    stroke-width: 3px;
  }

  /* The default edition of a group of several (`default_edition`): a
     brass dot on the node. Scoped under `.nodes` to outrank the node
     shape rules above, which would otherwise restyle it as a shape. */
  .nodes .node circle.edition-badge {
    display: none;
    fill: var(--brass);
    stroke: var(--paper-deep);
    stroke-width: 1.5px;
    pointer-events: none;
  }
  .nodes .node.edition-default circle.edition-badge {
    display: inline;
  }

  /* An edition that scores its original when played (instrumental, TV
     size, ...; `folds_into`): dashed outline, faded fill. */
  .node.edition-folded > :first-child {
    stroke-dasharray: 3 2;
    fill-opacity: 0.55;
  }

  /* One blob behind each edition group's nodes: the group's hull, drawn
     with a thick round-joined stroke so two nodes make a capsule and
     three or more a rounded polygon. Opacity sits on the element, not
     fill/stroke separately, so the two don't stack where they overlap. */
  .edition-hull {
    fill: var(--brass);
    stroke: var(--brass);
    stroke-width: 46px;
    stroke-linejoin: round;
    stroke-linecap: round;
    opacity: 0.1;
    pointer-events: none;
  }

  /* `paint-order: stroke` + a wide stroke in the page background color fakes
     a label background halo without measuring text width for a real <rect>
     behind it — the text itself is unaffected since fill paints on top.
     Labels live in their own layer stacked above every node shape (see
     labelLayer), not nested in their own node's <g>, so one node's shape
     can never paint over a different node's label. */
  .node-label {
    font-family: var(--mono);
    font-size: 10px;
    fill: var(--ink);
    paint-order: stroke;
    stroke: var(--paper-deep);
    stroke-width: 3px;
    stroke-linejoin: round;
    pointer-events: none;
    user-select: none;
  }

  /* Culled by updateLabelVisibility() when it would overlap a
     higher-priority label — the node shape stays put, only the text goes;
     hovering still shows the title via the floating .graph-hover-label. */
  .node-label.label-hidden {
    display: none;
  }

  .edge {
    stroke: var(--ink-faint);
    stroke-width: 2px;
    /* Purely decorative now — all pointer events go to the wider
       `.edge-hit` line stacked on the same path (see the edge join in
       `update()`), so a 1.5–4px visible stroke doesn't also mean a
       1.5–4px-wide click/hover target. */
    pointer-events: none;
  }

  .edge.dedup {
    cursor: pointer;
  }

  .edge-hit {
    fill: none;
    stroke: transparent;
    stroke-width: 14px;
    pointer-events: stroke;
    /* Every edge opens its details on click now, structural included (see
       the edge join in `update()`), so every edge gets the pointer cursor —
       not just dedup edges like before the click behavior was unified. */
    cursor: pointer;
  }

  /* active: a live identity link (same_identity/variant). hover hints
     "unlink" (red). */
  .edge.dedup.active-manual {
    stroke: var(--verdigris);
  }
  .edge.dedup.active-heuristic {
    stroke: var(--verdigris);
    stroke-dasharray: 5 3;
  }
  /* The visible line is `pointer-events: none` (see `.edge` above) so it can
     never itself match `:hover` — the interactive element is `.edge-hit`,
     a sibling under the same `.edge-item` group, so hover state has to key
     off that ancestor instead of the line being recolored. */
  .edge-item:hover .edge.dedup.active-manual,
  .edge-item:hover .edge.dedup.active-heuristic {
    stroke: var(--danger);
  }

  /* blocked: force-unlinked (different_identity) — a hard "no", shown
     solid red. hover hints "click softens it back", not "click restores". */
  .edge.dedup.blocked {
    stroke: var(--danger);
    stroke-width: 2.5px;
  }
  .edge-item:hover .edge.dedup.blocked {
    stroke: var(--brass);
  }

  /* edition: an enabled `EDITION_KINDS` row — two editions of one work.
     Solid brass, with an arrowhead on the derived side when the row
     records which side is the original. */
  .edge.dedup.edition {
    stroke: var(--brass-ink);
  }
  .edge-item:hover .edge.dedup.edition {
    stroke: var(--brass);
  }

  /* related: any other enabled row (medley, same_artist, ...) — a real
     connection, but neither identity nor edition. */
  .edge.dedup.related {
    stroke: var(--brass-ink);
    stroke-dasharray: 2 3;
  }
  .edge-item:hover .edge.dedup.related {
    stroke: var(--brass);
  }

  /* removed: a disabled row — an unlinked link, a softened block, a
     rejected suggestion. Only drawn with "Show removed links" on, or
     after an edit this session, so an undo is still one click away. */
  .edge.dedup.removed {
    stroke-dasharray: 1 4;
    opacity: 0.45;
  }
  .edge-item:hover .edge.dedup.removed {
    stroke: var(--ink-soft);
    opacity: 0.9;
  }

  .edge.structural {
    stroke-dasharray: 5 3;
    stroke-width: 1.5px;
  }
  .edge-item:hover .edge.structural {
    stroke: var(--brass-ink);
  }

  /* The dangling "creating a link" line — see `pendingLine` — is purely
     decorative (the real hit-testing for picking the second node stays on
     the node shapes themselves), so it never intercepts pointer events. */
  .pending-link-line {
    stroke: var(--verdigris);
    stroke-width: 2px;
    stroke-dasharray: 4 3;
    pointer-events: none;
    opacity: 0;
  }
  .pending-link-line.visible {
    opacity: 0.85;
  }

  .graph-arrowhead path {
    fill: var(--ink-faint);
  }
  .graph-arrowhead.edition path {
    fill: var(--brass-ink);
  }

  .graph-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    margin: 0 0 10px;
    padding: 0;
    list-style: none;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-soft);
  }
  .graph-legend li {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .graph-legend svg {
    flex: none;
    overflow: visible;
  }

  .graph-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 12px;
    margin-bottom: 10px;
  }
  .graph-toolbar label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-right: auto;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    cursor: pointer;
  }

  .graph-hover-label {
    position: absolute;
    z-index: 5;
    pointer-events: none;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--mono);
    font-size: 11px;
    padding: 3px 6px;
    max-width: 220px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transform: translate(-50%, -130%);
  }

  .graph-detail-panel {
    border: 1px solid var(--rail);
    background: var(--paper-deep);
    padding: 10px;
    margin-bottom: 10px;
  }

  .graph-detail-title {
    font-size: 14px;
    margin: 0 0 4px;
  }

  .graph-detail-type {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    margin: 0 0 8px;
  }

  .graph-detail-empty {
    color: var(--ink-faint);
    font-size: 12px;
    margin: 0;
  }

  .graph-detail-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }

  .graph-detail-relate {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--rail);
  }

  .graph-detail-edition {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--rail);
  }

  .graph-detail-edition .graph-detail-relate {
    flex-wrap: wrap;
    margin-top: 4px;
    padding-top: 0;
    border-top: none;
  }

  .graph-detail-edition .graph-detail-relate-select:first-child {
    flex-basis: 100%;
    min-height: 32px;
  }

  .graph-detail-fields {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .graph-detail-fields .graph-detail-relate-select {
    min-width: 180px;
    min-height: 28px;
  }

  .graph-detail-relate-select {
    flex: 1;
    font-family: var(--mono);
    font-size: 11px;
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--rail);
    padding: 3px 4px;
  }

  /* ---------- song view and the editor's modes ---------- */

  .graph-seg {
    display: inline-flex;
    border: 1px solid var(--rail);
  }
  .graph-seg[hidden] { display: none; }
  .graph-seg-btn {
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 10px;
    background: transparent;
    color: var(--ink-soft);
    border: 0;
    cursor: pointer;
  }
  .graph-seg-btn + .graph-seg-btn { border-left: 1px solid var(--rail); }
  .graph-seg-btn[aria-pressed="true"] {
    background: var(--ink);
    color: var(--paper);
  }
  .graph-seg-btn:focus-visible { outline: 2px solid var(--brass); outline-offset: -2px; }
  .graph-toolbar .graph-removed-toggle[hidden] { display: none; }
  .graph-toolbar .ghost-btn:disabled { opacity: 0.4; cursor: default; }
  .graph-flash {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--verdigris);
    margin: -4px 0 8px;
  }
  .graph-detail-role {
    font-size: 13px;
    margin: 0 0 8px;
  }
  .graph-selection-list {
    margin: 0 0 4px;
    padding-left: 18px;
    font-size: 12px;
    max-height: 9em;
    overflow-y: auto;
  }
  .graph-legend[hidden] { display: none; }

  .node-label .node-sublabel { fill: var(--ink-soft); }

  .node.song-original circle {
    stroke: var(--brass);
    stroke-width: 3.5px;
  }
  /* Several uploads of one recording: a second ring, like a stack. */
  .node.stacked circle:first-child {
    stroke-width: 1.5px;
    filter: drop-shadow(2px 2px 0 var(--ink-faint));
  }
  .node.conflict circle:first-child { stroke: var(--danger); stroke-width: 3px; }
  .node.detached { opacity: 0.4; }
  .node-label.detached-label { fill-opacity: 0.45; }
  .node.detached circle:first-child { stroke-dasharray: 3 3; }
  .node.selected circle:first-child,
  .node.selected rect:first-child {
    stroke: var(--verdigris);
    stroke-width: 3.5px;
  }

  .edge.tree {
    stroke: var(--brass-ink);
    stroke-width: 1.6px;
    pointer-events: none;
  }
  .edge-item:hover .edge.tree { stroke-width: 2.6px; }
  .edge.identity-link {
    stroke: var(--ink-faint);
    stroke-width: 2.5px;
    stroke-dasharray: 1 3;
    stroke-linecap: round;
    pointer-events: none;
  }
  .edge-label {
    font-family: var(--mono);
    font-size: 9px;
    fill: var(--ink-soft);
    paint-order: stroke;
    stroke: var(--paper-deep);
    stroke-width: 3px;
    pointer-events: none;
    user-select: none;
  }

  .cut-path {
    fill: none;
    stroke: var(--danger);
    stroke-width: 2px;
    stroke-dasharray: 6 4;
    pointer-events: none;
    opacity: 0;
  }
  .cut-path.visible { opacity: 0.9; }
  .dedup-graph.tool-cut { cursor: crosshair; }
  .dedup-graph.tool-connect .node circle { cursor: cell; }

  .merge-picker {
    margin-top: 10px;
    border: 1px solid var(--rail);
    background: var(--paper-deep);
    padding: 10px;
  }

  .merge-picker-hint {
    color: var(--ink-soft);
    font-size: 12px;
    margin: 0 0 8px;
  }

  .merge-picker-input {
    display: block;
    width: 100%;
    border: 1px solid var(--rail);
    background: var(--paper);
    padding: 6px 8px;
    font-size: 13px;
    margin-bottom: 8px;
  }

  .merge-picker-input:focus { outline: none; border-color: var(--brass); }

  .merge-picker-results {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 220px;
    overflow-y: auto;
  }

  .merge-picker-option {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--rail);
    padding: 8px 4px;
    cursor: pointer;
    font-size: 13px;
  }

  .merge-picker-option:hover { background: var(--paper-deeper); }

  .merge-picker-empty {
    color: var(--ink-faint);
    font-size: 12px;
    padding: 6px 4px;
  }

  .merge-picker-error {
    color: var(--danger);
    font-size: 12px;
    margin: 8px 0 0;
  }

  /* ---------- splitting an entry's sources apart (`mountUnmerge`) ---------- */
  .unmerge { margin-bottom: 20px; }

  .unmerge-list {
    list-style: none;
    margin: 0 0 10px;
    padding: 0;
  }

  .unmerge-row {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 8px;
    align-items: baseline;
    padding: 5px 0;
    border-bottom: 1px solid var(--rail);
    font-size: 13px;
    cursor: pointer;
  }

  .unmerge-row input { flex: none; margin: 0; }

  .unmerge-name { color: var(--ink-soft); overflow-wrap: anywhere; }

  .unmerge-flag {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
  }

  .unmerge-cut {
    list-style: none;
    margin: 0 0 10px;
    padding: 0;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .unmerge-cut li { padding: 2px 0; overflow-wrap: anywhere; }

  .unmerge-cut li::before { content: "✂ "; color: var(--brass-ink); }

  .unmerge-barrier {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 10px;
    align-items: baseline;
    padding: 5px 0;
    border-top: 1px solid var(--rail);
    font-size: 12px;
  }

  .unmerge-barrier-name { overflow-wrap: anywhere; }

  /* ---------- play call-to-action (on an entry's own page) ---------- */

  .play-cta-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 4px 0 28px;
  }

  .play-cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: none;
    border-radius: 999px;
    background: var(--verdigris);
    color: var(--paper);
    padding: 10px 22px 10px 18px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }

  .play-cta:hover { filter: brightness(1.1); }

  .play-cta.is-playing {
    background: var(--paper-deep);
    color: var(--ink);
    border: 1px solid var(--rail);
  }

  .play-cta-icon { font-size: 13px; }

  .play-cta-hint {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
  }

  /* No playable source (`buildFindCta`): the play button's place, outlined
     until something's attached, with the finder opening right under it. */
  .find-cta { margin: 4px 0 28px; }
  .find-cta .play-cta-row { margin: 0; }
  .find-cta-btn {
    background: transparent;
    color: var(--ink);
    border: 1px dashed var(--ink-soft);
  }
  .find-cta .entry-find {
    margin-top: 12px;
    border: 1px solid var(--rail);
    max-height: 480px;
  }

  .queue-cta {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border-radius: 999px;
  }

  .manifest-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    margin: 0 0 4px;
    padding-top: 4px;
    border-top: 1px solid var(--rail);
  }

  .manifest {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  /* A multi-disc tracklist's disc heading. */
  .manifest-disc {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    padding: 12px 4px 4px;
    border-bottom: 1px solid var(--rail);
  }

  .manifest-disc:first-child { padding-top: 0; }

  .manifest-row {
    display: flex;
    width: 100%;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--rail);
    padding: 6px 4px;
  }

  .manifest-no {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-faint);
    flex: none;
    width: 2em;
    text-align: right;
  }

  .manifest-play,
  .manifest-queue {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    padding: 0;
    background: transparent;
    border: none;
    border-radius: 50%;
    color: var(--ink-soft);
    cursor: pointer;
  }

  .manifest-play:hover,
  .manifest-queue:hover { background: var(--paper-deeper); color: var(--ink); }

  .manifest-play[disabled],
  .manifest-queue[disabled] {
    color: var(--ink-faint);
    cursor: default;
  }

  .manifest-play[disabled]:hover,
  .manifest-queue[disabled]:hover { background: transparent; }

  .manifest-title {
    flex: 1;
    text-align: left;
    background: transparent;
    border: none;
    padding: 4px;
    margin: -4px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    overflow-wrap: anywhere;
  }

  .manifest-title:hover { text-decoration: underline; }

  .manifest-row.is-playing .manifest-no,
  .manifest-row.is-playing .manifest-play,
  .manifest-row.is-playing .manifest-title {
    color: var(--verdigris);
  }

  /* An artist's track rows: date, role and play count after the title. */
  .manifest-role {
    flex: none;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-faint);
    border: 1px solid var(--rail);
    padding: 0 5px;
  }

  .manifest-date,
  .manifest-plays {
    flex: none;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
    text-align: right;
  }

  .manifest-date { min-width: 10ch; }
  .manifest-plays { min-width: 7ch; }
  .manifest-row[data-dim] .manifest-title { color: var(--ink-faint); }

  /* ---------- an artist's page (`fillArtistPage`) ---------- */
  .artist-aliases {
    font-size: 13px;
    color: var(--ink-faint);
    margin: -6px 0 6px;
    overflow-wrap: anywhere;
  }

  .artist-section { margin-bottom: 32px; }

  .artist-section .section-label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }

  .disco-filters {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 10px 0 14px;
  }

  .disco-filter {
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    border: 1px solid var(--rail);
    border-radius: 999px;
    background: transparent;
    color: var(--ink-soft);
    padding: 3px 11px;
    font-size: 12px;
    cursor: pointer;
  }

  .disco-filter:hover { border-color: var(--ink-soft); color: var(--ink); }

  .disco-filter[aria-pressed="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
  }

  .disco-filter-count {
    font-family: var(--mono);
    font-size: 10px;
    opacity: 0.7;
  }

  .track-filter {
    flex: 1 1 140px;
    max-width: 220px;
    margin-left: auto;
    border: 1px solid var(--rail);
    background: transparent;
    padding: 3px 10px;
    font-size: 12px;
    border-radius: 999px;
  }

  .track-filter:focus { outline: none; border-color: var(--brass); }

  .release-grid {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
    gap: 10px;
  }

  .release-grid > li[hidden] { display: none; }

  .release-tile {
    --kind: var(--ink-faint);
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .release-tile[data-kind="album"],
  .release-tile[data-kind="compilation"] { --kind: var(--type-release-group); }
  .release-tile[data-kind="ep"] { --kind: var(--type-release); }
  .release-tile[data-kind="single"] { --kind: var(--type-track); }
  .release-tile[data-kind="broadcast"] { --kind: var(--verdigris); }
  .release-tile[data-kind="playlist"] { --kind: var(--brass); }

  .release-open {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 100%;
    border: none;
    background: none;
    color: var(--ink);
    text-align: left;
    padding: 0;
    cursor: pointer;
  }

  .release-open:hover .release-title { text-decoration: underline; }
  .release-open:hover .release-cover img { filter: brightness(1.06); }

  .release-cover {
    width: 100%;
    aspect-ratio: 1;
    margin-bottom: 4px;
    background: color-mix(in srgb, var(--kind) 16%, var(--paper-deep));
    color: var(--kind);
    box-shadow: 0 1px 0 var(--rail), 0 6px 14px -10px rgb(0 0 0 / 0.5);
  }

  .release-cover .art-initial {
    font-size: 60px;
    opacity: 0.5;
  }

  .release-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
  }

  .release-kind {
    color: var(--kind);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 500;
  }

  .release-title {
    font-family: var(--serif);
    font-size: 15px;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    overflow-wrap: anywhere;
  }

  .release-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--ink-soft);
  }

  .release-also {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 2px 0 0;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-faint);
  }

  .release-also button {
    border: none;
    background: none;
    padding: 0;
    font: inherit;
    color: var(--ink-soft);
    text-decoration: underline dotted;
    cursor: pointer;
  }

  .release-also button:hover { color: var(--brass-ink); }

  .list-more {
    display: block;
    margin: 10px auto 0;
  }

  .release-grid { row-gap: 18px; }

  /* ---------- pictures (`artBox`) ---------- */
  .art {
    position: relative;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: var(--paper-deeper);
    color: var(--ink-faint);
  }

  .art img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 220ms ease-out;
  }

  .art.has-art img { opacity: 1; }

  .art.has-art .art-initial { visibility: hidden; }

  .art-initial {
    font-family: var(--serif);
    line-height: 1;
  }

  .track-thumb {
    width: 34px;
    height: 34px;
    border-radius: 3px;
  }

  .track-thumb .art-initial { font-size: 15px; }

  .entry-hero {
    display: flex;
    align-items: flex-end;
    gap: 26px;
  }

  .entry-heading {
    flex: 1;
    min-width: 0;
  }

  .hero-art {
    width: 168px;
    height: 168px;
    margin-bottom: 20px;
    box-shadow: 0 10px 24px -14px rgb(0 0 0 / 0.6);
  }

  .entry-hero[data-type="artist"] .hero-art { border-radius: 50%; }

  .hero-art .art-initial { font-size: 72px; }

  .artist-empty { margin-top: 8px; }

  @media (max-width: 560px) {
    .release-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    .manifest-date { display: none; }
    .entry-hero { align-items: center; gap: 16px; }
    .hero-art { width: 92px; height: 92px; }
    .hero-art .art-initial { font-size: 40px; }
  }

  .manifest-row.is-playing .manifest-title {
    font-weight: 500;
  }

  /* ---------- persistent player: floating dock + bottom bar ---------- */
  /*
   * Deliberately kept OUTSIDE `.app` and never touched by an entry-view
   * re-render: browsing the library only ever rewrites `main`'s contents,
   * so whatever's mounted here — the YouTube iframe, the Spotify SDK
   * connection — keeps running undisturbed while you look around.
   */

  #player-dock {
    position: fixed;
    right: 20px;
    bottom: calc(var(--player-bar-h) + 20px);
    width: min(400px, calc(100vw - 40px));
    z-index: 60;
    border: 1px solid var(--rail);
    background: var(--ink);
    box-shadow: 0 20px 44px rgba(0, 0, 0, 0.35);
  }

  #player-dock[hidden] { display: none; }

  .player-dock-surface {
    position: relative;
    overflow: hidden;
  }

  .player-dock-surface.video {
    aspect-ratio: 16 / 9;
  }

  .player-dock-surface.video iframe,
  .player-dock-surface.video .yt-mount,
  .player-dock-surface.video .yt-mount iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  .player-dock-surface.video .yt-mount {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 16px;
    text-align: center;
  }

  .player-dock-surface.video .yt-mount .note {
    color: var(--paper);
    border-left: none;
    margin: 0;
    padding: 0;
    font-size: 12px;
  }

  .player-dock-surface.compact {
    padding: 20px 16px;
    background: var(--paper-deep);
    color: var(--ink);
  }

  .player-dock-spotify {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  /* Positioned against the surface (not this card), so it fills the whole
     dock area behind the padding. */
  .player-dock-spotify-backdrop {
    position: absolute;
    inset: -32px;
    background: center / cover no-repeat;
    filter: blur(32px) saturate(1.3);
    opacity: 0.32;
    pointer-events: none;
  }

  .player-dock-spotify-art {
    width: 72px;
    height: 72px;
    border-radius: 3px;
    box-shadow: 0 8px 20px -12px rgb(0 0 0 / 0.7);
  }

  .player-dock-spotify-art .art-initial { font-size: 30px; }

  .player-dock-spotify-text {
    position: relative;
    flex: 1;
    min-width: 0;
  }

  .player-dock-spotify-artist {
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 8px;
    overflow-wrap: anywhere;
  }

  .player-dock-spotify-artist:empty { display: none; }

  .player-dock-spotify .player-dock-spotify-sub {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .player-dock-spotify .player-dock-spotify-sub::before {
    content: "";
    flex: none;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #3c8c5b;
  }

  .player-dock-spotify .player-dock-spotify-sub.failed::before { display: none; }

  .player-dock-spotify-title {
    font-weight: 500;
    overflow-wrap: anywhere;
    margin: 0 0 4px;
  }

  .player-dock-spotify-sub {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    margin: 0;
  }

  .player-dock-switch {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px;
    border-top: 1px solid var(--rail);
    background: var(--paper-deep);
  }

  .player-dock-switch button {
    border: 1px solid var(--rail);
    background: var(--paper);
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
  }

  .player-dock-switch button[aria-pressed="true"] {
    border-color: var(--brass);
    color: var(--brass-ink);
  }

  /* Source finder (`Player.openFinder`): search YouTube Music and Spotify
     for the playing track, or one of its editions, and attach the pick. */
  .player-dock-switch .find-btn {
    margin-left: auto;
    border-style: dashed;
    background: transparent;
    color: var(--ink-soft);
    font-family: var(--mono);
    font-size: 11px;
  }
  .player-dock-switch .find-btn[aria-expanded="true"] { border-style: solid; color: var(--ink); }
  .player-dock-switch .find-btn + .prefer-toggle { margin-left: 0; }

  .player-dock-find {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 8px;
    border-top: 1px solid var(--rail);
    background: var(--paper-deep);
    max-height: 360px;
    overflow-y: auto;
  }
  .player-dock-find[hidden] { display: none; }
  .player-dock-find p { margin: 0; }

  .find-head { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
  .find-head .find-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .find-head .find-skip { font-family: var(--mono); font-size: 11px; color: var(--brass-ink); }
  .find-head button,
  .find-form button {
    border: 1px solid var(--rail);
    background: var(--paper);
    color: var(--ink-soft);
    font-family: var(--mono);
    font-size: 11px;
    padding: 3px 8px;
    cursor: pointer;
  }
  .find-head button:hover,
  .find-form button:hover { color: var(--ink); border-color: var(--ink-soft); }

  .find-reason { font-size: 12px; color: var(--danger); }
  .find-form { display: flex; gap: 6px; }
  .find-form input {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 12px;
    padding: 4px 8px;
    border: 1px solid var(--rail);
    background: var(--paper);
    color: var(--ink);
  }
  .find-note { font-size: 11px; color: var(--ink-faint); }

  .find-results { display: flex; flex-direction: column; gap: 2px; }
  .find-row {
    display: grid;
    grid-template-columns: 36px minmax(0, 1fr) auto;
    gap: 8px;
    align-items: center;
    padding: 4px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .find-row:hover:not(:disabled) { border-color: var(--rail); background: var(--paper); }
  .find-row:disabled { cursor: default; opacity: 0.5; }
  .find-row[aria-busy="true"] { opacity: 1; border-color: var(--brass); }
  .find-thumb { width: 36px; height: 36px; object-fit: cover; background: var(--paper-deeper); }
  .find-name,
  .find-sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .find-name { font-size: 12px; }
  .find-sub { font-size: 11px; color: var(--ink-soft); }
  .find-tag {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-right: 6px;
  }
  .find-len { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); }
  /* Far from the track's own length: likely another cut. */
  .find-len[data-off] { color: var(--brass-ink); }

  /* Edition switcher for the playing track — same buttons as the entry
     page's `.editions`, laid out as a dock strip like the source switcher. */
  .player-dock-editions {
    gap: 6px;
    margin: 0;
    padding: 8px;
    border-top: 1px solid var(--rail);
    background: var(--paper-deep);
  }

  /* Preferred editions and sources on the dock strips (`preferPill`). */
  .prefer-star {
    color: var(--brass);
    margin-right: 6px;
  }

  .player-dock-switch .prefer-toggle,
  .player-dock-editions .prefer-toggle {
    margin-left: auto;
    border: 1px dashed var(--rail);
    background: transparent;
    color: var(--ink-soft);
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 10px;
    cursor: pointer;
  }

  .prefer-toggle:hover { color: var(--ink); border-color: var(--ink-soft); }

  .player-dock-switch .prefer-toggle[aria-pressed="true"],
  .player-dock-editions .prefer-toggle[aria-pressed="true"] {
    border-style: solid;
    border-color: var(--brass);
    color: var(--brass-ink);
  }

  .prefer-edit {
    display: inline-flex;
    align-items: stretch;
    border: 1px solid var(--rail);
    background: var(--paper);
    font-family: var(--mono);
    font-size: 11px;
  }

  .prefer-edit.is-preferred { border-color: var(--brass); }

  .player-dock-switch .prefer-edit button,
  .prefer-edit button {
    border: 0;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    padding: 4px 8px;
    cursor: pointer;
  }

  .prefer-edit.is-preferred .prefer-name { color: var(--brass-ink); }

  .player-dock-switch .prefer-edit .prefer-step,
  .prefer-edit .prefer-step {
    padding: 4px 7px;
    border-left: 1px solid var(--rail);
  }

  .prefer-edit .prefer-step:disabled { opacity: 0.35; cursor: default; }

  .prefer-weight {
    min-width: 2.2ch;
    padding: 4px 2px;
    text-align: center;
    border-left: 1px solid var(--rail);
    color: var(--ink);
  }

  /* Another device is playing: the dock shows what and where instead of an
     embed (see `Player.renderRemoteCard`). */
  .player-dock-remote {
    display: flex;
    gap: 14px;
    align-items: center;
  }

  .player-dock-remote img {
    flex: none;
    width: 64px;
    height: 64px;
    object-fit: cover;
    border: 1px solid var(--rail);
  }

  .player-dock-remote-text { min-width: 0; flex: 1; }

  .player-dock-remote button {
    margin-top: 10px;
    border: 1px solid var(--rail);
    background: var(--paper);
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
  }

  .player-dock-remote button:hover { border-color: var(--ink-soft); }

  /* Under a remote's muted video mirror: where the audio is, and a way to
     take it over (the card carries this when there's no mirror). */
  .player-dock-remote-strip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 6px 8px 6px 12px;
    border-top: 1px solid var(--rail);
    background: var(--paper-deep);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
  }

  .player-dock-remote-strip[hidden] { display: none; }

  .player-dock-remote-strip span {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .player-dock-remote-strip button {
    flex: none;
    border: 1px solid var(--rail);
    background: var(--paper);
    padding: 3px 10px;
    font-size: 12px;
    cursor: pointer;
  }

  .player-dock-remote-strip button:hover { border-color: var(--ink-soft); }

  /* The bar's device button turns brass while another device is playing —
     the "you're a remote right now" cue. */
  #player-bar-devices.is-remote { color: var(--brass-ink); }

  .player-devices {
    position: fixed;
    right: 16px;
    bottom: calc(var(--player-bar-h) + 8px);
    width: min(280px, calc(100vw - 32px));
    z-index: 80;
    border: 1px solid var(--rail);
    background: var(--paper);
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
    padding: 6px 0;
  }

  .player-devices[hidden] { display: none; }

  .player-devices-label {
    margin: 4px 12px 6px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .player-devices button {
    display: flex;
    width: 100%;
    gap: 8px;
    align-items: baseline;
    border: none;
    background: transparent;
    padding: 6px 12px;
    text-align: left;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
  }

  .player-devices button:hover { background: var(--paper-deeper); }

  .player-devices button[aria-checked="true"] { color: var(--brass-ink); font-weight: 500; }

  .player-devices-note {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-soft);
  }

  /* ---------- dock "up next" queue list ---------- */

  .player-dock-queue {
    max-height: 240px;
    overflow-y: auto;
    border-top: 1px solid var(--rail);
    background: var(--paper);
  }

  .player-dock-queue[hidden] { display: none; }

  .player-dock-queue-label {
    margin: 0;
    padding: 8px 10px 4px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .player-dock-queue-empty {
    margin: 0;
    padding: 0 10px 10px;
    font-size: 11px;
    color: var(--ink-soft);
  }

  .player-dock-queue-row {
    display: flex;
    align-items: center;
    gap: 4px;
    border-bottom: 1px solid var(--rail);
  }

  .player-dock-queue-row:last-child { border-bottom: none; }

  .queue-thumb {
    width: 28px;
    height: 28px;
    margin-left: 6px;
    border-radius: 3px;
  }

  .queue-thumb .art-initial { font-size: 12px; }

  .player-dock-queue-jump {
    flex: 1;
    min-width: 0;
    display: block;
    border: none;
    background: none;
    text-align: left;
    padding: 7px 4px 7px 10px;
    font-size: 12px;
    color: var(--ink);
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .player-dock-queue-jump:hover { text-decoration: underline; }

  /* Divider between the explicitly-queued layer and Post-queue (the
     background playlist — shuffle-all/tracklist continuation/auto-recommend
     filler) in the "up next" panel — see `renderDockQueue`. */
  .player-dock-queue-divider {
    margin: 0;
    padding: 6px 10px 2px;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--ink-faint);
    border-top: 1px solid var(--rail);
  }

  .player-dock-queue-remove {
    flex: none;
    border: none;
    background: none;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 12px;
    padding: 6px 10px;
  }

  .player-dock-queue-remove:hover { color: var(--danger); }

  .player-dock-queue-row.is-current .player-dock-queue-jump {
    color: var(--brass-ink);
    font-weight: 500;
  }

  .player-dock-queue-row.is-current .player-dock-queue-remove {
    visibility: hidden;
  }

  /* ---------- player mode: the same dock, reparented and given the whole
     screen instead of floating in a corner ---------- */

  #view-player {
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 32px 28px;
  }

  #view-player[hidden] { display: none; }

  .player-stage-wrap {
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }

  .player-stage-wrap[hidden] { display: none; }

  /* Still `position: fixed` in stage mode — see `syncStagePosition` in
     `Player` for why the dock is never actually reparented into
     `#player-stage-mount`, only overlaid on top of it. */
  #player-dock.stage {
    box-shadow: none;
  }

  #player-dock.stage .player-dock-spotify {
    padding: 36px 24px;
    gap: 28px;
  }

  #player-dock.stage .player-dock-spotify-art {
    width: 168px;
    height: 168px;
  }

  #player-dock.stage .player-dock-spotify-art .art-initial { font-size: 64px; }

  #player-dock.stage .player-dock-spotify-artist {
    font-size: 15px;
    margin-bottom: 12px;
  }

  @media (max-width: 560px) {
    #player-dock.stage .player-dock-spotify { gap: 16px; padding: 24px 16px; }
    #player-dock.stage .player-dock-spotify-art { width: 96px; height: 96px; }
    #player-dock.stage .player-dock-spotify-art .art-initial { font-size: 40px; }
  }

  #player-dock.stage .player-dock-spotify-title {
    font-size: 22px;
  }

  #player-dock.stage .player-dock-spotify-sub {
    font-size: 13px;
  }

  #player-dock.stage .player-dock-queue {
    max-height: none;
  }

  /* The expand/collapse chevron toggles `dockEl.hidden`, which would just
     blank the stage on a dedicated Player-mode page — disabled there in
     favor of the mode switcher as the only way in/out. */
  body.player-stage #player-bar-expand {
    visibility: hidden;
    pointer-events: none;
  }

  .player-stage-empty {
    max-width: 420px;
    margin: 14vh auto 0;
    padding: 0 24px;
    text-align: left;
    color: var(--ink-soft);
  }

  .player-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: var(--player-bar-h);
    display: grid;
    /* Art and info lead; every later control gets its own auto column on
       the same row, so adding a bar button never wraps it off the bar. */
    grid-template-columns: auto minmax(0, 1fr);
    grid-auto-flow: column;
    grid-auto-columns: auto;
    align-items: center;
    gap: 16px;
    padding: 0 16px;
    background: var(--paper-deeper);
    border-top: 1px solid var(--rail);
    z-index: 70;
  }

  .player-bar[hidden] { display: none; }

  body.has-player #main,
  body.has-player .rail {
    padding-bottom: var(--player-bar-h);
  }

  .player-bar-art {
    flex: none;
    width: 44px;
    height: 44px;
    border: 1px solid var(--rail);
    padding: 0;
    cursor: pointer;
    background: var(--paper-deep);
    overflow: hidden;
  }

  .player-bar-art img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .player-bar-art img[hidden] { display: none; }

  .player-bar-info {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .player-bar-title {
    background: none;
    border: none;
    padding: 0;
    text-align: left;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .player-bar-title:hover { text-decoration: underline; }

  .player-bar-sub {
    margin: 0;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* A credited artist on the bar's sub line: opens its entry. */
  .player-bar-artist {
    color: inherit;
    text-decoration: none;
    cursor: pointer;
  }

  .player-bar-artist:hover,
  .player-bar-artist:focus-visible {
    color: var(--ink);
    text-decoration: underline;
  }

  .player-bar-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    min-width: 220px;
  }

  .player-bar-transport {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .bar-btn {
    flex: none;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
  }

  .bar-btn:hover:not(:disabled) { color: var(--ink); }

  .bar-btn:disabled { opacity: 0.35; cursor: default; }

  .bar-btn[aria-pressed="true"] { color: var(--brass-ink); }

  /* The score button's dot (`NowPlaying.renderBadge`): filled when the
     playing track is unranked in NRS, a ring when it fails NRS checks. */
  #player-bar-np { position: relative; }

  .bar-btn-badge {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 9px;
    height: 9px;
    box-sizing: border-box;
    border-radius: 50%;
    background: var(--brass);
    box-shadow: 0 0 0 2px var(--paper-deeper);
    pointer-events: none;
  }

  .bar-btn-badge[hidden] { display: none; }

  .bar-btn-badge[data-state="incomplete"] {
    background: var(--paper-deeper);
    border: 2px solid var(--brass);
  }

  .bar-btn-toggle {
    width: 26px;
    height: 26px;
    font-size: 12px;
  }

  .bar-btn-accent {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--paper);
    font-size: 13px;
  }

  .bar-btn-accent:hover:not(:disabled) { color: var(--paper); filter: brightness(1.2); }
  .bar-btn-accent:disabled { background: var(--rail); color: var(--paper); }

  .player-bar-progress {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
  }

  .player-bar-progress[hidden] { display: none; }

  .player-bar-time {
    flex: none;
    width: 32px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-soft);
    text-align: center;
  }

  .player-bar-seek {
    flex: 1;
    min-width: 0;
    height: 3px;
    accent-color: var(--verdigris);
    cursor: pointer;
  }

  .player-bar-volume {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
  }

  .player-bar-volume[hidden] { display: none; }

  .player-bar-volume-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .player-bar-volume-icon {
    flex: none;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    width: 16px;
    height: 16px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .player-bar-volume-mute { cursor: pointer; }
  .player-bar-volume-mute:hover:not(:disabled) { color: var(--ink); }
  .player-bar-volume-mute:disabled { opacity: 0.35; cursor: default; }
  .player-bar-volume-mute[aria-pressed="true"] { color: var(--brass-ink); }

  .player-bar-volume-slider {
    width: 64px;
    height: 3px;
    accent-color: var(--verdigris);
    cursor: pointer;
  }

  .player-bar-volume-slider:disabled {
    opacity: 0.35;
    cursor: default;
  }

  /* ---------- now-playing drawer: score, NRS relations, library fixes ---------- */
  /*
   * Floats over the left of the page above the bar (the video dock owns the
   * right). Like the dock it lives outside `.app`, so browsing never
   * re-renders it.
   */

  .np-drawer {
    position: fixed;
    left: 20px;
    bottom: calc(var(--player-bar-h) + 20px);
    width: min(380px, calc(100vw - 40px));
    max-height: calc(100vh - var(--player-bar-h) - 40px);
    display: flex;
    flex-direction: column;
    z-index: 60;
    border: 1px solid var(--rail);
    background: var(--paper);
    box-shadow: 0 20px 44px rgba(0, 0, 0, 0.25);
  }

  .np-drawer[hidden] { display: none; }

  .np-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 8px 8px 12px;
    border-bottom: 1px solid var(--rail);
    background: var(--paper-deep);
  }

  .np-head .mix-seg { flex: 1; min-width: 0; }
  .np-head .mix-seg button { flex: 1; }
  .np-head .mix-seg button[hidden] { display: none; }

  .np-body {
    overflow-y: auto;
    padding: 12px 14px 14px;
    font-size: 13px;
  }

  .np-title {
    font-family: var(--serif);
    font-size: 17px;
    line-height: 1.25;
    margin: 0 0 4px;
    overflow-wrap: anywhere;
  }

  .np-sub {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    margin: 0 0 10px;
  }

  .np-sub a { color: var(--brass-ink); }

  .np-fold {
    font-size: 12px;
    color: var(--verdigris);
    margin: 0 0 6px;
  }

  .np-dupe {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    margin: 0 0 4px;
    overflow-wrap: anywhere;
  }

  .np-dupe a { color: var(--brass-ink); }

  .np-dupe-bind {
    display: block;
    padding-left: 20px;
    color: var(--ink-faint);
  }

  .nrs-dupes-warning {
    border-left: 3px solid var(--danger);
    background: var(--paper-deep);
    padding: 10px 14px;
    margin: 0 0 24px;
  }

  .nrs-dupes-title {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--danger);
    margin: 0 0 4px;
  }

  .np-section {
    border-top: 1px solid var(--rail);
    padding-top: 10px;
    margin-top: 12px;
  }

  .np-section-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--verdigris);
    margin: 0 0 6px;
  }

  .np-body .mix-row { grid-template-columns: 74px minmax(0, 1fr) 44px; padding: 3px 0; }

  .np-body select {
    font: inherit;
    font-size: 12px;
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--rail);
    padding: 3px 4px;
    min-width: 0;
  }

  .np-anchors {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 64px;
    gap: 4px 8px;
    margin: 4px 0 0;
  }

  .np-anchors input { width: 100%; }

  .np-actions {
    display: flex;

<!-- The relations graph renders as plain SVG driven by d3-force/d3-drag/
     d3-zoom — only d3-force's own dist bundle expects d3-quadtree/
