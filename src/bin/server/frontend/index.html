        const label = how && !playing.toLowerCase().includes(how.toLowerCase()) ? ` (${how})` : "";
        nodes.push(el("p", { className: "np-fold", text: `Playing ${playing}${label}, which scores its original.` }));
      }
      const sub = el("p", { className: "np-sub" });
      if (entry) {
        sub.append(scoreLine(entry), " · ", el("a", { href: entry.link, target: "_blank", rel: "noopener", text: "Open in NRS ↗" }));
      } else {
        sub.append("Not in NRS yet. Saving a score adds it.");
      }
      nodes.push(sub);
      if (entry?.issues?.length) {
        nodes.push(el("p", { className: "np-sub np-issues", text: `NRS checks: ${entry.issues.map((i) => i.message).join(" · ")}` }));
      }
      const l = data.listening;
      const pending = l.listened_seconds - l.exported_seconds;
      nodes.push(
        el("p", {
          className: "np-sub",
          text:
            `${l.plays} play${l.plays === 1 ? "" : "s"} · ${fmtMin(l.listened_seconds)} listened` +
            (pending >= 30 ? (entry ? ` · ${fmtMin(pending)} not sent yet` : " · sent once it's in NRS") : ""),
        })
      );

      // Music quality.
      const music = slider("Music", d.music, (v) => {
        d.music = v;
        d.musicDirty = true;
      });
      if (!d.musicSet && !d.musicDirty) music.out.textContent = "—";
      musicInput = music;
      nodes.push(section("Music", [music.row]));

      // One response.
      const responseBox = el("div");
      const drawResponse = () => {
        responseBox.replaceChildren(
          seg(RESPONSES, d.response, (v) => {
            d.response = v;
            drawResponse();
          })
        );
        if (!d.response) return;
        if (d.response !== "cry") {
          responseBox.appendChild(slider("Factor", d.factor, (v) => (d.factor = v)).row);
          responseBox.appendChild(
            el("div", { className: "mix-row" }, [
              el("span", { className: "mix-label", text: "Sign" }),
              seg(
                [
                  ["1", "+"],
                  ["-1", "−"],
                ],
                d.sign,
                (v) => {
                  d.sign = v;
                  drawResponse();
                }
              ),
            ])
          );
        }
        const grid = el("div", { className: "np-anchors" });
        for (const a of d.anchors) {
          const select = el("select", { "aria-label": "Anchor" }, [
            el("option", { value: "", text: "— anchor —" }),
            ...(palette || []).map((p) => el("option", { value: p.id, text: p.label || p.id, selected: p.id === a.id })),
          ]);
          select.onchange = () => (a.id = select.value);
          const weight = el("input", { type: "number", min: "0", step: "0.1", value: String(a.weight), "aria-label": "Weight" });
          weight.oninput = () => (a.weight = Number(weight.value) || 0);
          grid.append(select, weight);
        }
        responseBox.appendChild(grid);
        if (!palette) {
          api("/api/nrs/v1/palette")
            .then((res) => {
              palette = res.anchors || [];
              if (responseBox.isConnected) drawResponse();
            })
            .catch(() => {});
        }
      };
      drawResponse();
      const given = (entry?.impacts || []).filter((i) => i.section === "responses");
      const responseNodes = [responseBox];
      if (given.length) {
        responseNodes.unshift(
          el(
            "ul",
            { className: "np-list" },
            given.map((i) => el("li", {}, [el("span", { className: "t", text: i.title }), el("span", { className: "k", text: i.metric?.value || "" })]))
          )
        );
      }
      nodes.push(section("Response", responseNodes));

      // The MV, graded as the track's visual.
      if (data.nrs.videos?.length) {
        const v = data.nrs.videos[0];
        nodes.push(
          section("MV", [
            el("img", { className: "np-media", src: `https://i.ytimg.com/vi/${v.youtube}/hqdefault.jpg`, alt: v.label || "", loading: "lazy" }),
            slider("Base", d.visualBase, (x) => {
              d.visualBase = x;
              d.visualDirty = true;
            }).row,
            slider("Unique", d.visualUnique, (x) => {
              d.visualUnique = x;
              d.visualDirty = true;
            }).row,
          ])
        );
      }

      const save = actionButton("Save score", async () => {
        const set = [];
        const add = [];
        if (d.musicDirty) set.push({ kind: "music", music_base: (d.music / 100).toFixed(2) });
        if (d.visualDirty) set.push({ kind: "visual", base: (d.visualBase / 100).toFixed(2), unique: (d.visualUnique / 100).toFixed(2) });
        if (d.response) {
          const anchors = d.anchors.filter((a) => a.id && a.weight > 0);
          if (!anchors.length) throw new Error("Pick an anchor for the response.");
          const r = { kind: d.response };
          if (d.response !== "cry") {
            r.factor = (d.factor / 100).toFixed(2);
            r.sign = d.sign;
          }
          anchors.forEach((a, i) => {
            r[`anchor${i + 1}`] = a.id;
            r[`weight${i + 1}`] = String(a.weight);
          });
          add.push(r);
        }
        if (!set.length && !add.length) throw new Error("Nothing changed.");
        await postJson("/api/nrs/score", { ...(entry ? { nrs_id: entry.id } : { entry_id: target.entry_id }), set, add });
        refresh();
        return "Saved.";
      });
      saveScore = save.run;
      nodes.push(el("div", { className: "np-actions" }, [save.btn, save.statusEl]));

      // Albums: the one it's playing from first, then the ones NRS has.
      if (data.nrs.albums?.length) {
        nodes.push(section("Albums", data.nrs.albums.map((a) => renderAlbum(a))));
      }
      nodes.push(el("p", { className: "np-hint", text: "n toggles · 1–9, 0 set music · s saves" }));
      return nodes;
    }

    function renderAlbum(album) {
      const key = album.id || `lib:${album.entry_id}`;
      const visual = impactOf(album, "visual");
      const d = (draft.albums[key] ||= {
        base: Math.round(numParam(visual, "base", 0.5) * 100),
        unique: Math.round(numParam(visual, "unique", 0.5) * 100),
      });
      const head = el("div", { className: "np-album-head" }, [
        el("span", { className: "t", text: album.title || "(untitled)" }),
        album.from_release ? el("span", { className: "k", text: "playing from" }) : null,
        album.link ? el("a", { href: album.link, target: "_blank", rel: "noopener", text: "NRS ↗" }) : null,
      ]);
      const nodes = [head, el("p", { className: "np-sub", text: album.id ? scoreLine(album) : "Not in NRS yet. Grading its art adds it." })];
      if (album.id) {
        const img = el("img", { className: "np-media np-art", alt: "", loading: "lazy", hidden: true });
        nodes.push(img);
        api(`/api/nrs/v1/entries/${encodeURIComponent(album.id)}/media`)
          .then((m) => {
            if (m.images?.length) {
              img.src = m.images[0].url;
              img.hidden = false;
            }
          })
          .catch(() => {});
      }
      nodes.push(slider("Art base", d.base, (x) => (d.base = x)).row, slider("Unique", d.unique, (x) => (d.unique = x)).row);
      const save = actionButton("Save album art", async () => {
        await postJson("/api/nrs/score", {
          ...(album.id ? { nrs_id: album.id } : { entry_id: album.entry_id }),
          set: [{ kind: "visual", base: (d.base / 100).toFixed(2), unique: (d.unique / 100).toFixed(2) }],
        });
        refresh();
        return "Saved.";
      });
      nodes.push(el("div", { className: "np-actions" }, [save.btn, save.statusEl]));
      return el("div", { className: "np-album" }, nodes);
    }

    // ---- Relations ----

    function relationLabel(s) {
      const incoming = s.direction === "incoming";
      if (s.kind === "contains") return incoming ? "On" : "Contains";
      return `${s.kind} ${incoming ? "from" : "of"}`;
    }

    async function renderRelations(data, stale) {
      const target = data.target;
      const entry = data.nrs.entry;
      const nodes = [el("p", { className: "np-title", text: target.title || "(untitled)" })];
      if (!entry) {
        const add = actionButton("Add to NRS", async () => {
          await postJson("/api/nrs/score", { entry_id: target.entry_id });
          refresh();
          return "Added.";
        });
        nodes.push(status("Not in NRS yet, so it has no relations there."), el("div", { className: "np-actions" }, [add.btn, add.statusEl]));
        return nodes;
      }
      const path = `/api/nrs/v1/entries/${encodeURIComponent(entry.id)}/related`;
      const related = await api(path);
      if (stale()) return [];
      const suggestions = related.suggestions || [];
      const pending = suggestions.filter((s) => !s.relation_exists);
      const approve = async (picked) => {
        await postJson(path, { items: picked.map((s) => ({ store_id: s.target.store_id, kind: s.kind, direction: s.direction })) });
        refresh();
        return "Added to NRS.";
      };
      if (!suggestions.length) {
        nodes.push(status("No relations suggested."));
        return nodes;
      }
      const list = el("ul", { className: "np-list" });
      for (const s of suggestions) {
        const li = el("li", { className: s.relation_exists ? "is-done" : "" }, [
          el("span", { className: "k", text: relationLabel(s) }),
          el("span", { className: "t", text: s.target.title }),
        ]);
        if (s.relation_exists) {
          li.appendChild(el("span", { className: "k", text: "in NRS" }));
        } else {
          li.appendChild(actionButton("Approve", () => approve([s])).btn);
        }
        list.appendChild(li);
      }
      nodes.push(el("p", { className: "np-sub", text: `${pending.length} to review · suggested by the music store` }), list);
      if (pending.length > 1) {
        const all = actionButton(`Approve all ${pending.length}`, () => approve(pending));
        nodes.push(el("div", { className: "np-actions" }, [all.btn, all.statusEl]));
      }
      return nodes;
    }

    // ---- Library ----

    function editionLabel(ed) {
      if (ed.is_default) return "original";
      return (ed.transformation || ed.kind || "edition").replaceAll("_", " ");
    }

    function renderLibrary(entry) {
      const nodes = [el("p", { className: "np-title", text: entry.title || "(untitled)" })];
      if (nrs && !nrs.available && !nrs.absent) {
        nodes.push(status(`NRS isn't reachable${nrs.nrs_url ? ` at ${nrs.nrs_url}` : ""}, so only library fixes are shown.`));
      }
      const open = el("button", { className: "ghost-btn", type: "button", text: "Open in library", onclick: () => viewEntry(entryId) });
      const editions = entry.editions || [];
      if (editions.length <= 1) {
        nodes.push(status("No other editions of this track."), el("div", { className: "np-actions" }, [open]));
        return nodes;
      }
      const titleOf = new Map(editions.map((e) => [e.entry_id, e.title]));
      const list = el("ul", { className: "np-list" });
      for (const ed of editions) {
        const scores = ed.rank_target === ed.entry_id ? "own work" : `scores as ${titleOf.get(ed.rank_target) || ed.rank_target}`;
        list.appendChild(
          el("li", {}, [
            el("span", { className: "k", text: editionLabel(ed) }),
            el("button", {
              className: "t np-link",
              type: "button",
              text: (ed.title || "(untitled)") + (ed.is_current ? " (playing)" : ""),
              onclick: () => viewEntry(ed.entry_id),
            }),
            el("span", { className: "k", text: scores }),
          ])
        );
      }
      nodes.push(section("Editions", [list]));

      // The original has nothing to fix from here; its editions are fixed
      // from their own side, while they play.
      const current = editions.find((e) => e.is_current);
      const others = editions.filter((e) => !e.is_current);
      if (!current || current.is_default || !others.length) {
        nodes.push(el("div", { className: "np-actions" }, [open]));
        return nodes;
      }
      const known = TRANSFORMATIONS.flatMap(([, opts]) => opts.map(([v]) => v));
      const currentKind = known.includes(current.transformation) ? current.transformation : "";
      const kind = el(
        "select",
        { "aria-label": "Edition kind" },
        TRANSFORMATIONS.map(([group, opts]) =>
          el(
            "optgroup",
            { label: group },
            opts.map(([v, label]) => el("option", { value: v, text: label, selected: v === currentKind }))
          )
        )
      );
      const fallback = others.find((e) => e.is_default) || others[0];
      const original = el(
        "select",
        { "aria-label": "Original" },
        others.map((e) => el("option", { value: String(e.entry_id), text: e.title || String(e.entry_id), selected: e === fallback }))
      );
      const save = actionButton("Save", async () => {
        await postJson("/api/relations/derive", {
          original: Number(original.value),
          derived: current.entry_id,
          transformation: kind.value || null,
        });
        refresh();
        return "Saved.";
      });
      nodes.push(
        section("Fix the playing edition", [
          el("div", { className: "np-actions" }, [el("span", { text: "Playing edition:" }), kind, el("span", { text: "of" }), original]),
          el("div", { className: "np-actions" }, [save.btn, open, save.statusEl]),
        ])
      );
      return nodes;
    }

    // ---- keyboard ----

    document.addEventListener("keydown", (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const active = document.activeElement;
      const typing =
        active && (active.tagName === "TEXTAREA" || active.tagName === "SELECT" || (active.tagName === "INPUT" && active.type !== "range"));
      if (typing || !Player.hasTrack()) return;
      if (e.key === "n") {
        e.preventDefault();
        toggle();
        return;
      }
      if (!isOpen() || shownTab() !== "score" || !musicInput?.input.isConnected) return;
      if (/^[0-9]$/.test(e.key)) {
        e.preventDefault();
        musicInput.input.value = String(e.key === "0" ? 100 : Number(e.key) * 10);
        musicInput.input.dispatchEvent(new Event("input"));
      } else if (e.key === "s") {
        e.preventDefault();
        saveScore?.();
      }
    });

    barBtn.addEventListener("click", () => toggle());
    closeBtn.addEventListener("click", () => toggle(false));

    return { track, toggle };
  })();


  // ---------- player: persistent bottom bar + floating dock ----------
  //
  // Lives outside `main` and is never rebuilt when the library view
  // re-renders — browsing to a different entry only ever touches `main`'s
  // contents, so whatever's mounted here (a YouTube iframe, a Spotify
  // Connect session) keeps running. The bar is always-visible transport
  // (title, prev/play-pause/next); the dock is the actual video/embed
  // surface, collapsible without tearing down what's mounted in it.
  //
  // Two halves: the *view* (bar, dock, queue panel, device picker) renders
  // the server's session snapshot on every device; the *engine* (the
  // provider adapters below) only runs on the active device, mounting
  // whatever the snapshot says is current and reporting back what it does.
  const Player = (() => {
    const barEl = document.getElementById("player-bar");
    const dockEl = document.getElementById("player-dock");
    const surfaceEl = document.getElementById("player-dock-surface");
    const switchEl = document.getElementById("player-dock-switch");
    const dockQueueEl = document.getElementById("player-dock-queue");
    const dockEditionsEl = document.getElementById("player-dock-editions");
    const artBtn = document.getElementById("player-bar-art");
    const thumbImg = document.getElementById("player-bar-thumb");
    const titleBtn = document.getElementById("player-bar-title");
    const subEl = document.getElementById("player-bar-sub");
    const shuffleBtn = document.getElementById("player-bar-shuffle");
    const prevBtn = document.getElementById("player-bar-prev");
    const playPauseBtn = document.getElementById("player-bar-playpause");
    const playPauseIcon = document.getElementById("player-bar-playpause-icon");
    const nextBtn = document.getElementById("player-bar-next");
    const repeatBtn = document.getElementById("player-bar-repeat");
    const devicesBtn = document.getElementById("player-bar-devices");
    const devicesEl = document.getElementById("player-devices");
    const remoteStripEl = document.getElementById("player-dock-remote-strip");
    document.getElementById("player-dock-remote-strip-take").addEventListener("click", () =>
      Remote.command({ type: "transfer", to: Remote.deviceId }).catch(() => {})
    );
    const expandBtn = document.getElementById("player-bar-expand");
    const expandIcon = document.getElementById("player-bar-expand-icon");
    const progressEl = document.getElementById("player-bar-progress");
    const seekInput = document.getElementById("player-bar-seek");
    const timeElapsedEl = document.getElementById("player-bar-time-elapsed");
    const timeTotalEl = document.getElementById("player-bar-time-total");
    const muteBtn = document.getElementById("player-bar-mute");
    const volumePlayerSlider = document.getElementById("player-bar-volume-player-slider");
    const volumeGlobalSlider = document.getElementById("player-bar-volume-global-slider");
    const volumePlayerIcon = document.getElementById("player-bar-volume-player-icon");

    // Static icons that never change; the dynamic ones (play/pause, expand,
    // repeat's off/all/one, mute) are (re)rendered as state changes.
    shuffleBtn.innerHTML = svgIcon("shuffle", 13);
    prevBtn.innerHTML = svgIcon("skip-back", 16);
    nextBtn.innerHTML = svgIcon("skip-forward", 16);
    playPauseIcon.innerHTML = svgIcon("play", 15);
    repeatBtn.innerHTML = svgIcon("repeat", 13);
    devicesBtn.innerHTML = svgIcon("speaker", 15);
    expandIcon.innerHTML = svgIcon("chevron-down", 14);

    // Latest session snapshot from the server (see `Remote`).
    let snap = null;
    let onChangeCallback = null;
    let currentTitle = "";

    // ---- engine state: only meaningful while this tab is the active
    // device ----
    //
    // `provider` is what's mounted *here* (null otherwise); `mountedKey` is
    // the `track_seq|source` that mount is for, so a snapshot naming a
    // different track (or an explicitly switched source) remounts.
    let provider = null;
    let mountedKey = null;
    let mountedTrackSeq = null;
    // The server's `playing` as of the last snapshot — play/pause is only
    // driven on a *change* of it (see `reconcileEngine`).
    let lastSnapPlaying = null;
    let lastSeekSeq = null;
    // What the embed itself says. `null` right after a mount (not known
    // yet), so its first real state always gets reported.
    let localPlaying = null;
    let localControllable = false;
    let endedReported = false;
    let ytPlayer = null;
    // SoundCloud Widget JS API instance for whichever iframe is currently
    // mounted (see `mountSoundcloud`) — null whenever `provider` isn't
    // "soundcloud" or the widget hasn't fired its READY event yet.
    let scWidget = null;
    // NicoNico's embed talks over `window.postMessage`, not a JS API object —
    // `nicoIframe` is the postMessage target and `nicoPlayerId` the id both
    // sides tag every message with (see `mountNicovideo`/`nicoPostMessage`),
    // bumped per mount so a stray message from a since-replaced iframe is
    // ignored instead of corrupting the newly mounted one's state.
    let nicoIframe = null;
    let nicoPlayerId = 0;
    let nicoPlaying = false;
    // A Spotify track mounted paused (a transfer of a paused session) isn't
    // sent to the Connect device until the first play — `{ id, positionMs }`.
    let spotifyPending = null;
    let expanded = true;
    // Whether the dock is currently overlaid on Player mode's big stage
    // (see `setStageMode`) instead of floating over Library/Graph. Affects
    // whether the "up next" panel renders the full queue or just what's
    // ahead (`renderDockQueue`) and whether the bar's collapse chevron is
    // allowed to hide the dock (it isn't, in stage mode — see the CSS rule
    // for `body.player-stage #player-bar-expand`).
    let stageMode = false;
    // The `#player-stage-mount` placeholder to overlay the dock onto while
    // `stageMode` is active — see `syncStagePosition`.
    let stageMountEl = null;
    // Bumped on every mount/unmount. Spotify.play() and the widget API
    // loaders are async and can resolve after the user has moved on — each
    // adapter checks its own snapshot against the live value to notice
    // it's stale.
    let mountToken = 0;
    // The current track's sources in preference order (see `mount`) and
    // which one is mounted — `sourceFailed` walks forward through them so an
    // unplayable source (an embed-blocked YouTube video, say) falls back to
    // the next-best one instead of skipping the whole track.
    let currentSources = [];
    let currentSourceIdx = 0;

    function isActive() {
      return !!snap && snap.active_device === Remote.deviceId;
    }

    function hasTrack() {
      return !!snap?.current;
    }

    // ---- reporting (active device only) ----

    let lastReportAt = 0;

    function report(fields) {
      if (!isActive() || mountedTrackSeq == null) return;
      Remote.report({ track_seq: mountedTrackSeq, ...fields });
    }

    // Natural end of track, or an unplayable source to skip past: the
    // server advances the queue (or repeats) for everyone.
    function reportEnded(token) {
      if (token !== mountToken || endedReported) return;
      endedReported = true;
      report({ ended: true });
    }

    // ---- uniform progress: elapsed/duration + seek ----
    //
    // `progress` is the position (seconds) as of `at` (performance.now()),
    // advancing while `playing`. The active device feeds it from its
    // embed's own position (`engineProgress`), every other device from the
    // snapshot (`onSnapshot`); one ticker renders it either way.
    //
    // Neither embed pushes a continuous time update: YouTube's IFrame API is
    // pull-only (getCurrentTime/getDuration) and Spotify's SDK only fires
    // `player_state_changed` on play/pause/seek/track-change. A poll loop,
    // swapped out per-provider in mountSource(), covers both uniformly and
    // doubles as the Spotify end-of-track detector (see below) since the
    // SDK has no `ended` event of its own.
    let progress = { pos: 0, at: 0, playing: false, duration: 0 };
    let progressTimer = null;
    let seeking = false;
    let lastSpotifyPlaying = false;
    let lastSpotifyPosition = 0;

    function formatTime(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) seconds = 0;
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m}:${String(s).padStart(2, "0")}`;
    }

    function progressNow() {
      let p = progress.pos;
      if (progress.playing) p += (performance.now() - progress.at) / 1000;
      return progress.duration > 0 ? Math.min(p, progress.duration) : p;
    }

    function renderProgress() {
      progressEl.hidden = !(progress.duration > 0);
      if (seeking || progressEl.hidden) return;
      const position = progressNow();
      seekInput.max = String(Math.max(1, Math.round(progress.duration)));
      seekInput.value = String(Math.round(position));
      timeElapsedEl.textContent = formatTime(position);
      timeTotalEl.textContent = formatTime(progress.duration);
    }

    setInterval(renderProgress, 500);

    // The embed's own position, from whichever poll loop is running. Sent
    // on to the server every couple of seconds; the server only rebroadcasts
    // it when it drifts from what remotes are already extrapolating.
    //
    // Ignored until the embed has reported a real play/pause state: before
    // that, positions are pre-start placeholders (YouTube says 0 before its
    // `start` seek lands), and reporting them — or "not playing" — would
    // make the server pause the session and rewind it to 0.
    function engineProgress(position, duration) {
      PlayLog.progress(position);
      if (localPlaying === null) return;
      progress = { pos: position, at: performance.now(), playing: localPlaying, duration };
      renderProgress();
      const now = performance.now();
      if (now - lastReportAt < 2000) return;
      lastReportAt = now;
      report({
        playing: localPlaying,
        position_ms: Math.round(position * 1000),
        duration_ms: Math.round(duration * 1000),
      });
    }

    // The embed's own play/pause state (and whether it can be controlled at
    // all yet). Reported immediately when it changes.
    function engineState(isPlaying, controllable) {
      const changed = isPlaying !== localPlaying;
      progress = { pos: progressNow(), at: performance.now(), playing: isPlaying, duration: progress.duration };
      localPlaying = isPlaying;
      localControllable = controllable;
      renderPlayPause();
      if (changed) report({ playing: isPlaying, position_ms: Math.round(progress.pos * 1000) });
    }

    function stopProgressPolling() {
      if (progressTimer) {
        clearInterval(progressTimer);
        progressTimer = null;
      }
    }

    function startYoutubeProgressPolling() {
      stopProgressPolling();
      progressTimer = setInterval(() => {
        if (!ytPlayer || typeof ytPlayer.getCurrentTime !== "function") return;
        const duration = ytPlayer.getDuration();
        if (!duration) return;
        engineProgress(ytPlayer.getCurrentTime(), duration);
      }, 500);
    }

    function startSpotifyProgressPolling(token) {
      stopProgressPolling();
      lastSpotifyPlaying = false;
      lastSpotifyPosition = 0;
      progressTimer = setInterval(async () => {
        if (spotifyPending) return;
        const state = await Spotify.getCurrentState();
        if (!state || token !== mountToken) return;
        const position = state.position / 1000;
        const duration = state.duration / 1000;
        engineProgress(position, duration);
        // The SDK has no distinct "ended" event — a track that finished on
        // its own reports paused at position 0 right after having been
        // playing near the end, which a user pause/seek back to 0 wouldn't.
        const wasNearEnd = duration > 0 && lastSpotifyPosition >= duration - 1.2;
        if (lastSpotifyPlaying && state.paused && state.position === 0 && wasNearEnd) {
          reportEnded(token);
        }
        lastSpotifyPlaying = !state.paused;
        lastSpotifyPosition = position;
      }, 500);
    }

    // SoundCloud's Widget API is callback-, not promise-based, and has no
    // "ended" event distinct from FINISH (bound where the widget is created,
    // in `mountSoundcloud`) — this loop only has to cover position/duration.
    function startSoundcloudProgressPolling() {
      stopProgressPolling();
      progressTimer = setInterval(() => {
        if (!scWidget) return;
        scWidget.getDuration((durationMs) => {
          if (!durationMs || provider !== "soundcloud") return;
          scWidget.getPosition((positionMs) => {
            if (provider !== "soundcloud") return;
            engineProgress(positionMs / 1000, durationMs / 1000);
          });
        });
      }, 500);
    }

    seekInput.addEventListener("input", () => {
      seeking = true;
      timeElapsedEl.textContent = formatTime(Number(seekInput.value));
    });
    seekInput.addEventListener("change", () => {
      const value = Number(seekInput.value);
      // Shown right away; the active device seeks once the server bumps
      // `seek_seq` (see `reconcileEngine`), wherever the drag happened.
      progress = { ...progress, pos: value, at: performance.now() };
      seeking = false;
      renderProgress();
      Remote.command({ type: "seek", position_ms: Math.round(value * 1000) }).catch(() => {});
    });

    function engineSeek(seconds) {
      if (provider === "youtube" && ytPlayer?.seekTo) ytPlayer.seekTo(seconds, true);
      else if (provider === "spotify") {
        if (spotifyPending) spotifyPending.positionMs = seconds * 1000;
        else Spotify.seek(seconds * 1000).catch(() => {});
      } else if (provider === "soundcloud" && scWidget) scWidget.seekTo(seconds * 1000);
      else if (provider === "nicovideo") nicoPostMessage({ eventName: "seek", data: { time: seconds * 1000 } });
      progress = { ...progress, pos: seconds, at: performance.now() };
      renderProgress();
    }

    function enginePlay() {
      if (provider === "youtube" && ytPlayer?.playVideo) ytPlayer.playVideo();
      else if (provider === "spotify") {
        if (spotifyPending) {
          const { id, positionMs, token } = spotifyPending;
          spotifyPending = null;
          startSpotify(id, positionMs, token);
        } else Spotify.resume().catch(() => {});
      } else if (provider === "soundcloud" && scWidget) scWidget.play();
      else if (provider === "nicovideo") nicoPostMessage({ eventName: "play" });
    }

    function enginePause() {
      if (provider === "youtube" && ytPlayer?.pauseVideo) ytPlayer.pauseVideo();
      else if (provider === "spotify" && !spotifyPending) Spotify.pause().catch(() => {});
      else if (provider === "soundcloud" && scWidget) scWidget.pause();
      else if (provider === "nicovideo") nicoPostMessage({ eventName: "pause" });
    }

    // ---- volume: two 0..100 dials whose product is the effective volume,
    // applied to whichever provider is mounted in its own scale (YouTube:
    // 0..100, Spotify SDK: 0..1) ----
    //
    // - "global" scales everything together.
    // - "player" is per-provider — a separate value for each provider, and
    //   the dial shows the one for whichever is playing, so it doubles as a
    //   balance control between them.
    //
    // Both are part of the shared session (any device's sliders steer the
    // active device's volume). A session that has none yet is seeded from
    // this browser's old per-browser settings, if it has any.
    let volumeGlobal = 80;
    let volumeByProvider = {};
    let muted = false;
    // Snapshots arriving while a slider is being dragged would otherwise
    // yank it back to a value that's already been superseded.
    let volumeEditedAt = 0;
    let volumeSeeded = false;
    let volumeSendTimer = null;
    let volumePending = {};

    function seedVolume() {
      if (volumeSeeded) return;
      volumeSeeded = true;
      const seed = { type: "volume", seed: true, by_provider: {} };
      try {
        const raw = localStorage.getItem("player_volume_global") ?? localStorage.getItem("player_volume");
        const saved = raw === null ? NaN : Number(raw);
        if (Number.isFinite(saved) && saved >= 0 && saved <= 100) seed.global = saved;
        const parsed = JSON.parse(localStorage.getItem("player_volume_by_provider") || "null");
        for (const key of Object.keys(PLATFORM_COLOR)) {
          const v = parsed?.[key];
          if (Number.isFinite(v) && v >= 0 && v <= 100) seed.by_provider[key] = v;
        }
      } catch {}
      Remote.command(seed).catch(() => {});
    }

    // Coalesces slider drags into at most one command per 150ms, the last
    // value always winning.
    function sendVolume(fields) {
      volumeEditedAt = performance.now();
      volumePending = {
        ...volumePending,
        ...fields,
        by_provider: { ...(volumePending.by_provider || {}), ...(fields.by_provider || {}) },
      };
      if (volumeSendTimer) return;
      volumeSendTimer = setTimeout(() => {
        const payload = volumePending;
        volumePending = {};
        volumeSendTimer = null;
        Remote.command({ type: "volume", ...payload }).catch(() => {});
      }, 150);
    }

    // The provider the per-player dial is scoped to: what's mounted here,
    // or (as a remote) what the active device reports having mounted.
    function volumeProvider() {
      return isActive() ? provider : snap?.mounted?.provider || null;
    }

    function volumeControllable() {
      // NicoNico has no volume branch in `applyVolume` — `volumeChange`/
      // `mute` commands were tried against a live embed (0..1 scale, 0..100
      // scale, and a plain `mute` boolean) and none of them moved the
      // `volume`/`muted` fields `playerMetadataChange` reports back, unlike
      // `play`/`pause`/`seek`, which all took effect. Same as a bare "other"
      // embed: no programmatic control at all.
      if (isActive()) return ["youtube", "spotify", "soundcloud"].includes(provider);
      return snap?.mounted?.controllable !== false && ["youtube", "spotify", "soundcloud"].includes(volumeProvider());
    }

    function playerVolume() {
      return volumeByProvider[volumeProvider()] ?? 100;
    }

    function setVolumeUI() {
      const controllable = volumeControllable();
      volumeGlobalSlider.value = String(volumeGlobal);
      volumePlayerSlider.value = String(playerVolume());
      // Muted disables both dials on top of whatever the provider already
      // dictates — there's nothing to drag them to while the effective
      // volume is pinned to zero.
      volumeGlobalSlider.disabled = !controllable || muted;
      volumePlayerSlider.disabled = !controllable || muted;
      const silent = muted || volumeGlobal === 0 || playerVolume() === 0;
      muteBtn.disabled = !controllable;
      muteBtn.innerHTML = svgIcon(silent ? "volume-x" : "volume-2", 14);
      muteBtn.setAttribute("aria-label", silent ? "Unmute" : "Mute");
      muteBtn.setAttribute("aria-pressed", String(muted));
      // The per-player dial's icon names whichever provider it's actually
      // scoped to right now — headphones is the fallback for "other"
      // embeds and the no-track-loaded state, which have no such mark.
      const p = volumeProvider();
      volumePlayerIcon.innerHTML = svgIcon(p in PLATFORM_COLOR ? p : "headphones", 14);
      volumePlayerIcon.style.color = PLATFORM_COLOR[p] || "";
    }

    function applyVolume() {
      if (!isActive()) return;
      const effective = muted ? 0 : (volumeGlobal / 100) * (playerVolume() / 100) * 100;
      if (provider === "youtube" && ytPlayer?.setVolume) ytPlayer.setVolume(effective);
      else if (provider === "spotify") Spotify.setVolume(effective / 100).catch(() => {});
      else if (provider === "soundcloud" && scWidget) scWidget.setVolume(effective);
    }

    setVolumeUI();

    volumeGlobalSlider.addEventListener("input", () => {
      volumeGlobal = Number(volumeGlobalSlider.value);
      muted = false;
      applyVolume();
      setVolumeUI();
      sendVolume({ global: volumeGlobal, muted: false });
    });

    volumePlayerSlider.addEventListener("input", () => {
      const p = volumeProvider();
      if (!p) return;
      volumeByProvider[p] = Number(volumePlayerSlider.value);
      muted = false;
      applyVolume();
      setVolumeUI();
      sendVolume({ by_provider: { [p]: volumeByProvider[p] }, muted: false });
    });

    muteBtn.addEventListener("click", () => {
      muted = !muted;
      applyVolume();
      setVolumeUI();
      sendVolume({ muted });
    });

    // ---- YouTube: IFrame Player API, not a bare <iframe> ----
    //
    // A plain `<iframe src="…/embed/ID">` can't tell us when playback ends
    // or let the bar's play/pause button control it, so there'd be no way
    // to advance the queue or reflect state. The IFrame Player API creates
    // the iframe itself (given a mount element) and exposes both.
    let ytApiPromise = null;
    function loadYoutubeApi() {
      if (window.YT && window.YT.Player) return Promise.resolve(window.YT);
      if (ytApiPromise) return ytApiPromise;
      ytApiPromise = new Promise((resolve) => {
        window.onYouTubeIframeAPIReady = () => resolve(window.YT);
        const script = document.createElement("script");
        script.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(script);
      });
      return ytApiPromise;
    }

    // YouTube's numeric player error codes. 101/150 (the same restriction,
    // just two historical codes for it) is what a "does not allow
    // embedding" video reports — this covers both an explicit owner opt-out
    // *and* age-restricted videos, which YouTube blocks from every
    // third-party embed regardless of the owner's own embedding preference.
    const YT_ERROR_MESSAGES = {
      2: "That video's ID looks invalid.",
      5: "This video can't be played in an embedded player right now.",
      100: "This video was removed or made private.",
      101: "The video's owner doesn't allow it to play in embedded players like this one.",
      150: "The video's owner doesn't allow it to play in embedded players like this one.",
    };

    function setExpanded(v) {
      expanded = v;
      dockEl.hidden = (!v && !stageMode) || !hasTrack();
      expandBtn.setAttribute("aria-pressed", String(v));
      expandBtn.setAttribute("aria-label", v ? "Collapse player" : "Expand player");
      expandIcon.innerHTML = svgIcon(v ? "chevron-down" : "chevron-up", 14);
      if (stageMode) syncStagePosition();
      // Collapsing unloads a remote's video mirror; expanding brings it back.
      renderRemoteSurface();
    }

    // Lines the dock's `position: fixed` box up with `#player-stage-mount`'s
    // on-page rect. The dock itself is NEVER reparented there (see
    // `setStageMode`) — this overlay is the whole point.
    function syncStagePosition() {
      if (!stageMode || !stageMountEl || dockEl.hidden) return;
      // The placeholder is otherwise empty — give it the dock's height so
      // `#view-player` has real content to scroll when the full queue runs
      // past the viewport (the scroll listener below then moves the dock).
      stageMountEl.style.height = `${dockEl.offsetHeight}px`;
      const r = stageMountEl.getBoundingClientRect();
      dockEl.style.left = `${r.left}px`;
      dockEl.style.top = `${r.top}px`;
      dockEl.style.width = `${r.width}px`;
      dockEl.style.right = "auto";
      dockEl.style.bottom = "auto";
    }

    // Toggles Player mode's big stage look for the dock (video/Spotify
    // surface, provider switcher, "up next" panel) by overlaying it on top
    // of `#player-stage-mount` with `position: fixed`, instead of actually
    // moving the node there. A real `appendChild` reparent survives fine for
    // the Spotify Connect surface (nothing but plain DOM), but browsers
    // reload a cross-origin `<iframe>` — the YouTube embed included — when
    // it's moved to a new place in the tree, which used to restart playback
    // every time Player mode was opened. Staying put in `document.body` and
    // only overlaying keeps a live YouTube iframe or Spotify SDK session
    // running exactly like it already does across a Library-mode
    // navigation.
    function setStageMode(active, stageHost) {
      if (active === stageMode) return;
      if (!active && stageMountEl) stageMountEl.style.height = "";
      stageMode = active;
      stageMountEl = active ? stageHost : null;
      document.body.classList.toggle("player-stage", active);
      dockEl.classList.toggle("stage", active);
      if (active) {
        setExpanded(true);
      } else {
        dockEl.style.left = "";
        dockEl.style.top = "";
        dockEl.style.width = "";
        dockEl.style.right = "";
        dockEl.style.bottom = "";
        dockEl.hidden = !expanded || !hasTrack();
      }
      lastQueueKey = null;
      renderDockQueue();
    }

    // The stage overlay tracks a fixed-positioned rect, not a real DOM
    // parent, so anything that can move `#player-stage-mount` on the page —
    // resizing the window, or scrolling `#view-player` itself — has to
    // re-measure it explicitly.
    window.addEventListener("resize", syncStagePosition);
    document.getElementById("view-player").addEventListener("scroll", syncStagePosition);
    // …and so can the dock's own height changing (queue re-render, source
    // switch between a video and the compact Spotify surface).
    new ResizeObserver(syncStagePosition).observe(dockEl);

    function updateBarMeta(title, sub, thumbUrl) {
      titleBtn.textContent = title || "(untitled)";
      subEl.textContent = sub || "";
      if (thumbUrl) {
        if (thumbImg.getAttribute("src") !== thumbUrl) thumbImg.src = thumbUrl;
        thumbImg.hidden = false;
      } else {
        thumbImg.removeAttribute("src");
        thumbImg.hidden = true;
      }
    }

    // The bar's play/pause: the embed's real state on the active device,
    // the session's everywhere else. Any device can press play on a track
    // nobody is playing — that makes it the active device.
    function renderPlayPause() {
      const playing = isActive() ? !!localPlaying : !!snap?.playing;
      const controllable = isActive() ? localControllable : hasTrack();
      playPauseBtn.disabled = !controllable;
      playPauseIcon.innerHTML = svgIcon(playing ? "pause" : "play", 15);
      playPauseBtn.setAttribute("aria-label", playing ? "Pause" : "Play");
    }

    // Called by every provider adapter when its source can't play. Mounts the
    // next source in preference order if there is one; only once every
    // remaining source has failed is the track reported as ended, so the
    // server skips it. `token` is the failing mount's `mountToken` — a late
    // error from a source since switched away from is ignored.
    function sourceFailed(token) {
      if (token !== mountToken) return false;
      if (currentSourceIdx + 1 < currentSources.length) {
        localPlaying = null;
        localControllable = false;
        mountSourceAt(currentSourceIdx + 1, { startAt: 0, autoplay: !!snap?.playing });
        return true;
      }
      engineState(false, false);
      setTimeout(() => reportEnded(token), 1800);
      return false;
    }

    function mountYoutube(videoId, watchUrl, { startAt, autoplay }) {
      const token = mountToken;
      const wrapper = el("div", { className: "yt-mount" });
      const placeholder = el("div");
      wrapper.appendChild(placeholder);
      surfaceEl.appendChild(wrapper);
      loadYoutubeApi().then((YT) => {
        // The user may have skipped to a different track before the API
        // finished loading — the player would still spin up detached from
        // the dock, so bail rather than create an orphaned instance.
        if (!wrapper.isConnected || token !== mountToken) return;
        ytPlayer = new YT.Player(placeholder, {
          videoId,
          playerVars: {
            playsinline: 1,
            autoplay: autoplay ? 1 : 0,
            enablejsapi: 1,
            start: Math.floor(startAt),
          },
          events: {
            // Autoplay can be silently blocked (e.g. no prior user gesture,
            // or the browser's policy for unmuted video) — so rather than
            // asserting "playing", give it a moment and report "paused" if
            // nothing started (a PLAYING event reports itself).
            onReady: (e) => {
              if (token !== mountToken) return;
              localControllable = true;
              renderPlayPause();
              applyVolume();
              if (!autoplay) {
                engineState(false, true);
                return;
              }
              // The `autoplay=1` player param alone proved unreliable for a
              // player created mid-session (a transfer came up paused),
              // while an explicit playVideo() starts it.
              e.target.playVideo();
              setTimeout(() => {
                if (token !== mountToken) return;
                const st = e.target.getPlayerState();
                if (st !== YT.PlayerState.PLAYING && st !== YT.PlayerState.BUFFERING) engineState(false, true);
              }, 2500);
            },
            onStateChange: (e) => {
              if (token !== mountToken) return;
              if (e.data === YT.PlayerState.PLAYING) engineState(true, true);
              else if (e.data === YT.PlayerState.PAUSED) engineState(false, true);
              else if (e.data === YT.PlayerState.ENDED) reportEnded(token);
            },
            onError: (e) => {
              if (!wrapper.isConnected || token !== mountToken) return;
              if (sourceFailed(token)) return;
              const message = YT_ERROR_MESSAGES[e.data] || "This video can't be played here.";
              wrapper.innerHTML = "";
              wrapper.appendChild(el("p", { className: "note", text: message + " Skipping…" }));
              wrapper.appendChild(
                el("a", { className: "stamp", href: watchUrl, target: "_blank", rel: "noopener noreferrer" }, [
                  el("span", { className: "dot" }),
                  el("span", { text: "Watch on YouTube" }),
                ])
              );
            },
          },
        });
      });
      return wrapper;
    }

    function startSpotify(spotifyId, positionMs, token) {
      const status = surfaceEl.querySelector(".player-dock-spotify-sub");
      Spotify.play(spotifyId, positionMs)
        .then(() => {
          // The user may have moved on while this request was in flight —
          // the device would otherwise start playing this track anyway,
          // underneath whatever's mounted now.
          if (token !== mountToken) {
            Spotify.pause().catch(() => {});
            return;
          }
          if (status) status.textContent = "Playing via your Spotify account";
          applyVolume();
        })
        .catch((err) => {
          if (token !== mountToken) return;
          if (status) status.textContent = err.message;
          sourceFailed(token);
        });
    }

    function mountSpotify(spotifyId, title, { startAt, autoplay }) {
      const token = mountToken;
      const status = el("p", {
        className: "player-dock-spotify-sub",
        text: autoplay ? "Connecting to Spotify…" : "Paused",
      });
      surfaceEl.appendChild(
        el("div", { className: "player-dock-spotify" }, [
          el("p", { className: "player-dock-spotify-title", text: title || "(untitled)" }),
          status,
        ])
      );
      Spotify.setStateListener((state) => {
        if (!state || token !== mountToken) return;
        const playingThis = state.track_window?.current_track?.id === spotifyId;
        if (!playingThis) return;
        engineState(!state.paused, true);
        status.textContent = state.paused ? "Paused" : "Playing via your Spotify account";
      });
      if (autoplay) {
        startSpotify(spotifyId, startAt * 1000, token);
      } else {
        spotifyPending = { id: spotifyId, positionMs: startAt * 1000, token };
        engineState(false, true);
      }
    }

    // ---- SoundCloud: Widget JS API over an iframe pointed at the widget
    // embed URL `embed_for` built server-side (`https://w.soundcloud.com
    // /player/?url=<canonical track URL>`) ----
    //
    // Mirrors the YouTube adapter above: `SC.Widget` wraps an iframe we
    // create ourselves (rather than a bare `<iframe>` with no JS hook) so
    // play/pause/seek/volume and the FINISH/ERROR events are all available,
    // same shape as `mountYoutube`/plst4's `SoundCloud` player.
    let scApiPromise = null;
    function loadSoundcloudApi() {
      if (window.SC && window.SC.Widget) return Promise.resolve(window.SC);
      if (scApiPromise) return scApiPromise;
      scApiPromise = new Promise((resolve) => {
        const script = document.createElement("script");
        script.src = "https://w.soundcloud.com/player/api.js";
        script.onload = () => resolve(window.SC);
        document.head.appendChild(script);
      });
      return scApiPromise;
    }

    function mountSoundcloud(embedUrl, { startAt, autoplay }) {
      const wrapper = el("div", { className: "yt-mount" });
      const iframe = el("iframe", {
        src: embedUrl,
        allow: "autoplay",
        scrolling: "no",
        frameborder: "no",
      });
      wrapper.appendChild(iframe);
      surfaceEl.appendChild(wrapper);
      const token = mountToken;
      loadSoundcloudApi().then((SC) => {
        // Same staleness guard as `mountYoutube` — the user may have moved
        // on to a different source before the widget API script loaded.
        if (!wrapper.isConnected || token !== mountToken) return;
        const widget = new SC.Widget(iframe);
        widget.bind(SC.Widget.Events.READY, () => {
          if (token !== mountToken) return;
          scWidget = widget;
          applyVolume();
          if (startAt > 0) widget.seekTo(startAt * 1000);
          if (autoplay) widget.play();
          else engineState(false, true);
        });
        widget.bind(SC.Widget.Events.PLAY, () => token === mountToken && engineState(true, true));
        widget.bind(SC.Widget.Events.PAUSE, () => token === mountToken && engineState(false, true));
        widget.bind(SC.Widget.Events.FINISH, () => reportEnded(token));
        widget.bind(SC.Widget.Events.ERROR, () => sourceFailed(token));
      });
      return wrapper;
    }

    // ---- NicoNico: `postMessage`-based `jsapi=1` protocol over a plain
    // iframe (no widget object — unlike YouTube/SoundCloud there's no JS
    // library to load, just a message contract with the embed) ----
    //
    // Unofficial reference (no first-party docs exist —
    // https://gist.github.com/wkurosawa/903630fbcd01b300672053564c3a2916,
    // matches plst4's `Niconico` player): the embed posts `playerStatusChange`
    // ({ data: { playerStatus } }, 2 = playing / 3 = paused / 4 = ended) and
    // `playerMetadataChange` ({ data: { currentTime, duration, ... } }) events,
    // and accepts `play`/`pause`/`seek` ({ data: { time } }) and `volumeChange`
    // ({ data: { volume } }) commands. Every message is tagged with a
    // `playerId` both sides echo back — `nicoPlayerId` is bumped per mount so
    // a message from a since-replaced iframe (still in flight when the user
    // skips tracks) is ignored rather than corrupting the new one's state.
    // `currentTime`/`duration`/`seek`'s `time` are all **milliseconds** —
    // confirmed by watching a live embed's messages, not documented anywhere
    // (the gist above, and plst4, only ever pass/observe `time: 0`, which is
    // unit-ambiguous).
    const NICONICO_ORIGIN = "https://embed.nicovideo.jp";

    window.addEventListener("message", (e) => {
      if (e.origin !== NICONICO_ORIGIN || !nicoIframe) return;
      const msg = e.data;
      if (!msg || String(msg.playerId) !== String(nicoPlayerId)) return;
      const token = mountToken;
      if (msg.eventName === "playerStatusChange") {
        const status = msg.data?.playerStatus;
        if (status === 2) {
          nicoPlaying = true;
          engineState(true, true);
        } else if (status === 3) {
          nicoPlaying = false;
          engineState(false, true);
        } else if (status === 4) {
          nicoPlaying = false;
          reportEnded(token);
        }
      } else if (msg.eventName === "playerMetadataChange") {
        // `currentTime`/`duration` are milliseconds, confirmed against a
        // live embed (undocumented — see the adapter's module doc above);
        // `engineProgress` takes seconds, same as every other provider.
        const { currentTime, duration } = msg.data || {};
        if (typeof currentTime === "number" && typeof duration === "number" && duration > 0) {
          engineProgress(currentTime / 1000, duration / 1000);
        }
      } else if (msg.eventName === "error") {
        sourceFailed(token);
      }
    });

    function nicoPostMessage(msg) {
      if (!nicoIframe) return;
      nicoIframe.contentWindow?.postMessage(
        Object.assign({ sourceConnectorType: 1, playerId: String(nicoPlayerId) }, msg),
        NICONICO_ORIGIN
      );
    }

    function mountNicovideo(embedUrl, { startAt, autoplay }) {
      nicoPlayerId++;
      nicoPlaying = false;
      const myPlayerId = nicoPlayerId;
      const wrapper = el("div", { className: "yt-mount" });
      const iframe = el("iframe", {
        src: `${embedUrl}&playerId=${myPlayerId}`,
        allow: "autoplay; fullscreen",
      });
      wrapper.appendChild(iframe);
      surfaceEl.appendChild(wrapper);
      iframe.addEventListener("load", () => {
        if (!wrapper.isConnected || myPlayerId !== nicoPlayerId) return;
        nicoIframe = iframe;
        localControllable = true;
        renderPlayPause();
        if (autoplay) nicoPostMessage({ eventName: "play" });
        if (startAt > 0) nicoPostMessage({ eventName: "seek", data: { time: startAt * 1000 } });
        if (!autoplay) engineState(false, true);
      });
      return wrapper;
    }

    // Tears down whatever the engine has mounted. Spotify plays via a
    // Connect device, not the DOM — clearing the surface doesn't stop it
    // like it would an iframe, so it has to be paused explicitly.
    function clearSurface() {
      if (provider === "spotify" && !spotifyPending) Spotify.pause().catch(() => {});
      mountToken++;
      surfaceEl.innerHTML = "";
      ytPlayer = null;
      scWidget = null;
      nicoIframe = null;
      spotifyPending = null;
      provider = null;
      stopProgressPolling();
    }

    function unmountEngine() {
      clearSurface();
      PlayLog.finish();
      mountedKey = null;
      mountedTrackSeq = null;
      localPlaying = null;
      localControllable = false;
      remoteCardKey = null;
    }

    function mountSource(source, opts) {
      PlayLog.sourceChanged();
      const isSpotify =
        source.provider === "spotify" && Spotify.isConnected() && source.identifier.startsWith(SPOTIFY_TRACK_PREFIX);
      clearSurface();
      const token = mountToken;
      // The source's own provider (a Spotify track without a Spotify
      // connection is still "Spotify" to a remote, just as a bare preview
      // embed), plus whether this engine can actually control it.
      const mounted = (art) =>
        report({
          mounted: {
            provider: source.provider,
            identifier: source.identifier,
            art: art || null,
            controllable: provider !== "other",
          },
        });
      surfaceEl.className = "player-dock-surface " + (isSpotify ? "compact" : "video");
      if (isSpotify) {
        provider = "spotify";
        const spotifyId = source.identifier.slice(SPOTIFY_TRACK_PREFIX.length);
        mountSpotify(spotifyId, currentTitle, opts);
        mounted(null);
        Spotify.getTrackArt(spotifyId).then((art) => {
          // Mounting may have moved on to a different source while this
          // lookup was in flight — don't let a stale response clobber the
          // bar's current thumbnail.
          if (art && token === mountToken) mounted(art);
        });
        startSpotifyProgressPolling(token);
      } else if (source.provider === "youtube") {
        provider = "youtube";
        const videoId = source.embed_url.split("/").pop();
        mountYoutube(videoId, source.identifier, opts);
        mounted(`https://i.ytimg.com/vi/${videoId}/mqdefault.jpg`);
        startYoutubeProgressPolling();
      } else if (source.provider === "soundcloud") {
        provider = "soundcloud";
        mountSoundcloud(source.embed_url, opts);
        mounted(null);
        startSoundcloudProgressPolling();
      } else if (source.provider === "nicovideo") {
        provider = "nicovideo";
        mountNicovideo(source.embed_url, opts);
        mounted(null);
      } else {
        provider = "other";
        surfaceEl.appendChild(
          el("iframe", { src: source.embed_url, allow: "autoplay; encrypted-media", allowFullscreen: true })
        );
        mounted(null);
        // No programmatic control over a bare embed at all — it has
        // whatever built-in controls it ships with, if any.
        engineState(true, false);
      }
      // The player dial is per-provider — refresh it to whichever value is
      // stored for the provider just mounted.
      setVolumeUI();
    }

    // Playable sources per entry, for both the engine (what to mount) and
    // the switcher (what else there is). Small and per-session.
    const sourcesCache = new Map();
    function loadSources(entryId) {
      if (!sourcesCache.has(entryId)) {
        const p = api(`/api/entries/${entryId}/playable-sources`)
          .then((r) => r.sources)
          .catch(() => {
            sourcesCache.delete(entryId);
            return [];
          });
        sourcesCache.set(entryId, p);
      }
      return sourcesCache.get(entryId);
    }

    // Mounts what the snapshot says is current, picking up where the
    // session is (a transfer, or a reload resuming): from its position, and
    // playing only if the session is.
    function mountEngine(s, key) {
      clearSurface();
      if (s.track_seq !== mountedTrackSeq) PlayLog.start(s.current.entry_id);
      mountedKey = key;
      mountedTrackSeq = s.track_seq;
      lastSeekSeq = s.seek_seq;
      lastSnapPlaying = s.playing;
      localPlaying = null;
      localControllable = false;
      endedReported = false;
      remoteCardKey = null;
      const startAt = s.position_ms > 1500 ? s.position_ms / 1000 : 0;
      const opts = { startAt, autoplay: s.playing };
      progress = { pos: startAt, at: performance.now(), playing: false, duration: (s.duration_ms || 0) / 1000 };
      renderPlayPause();
      loadSources(s.current.entry_id).then((list) => {
        if (mountedKey !== key) return;
        // Ordered by this device's Settings-mode source preference, not
        // playable-sources' own (DB-row) order — see
        // `sortByProviderPreference` — starting from an explicit pick if
        // there is one. `sourceFailed` walks on down the list.
        const ordered = sortByProviderPreference(list);
        if (!ordered.length) {
          // Nothing this device can play: skip it, same as a failed embed.
          surfaceEl.className = "player-dock-surface compact";
          surfaceEl.appendChild(el("p", { className: "player-dock-spotify-sub", text: "No playable source. Skipping…" }));
          const token = mountToken;
          setTimeout(() => reportEnded(token), 1200);
          return;
        }
        currentSources = ordered;
        const picked = s.source ? ordered.findIndex((x) => x.identifier === s.source) : -1;
        mountSourceAt(Math.max(picked, 0), opts);
      });
    }

    // Mounts `currentSources[idx]`: the preferred (or explicitly picked)
    // source, or the next one after a failure. Its `mounted` report moves
    // the switcher's pressed button on every device.
    function mountSourceAt(idx, opts) {
      currentSourceIdx = idx;
      mountSource(currentSources[idx], opts);
    }

    // Brings the engine in line with a snapshot while this tab is active:
    // remount on a new track/source, seek on a new `seek_seq`, and
    // play/pause only when the server's `playing` *changes* — a level
    // check would undo a pause made in the embed itself if any other
    // snapshot arrived before that pause's report did.
    function reconcileEngine(s) {
      if (!s.current) {
        if (mountedKey !== null) unmountEngine();
        return;
      }
      const key = `${s.track_seq}|${s.source || ""}`;
      if (key !== mountedKey) {
        mountEngine(s, key);
        return;
      }
      if (s.seek_seq !== lastSeekSeq) {
        lastSeekSeq = s.seek_seq;
        engineSeek(s.position_ms / 1000);
      }
      if (s.playing !== lastSnapPlaying) {
        lastSnapPlaying = s.playing;
        if (s.playing !== localPlaying) s.playing ? enginePlay() : enginePause();
      }
      applyVolume();
    }

    function deviceLabel(id) {
      const d = snap?.devices.find((x) => x.id === id);
      if (!d) return "another device";
      // Two tabs in the same browser share a name; tell them apart.
      const twins = snap.devices.filter((x) => x.name === d.name).length > 1;
      return twins ? `${d.name} (${d.id.slice(0, 4)})` : d.name;
    }

    // What the dock shows on a device that isn't playing: the track, where
    // it's playing (if anywhere), and a way to take it over.
    let remoteCardKey = null;
    function renderRemoteCard() {
      const s = snap;
      const where = s.active_device
        ? `${s.playing ? "Playing" : "Paused"} on ${deviceLabel(s.active_device)}`
        : "Not playing on any device";
      const art = s.mounted?.art || null;
      const key = [s.current.entry_id, where, art].join("|");
      if (key === remoteCardKey) return;
      remoteCardKey = key;
      surfaceEl.className = "player-dock-surface compact";
      surfaceEl.innerHTML = "";
      surfaceEl.appendChild(
        el("div", { className: "player-dock-remote" }, [
          art ? el("img", { src: art, alt: "" }) : null,
          el("div", { className: "player-dock-remote-text" }, [
            el("p", { className: "player-dock-spotify-title", text: s.current.title || "(untitled)" }),
            el("p", { className: "player-dock-spotify-sub", text: where }),
            el("button", {
              type: "button",
              text: "Play here",
              onclick: () => Remote.command({ type: "transfer", to: Remote.deviceId }).catch(() => {}),
            }),
          ]),
        ].filter(Boolean))
      );
    }

    // ---- video mirror: audio is Spotify-Connect-style (one device), but
    // video is just a view — every other screen shows a muted copy of the
    // active device's video, steered to the session position ----
    //
    // YouTube only: it's the one video provider that can be muted (NicoNico
    // ignores volume/mute, see `volumeControllable`) — a mirror that can't
    // be silenced would just be a second audio device. Anything else shows
    // `renderRemoteCard` instead. Only loaded while this tab is visible and
    // its dock is showing; a hidden or collapsed one doesn't need to stream.
    const MIRROR_DRIFT = 0.75; // seconds off before re-seeking while playing
    const MIRROR_SEEK_COOLDOWN = 2000; // ms: let a seek land before judging it
    let mirror = null; // { key, wrapper, player, ready, lastSeekAt }

    function mirrorVideoId(s) {
      const m = s?.mounted;
      if (!m || m.provider !== "youtube") return null;
      const match = /youtu\.be\/([\w-]+)/.exec(m.identifier) || /[?&]v=([\w-]+)/.exec(m.identifier);
      return match ? match[1] : null;
    }

    function teardownMirror() {
      if (!mirror) return;
      mirror.wrapper.remove();
      mirror = null;
      remoteCardKey = null;
      remoteStripEl.hidden = true;
    }

    function mountMirror(key, videoId) {
      teardownMirror();
      surfaceEl.innerHTML = "";
      surfaceEl.className = "player-dock-surface video";
      const wrapper = el("div", { className: "yt-mount" });
      const placeholder = el("div");
      wrapper.appendChild(placeholder);
      surfaceEl.appendChild(wrapper);
      const m = { key, wrapper, player: null, ready: false, lastSeekAt: 0 };
      mirror = m;
      loadYoutubeApi().then((YT) => {
        if (mirror !== m) return;
        m.player = new YT.Player(placeholder, {
          videoId,
          // No controls: the mirror follows the session, so its own
          // play/seek UI would only fight `syncMirror`.
          playerVars: { playsinline: 1, mute: 1, controls: 0, disablekb: 1, start: Math.floor(progressNow()) },
          events: {
            onReady: (e) => {
              if (mirror !== m) return;
              e.target.mute();
              m.ready = true;
              syncMirror();
            },
            onStateChange: () => mirror === m && syncMirror(),
          },
        });
      });
    }

    // Steers the mirror to the session: play/pause to match, and re-seek
    // when it has drifted (a remote's position is the snapshot
    // extrapolated, re-anchored whenever the server rebroadcasts).
    function syncMirror() {
      const m = mirror;
      if (!m?.ready) return;
      const p = m.player;
      const S = window.YT.PlayerState;
      const st = p.getPlayerState();
      if (st === S.ENDED) return;
      const want = progressNow();
      if (progress.playing && st !== S.PLAYING && st !== S.BUFFERING) p.playVideo();
      else if (!progress.playing && st === S.PLAYING) p.pauseVideo();
      if (st === S.BUFFERING) return;
      const now = performance.now();
      const drift = Math.abs(p.getCurrentTime() - want);
      if (drift > (progress.playing ? MIRROR_DRIFT : 0.3) && now - m.lastSeekAt > MIRROR_SEEK_COOLDOWN) {
        m.lastSeekAt = now;
        p.seekTo(want, true);
      }
    }

    setInterval(syncMirror, 1000);

    // "Playing on … / Play here", under the mirror (the card carries it
    // otherwise).
    function renderRemoteStrip() {
      const s = snap;
      const where = s.active_device
        ? `${s.playing ? "Playing" : "Paused"} on ${deviceLabel(s.active_device)}`
        : "Not playing on any device";
      remoteStripEl.hidden = false;
      remoteStripEl.querySelector(".player-dock-remote-strip-where").textContent = where;
    }

    // The dock surface on a device that isn't playing: the mirror when
    // there's a video to mirror and somewhere to show it, the card
    // otherwise.
    function renderRemoteSurface() {
      if (!snap?.current || isActive()) return;
      const videoId =
        !dockEl.hidden && document.visibilityState === "visible" ? mirrorVideoId(snap) : null;
      if (!videoId) {
        teardownMirror();
        renderRemoteCard();
        return;
      }
      const key = `${snap.track_seq}|${videoId}`;
      if (mirror?.key !== key) mountMirror(key, videoId);
      syncMirror();
      renderRemoteStrip();
    }

    document.addEventListener("visibilitychange", renderRemoteSurface);

    // Source switcher: every playable source of the current track, the
    // mounted one pressed. Picking one is a command, so a remote can switch
    // what the active device plays too.
    let switcherKey = null;
    function renderSwitcher() {
      const s = snap;
      if (!s?.current) {
        switchEl.innerHTML = "";
        switcherKey = null;
        return;
      }
      const entryId = s.current.entry_id;
      loadSources(entryId).then((list) => {
        if (snap?.current?.entry_id !== entryId) return;
        const ordered = sortByProviderPreference(list);
        const picked = snap.mounted?.identifier || snap.source || null;
        const key = [entryId, picked, ordered.map((x) => x.identifier).join(",")].join("|");
        if (key === switcherKey) return;
        switcherKey = key;
        switchEl.innerHTML = "";
        if (ordered.length <= 1) return;
        for (const src of ordered) {
          switchEl.appendChild(
            el("button", {
              type: "button",
              text: src.provider,
              "aria-pressed": String(src.identifier === picked),
              onclick: () => Remote.command({ type: "select_source", identifier: src.identifier }).catch(() => {}),
            })
          );
        }
      });
    }

    // Edition switcher (the dock strip under the source switcher): the
    // current track's other editions, e.g. the instrumental. Picking one
    // replaces it in the queue for every device. Editions aren't all
    // playable, so look before replacing.
    let editionsEntryId = null;
    function renderEditions() {
      const entryId = snap?.current?.entry_id ?? null;
      if (entryId === editionsEntryId) return;
      editionsEntryId = entryId;
      fillEditions(dockEditionsEl, [], null);
      if (entryId == null) return;
      api(`/api/entries/${entryId}`)
        .then((entry) => {
          if (editionsEntryId === entryId) fillEditions(dockEditionsEl, entry.editions, switchEdition);
        })
        .catch(() => {});
    }

    async function switchEdition(ed) {
      const current = snap?.current;
      if (!current) return;
      const sources = await loadSources(ed.entry_id);
      if (snap?.current?.entry_id !== current.entry_id) return;
      if (!sources.length) {
        setStatus(`No playable source for the ${friendlyType(ed.transformation || ed.kind || "original")} edition.`);
        return;
      }
      const item = { entry_id: ed.entry_id, title: ed.title || current.title || null };
      Remote.command({ type: "replace_current", item }).catch((err) => setStatus(err.message));
    }

    // Renders either "up next" (default, floating dock) or the full queue
    // with the current track marked (stage mode, Player mode's big screen)
    // — same panel, reused rather than duplicated. Only rebuilt when the
    // queue's shape actually changed, not on every progress snapshot, so
    // it doesn't flicker under the pointer.
    let lastQueueKey = null;
    function renderDockQueue() {
      const rows = snap?.queue || [];
      const pos = rows.findIndex((r) => r.is_current);
      const items = stageMode ? rows : rows.slice(pos + 1);
      const key = [stageMode, hasTrack(), JSON.stringify(items)].join("|");
      if (key === lastQueueKey) return;
      lastQueueKey = key;
      dockQueueEl.innerHTML = "";
      if (!hasTrack()) {
        dockQueueEl.hidden = true;
        return;
      }
      dockQueueEl.hidden = false;
      dockQueueEl.appendChild(el("p", { className: "player-dock-queue-label", text: stageMode ? "Queue" : "Up next" }));
      if (!items.length) {
        dockQueueEl.appendChild(el("p", { className: "player-dock-queue-empty", text: "Nothing queued." }));
        return;
      }
      // Divider between the explicitly-queued layer and Post-queue (the
      // background playlist — shuffle-all/tracklist continuation/
      // auto-recommend filler): shown once, right before the first
      // Post-queue row, and only if something (current or queued) actually
      // preceded it — otherwise the panel's own header already says it all.
      let sawNonPostQueueRow = false;
      for (const item of items) {
        const isCurrent = !!item.is_current;
        if (isCurrent || !item.is_post_queue) {
          sawNonPostQueueRow = true;
        } else if (sawNonPostQueueRow) {
          dockQueueEl.appendChild(el("p", { className: "player-dock-queue-divider", text: "Post-queue" }));
          sawNonPostQueueRow = false;
        }
        const removeBtn = el("button", {
          type: "button",
          className: "player-dock-queue-remove",
          "aria-label": "Remove from queue",
          disabled: isCurrent,
          onclick: isCurrent
            ? null
            : () => Remote.command({ type: "remove", order_index: item.order_index }).catch(() => {}),
        });
        removeBtn.innerHTML = svgIcon("x", 12);
        dockQueueEl.appendChild(
          el("div", { className: "player-dock-queue-row" + (isCurrent ? " is-current" : "") }, [
            el("button", {
              type: "button",
              className: "player-dock-queue-jump",
              text: item.title || "(untitled)",
              onclick: () => Remote.command({ type: "jump", order_index: item.order_index }).catch(() => {}),
            }),
            removeBtn,
          ])
        );
      }
    }

    function renderDevices() {
      devicesBtn.classList.toggle("is-remote", !!snap?.active_device && !isActive());
      if (devicesEl.hidden || !snap) return;
      devicesEl.innerHTML = "";
      devicesEl.appendChild(el("p", { className: "player-devices-label", text: "Play on" }));
      for (const d of snap.devices) {
        const self = d.id === Remote.deviceId;
        const active = d.id === snap.active_device;
        devicesEl.appendChild(
          el(
            "button",
            {
              type: "button",
              role: "menuitemradio",
              "aria-checked": String(active),
              onclick: () => {
                closeDevices();
                if (!active) Remote.command({ type: "transfer", to: d.id }).catch(() => {});
              },
            },
            [
              el("span", { text: deviceLabel(d.id) }),
              self ? el("span", { className: "player-devices-note", text: "this tab" }) : null,
            ].filter(Boolean)
          )
        );
      }
    }

    function closeDevices() {
      devicesEl.hidden = true;
      devicesBtn.setAttribute("aria-expanded", "false");
    }

    devicesBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      devicesEl.hidden = !devicesEl.hidden;
      devicesBtn.setAttribute("aria-expanded", String(!devicesEl.hidden));
      renderDevices();
    });
    document.addEventListener("click", (e) => {
      if (!devicesEl.hidden && !devicesEl.contains(e.target)) closeDevices();
    });

    function onSnapshot(s) {
      snap = s;
      currentTitle = s.current?.title || "";
      if (s.volume) {
        if (performance.now() - volumeEditedAt > 600) {
          volumeGlobal = s.volume.global;
          volumeByProvider = { ...s.volume.by_provider };
          muted = s.volume.muted;
        }
      } else {
        seedVolume();
      }

      if (isActive()) {
        teardownMirror();
        reconcileEngine(s);
      } else {
        if (mountedKey !== null) unmountEngine();
        progress = {
          pos: s.position_ms / 1000,
          at: performance.now(),
          playing: s.playing,
          duration: (s.duration_ms || 0) / 1000,
        };
        if (!s.current) {
          teardownMirror();
          surfaceEl.innerHTML = "";
          remoteCardKey = null;
        }
      }

      const has = hasTrack();
      barEl.hidden = !has;
      document.body.classList.toggle("has-player", has);
      if (!has) dockEl.hidden = true;
      else if (dockEl.hidden && (expanded || stageMode)) setExpanded(expanded);
      // After the dock's visibility is settled — the mirror only loads
      // into a dock that's showing.
      renderRemoteSurface();
      if (has) {
        const p = s.mounted?.provider;
        const parts = [p ? providerLabel(p) : null];
        if (!isActive()) {
          parts.push(s.active_device ? `on ${deviceLabel(s.active_device)}` : "not playing");
        }
        updateBarMeta(currentTitle, parts.filter(Boolean).join(" · "), s.mounted?.art || null);
      }
      prevBtn.disabled = !s.has_prev;
      nextBtn.disabled = !s.has_next;
      shuffleBtn.setAttribute("aria-pressed", String(s.shuffled));
      repeatBtn.setAttribute("aria-pressed", String(s.repeat !== "off"));
      repeatBtn.innerHTML = svgIcon(s.repeat === "one" ? "repeat-1" : "repeat", 13);
      repeatBtn.setAttribute(
        "aria-label",
        s.repeat === "off" ? "Repeat off" : s.repeat === "all" ? "Repeat all" : "Repeat one"
      );
      renderPlayPause();
      renderProgress();
      setVolumeUI();
      renderSwitcher();
      renderEditions();
      renderDockQueue();
      renderDevices();
      if (stageMode) syncStagePosition();
      onChangeCallback?.();
    }

    // Play/pause. On the active device this drives the embed directly
    // (inside the click's user gesture, which autoplay policies want) and
    // the embed's report updates everyone else; anywhere else it's a
    // command — and with nobody playing, "play" makes this tab the player.
    function togglePlay() {
      if (isActive() && localControllable) {
        if (localPlaying) enginePause();
        else enginePlay();
        return;
      }
      if (!snap?.current) return;
      Remote.command({ type: snap.active_device ? "toggle" : "play" }).catch(() => {});
    }

    function isPlayingEntry(entryId) {
      return snap?.current?.entry_id === entryId;
    }

    prevBtn.addEventListener("click", () => Remote.command({ type: "prev" }).catch(() => {}));
    nextBtn.addEventListener("click", () => Remote.command({ type: "next" }).catch(() => {}));
    playPauseBtn.addEventListener("click", togglePlay);
    shuffleBtn.addEventListener("click", () => Remote.command({ type: "toggle_shuffle" }).catch(() => {}));
    repeatBtn.addEventListener("click", () => Remote.command({ type: "cycle_repeat" }).catch(() => {}));
    expandBtn.addEventListener("click", () => setExpanded(!expanded));
    artBtn.addEventListener("click", () => setExpanded(!expanded));
    titleBtn.addEventListener("click", () => {
      if (snap?.current) viewEntry(snap.current.entry_id);
    });

    Remote.subscribe(onSnapshot);

    return {
      togglePlay,
      isPlayingEntry,
      setStageMode,
      syncStagePosition,
      hasTrack,
      onChange: (fn) => {
        onChangeCallback = fn;
      },
    };
  })();

  function refreshPlayIndicators() {
    const cta = document.getElementById("play-cta");
    if (cta) {
      const playing = Player.isPlayingEntry(Number(cta.dataset.entryId));
      cta.classList.toggle("is-playing", playing);
      cta.querySelector(".play-cta-icon").innerHTML = svgIcon(playing ? "pause" : "play", 13);
      cta.querySelector(".play-cta-label").textContent = playing ? "Playing" : "Play";
    }
    for (const row of document.querySelectorAll(".manifest-row[data-entry-id]")) {
      const playing = Player.isPlayingEntry(Number(row.dataset.entryId));
      row.classList.toggle("is-playing", playing);
      const icon = row.querySelector(".manifest-play-icon");
      if (icon) icon.innerHTML = svgIcon(playing ? "pause" : "play", 12);
      const playBtn = row.querySelector(".manifest-play");
      if (playBtn) playBtn.setAttribute("aria-label", playing ? "Pause" : "Play");
    }
  }

  // Player mode's empty state ("nothing playing") vs. its stage/queue
  // wrapper — kept in sync on every session change rather than only when
  // the mode switch happens, so playback started from Library/the rail (or
  // from another device) while Player mode is open updates it live.
  function refreshPlayerStageVisibility() {
    const has = Player.hasTrack();
    playerStageWrapEl.hidden = !has;
    playerStageEmptyEl.hidden = has;
    // Unhiding the wrap just now is what gives `#player-stage-mount` its
    // real on-page size/position — re-sync the overlay against it.
    Player.syncStagePosition();
  }

  Player.onChange(() => {
    refreshPlayIndicators();
    refreshPlayerStageVisibility();
  });

  // ---------- queue actions: commands to the shared session ----------
  //
  // The queue itself (play order, shuffle/repeat, the Queue vs Post-queue
  // layers, auto-recommend top-up) lives server-side now — see
  // playback.rs's `Queue`. These just say what the library UI wants; the
  // result arrives as a snapshot, on every device. They play on whichever
  // device is active, or on this one if none is.
  async function playbackCommand(cmd) {
    try {
      await Remote.command(cmd);
      return true;
    } catch (err) {
      setStatus(err.message);
      return false;
    }
  }

  // What the server's queue stores of a track (`playback::QueueItem`);
  // `release_id` is the album a tracklist was played from, for the
  // now-playing drawer.
  function queueItem(t) {
    return { entry_id: t.entry_id, title: t.title ?? null, release_id: t.release_id ?? null };
  }

  function startQueue(items, index) {
    playbackCommand({
      type: "set_queue",
      items: items.map(queueItem),
      start_index: index,
    });
  }
