      const url = URL.createObjectURL(blob);
      const a = el("a", { href: url, download: `musiclib-import-${job.id}.log.txt` });
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    async function cancelJob(id) {
      const job = findJob(id);
      if (!job || job.canceling) return;
      job.canceling = true;
      render();
      try {
        await del(`/api/jobs/${id}`);
      } catch (e) {
        job.canceling = false;
        submitError = e.message;
        render();
        return;
      }
      // Don't wait for the next scheduled poll tick (up to POLL_MS away) —
      // fetch the now-canceled status right away for snappier feedback. The
      // tick already in flight from the original `poll()` call still fires
      // too, but by then the status is terminal, so it's a no-op re-render.
      poll(id);
    }

    function render() {
      viewEl.innerHTML = "";

      const urlInput = el("input", {
        className: "import-url-input",
        type: "text",
        placeholder: "Paste a URL (YouTube, Spotify, MusicBrainz, Discogs, SoundCloud, NicoNico…)",
        value: inputValue,
        oninput: (e) => {
          inputValue = e.target.value;
        },
        onkeydown: (e) => {
          if (e.key === "Enter") submit();
        },
      });
      const fileSelect = el("select", {
        className: "import-select",
        title: "Which fetch-options file to use",
        onchange: (e) => {
          selectedFile = e.target.value;
          loadEntryPoints(selectedFile);
        },
      });
      for (const f of files) {
        fileSelect.appendChild(el("option", { value: f.id, text: f.label || `${f.id}.yaml` }));
      }
      fileSelect.value = selectedFile;

      // Only shown once a file is picked that actually defines more than
      // one entry point — most files just have `main`, and forcing a choice
      // of one option every time would be pure friction.
      let entryPointSelect = null;
      if (entryPoints.length > 1) {
        entryPointSelect = el(
          "select",
          {
            className: "import-select",
            title: "Which entry point in the file to start from",
            onchange: (e) => {
              selectedEntryPoint = e.target.value;
            },
          },
          entryPoints.map((name) => el("option", { value: name, text: name }))
        );
        entryPointSelect.value = selectedEntryPoint;
      }

      const submitBtn = el("button", {
        className: "play-cta",
        type: "button",
        text: "Start import",
        onclick: submit,
      });

      const jobsList = jobs.length
        ? el(
            "ul",
            { className: "ingest-jobs import-jobs" },
            jobs.slice(0, MAX_SHOWN).map(renderJob)
          )
        : null;

      viewEl.appendChild(
        el("div", { className: "import-view" }, [
          el("p", { className: "card-kicker", text: "Import" }),
          el("h1", { className: "card-title", text: "Add to your library" }),
          el("p", {
            className: "card-meta",
            text: "Paste a URL from any source musiclib-rs understands, pick a fetch-options file from your config directory (and which entry point in it to start from, if it defines more than one), and it runs through the same pipeline as the import CLI.",
          }),
          el("div", { className: "import-form" }, [urlInput, fileSelect, entryPointSelect, submitBtn]),
          submitError ? el("p", { className: "rail-foot-error", text: submitError }) : null,
          el("p", { className: "manifest-label", text: jobs.length ? "Recent imports" : "No imports yet" }),
          jobsList,
        ])
      );
    }

    // Polls one job until it reaches a terminal status. Stops silently if the
    // job was dismissed from `jobs` while in flight — nothing left to update.
    async function poll(id) {
      let view;
      try {
        view = await api(`/api/jobs/${id}`);
      } catch (e) {
        const job = findJob(id);
        if (job) {
          job.status = "failed";
          job.errorMessage = e.message;
          render();
        }
        return;
      }
      const job = findJob(id);
      if (!job) return;
      job.status = view.status;
      job.stage = view.progress?.stage || null;
      job.message = view.progress?.message || null;
      job.detail = view.progress?.detail || null;
      job.createdAt = job.createdAt || view.created_at || null;
      job.updatedAt = view.updated_at || null;
      if (view.status === "succeeded") {
        job.entryId = view.result?.entry_id ?? null;
      } else if (view.status === "failed" || view.status === "canceled") {
        job.errorMessage = view.error?.message || null;
      }
      render();
      if (view.status === "pending" || view.status === "running") {
        setTimeout(() => poll(id), POLL_MS);
      }
    }

    async function submit() {
      const query = inputValue.trim();
      if (!query) return;
      inputValue = "";
      submitError = null;
      let res;
      try {
        res = await postJson("/api/ingest", {
          query,
          fetch_options: { file: selectedFile, entry_point: selectedEntryPoint || "main" },
        });
      } catch (e) {
        submitError = e.message;
        render();
        return;
      }
      jobs = [
        { id: res.job_id, query, status: "pending", stage: null, message: null, detail: null },
        ...jobs,
      ];
      render();
      poll(res.job_id);
    }

    // Fetched once at startup; `render()` above already works off the
    // built-in `__shallow__` fallback in the meantime, so a slow or failed
    // request just means the file picker stays down to that one option.
    async function loadFiles() {
      try {
        const data = await api("/api/fetch-options/files");
        if (Array.isArray(data.files) && data.files.length) {
          files = data.files;
          if (!files.some((f) => f.id === selectedFile)) {
            selectedFile = files[0].id;
          }
        }
      } catch {
        // keep the built-in fallback — the form still works.
      }
      await loadEntryPoints(selectedFile);
    }

    // `__shallow__` isn't a real file, so it never has more than the one
    // implicit entry point — skip the network round trip and just clear the
    // picker. `render()` at the end covers both branches.
    async function loadEntryPoints(fileId) {
      if (fileId === "__shallow__") {
        entryPoints = [];
        selectedEntryPoint = "main";
        render();
        return;
      }
      try {
        const data = await api(`/api/fetch-options/entry-points?file=${encodeURIComponent(fileId)}`);
        entryPoints = Array.isArray(data.entry_points) ? data.entry_points : [];
      } catch {
        entryPoints = [];
      }
      selectedEntryPoint = entryPoints.includes("main") ? "main" : entryPoints[0] || "main";
      render();
    }

    function init() {
      render();
      loadFiles();
    }

    return { render: init };
  })();

  // ---------- shuffle mix: familiar vs new ----------
  //
  // "Shuffle all" and the auto-recommend top-up draw each batch from two
  // pools. Familiar tracks are the ones NRS has scored, directly or through
  // an album or artist (`/api/library/nrs-pool`, see `nrs_pool.rs`); new
  // tracks come from the server's uniform sampler with the familiar pool
  // excluded. The settings decide the split and how NRS scores become draw
  // odds; they live in localStorage like this player's other preferences.
  // The cooldown reads the server's play log (`/api/plays/last`, see
  // `PlayLog`), plus plays noted since it was last read. Without a
  // reachable NRS app every batch is new, which is the plain library
  // shuffle.
  const ShuffleMix = (() => {
    const SETTINGS_KEY = "shuffle_mix";
    // When "Clear" last reset the cooldown (ms): plays before it are ignored.
    const PLAYS_CLEARED_KEY = "shuffle_mix_plays_cleared";
    const PLAYS_MAX_AGE_MS = 10 * 60 * 1000;
    const POOL_MAX_AGE_MS = 10 * 60 * 1000;
    const SIM_RUNS = 150;
    const TIERS = ["direct", "album", "artist"];
    const TIER_LABEL = { direct: "Scored track", album: "Scored album", artist: "Scored artist", new: "New" };
    const TIER_COLOR = {
      direct: "var(--type-track)",
      album: "var(--type-release)",
      artist: "var(--type-artist)",
    };
    // Cooldown half-life choices in hours: a log-ish scale reads better on
    // one slider than linear hours.
    const HALF_LIVES = [0, 1, 2, 4, 6, 12, 24, 48, 72, 168, 336, 720];
    const DEFAULTS = {
      familiar: 0.7,
      directOn: true,
      direct: 1,
      albumOn: true,
      album: 0.6,
      artistOn: true,
      artist: 0.35,
      artistMainOnly: true,
      combine: "max",
      floor: 0,
      basis: "score",
      sharpness: 1.5,
      cooldownHours: 24,
      cooldownStrength: 0.85,
      perSourceCap: 4,
      placement: "spread",
      familiarFirst: true,
      batch: 100,
    };
    const PRESETS = [
      { id: "comfort", label: "Comfort", values: { familiar: 0.9, direct: 1, album: 0.5, artist: 0.2, sharpness: 2.5, cooldownHours: 12, cooldownStrength: 0.7 } },
      { id: "balanced", label: "Balanced", values: { familiar: 0.7, direct: 1, album: 0.6, artist: 0.35, sharpness: 1.5, cooldownHours: 24, cooldownStrength: 0.85 } },
      { id: "explore", label: "Explore", values: { familiar: 0.4, direct: 1, album: 0.8, artist: 0.6, sharpness: 0.8, cooldownHours: 48, cooldownStrength: 0.95 } },
      { id: "discover", label: "Discover", values: { familiar: 0.1, direct: 1, album: 1, artist: 1, sharpness: 0.5, cooldownHours: 72, cooldownStrength: 1 } },
    ];

    function readJson(key, fallback) {
      try {
        return JSON.parse(localStorage.getItem(key) || "null") ?? fallback;
      } catch {
        return fallback;
      }
    }

    function writeJson(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch {}
    }

    function loadSettings() {
      const saved = readJson(SETTINGS_KEY, {});
      const out = { ...DEFAULTS };
      for (const k of Object.keys(DEFAULTS)) {
        if (typeof saved[k] === typeof DEFAULTS[k]) out[k] = saved[k];
      }
      return out;
    }

    let settings = loadSettings();
    // entry id -> last time it started a counted play (ms).
    let plays = {};
    let playsLoadedAt = 0;
    // The old localStorage play log had no durations; it isn't migrated.
    try {
      localStorage.removeItem("shuffle_mix_plays");
    } catch {}

    // The longest cooldown window (two half-lives of the longest choice).
    const PLAYS_WINDOW_MS = 2 * HALF_LIVES[HALF_LIVES.length - 1] * 3.6e6;

    async function loadPlays(force) {
      if (!force && Date.now() - playsLoadedAt < PLAYS_MAX_AGE_MS) return;
      playsLoadedAt = Date.now();
      const since = Math.max(Date.now() - PLAYS_WINDOW_MS, readJson(PLAYS_CLEARED_KEY, 0));
      try {
        const res = await api(`/api/plays/last?since=${Math.floor(since / 1000)}`);
        const loaded = {};
        for (const [id, at] of res.plays) loaded[id] = at * 1000;
        // Keep plays noted here that the server answer may predate.
        for (const [id, at] of Object.entries(plays)) {
          if (!(loaded[id] >= at)) loaded[id] = at;
        }
        plays = loaded;
        schedule();
      } catch {
        playsLoadedAt = 0;
      }
    }

    function set(patch) {
      settings = { ...settings, ...patch };
      writeJson(SETTINGS_KEY, settings);
      syncControls();
      schedule();
    }

    /// A play just became a counted one (see `PlayLog`); the server has it
    /// too, this just doesn't wait for the next `loadPlays`.
    function notePlayed(entryId) {
      plays[entryId] = Date.now();
      schedule();
    }

    // ---- the familiar pool ----

    let pool = null;
    let poolLoadedAt = 0;
    let poolError = null;
    let nrsUrl = null;
    let poolLoading = null;

    function loadPool(refresh = false) {
      const fresh = pool && Date.now() - poolLoadedAt < POOL_MAX_AGE_MS;
      if (fresh && !refresh) return Promise.resolve(pool);
      if (poolLoading && !refresh) return poolLoading;
      poolLoading = (async () => {
        try {
          const res = await api(`/api/library/nrs-pool${refresh ? "?refresh=1" : ""}`);
          nrsUrl = res.nrs_url;
          if (res.available) {
            pool = res.pool;
            poolLoadedAt = Date.now();
            poolError = null;
          } else {
            poolError = res.error || "NRS is unavailable";
          }
        } catch (err) {
          poolError = err.message;
        } finally {
          poolLoading = null;
        }
        schedule();
        return pool;
      })();
      schedule();
      return poolLoading;
    }

    // ---- scores to odds ----

    function lowerBound(sorted, v) {
      let lo = 0;
      let hi = sorted.length;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (sorted[mid] < v) lo = mid + 1;
        else hi = mid;
      }
      return lo;
    }

    function upperBound(sorted, v) {
      let lo = 0;
      let hi = sorted.length;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (sorted[mid] <= v) lo = mid + 1;
        else hi = mid;
      }
      return lo;
    }

    // One row per familiar track that any enabled tier reaches: its value
    // (tier weight x NRS score, the strongest or the sum across tiers), the
    // tier and pool source that contributed most, and its draw weight. A
    // source below the score floor doesn't count. `base` is the value's
    // position on the chosen basis in (0, 1]; `w` is `base ^ sharpness`
    // times the cooldown factor `cool`.
    function weigh(s = settings) {
      const counts = { direct: 0, album: 0, artist: 0 };
      if (!pool) return { rows: [], all: [], counts, vmax: 0, sorted: [] };
      const src = pool.sources;
      const best = (indices) => {
        let b = null;
        for (const i of indices) {
          const score = src[i].score;
          if (score >= s.floor && (b === null || score > src[b].score)) b = i;
        }
        return b;
      };
      const all = [];
      for (const track of pool.tracks) {
        const picks = {
          direct: best(track.direct),
          album: best(track.albums),
          artist: best(track.artists.filter(([, main]) => main || !s.artistMainOnly).map(([i]) => i)),
        };
        let value = 0;
        let tier = null;
        let source = null;
        let top = 0;
        for (const k of TIERS) {
          if (picks[k] === null) continue;
          counts[k]++;
          if (!s[`${k}On`] || !(s[k] > 0)) continue;
          const c = src[picks[k]].score * s[k];
          value = s.combine === "sum" ? value + c : Math.max(value, c);
          if (c > top) {
            top = c;
            tier = k;
            source = picks[k];
          }
        }
        if (value > 0) all.push({ track, value, tier, source, base: 0, raw: 0, cool: 1, w: 0 });
      }
      const sorted = all.map((r) => r.value).sort((a, b) => a - b);
      const vmax = sorted.length ? sorted[sorted.length - 1] : 0;
      const now = Date.now();
      for (const r of all) {
        r.base =
          s.basis === "percentile"
            ? (lowerBound(sorted, r.value) + upperBound(sorted, r.value)) / 2 / sorted.length
            : r.value / vmax;
        r.raw = s.sharpness > 0 ? Math.pow(r.base, s.sharpness) : 1;
        const at = plays[r.track.entry_id];
        if (at && s.cooldownHours > 0 && s.cooldownStrength > 0) {
          const ageHours = (now - at) / 3.6e6;
          r.cool = 1 - s.cooldownStrength * Math.pow(2, -ageHours / s.cooldownHours);
        }
        r.w = r.raw * r.cool;
      }
      return { rows: all.filter((r) => r.w > 0), all, counts, vmax, sorted };
    }

    // `k` rows by weight, without replacement (Efraimidis-Spirakis: the
    // largest u^(1/w) wins, compared as log(u)/w), keeping at most
    // `perSourceCap` per album or artist the value came through.
    function drawFamiliar(rows, k, s, skip) {
      if (k <= 0 || !rows.length) return [];
      const keyed = [];
      for (const r of rows) {
        if (skip && skip.has(r.track.entry_id)) continue;
        keyed.push([Math.log(Math.random()) / r.w, r]);
      }
      keyed.sort((a, b) => b[0] - a[0]);
      const perSource = new Map();
      const out = [];
      for (const [, r] of keyed) {
        if (out.length >= k) break;
        if (s.perSourceCap > 0 && r.tier !== "direct") {
          const n = perSource.get(r.source) || 0;
          if (n >= s.perSourceCap) continue;
          perSource.set(r.source, n + 1);
        }
        out.push(r);
      }
      return out;
    }

    function shuffleInPlace(a) {
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // Draw order is weight order, so both lists are shuffled first. "Spread"
    // interleaves them at their own even, jittered spacing.
    function arrange(familiar, fresh, s) {
      shuffleInPlace(familiar);
      shuffleInPlace(fresh);
      let out;
      if (s.placement === "spread" && familiar.length && fresh.length) {
        const keyed = [
          ...familiar.map((x, i) => [(i + 0.15 + 0.7 * Math.random()) / familiar.length, x]),
          ...fresh.map((x, i) => [(i + 0.15 + 0.7 * Math.random()) / fresh.length, x]),
        ];
        keyed.sort((a, b) => a[0] - b[0]);
        out = keyed.map(([, x]) => x);
      } else {
        out = shuffleInPlace([...familiar, ...fresh]);
      }
      if (s.familiarFirst) {
        const i = out.findIndex((x) => x.mix !== "new");
        if (i > 0) out.unshift(out.splice(i, 1)[0]);
      }
      return out;
    }

    // Recently started tracks, newest first, within two cooldown half-lives
    // (a day when the cooldown is off): the new sampler skips these.
    function recentPlays(s) {
      const windowMs = (s.cooldownHours > 0 ? 2 * s.cooldownHours : 24) * 3.6e6;
      const now = Date.now();
      return Object.entries(plays)
        .filter(([, at]) => now - at < windowMs)
        .sort((a, b) => b[1] - a[1])
        .map(([id]) => Number(id));
    }

    /// One batch of `n` queue items (`{entry_id, title, mix}`, `mix` being
    /// the tier or "new"), arranged per the settings. `skip` ids (already
    /// queued) are never drawn.
    async function generate(n, { skip = [] } = {}) {
      const s = settings;
      await Promise.all([loadPool(), loadPlays()]);
      const skipSet = new Set(skip.map(Number));
      const { rows } = weigh(s);
      const want = pool ? Math.round(n * s.familiar) : 0;
      const familiar = drawFamiliar(rows, want, s, skipSet).map((r) => ({
        entry_id: r.track.entry_id,
        title: r.track.title,
        mix: r.tier,
      }));
      const need = n - familiar.length;
      let fresh = [];
      if (need > 0) {
        const params = new URLSearchParams({ limit: String(need) });
        const exclude = TIERS.filter((t) => s[`${t}On`]).map((t) => (t === "direct" ? "track" : t));
        if (pool && exclude.length) params.set("exclude", exclude.join(","));
        const avoid = [...new Set([...skipSet, ...recentPlays(s)])].slice(0, 400);
        if (avoid.length) params.set("skip", avoid.join(","));
        fresh = (await api(`/api/library/shuffle?${params}`)).tracks.map((t) => ({ ...t, mix: "new" }));
      }
      return arrange(familiar, fresh, s);
    }

    // ---- settings UI ----

    let sectionEl = null;
    const syncers = [];
    let refs = {};
    let renderHandle = null;
    let previewItems = [];

    function syncControls() {
      for (const sync of syncers) sync();
      updateRailButton();
    }

    function schedule() {
      if (!sectionEl || !sectionEl.isConnected) {
        updateRailButton();
        return;
      }
      clearTimeout(renderHandle);
      renderHandle = setTimeout(renderDerived, 90);
    }

    function updateRailButton() {
      const pct = Math.round(settings.familiar * 100);
      shuffleMixBtn.innerHTML = svgIcon("sliders", 13) + `<span>${pct}%</span>`;
      shuffleMixBtn.title = `Shuffle mix: ${pct}% familiar, ${100 - pct}% new. Click to adjust.`;
    }

    const fmtNum = (n) => Number(n).toLocaleString();
    const fmtPct = (x) => `${Math.round(x * 100)}%`;

    function slider(key, label, { min, max, step, fmt, hint, values, enabled }) {
      // `values`: the slider walks indices into a fixed list instead.
      const input = el("input", {
        type: "range",
        min: values ? 0 : min,
        max: values ? values.length - 1 : max,
        step: values ? 1 : step,
        "aria-label": label,
      });
      const out = el("output");
      input.oninput = () => set({ [key]: values ? values[Number(input.value)] : Number(input.value) });
      const row = el("div", { className: "mix-row" }, [
        el("span", { className: "mix-label", text: label }),
        input,
        out,
        hint ? el("span", { className: "mix-hint", text: hint }) : null,
      ]);
      syncers.push(() => {
        const v = settings[key];
        if (values) {
          let i = values.indexOf(v);
          if (i < 0) i = values.findIndex((x) => x >= v);
          input.value = String(i < 0 ? values.length - 1 : i);
        } else {
          input.value = String(v);
        }
        out.textContent = fmt(v);
        if (enabled) input.disabled = !enabled();
      });
      return row;
    }

    function seg(key, options, label) {
      const buttons = options.map(([value, text]) =>
        el("button", { type: "button", text, onclick: () => set({ [key]: value }) })
      );
      syncers.push(() => {
        options.forEach(([value], i) => buttons[i].setAttribute("aria-pressed", String(settings[key] === value)));
      });
      return el("span", { className: "mix-seg", role: "group", "aria-label": label }, buttons);
    }

    function check(key, label) {
      const box = el("input", { type: "checkbox" });
      box.onchange = () => set({ [key]: box.checked });
      syncers.push(() => {
        box.checked = settings[key];
      });
      return el("label", { className: "mix-check" }, [box, el("span", { text: label })]);
    }

    function tierRow(tier, label, extra) {
      const box = el("input", { type: "checkbox", "aria-label": `Use ${label.toLowerCase()}` });
      box.onchange = () => set({ [`${tier}On`]: box.checked });
      const count = el("span", { className: "mix-count" });
      refs[`count_${tier}`] = count;
      const input = el("input", { type: "range", min: 0, max: 2, step: 0.05, "aria-label": `${label} weight` });
      input.oninput = () => set({ [tier]: Number(input.value) });
      const out = el("output");
      const row = el("div", { className: "mix-row" }, [
        el("label", {}, [
          box,
          el("span", { className: "mix-tag", style: `background:${TIER_COLOR[tier]}` }),
          el("span", { text: label }),
          count,
        ]),
        input,
        out,
        extra ? el("span", { className: "mix-hint" }, [extra]) : null,
      ]);
      syncers.push(() => {
        const on = settings[`${tier}On`];
        box.checked = on;
        row.classList.toggle("is-off", !on);
        input.disabled = !on;
        input.value = String(settings[tier]);
        out.textContent = `×${settings[tier].toFixed(2)}`;
      });
      return row;
    }

    function group(title, children) {
      return el("div", { className: "mix-group" }, [el("h3", { text: title }), ...children]);
    }

    function presetMatches(p) {
      return Object.entries(p.values).every(([k, v]) => Math.abs(settings[k] - v) < 1e-9);
    }

    function section() {
      if (sectionEl) {
        schedule();
        return sectionEl;
      }
      const presetButtons = PRESETS.map((p) =>
        el("button", { type: "button", text: p.label, onclick: () => set(p.values) })
      );
      syncers.push(() => {
        PRESETS.forEach((p, i) => presetButtons[i].setAttribute("aria-pressed", String(presetMatches(p))));
      });

      refs.pool = el("div", { className: "mix-pool" });
      refs.bar = el("div", { className: "mix-bar", role: "img" });
      refs.legend = el("div", { className: "mix-legend" });
      refs.chart = el("div", { className: "mix-chart" });
      refs.stats = el("div", { className: "mix-stats" });
      refs.held = el("span", { className: "mix-count" });
      refs.likely = el("ol", { className: "mix-list" });
      refs.preview = el("ol", { className: "mix-list", hidden: true });
      refs.playPreview = el("button", {
        className: "ghost-btn",
        type: "button",
        text: "Play this batch",
        disabled: true,
        onclick: () => previewItems.length && playMixBatch(previewItems),
      });

      sectionEl = el("div", { className: "settings-section", id: "shuffle-mix-settings" }, [
        el("div", { className: "mix-head" }, [
          el("h2", { text: "Shuffle mix" }),
          el("span", { className: "mix-seg", role: "group", "aria-label": "Presets" }, presetButtons),
        ]),
        el("p", {
          className: "sub",
          text:
            "Shuffle all and auto-recommend fill each batch with familiar tracks (ones NRS has scored, directly or through an album or artist) and new tracks from the rest of your library.",
        }),
        refs.pool,
        refs.bar,
        refs.legend,
        slider("familiar", "Familiar share", {
          min: 0,
          max: 1,
          step: 0.01,
          fmt: fmtPct,
          hint: "The rest of each batch is new tracks. A small familiar pool tops up with new ones.",
        }),

        group("Where familiar tracks come from", [
          tierRow("direct", "Tracks you scored"),
          tierRow("album", "On albums you scored"),
          tierRow("artist", "By artists you scored", check("artistMainOnly", "Main artist credits only")),
          el("div", { className: "mix-row" }, [
            el("span", { className: "mix-label", text: "Reached more than one way" }),
            el("span", {}, [seg("combine", [["max", "Strongest"], ["sum", "Add up"]], "Combine tiers")]),
            el("span"),
            el("span", {
              className: "mix-hint",
              text: "A track's value is tier weight × NRS score: the strongest tier, or every tier added together.",
            }),
          ]),
          slider("floor", "Ignore scores below", {
            min: 0,
            max: 8,
            step: 0.05,
            fmt: (v) => v.toFixed(2),
            hint: "Scores under this don't make a track familiar.",
          }),
        ]),

        group("How scores become odds", [
          el("div", { className: "mix-row" }, [
            el("span", { className: "mix-label", text: "Rank by" }),
            el("span", {}, [seg("basis", [["score", "NRS score"], ["percentile", "Percentile"]], "Basis")]),
            el("span"),
            el("span", {
              className: "mix-hint",
              text: "Percentile spaces tracks evenly by rank, so a few very high scores don't dominate.",
            }),
          ]),
          slider("sharpness", "Favor top scores", {
            min: 0,
            max: 5,
            step: 0.05,
            fmt: (v) => v.toFixed(2),
            hint: "Odds ∝ value^this. 0: every familiar track equally likely. 1: proportional. Higher: mostly your favorites.",
          }),
          refs.chart,
          refs.stats,
        ]),

        group("Repetition", [
          slider("cooldownHours", "Cooldown half-life", {
            values: HALF_LIVES,
            fmt: (h) => (h === 0 ? "off" : h < 48 ? `${h} h` : `${Math.round(h / 24)} d`),
            hint: "A just-played familiar track's odds recover by half every this long.",
          }),
          slider("cooldownStrength", "Cooldown strength", {
            min: 0,
            max: 1,
            step: 0.01,
            fmt: fmtPct,
            hint: "How far a just-played track's odds drop. 100%: it can't come straight back.",
            enabled: () => settings.cooldownHours > 0,
          }),
          slider("perSourceCap", "Max per album or artist", {
            min: 0,
            max: 20,
            step: 1,
            fmt: (v) => (v === 0 ? "∞" : String(v)),
            hint: "Per batch, for tracks reached through one album or artist. Directly scored tracks aren't capped.",
          }),
          el("div", { className: "mix-row" }, [
            el("span", { className: "mix-label", text: "Play log" }),
            el("span", {}, [refs.held]),
            el("button", {
              className: "ghost-btn",
              type: "button",
              text: "Clear",
              title: "Reset the cooldown. The play log itself is kept.",
              onclick: () => {
                plays = {};
                writeJson(PLAYS_CLEARED_KEY, Date.now());
                schedule();
              },
            }),
          ]),
        ]),

        group("Order", [
          el("div", { className: "mix-row" }, [
            el("span", { className: "mix-label", text: "New tracks" }),
            el("span", {}, [seg("placement", [["spread", "Spread evenly"], ["random", "Anywhere"]], "Placement")]),
            el("span"),
          ]),
          el("div", { className: "mix-row" }, [
            el("span", { className: "mix-label", text: "Opening track" }),
            el("span", {}, [check("familiarFirst", "Start with a familiar track")]),
            el("span"),
          ]),
          slider("batch", "Shuffle all batch", {
            min: 20,
            max: 300,
            step: 10,
            fmt: (v) => String(v),
            hint: "Auto-recommend adds 20 at a time with the same mix.",
          }),
        ]),

        group("Most likely familiar picks per batch", [refs.likely]),

        group("Try it", [
          el("div", { className: "mix-actions" }, [
            el("button", {
              className: "ghost-btn",
              type: "button",
              text: "Preview a batch",
              onclick: async () => {
                try {
                  previewItems = await generate(settings.batch);
                } catch (err) {
                  setStatus(`Couldn't build a batch: ${err.message}`);
                  return;
                }
                renderPreview();
              },
            }),
            refs.playPreview,
          ]),
          refs.preview,
        ]),
      ]);
      syncControls();
      loadPool();
      loadPlays(true);
      schedule();
      return sectionEl;
    }

    function whyText(r) {
      const src = pool.sources[r.source];
      if (r.tier === "direct") return `scored ${src.score.toFixed(2)}`;
      return `${r.tier === "album" ? "on" : "by"} ${src.title} · ${src.score.toFixed(2)}`;
    }

    function renderPool() {
      const box = refs.pool;
      box.innerHTML = "";
      box.classList.toggle("is-error", !!poolError && !pool);
      const refresh = el("button", {
        className: "ghost-btn",
        type: "button",
        text: poolLoading ? "Loading…" : pool ? "Refresh" : "Retry",
        disabled: !!poolLoading,
        onclick: () => loadPool(true),
      });
      if (!pool) {
        box.append(
          el("span", {
            text: poolLoading
              ? "Reading scores from NRS…"
              : `Couldn't read NRS${nrsUrl ? ` at ${nrsUrl}` : ""}: ${poolError}. Shuffles are all new tracks until it's reachable.`,
          }),
          refresh
        );
        return;
      }
      const mins = Math.max(0, Math.round((Date.now() / 1000 - pool.built_at) / 60));
      box.append(
        el("span", {
          text:
            `${fmtNum(pool.nrs_entries)} NRS music entries → ${fmtNum(pool.tracks.length)} playable familiar tracks · ` +
            `read ${mins === 0 ? "just now" : `${mins} min ago`}` +
            (poolError ? ` · last refresh failed: ${poolError}` : ""),
        }),
        refresh
      );
      if (pool.unresolved.length || pool.unplayable) {
        box.append(
          el("details", {}, [
            el("summary", {
              text: [
                pool.unresolved.length ? `${fmtNum(pool.unresolved.length)} NRS entries aren't in this library` : null,
                pool.unplayable ? `${fmtNum(pool.unplayable)} reached tracks have no playable source` : null,
              ]
                .filter(Boolean)
                .join(" · "),
            }),
            el(
              "ul",
              {},
              pool.unresolved.map((u) =>
                el("li", {}, [el("a", { href: u.url, target: "_blank", rel: "noopener", text: u.title || u.nrs_id })])
              )
            ),
          ])
        );
      }
    }

    function renderChart(w) {
      const host = refs.chart;
      const { all, vmax, sorted } = w;
      if (!all.length) {
        host.innerHTML = "";
        return;
      }
      const W = Math.max(280, host.clientWidth || 600);
      const H = 120;
      const pad = { l: 4, r: 4, t: 8, b: 18 };
      const iw = W - pad.l - pad.r;
      const ih = H - pad.t - pad.b;
      const BINS = 40;
      const bins = new Array(BINS).fill(0);
      for (const r of all) bins[Math.min(BINS - 1, Math.floor((r.value / vmax) * BINS))]++;
      const bmax = Math.max(...bins);
      const x = (v) => pad.l + (v / vmax) * iw;
      let rects = "";
      bins.forEach((n, i) => {
        if (!n) return;
        const h = (n / bmax) * ih * 0.9;
        rects += `<rect class="bin" x="${(pad.l + (i / BINS) * iw).toFixed(1)}" y="${(pad.t + ih - h).toFixed(1)}" width="${Math.max(1, iw / BINS - 1).toFixed(1)}" height="${h.toFixed(1)}"></rect>`;
      });
      // Relative odds of one pick as a function of value, before cooldown.
      const s = settings;
      const curveAt = (v) => {
        const base =
          s.basis === "percentile"
            ? (lowerBound(sorted, v) + upperBound(sorted, v)) / 2 / sorted.length
            : v / vmax;
        return s.sharpness > 0 ? Math.pow(base, s.sharpness) : 1;
      };
      const pts = [];
      for (let i = 0; i <= 80; i++) {
        const v = (i / 80) * vmax;
        pts.push(`${x(v).toFixed(1)},${(pad.t + ih - curveAt(v) * ih).toFixed(1)}`);
      }
      host.innerHTML =
        `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Familiar tracks by value, with the odds curve">` +
        rects +
        `<line class="axis" x1="${pad.l}" y1="${pad.t + ih}" x2="${W - pad.r}" y2="${pad.t + ih}"></line>` +
        `<polyline class="curve" points="${pts.join(" ")}"></polyline>` +
        `<text x="${pad.l}" y="${H - 4}">0</text>` +
        `<text x="${W - pad.r}" y="${H - 4}" text-anchor="end">value ${vmax.toFixed(2)}</text>` +
        `<text x="${W - pad.r}" y="${pad.t + 2}" text-anchor="end" dominant-baseline="hanging">odds per pick</text>` +
        `</svg>`;
    }

    function stat(value, label) {
      return el("div", { className: "mix-stat" }, [el("b", { text: value }), el("span", { text: label })]);
    }

    function renderDerived() {
      if (!sectionEl) return;
      renderPool();
      const s = settings;
      const w = weigh(s);
      for (const t of TIERS) {
        refs[`count_${t}`].textContent = pool ? fmtNum(w.counts[t]) : "–";
      }

      const n = s.batch;
      const want = pool ? Math.round(n * s.familiar) : 0;
      const sim = { hits: new Map(), tiers: { direct: 0, album: 0, artist: 0 } };
      if (want > 0 && w.rows.length) {
        for (let i = 0; i < SIM_RUNS; i++) {
          for (const r of drawFamiliar(w.rows, want, s)) {
            sim.hits.set(r, (sim.hits.get(r) || 0) + 1);
            sim.tiers[r.tier]++;
          }
        }
      }
      const per = Object.fromEntries(TIERS.map((t) => [t, sim.tiers[t] / SIM_RUNS]));
      const familiarCount = TIERS.reduce((a, t) => a + per[t], 0);
      const newCount = n - familiarCount;

      refs.bar.innerHTML = "";
      for (const t of TIERS) {
        if (per[t] > 0) refs.bar.append(el("span", { style: `flex-grow:${per[t]};background:${TIER_COLOR[t]}` }));
      }
      if (newCount > 0) refs.bar.append(el("span", { className: "mix-new", style: `flex-grow:${newCount}` }));
      refs.bar.setAttribute(
        "aria-label",
        `Per batch of ${n}: ${Math.round(familiarCount)} familiar, ${Math.round(newCount)} new`
      );
      refs.legend.innerHTML = "";
      for (const t of TIERS) {
        refs.legend.append(
          el("span", {}, [
            el("span", { className: "mix-swatch", style: `background:${TIER_COLOR[t]}` }),
            document.createTextNode(`${TIER_LABEL[t]} `),
            el("b", { text: per[t].toFixed(per[t] < 10 ? 1 : 0) }),
          ])
        );
      }
      refs.legend.append(
        el("span", {}, [
          el("span", { className: "mix-swatch mix-new" }),
          document.createTextNode("New "),
          el("b", { text: newCount.toFixed(newCount < 10 ? 1 : 0) }),
        ]),
        el("span", { text: `per ${n}-track batch` })
      );

      renderChart(w);

      // Effective pool: exp(entropy) of one pick's distribution, i.e. the
      // size of a uniform pool that's as unpredictable.
      let total = 0;
      for (const r of w.rows) total += r.w;
      let entropy = 0;
      for (const r of w.rows) {
        const p = r.w / total;
        if (p > 0) entropy -= p * Math.log(p);
      }
      const effective = w.rows.length ? Math.exp(entropy) : 0;
      const byWeight = w.rows.map((r) => r.w).sort((a, b) => b - a);
      const topN = Math.max(1, Math.round(byWeight.length * 0.1));
      const topShare = total ? byWeight.slice(0, topN).reduce((a, b) => a + b, 0) / total : 0;
      const held = w.all.filter((r) => r.cool < 0.5).length;
      const distinct = sim.hits.size;
      refs.stats.innerHTML = "";
      refs.stats.append(
        stat(fmtNum(w.rows.length), "familiar tracks eligible"),
        stat(`≈ ${fmtNum(Math.round(effective))}`, "effective pool (as varied as a uniform pool this size)"),
        stat(fmtPct(topShare), "of the odds go to the top 10%"),
        stat(
          fmtNum(distinct),
          `different familiar tracks across ${SIM_RUNS} simulated batches`
        )
      );
      const logged = Object.keys(plays).length;
      refs.held.textContent = `${fmtNum(logged)} tracks played recently · ${fmtNum(held)} familiar tracks under half odds from cooldown`;

      const likely = [...sim.hits.entries()].sort((a, b) => b[1] - a[1]).slice(0, 15);
      refs.likely.innerHTML = "";
      if (!likely.length) {
        refs.likely.append(
          el("li", {}, [el("span"), el("span", { className: "t", text: pool ? "No familiar picks with these settings." : "No NRS scores loaded." })])
        );
      }
      likely.forEach(([r, hits], i) => {
        const p = hits / SIM_RUNS;
        refs.likely.append(
          el("li", {}, [
            el("span", { className: "n", text: String(i + 1) }),
            el("span", { className: "t" }, [
              el("span", { className: "mix-tag", style: `background:${TIER_COLOR[r.tier]}` }),
              document.createTextNode(r.track.title || `#${r.track.entry_id}`),
            ]),
            el("span", { className: "why", text: whyText(r) }),
            el("span", { className: "p", text: fmtPct(p) }),
            el("span", { className: "meter", style: `width:${(p * 100).toFixed(1)}%` }),
          ])
        );
      });
    }

    function renderPreview() {
      const list = refs.preview;
      list.innerHTML = "";
      list.hidden = !previewItems.length;
      refs.playPreview.disabled = !previewItems.length;
      previewItems.forEach((item, i) => {
        list.append(
          el("li", {}, [
            el("span", { className: "n", text: String(i + 1) }),
            el("span", { className: "t" }, [
              el("span", { className: `mix-tag${item.mix === "new" ? " mix-new" : ""}`, style: item.mix === "new" ? "" : `background:${TIER_COLOR[item.mix]}` }),
              document.createTextNode(item.title || `#${item.entry_id}`),
            ]),
            el("span", { className: "why", text: TIER_LABEL[item.mix] }),
            el("span"),
          ])
        );
      });
    }

    updateRailButton();
    return { generate, notePlayed, section, batchSize: () => settings.batch };
  })();

  // ---------- settings mode: playback source preference ----------
  //
  // Which provider the player should prefer when a track is playable from more than one (see
  // `sortByProviderPreference`, used by `Player.mountEngine`). A plain ordered
  // list rather than a single "preferred provider" dropdown so it keeps
  // making sense as more providers gain direct playback support — reordering
  // is what "prefer Spotify over YouTube, but fall back to YouTube" means
  // once there are more than two choices to fall back through.
  const Settings = (() => {
    const viewEl = document.getElementById("view-settings");

    function move(order, from, to) {
      const next = order.slice();
      const [item] = next.splice(from, 1);
      next.splice(to, 0, item);
      setProviderPreference(next);
      render();
    }

    function moveButton(label, disabled, iconName, onclick) {
      const btn = el("button", { type: "button", "aria-label": label, disabled, onclick });
      btn.innerHTML = svgIcon(iconName, 13);
      return btn;
    }

    function render() {
      viewEl.innerHTML = "";
      const order = getProviderPreference();

      const list = el(
        "ul",
        { className: "provider-pref-list" },
        order.map((provider, i) =>
          el("li", { className: "provider-pref-row" }, [
            el("span", { className: "provider-pref-rank", text: `${i + 1}.` }),
            el("span", {
              className: "provider-pref-dot",
              style: `background:${PLATFORM_COLOR[provider] || "var(--ink-faint)"}`,
            }),
            el("span", { className: "provider-pref-name", text: providerLabel(provider) }),
            el("span", { className: "provider-pref-moves" }, [
              moveButton(`Move ${providerLabel(provider)} up`, i === 0, "chevron-up", () => move(order, i, i - 1)),
              moveButton(
                `Move ${providerLabel(provider)} down`,
                i === order.length - 1,
                "chevron-down",
                () => move(order, i, i + 1)
              ),
            ]),
          ])
        )
      );

      viewEl.appendChild(
        el("div", { className: "settings-view has-mix" }, [
          ShuffleMix.section(),
          el("div", { className: "settings-section" }, [
            el("h2", { text: "Playback source" }),
            el("p", {
              className: "sub",
              text:
                "When a track is available from more than one source, the player uses the first one from this order. Move a source up to prefer it.",
            }),
            list,
          ]),
        ])
      );
    }

    return { render };
  })();

  // ---------- spotify: connect + playback, entirely client-side ----------
  //
  // Authorization Code with PKCE (https://developer.spotify.com/documentation/web-api/tutorials/code-pkce-flow)
  // needs no client secret and no server involvement, so the whole flow —
  // and the token store — lives here in the browser via localStorage. This
  // is a personal, single-user, localhost app: that's an appropriate place
  // to keep it, not a backend concern.
  const Spotify = (() => {
    const SCOPES = "streaming user-read-email user-read-private user-modify-playback-state user-read-playback-state";
    // YouTube's embed-permission check treats the raw IP-literal origin
    // differently from a named host, so the app is now browsed via
    // `localhost` (see Player's YouTube mount for its own localhost-only
    // trick) — but the Spotify app's redirect URI is registered as
    // `127.0.0.1`. Normalize back down to that so Connect keeps working
    // without having to re-register anything in the Spotify dashboard.
    //
    // Pinned to `/`, not `location.pathname`: a registered OAuth redirect
    // URI has to be a single static value, but the app now also serves
    // `/entry/{id}` deep links (see the URL-routing section near the bottom
    // of this file) — building this from whatever page happens to be open
    // would send Spotify a different redirect_uri per entry and break
    // Connect everywhere except whichever one URI got registered.
    const REDIRECT_URI = (location.origin + "/").replace("localhost", "127.0.0.1");
    const panelEl = document.getElementById("spotify-panel");

    let player = null;
    let playerReady = null;
    let deviceId = null;
    let lastError = "";
    let stateListener = null;

    function b64url(buffer) {
      return btoa(String.fromCharCode(...new Uint8Array(buffer)))
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");
    }

    function randomToken(len) {
      const bytes = new Uint8Array(len);
      crypto.getRandomValues(bytes);
      return b64url(bytes.buffer).slice(0, len);
    }

    async function challengeFor(verifier) {
      const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier));
      return b64url(digest);
    }

    function getClientId() {
      return localStorage.getItem("spotify_client_id") || "";
    }

    function getTokens() {
      try {
        return JSON.parse(localStorage.getItem("spotify_tokens") || "null");
      } catch {
        return null;
      }
    }

    function setTokens(t) {
      localStorage.setItem("spotify_tokens", JSON.stringify(t));
    }

    function clearTokens() {
      localStorage.removeItem("spotify_tokens");
    }

    function isConnected() {
      return !!getTokens();
    }

    // The other half of handleRedirect()'s 127.0.0.1 → localhost bounce:
    // tokens can't cross that origin boundary via localStorage, so they ride
    // in the URL fragment instead. Runs synchronously at module init, before
    // the caller's first render(), so "Connected" is correct on first paint.
    (function pickUpCarriedTokens() {
      const prefix = "#spotify_tokens=";
      if (!location.hash.startsWith(prefix)) return;
      try {
        setTokens(JSON.parse(decodeURIComponent(location.hash.slice(prefix.length))));
      } catch {
        // Malformed fragment — nothing to recover, just drop it below.
      }
      history.replaceState({}, "", location.pathname + location.search);
    })();

    // The other other half: connect() stores its PKCE verifier/state under
    // whatever origin it runs on, but the callback is forced to land on
    // 127.0.0.1 (REDIRECT_URI is pinned there — see above) since that's
    // where the Spotify app's redirect URI is registered. If connect() ran
    // on localhost, the callback would look for a verifier that only exists
    // in localhost's localStorage and never find it — a silent "state
    // mismatch" with no visible error, since handleRedirect()'s own bounce
    // then wipes the in-memory error message too. So: hop to 127.0.0.1
    // *before* generating the verifier, carrying the client id along (it's
    // not secret — Spotify's own /authorize URL exposes it anyway), and
    // resume the real connect() once actually there.
    (function resumeConnectIfRequested() {
      const clientId = new URLSearchParams(location.search).get("spotify_connect");
      if (!clientId) return;
      localStorage.setItem("spotify_client_id", clientId);
      history.replaceState({}, "", location.pathname);
      connect();
    })();

    function startConnect() {
      if (location.hostname === "127.0.0.1") {
        connect();
        return;
      }
      const port = location.port ? ":" + location.port : "";
      const cid = encodeURIComponent(getClientId());
      location.href =
        location.protocol + "//127.0.0.1" + port + location.pathname + "?spotify_connect=" + cid;
    }

    async function exchangeToken(body) {
      const res = await fetch("https://accounts.spotify.com/api/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body,
      });
      if (!res.ok) return null;
      const json = await res.json();
      return {
        access_token: json.access_token,
        refresh_token: json.refresh_token || getTokens()?.refresh_token,
        expires_at: Date.now() + json.expires_in * 1000,
      };
    }

    async function getValidAccessToken() {
      let tokens = getTokens();
      if (!tokens) return null;
      if (tokens.expires_at - Date.now() > 60000) return tokens.access_token;
      const clientId = getClientId();
      const refreshed = await exchangeToken(
        new URLSearchParams({ client_id: clientId, grant_type: "refresh_token", refresh_token: tokens.refresh_token })
      );
      if (!refreshed) {
        clearTokens();
        return null;
      }
      setTokens(refreshed);
      return refreshed.access_token;
    }

    async function connect() {
      const clientId = getClientId();
      if (!clientId) return;
      const verifier = randomToken(64);
      const state = randomToken(16);
      localStorage.setItem("spotify_pkce_verifier", verifier);
      localStorage.setItem("spotify_pkce_state", state);
      const challenge = await challengeFor(verifier);
      const params = new URLSearchParams({
        client_id: clientId,
        response_type: "code",
        redirect_uri: REDIRECT_URI,
        scope: SCOPES,
        code_challenge_method: "S256",
        code_challenge: challenge,
        state,
      });
      location.href = `https://accounts.spotify.com/authorize?${params}`;
    }

    function disconnect() {
      clearTokens();
      player?.disconnect();
      player = null;
      playerReady = null;
      deviceId = null;
      render();
    }

    async function handleRedirect() {
      const url = new URL(location.href);
      const code = url.searchParams.get("code");
      const state = url.searchParams.get("state");
      const error = url.searchParams.get("error");
      if (!code && !error) return;
      url.searchParams.delete("code");
      url.searchParams.delete("state");
      url.searchParams.delete("error");
      history.replaceState({}, "", url.pathname + url.search + url.hash);

      const expectedState = localStorage.getItem("spotify_pkce_state");
      const verifier = localStorage.getItem("spotify_pkce_verifier");
      localStorage.removeItem("spotify_pkce_state");
      localStorage.removeItem("spotify_pkce_verifier");

      if (error) {
        lastError = `Spotify declined: ${error}`;
      } else if (!verifier || state !== expectedState) {
        lastError = "Spotify connection failed (state mismatch). Try again.";
      } else {
        const tokens = await exchangeToken(
          new URLSearchParams({
            client_id: getClientId(),
            grant_type: "authorization_code",
            code,
            redirect_uri: REDIRECT_URI,
            code_verifier: verifier,
          })
        );
        if (tokens) {
          setTokens(tokens);
        } else {
          lastError = "Spotify connection failed while exchanging the code.";
        }
      }

      // The callback had to land on 127.0.0.1 (REDIRECT_URI is pinned to
      // it), but the rest of the app wants localhost — bounce now that the
      // token exchange is done. localStorage doesn't cross that origin
      // boundary, so whatever we just stored has to ride along in the URL
      // fragment for the localhost side to pick up (see the top of this
      // module) — otherwise the tokens exist but "Connected" never shows.
      if (location.hostname === "127.0.0.1") {
        const port = location.port ? ":" + location.port : "";
        const tokens = getTokens();
        const carry = tokens ? "#spotify_tokens=" + encodeURIComponent(JSON.stringify(tokens)) : "";
        location.replace(location.protocol + "//localhost" + port + location.pathname + location.search + carry);
        return;
      }
      render();
    }

    function loadSdk() {
      if (window.Spotify) return Promise.resolve(window.Spotify);
      return new Promise((resolve) => {
        window.onSpotifyWebPlaybackSDKReady = () => resolve(window.Spotify);
        const script = document.createElement("script");
        script.src = "https://sdk.scdn.co/spotify-player.js";
        document.head.appendChild(script);
      });
    }

    function ensurePlayer() {
      if (playerReady) return playerReady;
      playerReady = (async () => {
        const SpotifySdk = await loadSdk();
        const p = new SpotifySdk.Player({
          name: "Library",
          getOAuthToken: async (cb) => cb(await getValidAccessToken()),
          volume: 0.8,
        });
        p.addListener("ready", ({ device_id }) => {
          deviceId = device_id;
        });
        p.addListener("not_ready", () => {
          deviceId = null;
        });
        p.addListener("initialization_error", ({ message }) => {
          lastError = message;
          render();
        });
        p.addListener("authentication_error", ({ message }) => {
          lastError = message;
          clearTokens();
          render();
        });
        p.addListener("account_error", () => {
          lastError = "Spotify Premium is required for in-app playback.";
          render();
        });
        p.addListener("player_state_changed", (state) => stateListener?.(state));
        await p.connect();
        player = p;
        return p;
      })();
      return playerReady;
    }

    async function waitForDevice(timeoutMs) {
      const start = Date.now();
      while (!deviceId && Date.now() - start < timeoutMs) {
        await new Promise((r) => setTimeout(r, 150));
      }
      return deviceId;
    }

    /// Play `spotifyId` (a bare track id) on this app's Spotify Connect
    /// device, creating the device (and prompting the SDK's own connection
    /// handshake) on first use. Returns once playback has been requested —
    /// UI state (playing/paused) comes from `player_state_changed` events.
    /// `positionMs` resumes mid-track (a transfer from another device).
    async function play(spotifyId, positionMs = 0) {
      await ensurePlayer();
      const device = await waitForDevice(8000);
      if (!device) throw new Error("Spotify player didn't come online in time.");
      const token = await getValidAccessToken();
      const res = await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${device}`, {
        method: "PUT",
        headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({ uris: [`spotify:track:${spotifyId}`], position_ms: Math.round(positionMs) }),
      });
      if (!res.ok && res.status !== 204) {
        throw new Error(`Spotify refused to play (${res.status}).`);
      }
    }

    /// Replaces the single active `player_state_changed` callback (the SDK
    /// listener itself is registered once, in `ensurePlayer`) — callers
    /// switching between tracks just call this again rather than stacking
    /// listeners.
    function setStateListener(cb) {
      stateListener = cb;
    }

    async function resume() {
      if (player) await player.resume();
    }

    /// Unlike the iframe-based providers, Spotify plays through a Connect
    /// device that keeps streaming even after the dock's visible surface is
    /// torn down or swapped to a different source — it has to be told to
    /// stop explicitly.
    async function pause() {
      if (player) await player.pause();
    }

    /// Raw SDK state (position/duration in ms, paused, current track id) —
    /// polled from Player's progress ticker since, unlike YouTube's IFrame
    /// API, the SDK only pushes `player_state_changed` on play/pause/seek/
    /// track-change, not continuously.
    async function getCurrentState() {
      return player ? player.getCurrentState() : null;
    }

    async function seek(positionMs) {
      if (player) await player.seek(positionMs);
    }

    /// `volume` is 0..1 — the SDK's own scale — unlike the bar's 0..100 UI
    /// slider or YouTube's IFrame API, which each use their own range.
    async function setVolume(volume) {
      if (player) await player.setVolume(volume);
    }

    /// Looks up the track's album art for the player bar thumbnail — the
    /// SDK's `player_state_changed` payload does carry `album.images`, but
    /// only once playback has actually started, which is too late for the
    /// bar to show art right away. A direct `/v1/tracks` lookup gets it
    /// as soon as mounting starts. Returns null on any failure (not
    /// connected, track not found, network error); callers fall back to
    /// the existing icon placeholder.
    async function getTrackArt(spotifyId) {
      try {
        const token = await getValidAccessToken();
        const res = await fetch(`https://api.spotify.com/v1/tracks/${spotifyId}`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        if (!res.ok) return null;
        const json = await res.json();
        const images = json.album?.images || [];
        // Spotify returns images largest-first (typically 640/300/64) —
        // the middle size is the closest analogue to YouTube's mqdefault.
        return images[1]?.url || images[0]?.url || null;
      } catch {
        return null;
      }
    }

    let editingClientId = false;

    function renderClientIdForm(cancelable) {
      const existing = getClientId();
      panelEl.appendChild(
        el("p", {
          className: "hint",
          text: existing
            ? "Update the Client ID, or cancel to keep the current one."
            : "Paste a Spotify app's Client ID to enable in-app playback.",
        })
      );
      const input = el("input", { type: "text", placeholder: "Client ID", value: existing });
      const buttons = [
        el("button", {
          className: "ghost-btn",
          type: "button",
          text: "Save",
          onclick: () => {
            const id = input.value.trim();
            if (!id) return;
            localStorage.setItem("spotify_client_id", id);
            editingClientId = false;
            render();
          },
        }),
      ];
      if (cancelable) {
        buttons.push(
          el("button", {
            className: "ghost-btn",
            type: "button",
            text: "Cancel",
            onclick: () => {
              editingClientId = false;
              render();
            },
          })
        );
      }
      panelEl.appendChild(el("div", { className: "rail-foot-row" }, [input, ...buttons]));
      panelEl.appendChild(
        el("div", { className: "redirect-box" }, [
          el("code", { text: REDIRECT_URI }),
          el("button", {
            className: "ghost-btn",
            type: "button",
            text: "Copy",
            onclick: () => navigator.clipboard?.writeText(REDIRECT_URI),
          }),
        ])
      );
      panelEl.appendChild(
        el("p", {
          className: "hint",
          style: "margin-top: 8px;",
          text: "Add that as a Redirect URI on developer.spotify.com/dashboard, then paste the app's Client ID above.",
        })
      );
    }

    function render() {
      panelEl.innerHTML = "";
      const dot = el("span", { className: "dot" + (isConnected() ? " on" : "") });
      const label = el("span", { text: isConnected() ? "Spotify connected" : "Spotify" });
      panelEl.appendChild(el("p", { className: "rail-foot-label" }, [dot, label]));

      if (isConnected()) {
        panelEl.appendChild(
          el("button", { className: "ghost-btn", type: "button", onclick: disconnect, text: "Disconnect" })
        );
      } else if (getClientId() && !editingClientId) {
        panelEl.appendChild(
          el("div", { className: "rail-foot-row" }, [
            el("button", { className: "ghost-btn", type: "button", onclick: startConnect, text: "Connect" }),
            el("button", {
              className: "ghost-btn",
              type: "button",
              text: "Edit",
              onclick: () => {
                editingClientId = true;
                render();
              },
            }),
          ])
        );
      } else {
        renderClientIdForm(!!getClientId());
      }

      if (lastError) {
        panelEl.appendChild(el("p", { className: "rail-foot-error", text: lastError }));
      }
    }

    return {
      render,
      handleRedirect,
      isConnected,
      play,
      resume,
      pause,
      setStateListener,
      getCurrentState,
      seek,
      setVolume,
      getTrackArt,
    };
  })();

  const SPOTIFY_TRACK_PREFIX = "https://open.spotify.com/track/";

  // ---------- remote: this tab as one device of the server's single
  // playback session ----------
  //
  // Like Spotify Connect: the queue, what's playing, position and volume
  // live on the server (playback.rs, docs/plan-single-user-player.md), not
  // here. Every open tab is a *device* subscribed to the session's SSE
  // feed; at most one is *active* and actually mounts the embed, and every
  // other one is a remote control showing the same state. Controls are
  // commands to the server (`command`), and the active device reports what
  // its embed really did (`report`).
  const Remote = (() => {
    const DEVICE_KEY = "playback_device_id";
    // Taken out of sessionStorage on load and put back on `pagehide`: a
    // reload keeps its id (and so picks the session back up, see
    // `PlaybackHub::connect`), while a duplicated tab, which copies
    // sessionStorage, finds nothing there and mints its own.
    let deviceId = null;
    try {
      deviceId = sessionStorage.getItem(DEVICE_KEY);
      sessionStorage.removeItem(DEVICE_KEY);
    } catch {}
    if (!deviceId) {
      // `crypto.randomUUID` needs a secure context, which a phone hitting
      // the server by LAN IP isn't; `getRandomValues` works everywhere.
      deviceId = Array.from(crypto.getRandomValues(new Uint8Array(8)), (b) => b.toString(16).padStart(2, "0")).join("");
    }
    window.addEventListener("pagehide", () => {
      try {
        sessionStorage.setItem(DEVICE_KEY, deviceId);
      } catch {}
    });

    function deviceName() {
      const ua = navigator.userAgent;
      const browser = /Edg\//.test(ua)
        ? "Edge"
        : /Firefox\//.test(ua)
          ? "Firefox"
          : /Chrome\//.test(ua)
            ? "Chrome"
            : /Safari\//.test(ua)
              ? "Safari"
              : "Browser";
      const os = /Android/.test(ua)
        ? "Android"
        : /iPhone|iPad/.test(ua)
          ? "iOS"
          : /Mac OS X/.test(ua)
            ? "macOS"
            : /Windows/.test(ua)
              ? "Windows"
              : /Linux/.test(ua)
                ? "Linux"
                : "";
      return os ? `${browser} on ${os}` : browser;
    }

    const listeners = [];
    let snapshot = null;

    function connect() {
      // encodeURIComponent, not URLSearchParams: the latter writes spaces
      // as `+`, which the server's `parse_query` (plain percent-decoding)
      // keeps literally. EventSource reconnects on its own (the server
      // sends `retry: 2000`), re-registering this device each time.
      const source = new EventSource(
        `/api/playback/events?device_id=${encodeURIComponent(deviceId)}&name=${encodeURIComponent(deviceName())}`
      );
      source.onmessage = (e) => {
        let snap;
        try {
          snap = JSON.parse(e.data);
        } catch {
          return;
        }
        snapshot = snap;
        for (const fn of listeners) fn(snap);
      };
    }

    function command(cmd) {
      return postJson("/api/playback/command", { device_id: deviceId, ...cmd });
    }

    function report(fields) {
      return fetch("/api/playback/report", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device_id: deviceId, ...fields }),
      }).catch(() => {});
    }

    return {
      deviceId,
      connect,
      command,
      report,
      subscribe: (fn) => listeners.push(fn),
      get snapshot() {
        return snapshot;
      },
    };
  })();

  // ---------- play log: each track start reported to the server ----------
  //
  // One play per track the active device starts (`Player`'s `mountEngine`), reported to
  // `/api/plays` (see `plays.rs`) with how much was actually heard: a
  // position advance that keeps pace with the wall clock counts, a seek or
  // a pause doesn't. Measuring against the wall clock rather than a fixed
  // step keeps background tabs counted, whose timers the browser throttles
  // to a tick a minute. Reports go out every REPORT_EVERY_S of new
  // listening, when the track changes, and by beacon when the page closes.
  // A play under MIN_COUNTED_S is a skip: logged, not noted for the shuffle
  // cooldown. The server owns the log; the NRS extension reads it there.
  const PlayLog = (() => {
    const MIN_COUNTED_S = 10;
    const REPORT_EVERY_S = 30;
    let cur = null;
    const listeners = new Set();

    function report(play, useBeacon) {
      if (!play || play.playId == null || play.listened <= play.reported) return;
      const listened = Math.round(play.listened * 10) / 10;
      const body = JSON.stringify({ listened_seconds: listened });
      const url = `/api/plays/${play.playId}`;
      const previous = play.reported;
      play.reported = play.listened;
      if (useBeacon && navigator.sendBeacon) {
        navigator.sendBeacon(url, new Blob([body], { type: "application/json" }));
        return;
      }
      fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body })
        .then((res) => {
          if (!res.ok) throw new Error(res.statusText);
        })
        .catch(() => {
          play.reported = previous;
        });
    }

    function start(entryId) {
      finish();
      const play = { entryId, playId: null, listened: 0, reported: 0, lastPos: null, lastAt: 0, counted: false };
      cur = play;
      postJson("/api/plays", { entry_id: entryId })
        .then((res) => {
          play.playId = res.play_id;
          // Heard before the id arrived, or already replaced: report now.
          if (play !== cur || play.listened - play.reported >= REPORT_EVERY_S) report(play);
        })
        .catch(() => {});
    }

    /// Fed every progress poll of whichever provider is mounted.
    function progress(position) {
      const play = cur;
      if (!play || !Number.isFinite(position)) return;
      const now = performance.now() / 1000;
      if (play.lastPos != null) {
        const step = position - play.lastPos;
        const wall = now - play.lastAt;
        if (step > 0 && step <= wall * 1.5 + 1) play.listened += step;
      }
      play.lastPos = position;
      play.lastAt = now;
      if (!play.counted && play.listened >= MIN_COUNTED_S) {
        play.counted = true;
        ShuffleMix.notePlayed(play.entryId);
      }
      if (play.listened - play.reported >= REPORT_EVERY_S) report(play);
      for (const fn of listeners) fn(play);
    }

    /// A different source of the same track was mounted: its position
    /// starts over, which isn't a step.
    function sourceChanged() {
      if (cur) cur.lastPos = null;
    }

    function finish() {
      if (cur) report(cur);
      cur = null;
    }

    window.addEventListener("pagehide", () => report(cur, true));

    return {
      start,
      progress,
      sourceChanged,
      finish,
      current: () => cur,
      onProgress: (fn) => listeners.add(fn),
    };
  })();

  // ---------- now-playing drawer: score, NRS relations, library fixes ----------
  //
  // Follows the session's current track (`track`, called on every snapshot).
  // Score and Relations talk to the server's NRS extension (`/api/nrs/*`,
  // see `nrs_bridge.rs`); they're hidden when the server was built without
  // it or the NRS app isn't reachable, and nothing else in the player waits
  // on them. Library edits musiclib's own edition data and always works.
  // What a play scores is the server's call
  // (`EditionProjection::rank_target`): an instrumental or a TV-size cut
  // scores its original, a cover is its own entry.
  const NowPlaying = (() => {
    const drawerEl = document.getElementById("np-drawer");
    const tabsEl = document.getElementById("np-tabs");
    const bodyEl = document.getElementById("np-body");
    const closeBtn = document.getElementById("np-close");
    const barBtn = document.getElementById("player-bar-np");
    closeBtn.innerHTML = svgIcon("x", 13);
    barBtn.innerHTML = svgIcon("star", 16);
    const badgeEl = el("span", { className: "bar-btn-badge", hidden: true });
    barBtn.appendChild(badgeEl);
    const BAR_TITLE = barBtn.title;
    const BAR_LABEL = barBtn.getAttribute("aria-label");

    const TABS = [
      ["score", "Score"],
      ["relations", "Relations"],
      ["library", "Library"],
    ];
    const NRS_TABS = new Set(["score", "relations"]);
    const TAB_KEY = "now_playing_tab";
    const RESPONSES = [
      ["", "None"],
      ["nei", "NEI"],
      ["aei", "AEI"],
      ["cry", "Cry"],
    ];
    // `version_tokens` markers the Library tab can set. The first group
    // folds into the original (`DEGENERATE_MARKERS` server-side).
    const TRANSFORMATIONS = [
      ["Scores its original", [["instrumental", "Instrumental"], ["short_ver", "Short version"], ["tv_size", "TV size"], ["game_ver", "Game version"]]],
      ["Its own work", [["cover", "Cover"], ["remix", "Remix"], ["arrangement", "Arrangement"], ["live", "Live"], ["acoustic", "Acoustic"], ["", "Other version"]]],
    ];

    let tab = "score";
    try {
      tab = localStorage.getItem(TAB_KEY) || "score";
    } catch {}
    let entryId = null;
    let releaseId = null;
    // `/api/nrs/status`: null until asked, `{ available: false, absent }`
    // when the server has no NRS extension.
    let nrs = null;
    // `/api/nrs/now/{entryId}` for the playing track, once loaded.
    let now = null;
    // That request while in flight, shared by the drawer and the bar badge
    // so a track change asks NRS once.
    let nowRequest = null;
    let palette = null;
    let token = 0;
    // The Score tab's unsaved inputs, so a re-render doesn't lose them.
    let draft = null;
    // The Score tab's music slider and save action, for the shortcuts.
    let musicInput = null;
    let saveScore = null;

    const isOpen = () => !drawerEl.hidden;
    const nrsOn = () => !!(nrs && nrs.available);
    // The tab to show: the chosen one, unless it needs NRS and NRS is out.
    const shownTab = () => (NRS_TABS.has(tab) && !nrsOn() ? "library" : tab);
    const fmtMin = (s) => (s < 60 ? `${Math.round(s)} s` : `${Math.round(s / 60)} min`);

    function status(text, isError) {
      return el("p", { className: "np-status" + (isError ? " is-error" : ""), text });
    }

    function section(label, children) {
      return el("div", { className: "np-section" }, [el("p", { className: "np-section-label", text: label }), ...children]);
    }

    function slider(label, value, onInput) {
      const out = el("output", { text: `${value}%` });
      const input = el("input", { type: "range", min: "0", max: "100", step: "1", value: String(value), "aria-label": label });
      input.addEventListener("input", () => {
        out.textContent = `${input.value}%`;
        onInput(Number(input.value));
      });
      return { row: el("div", { className: "mix-row" }, [el("span", { className: "mix-label", text: label }), input, out]), input, out };
    }

    function seg(options, current, onPick) {
      const wrap = el("div", { className: "mix-seg" });
      for (const [value, label] of options) {
        wrap.appendChild(
          el("button", {
            type: "button",
            text: label,
            "aria-pressed": value === current,
            onclick: () => onPick(value),
          })
        );
      }
      return wrap;
    }

    /// A button running `run` (async; its result is the status text), with
    /// the status shown next to it.
    function actionButton(text, run) {
      const statusEl = status("");
      const btn = el("button", { className: "ghost-btn", type: "button", text });
      const go = async () => {
        if (btn.getAttribute("aria-busy") === "true") return;
        btn.setAttribute("aria-busy", "true");
        statusEl.className = "np-status";
        statusEl.textContent = "Saving…";
        try {
          statusEl.textContent = (await run()) || "Saved.";
        } catch (e) {
          statusEl.className = "np-status is-error";
          statusEl.textContent = e.message;
        } finally {
          btn.removeAttribute("aria-busy");
        }
      };
      btn.onclick = go;
      return { btn, statusEl, run: go };
    }

    async function nrsStatus() {
      try {
        const res = await fetch("/api/nrs/status");
        nrs = res.status === 404 ? { available: false, absent: true } : await res.json();
      } catch (e) {
        nrs = { available: false, error: e.message };
      }
      return nrs;
    }

    function renderTabs() {
      tabsEl.innerHTML = "";
      const shown = shownTab();
      for (const [id, label] of TABS) {
        tabsEl.appendChild(
          el("button", {
            type: "button",
            role: "tab",
            text: label,
            hidden: NRS_TABS.has(id) && !nrsOn(),
            "aria-pressed": id === shown,
            onclick: () => setTab(id),
          })
        );
      }
    }

    function setTab(id) {
      tab = id;
      try {
        localStorage.setItem(TAB_KEY, id);
      } catch {}
      renderTabs();
      load();
    }

    function toggle(force) {
      const open = force ?? !isOpen();
      drawerEl.hidden = !open;
      barBtn.setAttribute("aria-pressed", String(open));
      if (!open) return;
      // Asked on every open, so starting NRS later brings its tabs back.
      renderTabs();
      bodyEl.replaceChildren(status("Loading…"));
      nrsStatus().then(() => {
        renderTabs();
        load();
      });
    }

    function track(id, release) {
      if (id === entryId && release === releaseId) return;
      entryId = id;
      releaseId = release;
      draft = null;
      forget();
      if (isOpen()) load();
    }

    /// Loads `now` for the playing track, joining a request already made.
    function fetchNow() {
      if (!nowRequest) {
        const q = releaseId != null ? `?release=${releaseId}` : "";
        const req = api(`/api/nrs/now/${entryId}${q}`).then(
          (data) => {
            if (nowRequest === req) {
              now = data;
              renderBadge();
            }
            return data;
          },
          (e) => {
            if (nowRequest === req) nowRequest = null;
            throw e;
          }
        );
        nowRequest = req;
      }
      return nowRequest;
    }

    /// Drops `now` (the track changed, or a write changed its NRS entry)
    /// and asks again, so the badge stays current with the drawer closed.
    function forget() {
      now = null;
      nowRequest = null;
      renderBadge();
      if (entryId != null && !nrs?.absent) fetchNow().catch(() => {});
    }

    /// The star's dot: filled when the playing track is unranked in NRS
    /// (not in it, or nothing scored), a ring when its entry still fails
    /// NRS checks. Nothing while NRS is out or `now` is loading.
    function renderBadge() {
      const entry = now?.nrs?.available ? now.nrs.entry : undefined;
      let state = null;
      let note = null;
      if (entry === null) {
        state = "unranked";
        note = "Not in NRS yet";
      } else if (entry?.score && !Number(entry.score.value)) {
        state = "unranked";
        note = "Not scored in NRS yet";
      } else if (entry?.issues?.length) {
        state = "incomplete";
        note = `Incomplete in NRS: ${entry.issues.map((i) => i.message).join(", ")}`;
      }
      badgeEl.hidden = !state;
      if (state) badgeEl.dataset.state = state;
      barBtn.title = note ? `${note} — score and fix it (n)` : BAR_TITLE;
      barBtn.setAttribute("aria-label", note ? `${BAR_LABEL}. ${note}` : BAR_LABEL);
    }

    async function load() {
      const my = ++token;
      const stale = () => my !== token || !isOpen();
      if (entryId == null) {
        bodyEl.replaceChildren(status("Nothing playing."));
        return;
      }
      const view = shownTab();
      if (!now || view === "library") bodyEl.replaceChildren(status("Loading…"));
      try {
        if (view === "library") {
          const entry = await api(`/api/entries/${entryId}`);
          if (!stale()) bodyEl.replaceChildren(...renderLibrary(entry));
          return;
        }
        if (!now) {
          await fetchNow();
          if (my !== token) return;
        }
        if (stale()) return;
        if (!now.nrs.available) {
          // NRS went away since the status check: fall back to Library.
          nrs = { available: false, error: now.nrs.error };
          now = null;
          nowRequest = null;
          renderTabs();
          load();
          return;
        }
        if (view === "score") {
          bodyEl.replaceChildren(...renderScore(now));
        } else {
          const nodes = await renderRelations(now, stale);
          if (!stale()) bodyEl.replaceChildren(...nodes);
        }
      } catch (e) {
        if (!stale()) bodyEl.replaceChildren(status(e.message, true));
      }
    }

    /// Reload after a write: the score, rank and bindings may all change.
    function refresh() {
      draft = null;
      forget();
      load();
    }

    // ---- Score ----

    function impactOf(entry, kind) {
      const all = (entry?.impacts || []).filter((i) => i.kind === kind);
      return all.find((i) => !i.shared) || all[0] || null;
    }

    function numParam(impact, key, fallback) {
      const v = Number(impact?.params?.[key]);
      return Number.isFinite(v) ? v : fallback;
    }

    function scoreLine(entry) {
      const s = entry?.score;
      if (!s || s.value == null) return "Not scored yet";
      const parts = [`V ${Number(s.value).toFixed(2)}`];
      if (s.rank != null) parts.push(`#${s.rank} of ${s.total}`);
      if (s.kind_rank != null) parts.push(`#${s.kind_rank} of ${s.kind_total} ${s.kind}s`);
      return parts.join(" · ");
    }

    function newDraft(data) {
      const entry = data.nrs.entry;
      const music = impactOf(entry, "music");
      const visual = impactOf(entry, "visual");
      return {
        music: Math.round(numParam(music, "music_base", 0.5) * 100),
        musicSet: !!music,
        musicDirty: false,
        response: "",
        factor: 50,
        sign: "1",
        anchors: [
          { id: "", weight: 1 },
          { id: "", weight: 1 },
        ],
        visualBase: Math.round(numParam(visual, "base", 0.5) * 100),
        visualUnique: Math.round(numParam(visual, "unique", 0.5) * 100),
        visualDirty: false,
        albums: {},
      };
    }

    function renderScore(data) {
      if (!draft) draft = newDraft(data);
      const d = draft;
      const target = data.target;
      const entry = data.nrs.entry;
      const nodes = [el("p", { className: "np-title", text: target.title || "(untitled)" })];
      if (target.folded) {
        const playing = data.playing.title || "another edition";
        const how = (target.transformation || "").replaceAll("_", " ");
