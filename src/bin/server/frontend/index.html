      surfaceEl.innerHTML = "";
      ytPlayer = null;
      surfaceEl.className = "player-dock-surface " + (isSpotify ? "compact" : "video");
      if (isSpotify) {
        provider = "spotify";
        const spotifyId = source.identifier.slice(SPOTIFY_TRACK_PREFIX.length);
        const token = mountToken;
        mountSpotify(spotifyId, currentTitle, token);
        updateBarMeta(currentTitle, "Spotify", null);
        Spotify.getTrackArt(spotifyId).then((art) => {
          // Mounting may have moved on to a different source while this
          // lookup was in flight — don't let a stale response clobber the
          // bar's current thumbnail.
          if (art && token === mountToken) updateBarMeta(currentTitle, "Spotify", art);
        });
        startSpotifyProgressPolling(mountToken);
        volumeControllable = true;
      } else if (source.provider === "youtube") {
        provider = "youtube";
        const videoId = source.embed_url.split("/").pop();
        mountYoutube(videoId, source.identifier);
        updateBarMeta(currentTitle, "YouTube", `https://i.ytimg.com/vi/${videoId}/mqdefault.jpg`);
        startYoutubeProgressPolling();
        volumeControllable = true;
      } else {
        provider = "other";
        surfaceEl.appendChild(
          el("iframe", { src: source.embed_url, allow: "autoplay; encrypted-media", allowFullscreen: true })
        );
        updateBarMeta(currentTitle, source.provider, null);
        setPlayPauseUI(true, false);
        stopProgressPolling();
        showProgress(false);
        // No programmatic control over a bare embed's own volume — the
        // widget has whatever built-in controls it ships with, if any.
        volumeControllable = false;
      }
      // The player dial is per-provider — refresh it to whichever value is
      // stored for the provider just mounted.
      setVolumeUI();
    }

    function renderSwitcher(sources) {
      switchEl.innerHTML = "";
      if (sources.length <= 1) return;
      sources.forEach((s, i) => {
        const btn = el("button", {
          type: "button",
          text: s.provider,
          "aria-pressed": i === 0,
          onclick: () => {
            mountSource(s);
            for (const b of switchEl.querySelectorAll("button")) b.setAttribute("aria-pressed", "false");
            btn.setAttribute("aria-pressed", "true");
          },
        });
        switchEl.appendChild(btn);
      });
    }

    function mount(entryId, sources, title, opts) {
      const firstPlay = !currentEntryId;
      currentEntryId = entryId;
      currentTitle = title;
      onEndedCallback = (opts && opts.onEnded) || null;
      barEl.hidden = false;
      document.body.classList.add("has-player");
      renderSwitcher(sources);
      mountSource(sources[0]);
      setExpanded(firstPlay ? true : expanded);
    }

    function togglePlay() {
      if (provider === "youtube" && ytPlayer) {
        if (ytPlayer.getPlayerState() === 1) ytPlayer.pauseVideo();
        else ytPlayer.playVideo();
      } else if (provider === "spotify") {
        Spotify.togglePlay();
      }
    }

    function setTransportHandlers(prevFn, nextFn, prevEnabled, nextEnabled) {
      onPrevHandler = prevFn;
      onNextHandler = nextFn;
      prevBtn.disabled = !prevEnabled;
      nextBtn.disabled = !nextEnabled;
    }

    /// Bound once by the app-level queue wiring (unlike setTransportHandlers,
    /// these don't change per-track) — shuffle/repeat toggle the queue's
    /// mode without touching what's currently mounted, and jump/remove act
    /// on the "up next" list rendered into the dock by renderDockQueue.
    function setQueueHandlers(shuffleFn, repeatFn, jumpFn, removeFn) {
      onShuffleHandler = shuffleFn;
      onRepeatHandler = repeatFn;
      onQueueJumpHandler = jumpFn;
      onQueueRemoveHandler = removeFn;
    }

    // Renders either "up next" (default, floating dock) or the full queue
    // with the current track marked (stage mode, Player mode's big screen)
    // — same panel, reused rather than duplicated, because it's already
    // exactly the queue-shaped state this dock owns. Pulled straight from
    // `Queue` rather than taking a param: the list to show depends only on
    // `stageMode`, and every caller that changes queue shape already goes
    // through `setQueueUI`/`setStageMode` right after mutating `Queue`.
    function renderDockQueue() {
      dockQueueEl.innerHTML = "";
      if (!currentEntryId) {
        dockQueueEl.hidden = true;
        return;
      }
      dockQueueEl.hidden = false;
      const items = stageMode ? Queue.all() : Queue.upcoming();
      dockQueueEl.appendChild(el("p", { className: "player-dock-queue-label", text: stageMode ? "Queue" : "Up next" }));
      if (!items.length) {
        dockQueueEl.appendChild(el("p", { className: "player-dock-queue-empty", text: "Nothing queued." }));
        return;
      }
      for (const item of items) {
        const isCurrent = !!item.isCurrent;
        const removeBtn = el("button", {
          type: "button",
          className: "player-dock-queue-remove",
          "aria-label": "Remove from queue",
          disabled: isCurrent,
          onclick: isCurrent ? null : () => onQueueRemoveHandler?.(item.orderIndex),
        });
        removeBtn.innerHTML = svgIcon("x", 12);
        dockQueueEl.appendChild(
          el("div", { className: "player-dock-queue-row" + (isCurrent ? " is-current" : "") }, [
            el("button", {
              type: "button",
              className: "player-dock-queue-jump",
              text: item.title || "(untitled)",
              onclick: () => onQueueJumpHandler?.(item.orderIndex),
            }),
            removeBtn,
          ])
        );
      }
    }

    /// Refreshes everything queue-shaped in the UI: the shuffle/repeat
    /// button states and the dock's queue panel. Called by the app-level
    /// queue module every time it changes shape (toggle, skip, add, remove).
    function setQueueUI(shuffled, repeatMode) {
      shuffleBtn.setAttribute("aria-pressed", String(shuffled));
      const repeatActive = repeatMode !== "off";
      repeatBtn.setAttribute("aria-pressed", String(repeatActive));
      repeatBtn.innerHTML = svgIcon(repeatMode === "one" ? "repeat-1" : "repeat", 13);
      repeatBtn.setAttribute(
        "aria-label",
        repeatMode === "off" ? "Repeat off" : repeatMode === "all" ? "Repeat all" : "Repeat one"
      );
      renderDockQueue();
    }

    function isPlayingEntry(entryId) {
      return currentEntryId === entryId;
    }

    prevBtn.addEventListener("click", () => onPrevHandler?.());
    nextBtn.addEventListener("click", () => onNextHandler?.());
    playPauseBtn.addEventListener("click", togglePlay);
    shuffleBtn.addEventListener("click", () => onShuffleHandler?.());
    repeatBtn.addEventListener("click", () => onRepeatHandler?.());
    expandBtn.addEventListener("click", () => setExpanded(!expanded));
    artBtn.addEventListener("click", () => setExpanded(!expanded));
    titleBtn.addEventListener("click", () => {
      if (currentEntryId) viewEntry(currentEntryId);
    });

    return {
      mount,
      togglePlay,
      isPlayingEntry,
      setTransportHandlers,
      setQueueHandlers,
      setQueueUI,
      setStageMode,
      syncStagePosition,
      hasTrack,
    };
  })();

  // ---------- queue: play order, shuffle and repeat, independent of what's
  // on screen ----------
  //
  // `items` is the queue in the order it was built (a tracklist's disc/track
  // order, or a single standalone track); `order` is the permutation of
  // indices into `items` that playback actually walks — identity when
  // shuffle is off, reshuffled with the current track pinned first when
  // it's on. `pos` indexes into `order`, not `items`, so "what's next" is
  // always `order[pos + 1]` regardless of shuffle. Keeping the natural order
  // separate means switching shuffle off restores it exactly instead of
  // compounding reshuffles.
  const Queue = (() => {
    let items = [];
    let order = [];
    let pos = -1;
    let shuffled = false;
    let repeatMode = "off"; // "off" | "all" | "one"

    function identityOrder() {
      return items.map((_, i) => i);
    }

    // Fisher-Yates over everything except `anchorIdx`, which is pinned
    // first — used both for "shuffle just turned on" (anchor = currently
    // playing item) and "queue just (re)started" (anchor = the requested
    // start item).
    function shuffleFrom(anchorIdx) {
      const rest = items.map((_, i) => i).filter((i) => i !== anchorIdx);
      for (let i = rest.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [rest[i], rest[j]] = [rest[j], rest[i]];
      }
      return [anchorIdx, ...rest];
    }

    function set(newItems, startIndex) {
      items = newItems;
      const anchor = items[startIndex] ? startIndex : 0;
      order = shuffled ? shuffleFrom(anchor) : identityOrder();
      pos = order.indexOf(anchor);
    }

    function current() {
      return pos >= 0 && pos < order.length ? items[order[pos]] : null;
    }

    function hasPrev() {
      if (!order.length) return false;
      return pos > 0 || repeatMode === "all";
    }

    function hasNext() {
      if (!order.length) return false;
      return pos < order.length - 1 || repeatMode === "all";
    }

    function moveTo(newPos) {
      if (newPos < 0) {
        if (repeatMode !== "all") return null;
        newPos = order.length - 1;
      } else if (newPos >= order.length) {
        if (repeatMode !== "all") return null;
        newPos = 0;
      }
      pos = newPos;
      return current();
    }

    function prev() {
      return moveTo(pos - 1);
    }

    function next() {
      return moveTo(pos + 1);
    }

    // Called on natural end-of-track (not a manual skip): repeat-one
    // replays the same item in place rather than advancing, matching how
    // Spotify treats repeat-one — manual skips still move on regardless.
    function advanceOnEnded() {
      return repeatMode === "one" ? current() : next();
    }

    function jumpTo(orderIndex) {
      if (orderIndex < 0 || orderIndex >= order.length) return null;
      pos = orderIndex;
      return current();
    }

    function removeAt(orderIndex) {
      if (orderIndex === pos || orderIndex < 0 || orderIndex >= order.length) return false;
      order.splice(orderIndex, 1);
      if (orderIndex < pos) pos--;
      return true;
    }

    function toggleShuffle() {
      shuffled = !shuffled;
      const anchor = current();
      if (!anchor) {
        order = shuffled ? order : identityOrder();
        return;
      }
      const anchorIdx = order[pos];
      order = shuffled ? shuffleFrom(anchorIdx) : identityOrder();
      pos = order.indexOf(anchorIdx);
    }

    function cycleRepeat() {
      repeatMode = repeatMode === "off" ? "all" : repeatMode === "all" ? "one" : "off";
      return repeatMode;
    }

    // Everything after `pos` in play order, each tagged with its absolute
    // position in `order` so the dock's queue panel can jump/remove by it.
    function upcoming() {
      return order.slice(pos + 1).map((itemIdx, i) => ({ ...items[itemIdx], orderIndex: pos + 1 + i }));
    }

    // The whole play order — past, current, and upcoming — for Player
    // mode's full queue panel (see `Player.setStageMode`/`renderDockQueue`).
    // Same `orderIndex` tagging as `upcoming()`, plus `isCurrent` so the
    // renderer can mark and lock the playing row.
    function all() {
      return order.map((itemIdx, i) => ({ ...items[itemIdx], orderIndex: i, isCurrent: i === pos }));
    }

    // Append new items to the end of the queue without resetting position.
    function append(newItems) {
      if (!newItems.length) return;
      const startIdx = items.length;
      items = items.concat(newItems);
      const newIndices = newItems.map((_, i) => startIdx + i);
      if (shuffled) {
        order = order.concat(newIndices);
      } else {
        order = identityOrder();
      }
    }

    return {
      set,
      current,
      hasPrev,
      hasNext,
      prev,
      next,
      advanceOnEnded,
      jumpTo,
      removeAt,
      toggleShuffle,
      cycleRepeat,
      upcoming,
      all,
      append,
      get shuffled() {
        return shuffled;
      },
      get repeatMode() {
        return repeatMode;
      },
    };
  })();

  function refreshPlayIndicators() {
    const cta = document.getElementById("play-cta");
    if (cta) {
      const playing = Player.isPlayingEntry(Number(cta.dataset.entryId));
      cta.classList.toggle("is-playing", playing);
      cta.querySelector(".play-cta-icon").innerHTML = svgIcon(playing ? "pause" : "play", 13);
      cta.querySelector(".play-cta-label").textContent = playing ? "Playing" : "Play";
    }
    for (const row of document.querySelectorAll(".manifest-row[data-entry-id]")) {
      const playing = Player.isPlayingEntry(Number(row.dataset.entryId));
      row.classList.toggle("is-playing", playing);
      const icon = row.querySelector(".manifest-play-icon");
      if (icon) icon.innerHTML = svgIcon(playing ? "pause" : "play", 12);
      const playBtn = row.querySelector(".manifest-play");
      if (playBtn) playBtn.setAttribute("aria-label", playing ? "Pause" : "Play");
    }
  }

  // Pushes the queue's current shape (transport enabled state, shuffle/
  // repeat button state, queue panel) into Player. Called after every Queue
  // mutation that doesn't already remount a track.
  function syncTransport() {
    Player.setTransportHandlers(
      () => {
        if (Queue.prev()) playCurrent();
      },
      () => {
        if (Queue.next()) playCurrent();
      },
      Queue.hasPrev(),
      Queue.hasNext()
    );
    Player.setQueueUI(Queue.shuffled, Queue.repeatMode);
  }

  // Player mode's empty state ("nothing playing") vs. its stage/queue
  // wrapper — kept in sync here (called after every mount, and once on
  // entering the mode) rather than only when the mode switch happens, so
  // starting playback from Library/the rail while Player mode is already
  // open updates it live.
  function refreshPlayerStageVisibility() {
    const has = Player.hasTrack();
    playerStageWrapEl.hidden = !has;
    playerStageEmptyEl.hidden = has;
    // Unhiding the wrap just now is what gives `#player-stage-mount` its
    // real on-page size/position — re-sync the overlay against it.
    Player.syncStagePosition();
  }

  Player.setQueueHandlers(
    () => {
      Queue.toggleShuffle();
      syncTransport();
    },
    () => {
      Queue.cycleRepeat();
      syncTransport();
    },
    (orderIndex) => {
      if (Queue.jumpTo(orderIndex)) playCurrent();
    },
    (orderIndex) => {
      Queue.removeAt(orderIndex);
      syncTransport();
    }
  );

  function mountQueueItem(entryId, title, sources) {
    Player.mount(entryId, sources, title, {
      onEnded: () => {
        if (Queue.advanceOnEnded()) {
          playCurrent();
        } else {
          autoRecommend();
        }
      },
    });
    syncTransport();
    refreshPlayIndicators();
    refreshPlayerStageVisibility();
  }

  async function playCurrent() {
    const item = Queue.current();
    if (!item) return;
    let sources = [];
    try {
      sources = (await api(`/api/entries/${item.entry_id}/playable-sources`)).sources;
    } catch {
      // fall through with an empty source list — nothing to play, but we
      // shouldn't leave the queue pointing at a stale mount either.
    }
    if (!sources.length) return;
    mountQueueItem(item.entry_id, item.title, sources);
  }

  function startQueue(items, index) {
    Queue.set(items, index);
    playCurrent();
  }

  function playStandalone(entryId, title, sources) {
    Queue.set([{ entry_id: entryId, title }], 0);
    mountQueueItem(entryId, title, sources);
  }

  /// "Shuffle all" in the rail header — there's no playlist concept yet, so
  /// this is the closest equivalent to Spotify's Liked-Songs shuffle: pull a
  /// random, already-playable batch from across the whole library (server
  /// picks and filters it — see `player.rs`'s `shuffle_library`) and queue
  /// it up. Turns the player's own shuffle mode on too so skipping around
  /// afterwards stays random rather than walking this batch in order.
  async function shuffleLibrary() {
    setStatus("Shuffling your library…");
    let tracks = [];
    try {
      tracks = (await api("/api/library/shuffle?limit=100")).tracks;
    } catch (err) {
      setStatus(`Couldn't shuffle the library: ${err.message}`);
      return;
    }
    if (!tracks.length) {
      setStatus("No playable tracks found to shuffle.");
      return;
    }
    setStatus("");
    Queue.set(tracks, 0);
    if (!Queue.shuffled) Queue.toggleShuffle();
    playCurrent();
  }

  // Auto-recommend: when the queue runs out naturally (repeat-off, last
  // track finished), pull a fresh random batch from the library and continue
  // playing instead of stopping. Failures are silent — the queue just ends.
  async function autoRecommend() {
    try {
      const { tracks } = await api("/api/library/shuffle?limit=20");
      if (!tracks.length) return;
      Queue.append(tracks);
      playCurrent();
    } catch {
      // library entirely unplayable — nothing to recommend
    }
  }

  async function api(path) {
    const res = await fetch(path);
    if (!res.ok) {
      let message = res.statusText;
      try {
        message = (await res.json()).message || message;
      } catch {}
      throw new Error(message || `request failed (${res.status})`);
    }
    return res.json();
  }

  async function postJson(path, payload) {
    const res = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      let message = res.statusText;
      try {
        message = (await res.json()).message || message;
      } catch {}
      throw new Error(message || `request failed (${res.status})`);
    }
    return res.json();
  }

  function setStatus(text) {
    railStatus.hidden = !text;
    railStatus.textContent = text || "";
  }

  function catalogNo(id) {
    return "No. " + String(id).padStart(6, "0");
  }

  function friendlyDate(raw) {
    if (!raw) return null;
    return raw.split(" ")[0];
  }

  function friendlyType(t) {
    return (t || "unknown").replace(/_/g, " ");
  }

  // ---------- search ----------

  shuffleLibraryBtn.addEventListener("click", shuffleLibrary);

  let debounceHandle;
  searchEl.addEventListener("input", () => {
    clearTimeout(debounceHandle);
    debounceHandle = setTimeout(runSearch, 200);
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement !== searchEl) {
      e.preventDefault();
      searchEl.focus();
      searchEl.select();
    }
  });

  resultsEl.addEventListener("keydown", (e) => {
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    const rows = Array.from(resultsEl.querySelectorAll(".result"));
    const i = rows.indexOf(document.activeElement);
    if (i === -1) return;
    e.preventDefault();
    const next = e.key === "ArrowDown" ? rows[i + 1] : rows[i - 1];
    if (next) next.focus();
  });

  // A link/unlink edit can change which entries a live query matches (a
  // newly-hidden duplicate, a newly-restored one) — re-run the visible
  // search so the results list doesn't go stale next to a graph that just
  // updated.
  function refreshSearchIfActive() {
    if (searchEl.value.trim()) runSearch();
  }

  async function runSearch() {
    const q = searchEl.value.trim();
    const token = ++searchToken;
    resultsEl.innerHTML = "";
    if (!q) {
      setStatus("");
      return;
    }
    setStatus("Searching…");
    let data;
    try {
      data = await api(`/api/library/search?q=${encodeURIComponent(q)}`);
    } catch (err) {
      if (token !== searchToken) return;
      setStatus(`Couldn't search: ${err.message}`);
      return;
    }
    if (token !== searchToken) return;

    if (!data.results.length) {
      setStatus(`No matches for "${q}".`);
      return;
    }
    setStatus("");
    const groups = new Map();
    for (const r of data.results) {
      const key = r.entry_type || "unknown";
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(r);
    }
    const orderedKeys = [
      ...TYPE_ORDER.filter((k) => groups.has(k)),
      ...[...groups.keys()].filter((k) => !TYPE_ORDER.includes(k)),
    ];
    for (const key of orderedKeys) {
      resultsEl.appendChild(
        el("li", { className: "result-group-label", role: "presentation" }, [
          el("span", { text: TYPE_LABEL[key] || friendlyType(key) }),
        ])
      );
      for (const r of groups.get(key)) {
        resultsEl.appendChild(
          el(
            "li",
            {
              // Draggable so a graph view open elsewhere can pick this
              // entry up and drop it in as a node (see graph drop handler).
              draggable: "true",
              ondragstart: (e) => {
                e.dataTransfer.setData("text/plain", String(r.entry_id));
                e.dataTransfer.effectAllowed = "copy";
              },
            },
            [
              el(
                "button",
                {
                  className: "result",
                  role: "option",
                  type: "button",
                  "data-entry-id": String(r.entry_id),
                  "aria-selected":
                    String(r.entry_id) === String(currentMode === "graph" ? graphActiveId : activeId),
                  // In Graph mode, a result re-anchors the open graph in
                  // place instead of navigating away to Library mode — the
                  // graph stays the thing on screen, just pointed at a
                  // different entry.
                  onclick: () => (currentMode === "graph" ? viewGraph(r.entry_id) : viewEntry(r.entry_id)),
                },
                [el("span", { className: "result-title", text: r.title || "(untitled)" })]
              ),
            ]
          )
        );
      }
    }
  }

  // ---------- entry detail (browsing only — never touches Player) ----------

  function stamp(source, identifier, isPlatform) {
    const href = identifier && identifier.startsWith("http") ? identifier : null;
    const dot = el("span", { className: "dot" });
    dot.style.background = isPlatform && PLATFORM_COLOR[source] ? PLATFORM_COLOR[source] : "var(--verdigris)";
    const label = el("span", { text: source });
    if (href) {
      return el("a", { className: "stamp", href, target: "_blank", rel: "noopener noreferrer" }, [dot, label]);
    }
    return el("span", { className: "stamp" }, [dot, label]);
  }

  // ---------- relations graph (dedup calibration + structure browsing) ----------
  //
  // A soft-identity component is a graph, not a hierarchy — entries link in
  // transitively (A same_identity B, B variant C), so a flattened "list of
  // other members" can't show which specific pair an edge connects, or tell
  // a manual link apart from an automatic one. Rendering the actual graph
  // and editing it directly (click a node pair to link, click an edge to
  // unlink) is both more honest and the only UI that can't silently no-op
  // on the wrong pair. Every edit goes through the server's
  // `record_identity_feedback` — reversible, and logged as real calibration
  // data (`dedup_feedback`), not a UI-only toggle.
  //
  // Structural (`entry_child`) edges ride along in the same graph as
  // read-only context — they're importer-owned facts, not something this UI
  // offers feedback on, so they're rendered distinctly (directed, dashed)
  // and never enter the click-to-link/unlink flow below.

  // A plain string hash (FNV-1a), used in place of Math.random() to seed
  // node starting positions — the same entry_id always hashes to the same
  // spot, so reloading the same graph settles into the same arrangement
  // instead of a fresh random one every time. `salt` gets two independent
  // values (x and y) out of one id without needing a second hash function.
  function hashUnit(id, salt) {
    let h = 0x811c9dc5;
    const s = salt + id;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return (h >>> 0) / 4294967296;
  }

  // d3-force's own internals (forceCollide in particular) call into a
  // random source to jiggle nodes that end up exactly — or, at floating
  // point precision, near enough — coincident, which a graph dense enough
  // to have several hundred nodes settling in a small area hits often
  // enough to matter: that randomness was still leaking into the
  // "deterministic" fixed-tick-count settle (see its call site), degrading
  // right back into "different layout every reload" for large graphs
  // despite the tick count itself being fixed. d3-force has a first-class,
  // documented hook for exactly this — `simulation.randomSource(fn)` swaps
  // in a seeded PRNG (mulberry32) that every force pulls from instead of
  // `Math.random` directly (used at the simulation's creation, below,
  // rather than monkeypatching the global `Math.random` — which wouldn't
  // even reliably work if d3's own module scope cached a reference to it
  // before this code ever runs).
  function mulberry32(seed) {
    return function () {
      seed |= 0;
      seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // The RELATE-tier version-kind taxonomy (`docs/CONFIG_REFERENCE.md`'s
  // `relate(kind, conf, reason)`) — "related but not the same entry",
  // separate from the same_identity/different_identity/variant trio that
  // drives the soft-identity graph itself. Mirrors the server's own
  // `RELATE_KINDS` allowlist (`src/bin/server/player.rs`) so the picker
  // below only ever offers a kind the server will accept.
  const RELATE_KINDS = [
    "alt_version",
    "live",
    "remix",
    "instrumental",
    "cover",
    "medley",
    "release_variant",
    "in_release_group",
    "same_artist",
  ];
  const RELATE_KIND_SET = new Set(RELATE_KINDS);

  // "active" mirrors the live component (same_identity/variant, enabled).
  // "suggested" is a plain-unlinked edge: disabled, but the row survives —
  // shown dashed, one click restores it. "blocked" is a force-unlinked
  // (different_identity) edge — shown distinctly, one click softens it back
  // to neutral rather than trivially restoring it. "cleared" is a disabled
  // different_identity/relate-kind row with nothing currently asserted —
  // not rendered, it carries no actionable meaning. "related" is a
  // RELATE_KINDS row (cover/remix/same_artist/…) — annotates a connection
  // between two distinct entries, doesn't affect the identity graph at all.
  function dedupEdgeState(edge) {
    if (edge.kind === "different_identity") return edge.enabled ? "blocked" : "cleared";
    if (RELATE_KIND_SET.has(edge.kind)) return edge.enabled ? "related" : "cleared";
    return edge.enabled ? "active" : "suggested";
  }

  const SVG_NS = "http://www.w3.org/2000/svg";
  function svgEl(tag, attrs) {
    const node = document.createElementNS(SVG_NS, tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v !== null && v !== undefined) node.setAttribute(k, v);
    }
    return node;
  }

  // Long titles (often CJK plus emoji, with no clean word-wrap boundary) are
  // truncated rather than wrapped across multiple <tspan> lines — simpler
  // than measuring text metrics to wrap, and the details panel always shows
  // the untruncated title anyway. `Array.from` (not `.slice`) is required
  // here: titles routinely contain emoji outside the BMP, which JS strings
  // store as UTF-16 surrogate pairs — slicing by raw index can cut a pair
  // in half and render as a "�" replacement character.
  function truncateLabel(text, max) {
    if (!text) return text;
    const chars = Array.from(text);
    return chars.length > max ? chars.slice(0, max - 1).join("") + "…" : text;
  }

  // Fixed simulation-space dimensions — the `viewBox` set on the SVG once
  // at creation and never touched again, regardless of how big the
  // `.dedup-graph` container actually renders (window resizes, side panels
  // opening/closing, entry-card vs. fullscreen). The container's CSS
  // `width:100%; height:100%` still scales it to fit visually, but the
  // coordinate space the force simulation itself runs in — node seeding,
  // the centering force, `fitToContent`'s fit math — stays constant, so a
  // resize can't jitter node positions or shift the layout's center out
  // from under an edit/navigation that happened to land mid-resize.
  const GRAPH_CANVAS_WIDTH = 1000;
  const GRAPH_CANVAS_HEIGHT = 640;
  const GRAPH_NODE_RADIUS = 11;
  // Collision radius used to keep labels from overlapping — deliberately
  // much bigger than GRAPH_NODE_RADIUS (the node shape itself), since it's
  // really standing in for "node + its label" and truncateLabel's ~22
  // characters of monospace 10px text run wider than the node alone.
  const GRAPH_LABEL_RADIUS = 46;
  // Screen-space label metrics — must track the `.node-label` CSS rule
  // (10px, monospace) and the `dy` set when a label is created. Since
  // labels are counter-scaled to a fixed screen size (see zoomBehavior's
  // "zoom" handler), these are also fixed screen-pixel values regardless
  // of zoom, not model units. Monospace makes width a cheap, close-enough
  // estimate straight from character count — no per-node getBBox() call
  // (forces a layout reflow) needed just to decide what to hide.
  const LABEL_FONT_SIZE = 10;
  const LABEL_CHAR_WIDTH = LABEL_FONT_SIZE * 0.62;
  const LABEL_LINE_HEIGHT = LABEL_FONT_SIZE * 1.4;
  const LABEL_OFFSET_Y = GRAPH_NODE_RADIUS + 14;
  // Which node kind's label wins when two overlap — the entry you're
  // looking at, then the things you can actually act on (dedup links),
  // then read-only structural context last.
  const GRAPH_LABEL_PRIORITY = { self: 0, member: 1, structural: 2 };

  // The relations graph is built exactly once (see `graphEditor` below) and
  // its DOM/simulation/node-position state is reused across every entry
  // shown thereafter, rather than torn down and recreated per `viewGraph`
  // call as `buildDedupSection` used to be. That's what makes two things
  // possible:
  //
  //   - Navigating to a different entry morphs the graph instead of
  //     replacing it: `load()` re-fetches and re-joins onto the *same*
  //     node/link data (`currentNodesById`/`currentLinks`) that `update()`
  //     already carries positions over from — nodes common to both entries
  //     keep their spot, newly-relevant ones fade in, no-longer-relevant
  //     ones are removed by d3's own join-exit, all in the same simulation.
  //   - A dedup edit (link/unlink/relate/…) can call `refresh()` — re-fetch
  //     plus the same join — without touching anything outside the graph at
  //     all, instead of the old `viewEntry(entryId, {push:false})` full
  //     detail-view rebuild.
  function createGraphEditor() {
    const section = el("div", { className: "merge-section" });
    // Mutable "what entry is this graph currently anchored on" state —
    // `load()` below is the only thing that changes these. Everything in
    // this function that used to read the old per-call `entryId`/
    // `entryType`/`softLinkedIds` parameters reads these instead.
    let currentEntryId = null;
    let currentEntryType = null;
    let currentSoftLinkedIds = [];
    const labelEl = el("p", { className: "merge-label", text: "Relations" });
    const hintEl = el("p", {
      className: "merge-picker-hint",
      text:
        "Click one entry, then another, to start a connection — pick its kind before it's created. Click empty space to " +
        "cancel. Shift+click an entry to focus the graph on it. Click a line for its details and actions (unlink, " +
        "force-block, or remove/add a relation kind); hover it for a quick peek. Drag an entry in from the library to " +
        "add it here. Dashed arrows are release/track structure and aren't editable.",
    });
    const graphHost = el("div", { className: "dedup-graph" });
    const detailPanel = el("div", { className: "graph-detail-panel" }, [
      el("p", { className: "graph-detail-empty", text: "Click a node for details." }),
    ]);
    const errorEl = el("p", { className: "merge-picker-error", hidden: true });
    section.appendChild(labelEl);
    section.appendChild(hintEl);
    section.appendChild(graphHost);
    section.appendChild(detailPanel);

    function showError(message) {
      errorEl.hidden = false;
      errorEl.textContent = message;
    }

    function renderDetail(data) {
      detailPanel.innerHTML = "";
      detailPanel.appendChild(
        el("p", { className: "graph-detail-title", text: data.title || catalogNo(data.entry_id) })
      );
      detailPanel.appendChild(el("p", { className: "graph-detail-type", text: friendlyType(data.entry_type) }));
      const sources = data.sources || [];
      if (sources.length) {
        const stamps = el("div", { className: "stamps" });
        for (const s of sources) stamps.appendChild(stamp(s.source, s.identifier, s.source in PLATFORM_COLOR));
        detailPanel.appendChild(stamps);
      } else {
        detailPanel.appendChild(el("p", { className: "graph-detail-empty", text: "No sources." }));
      }
    }

    // ---- SVG skeleton, built once — renderGraph()/update() below only
    // touch the node/edge data joins inside it from here on. ----
    const svg = svgEl("svg", {
      class: "graph-svg",
      viewBox: `0 0 ${GRAPH_CANVAS_WIDTH} ${GRAPH_CANVAS_HEIGHT}`,
    });
    // A single persistent graph editor only ever needs one marker id — no
    // per-entry suffix needed now that this SVG isn't rebuilt per entry.
    const markerId = "graph-arrow-main";
    const defs = svgEl("defs");
    const marker = svgEl("marker", {
      id: markerId,
      viewBox: "0 0 10 10",
      refX: 9,
      refY: 5,
      markerWidth: 6,
      markerHeight: 6,
      orient: "auto-start-reverse",
      class: "graph-arrowhead",
    });
    marker.appendChild(svgEl("path", { d: "M0,0 L10,5 L0,10 Z" }));
    defs.appendChild(marker);
    const viewport = svgEl("g", { class: "viewport" });
    const edgeLayer = svgEl("g", { class: "edges" });
    const nodeLayer = svgEl("g", { class: "nodes" });
    // Labels live in their own layer, stacked above every node — SVG paints
    // in document order, so a label nested inside its own node's <g> (as it
    // used to be) could still end up underneath a *different*, later node's
    // shape wherever the two overlap. Splitting it out means every label
    // paints over every node shape regardless of who's on top of whom
    // otherwise. It's a separate, non-interactive tree: labels already had
    // `pointer-events: none` (see .node-label), so nothing about
    // drag/click/hover handling changes by moving them out of the
    // draggable node <g>.
    const labelLayer = svgEl("g", { class: "labels" });
    // The in-progress "creating a link" line — one node picked, the other
    // end trails the pointer until a second node is clicked (or the
    // gesture is cancelled). Lives in `viewport` (not its own top-level
    // layer) so it shares the same world coordinate space as node
    // positions/zoom-pan; appended last so it always paints over every
    // node/edge it crosses. See `updatePendingLine`.
    const pendingLine = svgEl("line", { class: "pending-link-line" });
    viewport.appendChild(edgeLayer);
    viewport.appendChild(nodeLayer);
    viewport.appendChild(labelLayer);
    viewport.appendChild(pendingLine);
    svg.appendChild(defs);
    svg.appendChild(viewport);
    graphHost.appendChild(svg);
    const hoverLabel = el("div", { className: "graph-hover-label", hidden: true });
    graphHost.appendChild(hoverLabel);

    // Labels stay a fixed screen size/offset regardless of zoom, the same
    // way map labels don't grow with the terrain: each label's own
    // `translate(x,y) scale(1/k)` places it at its node's position (same
    // as the node <g>'s own translate) but then cancels the viewport's
    // `scale(k)` for that element alone, leaving everything else's size —
    // the node shapes, the edges — scaling normally. Recomputed on every
    // zoom/pan since the *cancellation factor* depends on the current k,
    // not on anything about the node; recomputed on every tick since the
    // translate half depends on the node's (possibly still-moving)
    // position.
    let currentZoomK = 1;
    function labelTransform(d) {
      return `translate(${d.x},${d.y}) scale(${1 / currentZoomK})`;
    }
    const zoomBehavior = d3
      .zoom()
      .scaleExtent([0.3, 3])
      .on("zoom", (event) => {
        viewport.setAttribute("transform", event.transform.toString());
        currentZoomK = event.transform.k;
        d3.select(labelLayer).selectAll(".node-label").attr("transform", labelTransform);
        updateLabelVisibility();
      });
    d3.select(svg).call(zoomBehavior);

    // Cytoscape's `cy.fit()` used to re-center/re-scale the camera onto
    // whatever the layout actually produced — seeding node positions inside
    // the container bounds only keeps the *starting* layout framed; once
    // the force simulation's repulsion pushes nodes outward from there,
    // nothing else re-frames the view, so content silently drifts past the
    // visible edges. This is the same idea via d3-zoom's own programmatic
    // transform instead: compute a bounding box over the current node
    // positions and pan/scale to fit it, with a mild zoom-in cap so a
    // single-node graph doesn't fill the container edge-to-edge.
    function fitToContent() {
      if (suppressNextFit) {
        suppressNextFit = false;
        return;
      }
      const nodes = Array.from(currentNodesById.values());
      if (!nodes.length) return;
      const pad = GRAPH_NODE_RADIUS + 20;
      const minX = Math.min(...nodes.map((n) => n.x)) - pad;
      const maxX = Math.max(...nodes.map((n) => n.x)) + pad;
      const minY = Math.min(...nodes.map((n) => n.y)) - pad;
      const maxY = Math.max(...nodes.map((n) => n.y)) + pad;
      const rect = graphHost.getBoundingClientRect();
      const w = Math.max(rect.width, 200);
      const h = Math.max(rect.height, 200);
      const scale = Math.min(1.5, w / Math.max(maxX - minX, 1), h / Math.max(maxY - minY, 1));
      const tx = w / 2 - scale * (minX + maxX) / 2;
      const ty = h / 2 - scale * (minY + maxY) / 2;
      d3.select(svg)
        .transition()
        .duration(300)
        .call(zoomBehavior.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
    }

    function showHoverLabel(d) {
      const t = d3.zoomTransform(svg);
      const [x, y] = t.apply([d.x, d.y]);
      hoverLabel.textContent = d.title || catalogNo(d.entry_id);
      hoverLabel.style.left = `${x}px`;
      hoverLabel.style.top = `${y}px`;
      hoverLabel.hidden = false;
    }
    function hideHoverLabel() {
      hoverLabel.hidden = true;
    }

    // Edges carry real, otherwise-invisible data (kind/origin/confidence
    // for a dedup edge, disc/track position for a structural one) that
    // color/dash-pattern alone only hints at. Surfaced on hover rather than
    // click since click is already spoken for (link/unlink/force-block —
    // see the hint text above the graph), the same split as a node's own
    // hover-for-title vs. click-for-select/link.
    function edgeHoverText(d) {
      if (d.edgeType === "structural") {
        const parts = ["structural"];
        if (d.discNo != null || d.trackNo != null) {
          parts.push(`disc ${d.discNo ?? "?"} · track ${d.trackNo ?? "?"}`);
        }
        return parts.join(" · ");
      }
      const parts = [d.kind, d.origin, d.state];
      if (typeof d.confidence === "number") parts.push(`${Math.round(d.confidence * 100)}% confidence`);
      return parts.filter(Boolean).join(" · ");
    }
    function showEdgeHoverLabel(event, d) {
      const [x, y] = d3.pointer(event, graphHost);
      hoverLabel.textContent = edgeHoverText(d);
      hoverLabel.style.left = `${x}px`;
      hoverLabel.style.top = `${y}px`;
      hoverLabel.hidden = false;
    }

    let selected = null;
    // True while the "pick a kind" panel from a completed node-pair click
    // is showing (see `showCreateLinkPicker`) — distinct from `selected`,
    // which is already back to null by then (the *node*-picking half of the
    // gesture is done; only the kind choice is still pending). Tracked so a
    // background click or a third node click knows there's still an
    // in-progress gesture to cancel/replace even though `selected` alone
    // wouldn't show it.
    let pickerOpen = false;
    // Last known pointer position, in the same world coordinate space as
    // node `x`/`y` (see `updatePendingLine`) — updated on every `mousemove`
    // over the graph, read from both that handler and `ticked()` so the
    // dangling line keeps tracking the pointer even while only the
    // selected node itself is drifting (simulation still settling) and
    // vice versa.
    let pendingMouseX = 0;
    let pendingMouseY = 0;
    // The current node/link datum objects, keyed by id — the single source
    // of truth for both the simulation and the DOM. Kept across renderGraph
    // calls (rather than rebuilt from scratch) so a re-fetch after a click
    // or edit carries over each existing node's live position/velocity/pin
    // instead of visibly resetting it.
    let currentNodesById = new Map();
    let currentLinks = [];
    // The simulation's "end" event also fires after a drag's reheat cools
    // back down — fitting the camera to content at that point would yank
    // the view out from under a rearrangement the user just made by hand.
    // Only a genuine data change (fresh load, a dropped-in node) should
    // trigger a re-fit; dragStarted sets this so the next settle is skipped.
    let suppressNextFit = false;
    // True for the ~300ms window right after `update()` plays the
    // old-position -> new-position morph transition (see `update()`'s end)
    // — `ticked()` skips repositioning while this is set, since the physics
    // has *already* fully settled by then (the fixed-tick-count settle
    // below runs synchronously before any of this) and the live timer's
    // first post-restart tick would otherwise snap every node straight to
    // its final spot, canceling the transition out from under it.
    let morphing = false;
    // Bumped every time `update()` starts a new morph — its `.end()`
    // handler only clears `morphing` if it's still the most recent one, so
    // a morph interrupted by a rapid second re-anchor (its transitions
    // literally cancelled by the new ones landing on the same elements)
    // doesn't clear the flag out from under the newer morph that's still
    // running.
    let morphGeneration = 0;
    // Bumped on every `load()`/`refresh()` call; a fetch that resolves after
    // a newer one started (e.g. a slow relations fetch for an entry the user
    // has since navigated away from) checks this before touching the DOM, so
    // it can't clobber a more recent render with stale data.
    let loadToken = 0;

    // Positions/hides the dangling "creating a link" line every frame it
    // could plausibly need to move: on `mousemove` (pointer moved, node
    // stationary) and from `ticked()` (node still settling, pointer
    // stationary). Reads `selected`'s *live* position from
    // `currentNodesById` rather than the stale datum captured at click time
    // — the node keeps moving under the simulation right after it's picked.
    function updatePendingLine() {
      if (selected === null) {
        pendingLine.classList.remove("visible");
        return;
      }
      const node = currentNodesById.get(String(selected));
      if (!node) return;
      pendingLine.classList.add("visible");
      pendingLine.setAttribute("x1", node.x);
      pendingLine.setAttribute("y1", node.y);
      pendingLine.setAttribute("x2", pendingMouseX);
      pendingLine.setAttribute("y2", pendingMouseY);
    }
    svg.addEventListener("mousemove", (event) => {
      if (selected === null) return;
      [pendingMouseX, pendingMouseY] = d3.pointer(event, viewport);
      updatePendingLine();
    });
    // A click that lands on neither a node nor an edge — i.e. empty canvas
    // (or a pan-drag's synthetic click, which d3-zoom itself suppresses
    // before it ever reaches here) — cancels whichever half of the
    // create-a-link gesture is still in progress. Left alone when nothing
    // is pending so an ordinary background click doesn't also blow away an
    // already-open node detail panel.
    svg.addEventListener("click", (event) => {
      if (selected === null && !pickerOpen) return;
      if (event.target.closest(".node") || event.target.closest(".edge-item")) return;
      resetSelection();
    });

    // `distance`/`strength` vary per dedup edge by `d.confidence` (see
    // `edgeLinkDistance`/`edgeLinkStrength` below) — a manual/high-confidence
    // link pulls its pair in tight, a weak automatic suggestion sits looser.
    // For a hub with many same-kind neighbors this turns the uniform
    // charge/link equilibrium (which otherwise settles into an
    // undifferentiated ring, since every spoke has identical distance and
    // strength) into a radial gradient that actually encodes something,
    // instead of only being visible as a stroke-width difference.
    const linkForce = d3
      .forceLink()
      .id((d) => d.id)
      .distance(edgeLinkDistance)
      .strength(edgeLinkStrength);
    // A gentle pull toward the viewport center replaces the old hack of
    // hard-pinning the anchor node (`fx`/`fy` fixed forever) to keep the
    // graph from drifting off-center: that pin froze one node in place while
    // charge/link forces kept moving everything else around it, which reads
    // as an obviously fake "everything orbits a nailed-down point" layout.
    // A low-strength forceX/forceY has no privileged node — it nudges the
    // whole graph's center of mass back toward the middle without ever
    // fully overriding what charge/link settle on, so the layout still
    // looks like one physical system. Target is recomputed in `update()`
    // (the container can resize) and read fresh on every `simulation.nodes()`
    // re-initialization via the closure.
    let centerX = 0;
    let centerY = 0;
    const simulation = d3
      .forceSimulation()
      .randomSource(mulberry32(0x9e3779b9))
      .force("charge", d3.forceManyBody().strength(-60).distanceMin(15).distanceMax(300))
      .force("link", linkForce)
      .force("x", d3.forceX(() => centerX).strength(0.03))
      .force("y", d3.forceY(() => centerY).strength(0.03))
      // Distance/strength jitter alone spreads edges apart, but nothing
      // stopped two nodes from landing on top of each other regardless —
      // that needs actual collision resolution. `randomSource` above exists
      // specifically to make forceCollide's own internal tie-breaking
      // (nudging exactly-coincident nodes apart) deterministic, so this was
      // always meant to be paired with it. Full strength (the default, 1)
      // snaps overlaps back apart hard enough that dragging one node through
      // a dense cluster reads as everything else jiggling rather than
      // settling — softened strength plus a couple of resolution passes
      // spreads that correction out more smoothly instead of overshooting
      // and correcting every tick.
      .force("collide", d3.forceCollide(GRAPH_LABEL_RADIUS).strength(0.6).iterations(2))
      .velocityDecay(0.75)
      .on("tick", ticked)
      .on("end", fitToContent)
      .stop();
    // Reheating this hot during a drag is what feeds the collide jiggle
    // above: alpha scales every force's per-tick impulse, so a high sustained
    // alphaTarget makes neighbors overreact to the dragged node shoving
    // through their collision radius. Lower keeps the drag visibly live
    // (link tension still follows immediately) without amplifying every
    // nearby collision into a visible shudder.
    const ALPHA_DRAG = 0.2;

    // Shared by `ticked()` and `update()`'s morph transition (see
    // `morphing`) — both need the exact same source/target -> line-endpoint
    // math, just fed live simulation positions vs. a transition's
    // interpolated ones, so it takes plain `{x,y}` points rather than
    // reading `d.source`/`d.target` itself.
    function edgeLineCoords(d, source, target) {
      if (d.edgeType === "structural") {
        // Shorten the line short of the target node's edge so the
        // arrowhead is visible instead of hiding under the node shape.
        const dx = target.x - source.x;
        const dy = target.y - source.y;
        const dist = Math.hypot(dx, dy) || 1;
        const r = GRAPH_NODE_RADIUS + 2;
        return { x1: source.x, y1: source.y, x2: target.x - (dx / dist) * r, y2: target.y - (dy / dist) * r };
      }
      return { x1: source.x, y1: source.y, x2: target.x, y2: target.y };
    }

    function ticked() {
      if (morphing) return;
      d3.select(nodeLayer)
        .selectAll(".node")
        .attr("transform", (d) => `translate(${d.x},${d.y})`);
      d3.select(labelLayer).selectAll(".node-label").attr("transform", labelTransform);
      d3.select(edgeLayer)
        .selectAll(".edge-item")
        .each(function (d) {
          // Both the visible line and its wider invisible hitbox sibling
          // (see the edge join in `update()`) share one path — position
          // both at once rather than picking them apart here.
          const { x1, y1, x2, y2 } = edgeLineCoords(d, d.source, d.target);
          d3.select(this).selectAll("line").attr("x1", x1).attr("y1", y1).attr("x2", x2).attr("y2", y2);
        });
      updateLabelVisibility();
      updatePendingLine();
    }

    // Greedy priority-based label culling — the same idea map apps use:
    // place the highest-priority labels first, then skip any lower-
    // priority one whose screen-space box would overlap an already-placed
    // label, rather than letting them pile into unreadable noise. The node
    // shape itself stays visible either way (only `.node-label` is hidden
    // via CSS), and the hover label (showHoverLabel) is what surfaces a
    // culled title on demand, so nothing actually becomes undiscoverable.
    // Recomputed on every tick and every zoom/pan: node *screen* spacing
    // changes with both (zooming in spreads nodes apart in screen space
    // even though each label's own screen size stays fixed), so what's
    // droppable changes too — zooming in should reveal previously-hidden
    // labels once there's room, exactly like a map.
    function updateLabelVisibility() {
      const t = d3.zoomTransform(svg);
      const boxes = Array.from(currentNodesById.values()).map((n) => {
        const [sx, sy] = t.apply([n.x, n.y]);
        const label = truncateLabel(n.title, 22) || catalogNo(n.entry_id);
        const halfWidth = (label.length * LABEL_CHAR_WIDTH) / 2;
        return {
          id: n.id,
          priority: GRAPH_LABEL_PRIORITY[n.kind] ?? 3,
          left: sx - halfWidth,
          right: sx + halfWidth,
          top: sy + LABEL_OFFSET_Y,
          bottom: sy + LABEL_OFFSET_Y + LABEL_LINE_HEIGHT,
        };
      });
      boxes.sort((a, b) => a.priority - b.priority);
      const placed = [];
      const visible = new Set();
      for (const box of boxes) {
        const overlaps = placed.some(
          (p) => box.left < p.right && box.right > p.left && box.top < p.bottom && box.bottom > p.top
        );
        if (!overlaps) {
          placed.push(box);
          visible.add(box.id);
        }
      }
      d3.select(labelLayer)
        .selectAll(".node-label")
        .classed("label-hidden", (d) => !visible.has(d.id));
    }

    function nodeClass(d) {
      return [
        "node",
        d.kind,
        `type-${d.entry_type || "unknown"}`,
        d.entry_id === selected ? "selected-for-link" : "",
      ]
        .filter(Boolean)
        .join(" ");
    }
    function edgeClass(d) {
      if (d.edgeType === "structural") return "edge structural";
      return [
        "edge",
        "dedup",
        d.state,
        d.state === "active" ? (d.origin === "manual" ? "active-manual" : "active-heuristic") : "",
      ]
        .filter(Boolean)
        .join(" ");
    }

    // Dedup edges carry a real confidence value (manual links are 1.0;
    // automatic RELATE-tier links carry the model's probability) — using it
    // for stroke width means a hub with many same-kind neighbors (identical
    // color/dash pattern otherwise) still reads as "some of these are more
    // certain than others" instead of forty identical spokes. `null` leaves
    // the CSS class's own stroke-width alone (structural edges, or any
    // dedup edge missing a confidence value).
    function edgeStrokeWidth(d) {
      if (d.edgeType !== "dedup" || typeof d.confidence !== "number") return null;
      return `${(1 + d.confidence * 2.5).toFixed(2)}px`;
    }
    // Confidence alone doesn't actually vary in practice — a component's
    // members are overwhelmingly manual/RELATE-confirmed links that all sit
    // at confidence 1.0 — so scaling distance by confidence collapsed to the
    // same constant for every edge and a hub with many members still settled
    // into one perfectly uniform ring (identical distance *and* identical
    // mutual repulsion is exactly the equilibrium that produces a circle).
    // The same is true, worse, for structural (release→track) edges — no
    // confidence field at all, so a release with dozens of tracks is the
    // single most common way to hit this: every child sits at the exact
    // same fixed distance/strength from the same parent, the textbook
    // "spokes settle into a perfect ring" equilibrium.
    //
    // What actually breaks the circle is giving each edge its own
    // distance/strength at all, dedup or structural alike. `hashUnit`
    // (already used to seed node starting positions, see above) gives a
    // per-edge offset that's random-*looking* but stable across reloads —
    // same graph, same jitter, same layout — rather than reintroducing the
    // "different shape every reload" problem the deterministic tick count
    // and seeded random source above exist to avoid.
    function edgeLinkDistance(d) {
      const conf = d.edgeType === "structural" ? 0.7 : typeof d.confidence === "number" ? d.confidence : 0.5;
      const base = 110 - conf * 40; // 82 (structural) / 70 (confident dedup) .. 110 (weak dedup)
      const jitter = (hashUnit(d.id, "link-dist") - 0.5) * 60; // ±30px, stable per edge
      return Math.max(30, base + jitter);
    }
    function edgeLinkStrength(d) {
      const conf = d.edgeType === "structural" ? 0.7 : typeof d.confidence === "number" ? d.confidence : 0.5;
      return 0.35 + conf * 0.25 + hashUnit(d.id, "link-strength") * 0.15;
    }

    // Click vs. drag disambiguation: d3-drag fires start/drag/end for every
    // pointer-down, including a plain click with no movement, and a native
    // `click` listener on the same element would double up with it. Track
    // the *pointer's* total displacement (not the node's) and treat
    // anything under a few pixels as a click — the same "select, then click
    // a target to link" flow as before, just driven by dragend rather than
    // a separate tap event. This has to be the pointer's own movement,
    // specifically not `d.x`/`d.y`: those are also being driven by the
    // simulation independently of the user's input (e.g. residual motion
    // left over from another node's drag-reheat), so comparing the node's
    // position at drag-start vs drag-end could measure the simulation's
    // motion instead of the click and misfire as a drag.
    function dragStarted(event, d) {
      d.__dragStartEventX = event.x;
      d.__dragStartEventY = event.y;
      suppressNextFit = true;
      // Reheating here (on mousedown, before any movement) used to mean a
      // plain press-and-hold with the pointer never moving still kept the
      // whole simulation "hot" for as long as the button stayed down —
      // every neighboring node visibly jiggling even though nothing was
      // actually being dragged anywhere. The reheat now happens in
      // `dragged()` instead, which only fires on real pointer movement, so
      // a stationary hold does nothing and the graph only comes alive once
      // there's an actual drag to respond to.
    }
    function dragged(event, d) {
      // `alphaTarget` alone only *aims* the simulation at that temperature
      // — alpha itself still has to climb there tick by tick (an
      // exponential approach at the default decay rate takes roughly a
      // second to become visible), so a quick drag could release before
      // neighbors ever felt a meaningfully strong pull. Setting `.alpha()`
      // directly jumps the temperature up on the very next tick;
      // `alphaTarget` still sustains it for as long as the drag continues.
      // Cheap to call on every drag event — `restart()` is a no-op if the
      // simulation's timer is already running.
      simulation.alphaTarget(ALPHA_DRAG).alpha(Math.max(simulation.alpha(), ALPHA_DRAG)).restart();
      d.fx = event.x;
      d.fy = event.y;
    }
    function dragEnded(event, d) {
      simulation.alphaTarget(0);
      const moved = Math.hypot(event.x - d.__dragStartEventX, event.y - d.__dragStartEventY);
      if (moved >= 5) return;
      // Shift-click re-anchors the graph on that entry (a real navigation —
      // pushes history, morphs onto its relations, same as clicking it in
      // the rail search while Graph mode is open) rather than the plain
      // click's link-selection, so the two gestures can't be confused for
      // each other on the same node. Only Library mode's `viewEntry` leaves
      // the graph behind entirely; nothing here should do that.
      if (event.sourceEvent?.shiftKey) {
        if (currentMode === "graph") viewGraph(d.entry_id);
        else viewEntry(d.entry_id);
        return;
      }
      renderDetail(d);
      onNodeClick(d.entry_id);
    }
    const dragBehavior = d3.drag().on("start", dragStarted).on("drag", dragged).on("end", dragEnded);

    // Builds/updates the DOM and (re)starts the simulation from `nodes`/
    // `links` — called both for a fresh fetch and for a local drag-in, so
    // it always re-seeds only truly new nodes (anything already in
    // `currentNodesById` keeps its live x/y/velocity/pin, exactly like the
    // old refresh() bridge did).
    function update(nodes, links) {
      const nodeById = new Map(nodes.map((n) => [n.id, n]));
      const rect = graphHost.getBoundingClientRect();
      const w = Math.max(rect.width, 200);
      const h = Math.max(rect.height, 200);
      svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
      const anchorId = String(currentEntryId);
      centerX = w / 2;
      centerY = h / 2;

      // Where each persisting node/label/edge-endpoint is sitting on screen
      // *before* this update's settle moves it — the morph transition below
      // animates from here to the freshly-computed `n.x`/`n.y`, instead of
      // the plain snap `ticked()` would otherwise produce (see `morphing`).
      // Genuinely new nodes have no entry and just appear at their final
      // spot — nothing to morph from.
      const fromPositions = new Map();

      for (const n of nodes) {
        const prev = currentNodesById.get(n.id);
        if (prev) {
          fromPositions.set(n.id, { x: prev.x, y: prev.y });
          n.x = prev.x;
          n.y = prev.y;
          n.vx = prev.vx;
          n.vy = prev.vy;
          // A dragged node's own `fx`/`fy` (set by `dragged()`) is a
          // deliberate, user-placed pin and carries over across refetches —
          // unlike the old auto-pin on the anchor node, this one only ever
          // exists because the user put it there.
          if (prev.fx !== undefined) {
            n.fx = prev.fx;
            n.fy = prev.fy;
          }
        } else if (n.id === anchorId) {
          // Seed (not pin) the anchor at the container's center so the
          // first layout starts from a sensible spot — it's still fully
          // free to move once the simulation runs.
          n.x = centerX;
          n.y = centerY;
        } else {
          n.x = hashUnit(n.id, "x") * w;
          n.y = hashUnit(n.id, "y") * h;
        }
      }

      // `nodeById.get(l.source)` resolves a fresh (string-id) link from a
      // server re-fetch; when `links` is instead the same array reused from
      // the drop handler, `.source`/`.target` are already the live node
      // object references from a previous resolution, so the lookup misses
      // (wrong key type) and the `|| l.source` fallback keeps them as-is —
      // still correct, since the referenced node objects haven't changed.
      for (const l of links) {
        l.source = nodeById.get(l.source) || l.source;
        l.target = nodeById.get(l.target) || l.target;
      }

      currentNodesById = nodeById;
      currentLinks = links;

      // Each join below is given an explicit `exit` (fade out, then
      // detach — `.remove()` chained onto a transition is d3's idiom for
      // "once this finishes", not an immediate removal) instead of the
      // default instant-`.remove()`, and entering elements start at
      // `opacity: 0` rather than their normal opacity. The fade-*in* half
      // happens later, folded into the same transition that morphs
      // position (see `morphing` below) — one transition per element
      // covers both, since a second, separate `.transition()` call on the
      // same element would just cancel the first outright (unnamed
      // transitions replace each other, they don't run concurrently).
      // Each join's return value — enter merged with update, exit excluded
      // — is kept (`nodeJoinSel`/`labelJoinSel`/`edgeJoinSel`) so that
      // later code, including the position-morph, only ever touches
      // elements that are actually staying, never ones already mid-fade-out.
      const nodeJoinSel = d3
        .select(nodeLayer)
        .selectAll(".node")
        .data(nodes, (d) => d.id)
        .join(
          (enter) => {
            const g = enter
              .append("g")
              .attr("class", nodeClass)
              .attr("data-node-id", (d) => d.id)
              .attr("opacity", 0)
              .call(dragBehavior);
            g.append((d) => svgEl(d.kind === "structural" ? "rect" : "circle"));
            g.on("mouseenter", (event, d) => showHoverLabel(d));
            g.on("mouseleave", hideHoverLabel);
            return g;
          },
          (update) => update,
          (exit) => exit.transition().duration(200).attr("opacity", 0).remove()
        )
        .attr("class", nodeClass)
        .each(function (d) {
          const shape = d3.select(this).select("circle, rect");
          if (d.kind === "structural") {
            shape
              .attr("x", -GRAPH_NODE_RADIUS)
              .attr("y", -GRAPH_NODE_RADIUS)
              .attr("width", GRAPH_NODE_RADIUS * 2)
              .attr("height", GRAPH_NODE_RADIUS * 2)
              .attr("rx", 4);
          } else {
            shape.attr("r", GRAPH_NODE_RADIUS);
          }
        });

      // A separate data join (not nested inside the node <g> above) —
      // see labelLayer's own comment for why labels need their own layer.
      const labelJoinSel = d3
        .select(labelLayer)
        .selectAll(".node-label")
        .data(nodes, (d) => d.id)
        .join(
          (enter) =>
            enter
              .append("text")
              .attr("class", "node-label")
              .attr("text-anchor", "middle")
              .attr("dy", LABEL_OFFSET_Y)
              .attr("opacity", 0),
          (update) => update,
          (exit) => exit.transition().duration(200).attr("opacity", 0).remove()
        )
        .attr("transform", labelTransform)
        .text((d) => truncateLabel(d.title, 22) || catalogNo(d.entry_id));

      const edgeJoinSel = d3
        .select(edgeLayer)
        .selectAll(".edge-item")
        .data(links, (d) => d.id)
        .join(
          (enter) => {
            const g = enter.append("g").attr("class", "edge-item").attr("opacity", 0);
            // A structural edge's visible stroke is 1.5px, a dedup edge's
            // 1–4px (see `edgeStrokeWidth`) — far too thin to reliably click
            // or hover. The standard SVG fix: a second, wider, fully
            // transparent line stacked on the exact same path. It alone
            // receives pointer events (`.edge-hit` is `pointer-events:
            // stroke` in CSS; the visible line underneath/above it is
            // `pointer-events: none`), so every edge gets a generous hitbox
            // without changing how anything actually looks. Both lines get
            // identical coordinates every tick — see `ticked()`.
            g.append("line").attr("class", "edge-hit");
            const visible = g.append("line").attr("class", edgeClass);
            visible.filter((d) => d.edgeType === "structural").attr("marker-end", `url(#${markerId})`);
            // Click used to act immediately on a dedup edge (unlink, or
            // force-block on shift-click) — with only two outcomes that was
            // fine, but RELATE_KINDS adds a whole taxonomy of possible
            // connections, and a raw click can't safely disambiguate "unlink"
            // from "remove the cover relation" from "this is actually a
            // same_artist edge, add that too" without either guessing or
            // losing the shift-click gesture entirely. Click now always opens
            // the same detail panel a node's click does, with explicit
            // buttons for whatever's actually possible on that edge's kind —
            // see `showEdgeDetail`. Bound to every edge, structural included
            // (read-only there, but still worth surfacing disc/track position
            // without needing to hover).
            g.on("click", (event, d) => showEdgeDetail(d));
            g.on("mouseenter", showEdgeHoverLabel)
              .on("mousemove", showEdgeHoverLabel)
              .on("mouseleave", hideHoverLabel);
            return g;
          },
          (update) => update,
          (exit) => exit.transition().duration(200).attr("opacity", 0).remove()
        );
      edgeJoinSel.select("line:last-child").attr("class", edgeClass).style("stroke-width", edgeStrokeWidth);

      simulation.nodes(nodes);
      linkForce.links(links);
      simulation.alpha(Math.max(simulation.alpha(), 0.4));
      // The settle runs as a fixed, synchronous number of `.tick()` calls
      // rather than letting the browser's live frame timer animate it —
      // "animate live until alpha decays past alphaMin" sounds equivalent
      // but isn't: the *number of ticks* that actually execute before that
      // point depends on however many animation frames the browser
      // delivered in that stretch of wall-clock time, which varies slightly
      // run to run. For a handful of nodes that never mattered (everything
      // converges to the same equilibrium regardless of a few ticks either
      // way), but for a few hundred mutually-repelling nodes it was enough
      // to tip the whole layout into a genuinely different stable
      // arrangement on reload — not cosmetic jitter, an actually different
      // graph shape (the same class of chaotic sensitivity Cytoscape's cose
      // layout turned out to have, just resurfacing here instead).
      // Ticking a fixed count synchronously has no such dependency: same
      // inputs, same iteration count, same output, always. `.restart()`
      // afterward re-arms the live timer purely so a later drag's reheat
      // still works — alpha is already low enough that nothing visibly
      // animates again until then.
      for (let i = 0; i < 300; i++) simulation.tick();
      simulation.restart();

      // Play the visual move from each persisting element's prior spot
      // (`fromPositions`) to the position the settle above just computed,
      // fading entering ones in (opacity 0 -> 1, set on creation above) at
      // the same time — one transition per element covers both position and
      // opacity together (see the join comment above for why it can't be
      // two separate `.transition()` calls). `ticked()` is suppressed for
      // the duration (`morphing`) so the live timer's next tick event
      // doesn't snap everything straight there first. Elements with no
      // `fromPositions` entry (brand new) just get set directly to their
      // final spot — a same-to-same *position* transition (only opacity
      // actually moves), which is what a new node/edge should do anyway.
      // Exiting elements fade out entirely inside their own join's `exit`
      // callback above and never reach here — `nodeJoinSel`/`labelJoinSel`/
      // `edgeJoinSel` are enter+update only.
      morphing = true;
      const myMorphGeneration = ++morphGeneration;

      nodeJoinSel.each(function (d) {
        const from = fromPositions.get(d.id) || d;
        d3.select(this).attr("transform", `translate(${from.x},${from.y})`);
      });
      const nodeTransition = nodeJoinSel
        .transition()
        .duration(300)
        .ease(d3.easeCubicOut)
        .attr("transform", (d) => `translate(${d.x},${d.y})`)
        .attr("opacity", 1);

      labelJoinSel.each(function (d) {
        const from = fromPositions.get(d.id) || d;
        d3.select(this).attr("transform", labelTransform(from));
      });
      labelJoinSel
        .transition()
        .duration(300)
        .ease(d3.easeCubicOut)
        .attr("transform", labelTransform)
        .attr("opacity", 1);

      edgeJoinSel.each(function (d) {
        const from = edgeLineCoords(d, fromPositions.get(d.source.id) || d.source, fromPositions.get(d.target.id) || d.target);
        d3.select(this).selectAll("line").attr("x1", from.x1).attr("y1", from.y1).attr("x2", from.x2).attr("y2", from.y2);
      });
      // Opacity lives on the `.edge-item` group, position on its `<line>`
      // children — different elements, so these are two independent
      // transitions rather than a conflict.
      edgeJoinSel.transition().duration(300).ease(d3.easeCubicOut).attr("opacity", 1);
      edgeJoinSel
        .selectAll("line")
        .transition()
        .duration(300)
        .ease(d3.easeCubicOut)
        .attr("x1", (d) => edgeLineCoords(d, d.source, d.target).x1)
        .attr("y1", (d) => edgeLineCoords(d, d.source, d.target).y1)
        .attr("x2", (d) => edgeLineCoords(d, d.source, d.target).x2)
        .attr("y2", (d) => edgeLineCoords(d, d.source, d.target).y2);

      // One element's `.end()` stands in for "the morph is done" — every
      // transition above shares the same duration and started together.
      // Rejects if interrupted (e.g. a rapid second re-anchor landing new
      // transitions on the same elements) — that's fine, it just means a
      // newer morph is already driving; only clear `morphing` if this is
      // still the most recent one.
      nodeTransition
        .end()
        .catch(() => {})
        .finally(() => {
          if (myMorphGeneration !== morphGeneration) return;
          morphing = false;
          ticked();
        });
    }

    async function renderGraph() {
      const myToken = ++loadToken;
      let data;
      try {
        data = await api(`/api/entries/${currentEntryId}/relations`);
      } catch (err) {
        if (myToken !== loadToken) return;
        showError(err.message);
        return;
      }
      if (myToken !== loadToken) return;
      const dedupEdges = data.edges;
      const structuralEdges = data.structural_edges || [];
      const memberIds = new Set();
      for (const e of dedupEdges) {
        memberIds.add(e.entry_a);
        memberIds.add(e.entry_b);
      }

      const nodes = data.nodes.map((n) => ({
        id: String(n.entry_id),
        entry_id: n.entry_id,
        title: n.title,
        entry_type: n.entry_type,
        sources: n.sources,
        kind: n.entry_id === currentEntryId ? "self" : memberIds.has(n.entry_id) ? "member" : "structural",
      }));
      const links = [];
      for (const e of dedupEdges) {
        links.push({
          id: `dedup-${e.entry_a}-${e.entry_b}-${e.kind}`,
          source: String(e.entry_a),
          target: String(e.entry_b),
          edgeType: "dedup",
          entry_a: e.entry_a,
          entry_b: e.entry_b,
          kind: e.kind,
          origin: e.origin,
          enabled: e.enabled,
          confidence: e.confidence,
          state: dedupEdgeState(e),
        });
      }
      for (const e of structuralEdges) {
        links.push({
          id: `struct-${e.parent_entry_id}-${e.child_entry_id}`,
          source: String(e.parent_entry_id),
          target: String(e.child_entry_id),
          edgeType: "structural",
          discNo: e.disc_no,
          trackNo: e.track_no,
        });
      }

      update(nodes, links);
    }

    // Every dedup edit (link/unlink/relate/unrelate/force-block/…) lands
    // here — refresh just the graph and the card fields that can actually
    // change as a result (title/date/stamps are a union across soft-linked
    // members, see `refreshAfterEdit`), never the whole detail view.
    function afterEdit(promise) {
      promise
        .then(() => {
          refreshAfterEdit(currentEntryId);
        })
        .catch((err) => showError(err.message));
    }

    // The node-picking half of "create a link": first click arms `selected`
    // (and the dangling `pendingLine`, see `updatePendingLine`); a second,
    // different node hands the pair to `showCreateLinkPicker` to choose
    // *what kind* of connection it should be, rather than assuming
    // same-identity the way a bare click used to. Clicking the same node
    // again cancels. A stray click on a node while the kind picker from a
    // previous pair is still open (`pickerOpen`) abandons that pair first —
    // `resetSelection()` — and starts fresh from the node just clicked,
    // rather than leaving an orphaned picker no longer reachable from any
    // visible selection.
    function onNodeClick(id) {
      if (pickerOpen) resetSelection();
      if (selected === null) {
        selected = id;
        pendingMouseX = currentNodesById.get(String(id))?.x ?? 0;
        pendingMouseY = currentNodesById.get(String(id))?.y ?? 0;
        updatePendingLine();
      } else if (selected === id) {
        selected = null;
        updatePendingLine();
      } else {
        const a = selected;
        selected = null;
        updatePendingLine();
        showCreateLinkPicker(a, id);
      }
      // A pure selection-highlight change needs no re-fetch — the node set
      // is unchanged, only which one carries `.selected-for-link` is.
      d3.select(nodeLayer).selectAll(".node").attr("class", nodeClass);
    }

    // The kind-picking half: both endpoints are already fixed, so this is
    // just "what is this connection" — same identity (the old default
    // behavior) or one of the RELATE_KINDS version-kind annotations, shown
    // in the same detail panel an existing node/edge click would use.
    // Mirrors `relateKindPicker`'s options list but can't reuse it directly:
    // that one always posts to `/api/relations/relate` for an edge that
    // already exists, while this also has to cover the same-identity `link`
    // path for a pair that doesn't have an edge yet.
    function showCreateLinkPicker(a, b) {
      pickerOpen = true;
      const nodeA = currentNodesById.get(String(a));
      const nodeB = currentNodesById.get(String(b));
      detailPanel.innerHTML = "";
      detailPanel.appendChild(el("p", { className: "graph-detail-title", text: "New connection" }));
      detailPanel.appendChild(
        el("p", { className: "graph-detail-type", text: `${endpointLabel(nodeA)} ↔ ${endpointLabel(nodeB)}` })
      );
      const select = el(
        "select",
        { className: "graph-detail-relate-select" },
        [el("option", { value: "same_identity", text: "Same identity (link)" })].concat(
          RELATE_KINDS.map((kind) => el("option", { value: kind, text: friendlyType(kind) }))
        )
      );
      detailPanel.appendChild(select);
      const actions = el("div", { className: "graph-detail-actions" });
      actions.appendChild(
        el("button", {
          className: "ghost-btn",
          type: "button",
          text: "Create",
          onclick: () => {
            const kind = select.value;
            afterEdit(
              kind === "same_identity"
                ? postJson("/api/relations/link", { a, b })
                : postJson("/api/relations/relate", { a, b, kind })
            );
          },
        })
      );
      actions.appendChild(
        el("button", { className: "ghost-btn", type: "button", text: "Cancel", onclick: () => resetSelection() })
      );
      detailPanel.appendChild(actions);
    }

    // Buttons for whatever's actually valid on this edge's kind — a
    // RELATE_KINDS edge only ever offers removal (it's an independent row,
    // not a toggle), while same_identity/different_identity/variant get the
    // same link/unlink/force-block/soften-block moves the old raw click and
    // shift-click used to perform directly.
    function edgeDetailActions(d) {
      const actions = el("div", { className: "graph-detail-actions" });
      const button = (text, onclick) => el("button", { className: "ghost-btn", type: "button", text, onclick });
      if (RELATE_KIND_SET.has(d.kind)) {
        actions.appendChild(
          d.state === "cleared"
            ? button("Restore relation", () =>
                afterEdit(postJson("/api/relations/relate", { a: d.entry_a, b: d.entry_b, kind: d.kind }))
              )
            : button("Remove relation", () =>
                afterEdit(postJson("/api/relations/unrelate", { a: d.entry_a, b: d.entry_b, kind: d.kind }))
              )
        );
        return actions;
      }
      if (d.state !== "active") {
        actions.appendChild(
          button(d.state === "blocked" ? "Link anyway (same identity)" : "Restore link", () =>
            afterEdit(postJson("/api/relations/link", { a: d.entry_a, b: d.entry_b }))
          )
        );
      }
      if (d.state === "active" || d.state === "suggested") {
        actions.appendChild(
          button("Unlink", () =>
            afterEdit(postJson("/api/relations/unlink", { a: d.entry_a, b: d.entry_b, force: false }))
          )
        );
      }
      if (d.state === "blocked") {
        actions.appendChild(
          button("Soften block", () =>
            afterEdit(postJson("/api/relations/unlink", { a: d.entry_a, b: d.entry_b, force: false }))
          )
        );
      } else {
        actions.appendChild(
          button("Force block", () =>
            afterEdit(postJson("/api/relations/unlink", { a: d.entry_a, b: d.entry_b, force: true }))
          )
        );
      }
