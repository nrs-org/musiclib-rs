      // `alphaTarget` alone only *aims* the simulation at that temperature
      // — alpha itself still has to climb there tick by tick (an
      // exponential approach at the default decay rate takes roughly a
      // second to become visible), so a quick drag could release before
      // neighbors ever felt a meaningfully strong pull. Setting `.alpha()`
      // directly jumps the temperature up on the very next tick;
      // `alphaTarget` still sustains it for as long as the drag continues.
      // Cheap to call on every drag event — `restart()` is a no-op if the
      // simulation's timer is already running.
      simulation.alphaTarget(ALPHA_DRAG).alpha(Math.max(simulation.alpha(), ALPHA_DRAG)).restart();
      d.fx = event.x;
      d.fy = event.y;
      d.userPinned = true;
    }
    function dragEnded(event, d) {
      simulation.alphaTarget(0);
      const moved = Math.hypot(event.x - d.__dragStartEventX, event.y - d.__dragStartEventY);
      if (moved >= 5) return;
      // A click that wobbled a pixel or two isn't a placement: back to its
      // spot in the tree.
      if (d.treeX != null && d.userPinned) {
        d.userPinned = false;
        d.fx = centerX + d.treeX;
        d.fy = centerY + d.treeY;
      }
      // Shift-click re-anchors the graph on that entry (a real navigation —
      // pushes history, morphs onto its relations, same as clicking it in
      // the rail search while Graph mode is open) rather than the plain
      // click's link-selection, so the two gestures can't be confused for
      // each other on the same node. Only Library mode's `viewEntry` leaves
      // the graph behind entirely; nothing here should do that.
      if (event.sourceEvent?.shiftKey) {
        if (currentMode === "graph") viewGraph(d.entry_id);
        else viewEntry(d.entry_id);
        return;
      }
      handleNodeClick(event.sourceEvent || {}, d);
    }

    // View mode inspects; Edit mode's Select tool selects (Ctrl+click
    // adds), Connect picks two versions, and a pending "Move under…" takes
    // the clicked node as the parent.
    function handleNodeClick(source, d) {
      errorEl.hidden = true;
      if (pickParent) {
        chooseParent(pickParent, d);
        return;
      }
      if (editing && tool === "connect") {
        onNodeClick(d.entry_id);
        return;
      }
      if (editing && (source.ctrlKey || source.metaKey)) {
        if (selection.has(d.id)) selection.delete(d.id);
        else selection.add(d.id);
      } else {
        selection.clear();
        selection.add(d.id);
      }
      d3.select(nodeLayer).selectAll(".node").attr("class", nodeClass);
      if (selection.size > 1) renderSelection();
      else if (selection.size === 1) renderDetail(currentNodesById.get([...selection][0]));
      else resetSelection();
    }
    const dragBehavior = d3.drag().on("start", dragStarted).on("drag", dragged).on("end", dragEnded);

    // Builds/updates the DOM and (re)starts the simulation from `nodes`/
    // `links` — called both for a fresh fetch and for a local drag-in, so
    // it always re-seeds only truly new nodes (anything already in
    // `currentNodesById` keeps its live x/y/velocity/pin, exactly like the
    // old refresh() bridge did).
    function update(nodes, links) {
      const nodeById = new Map(nodes.map((n) => [n.id, n]));
      const rect = graphHost.getBoundingClientRect();
      const w = Math.max(rect.width, 200);
      const h = Math.max(rect.height, 200);
      svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
      const anchorId = String(currentEntryId);
      centerX = w / 2;
      centerY = h / 2;

      // Where each persisting node/label/edge-endpoint is sitting on screen
      // *before* this update's settle moves it — the morph transition below
      // animates from here to the freshly-computed `n.x`/`n.y`, instead of
      // the plain snap `ticked()` would otherwise produce (see `morphing`).
      // Genuinely new nodes have no entry and just appear at their final
      // spot — nothing to morph from.
      const fromPositions = new Map();

      for (const n of nodes) {
        const prev = currentNodesById.get(n.id);
        if (prev) {
          fromPositions.set(n.id, { x: prev.x, y: prev.y });
          n.x = prev.x;
          n.y = prev.y;
          n.vx = prev.vx;
          n.vy = prev.vy;
          // A dragged node's own `fx`/`fy` (set by `dragged()`) is a
          // deliberate, user-placed pin and carries over across refetches —
          // unlike the old auto-pin on the anchor node, this one only ever
          // exists because the user put it there. Song view's tree pins
          // (below) don't carry over: they're recomputed every time.
          if (prev.userPinned) {
            n.fx = prev.fx;
            n.fy = prev.fy;
            n.userPinned = true;
          }
        } else if (n.id === anchorId) {
          // Seed (not pin) the anchor at the container's center so the
          // first layout starts from a sensible spot — it's still fully
          // free to move once the simulation runs.
          n.x = centerX;
          n.y = centerY;
        } else {
          n.x = hashUnit(n.id, "x") * w;
          n.y = hashUnit(n.id, "y") * h;
        }
        // Song view lays the tree out itself (`layoutSongTree`): pin each
        // node to its spot unless the user placed it.
        if (n.treeX != null && !n.userPinned) {
          n.fx = centerX + n.treeX;
          n.fy = centerY + n.treeY;
          if (!prev) {
            n.x = n.fx;
            n.y = n.fy;
          }
        }
      }

      // `nodeById.get(l.source)` resolves a fresh (string-id) link from a
      // server re-fetch; when `links` is instead the same array reused from
      // the drop handler, `.source`/`.target` are already the live node
      // object references from a previous resolution, so the lookup misses
      // (wrong key type) and the `|| l.source` fallback keeps them as-is —
      // still correct, since the referenced node objects haven't changed.
      for (const l of links) {
        l.source = nodeById.get(l.source) || l.source;
        l.target = nodeById.get(l.target) || l.target;
      }

      currentNodesById = nodeById;
      currentLinks = links;

      // Each join below is given an explicit `exit` (fade out, then
      // detach — `.remove()` chained onto a transition is d3's idiom for
      // "once this finishes", not an immediate removal) instead of the
      // default instant-`.remove()`, and entering elements start at
      // `opacity: 0` rather than their normal opacity. The fade-*in* half
      // happens later, folded into the same transition that morphs
      // position (see `morphing` below) — one transition per element
      // covers both, since a second, separate `.transition()` call on the
      // same element would just cancel the first outright (unnamed
      // transitions replace each other, they don't run concurrently).
      // Each join's return value — enter merged with update, exit excluded
      // — is kept (`nodeJoinSel`/`labelJoinSel`/`edgeJoinSel`) so that
      // later code, including the position-morph, only ever touches
      // elements that are actually staying, never ones already mid-fade-out.
      const nodeJoinSel = d3
        .select(nodeLayer)
        .selectAll(".node")
        .data(nodes, (d) => d.id)
        .join(
          (enter) => {
            const g = enter
              .append("g")
              .attr("class", nodeClass)
              .attr("data-node-id", (d) => d.id)
              .attr("opacity", 0)
              .call(dragBehavior);
            g.append((d) => svgEl(d.kind === "structural" ? "rect" : "circle"));
            g.append(() => svgEl("circle", { class: "edition-badge", cx: 8, cy: -8, r: 4 }));
            g.on("mouseenter", (event, d) => showHoverLabel(d));
            g.on("mouseleave", hideHoverLabel);
            return g;
          },
          (update) => update,
          (exit) => exit.transition().duration(200).attr("opacity", 0).remove()
        )
        .attr("class", nodeClass)
        .each(function (d) {
          const shape = d3.select(this).select("circle, rect");
          if (d.kind === "structural") {
            shape
              .attr("x", -GRAPH_NODE_RADIUS)
              .attr("y", -GRAPH_NODE_RADIUS)
              .attr("width", GRAPH_NODE_RADIUS * 2)
              .attr("height", GRAPH_NODE_RADIUS * 2)
              .attr("rx", 4);
          } else {
            shape.attr("r", GRAPH_NODE_RADIUS);
          }
        });

      // A separate data join (not nested inside the node <g> above) —
      // see labelLayer's own comment for why labels need their own layer.
      const labelJoinSel = d3
        .select(labelLayer)
        .selectAll(".node-label")
        .data(nodes, (d) => d.id)
        .join(
          (enter) =>
            enter
              .append("text")
              .attr("class", "node-label")
              .attr("text-anchor", "middle")
              .attr("dy", LABEL_OFFSET_Y)
              .attr("opacity", 0),
          (update) => update,
          (exit) => exit.transition().duration(200).attr("opacity", 0).remove()
        )
        .attr("transform", labelTransform)
        .classed("detached-label", (d) => Boolean(d.detached))
        .each(function (d) {
          const text = d3.select(this);
          text.selectAll("tspan").remove();
          labelLines(d).forEach((line, i) =>
            text
              .append("tspan")
              // Only later lines set x/dy: the first keeps the text's own
              // offset below the node.
              .attr("x", i ? 0 : null)
              .attr("dy", i ? LABEL_LINE_HEIGHT : null)
              .attr("class", i ? "node-sublabel" : null)
              .text(line)
          );
        });

      const edgeJoinSel = d3
        .select(edgeLayer)
        .selectAll(".edge-item")
        .data(links, (d) => d.id)
        .join(
          (enter) => {
            const g = enter.append("g").attr("class", "edge-item").attr("opacity", 0);
            // A structural edge's visible stroke is 1.5px, a dedup edge's
            // 1–4px (see `edgeStrokeWidth`) — far too thin to reliably click
            // or hover. The standard SVG fix: a second, wider, fully
            // transparent line stacked on the exact same path. It alone
            // receives pointer events (`.edge-hit` is `pointer-events:
            // stroke` in CSS; the visible line underneath/above it is
            // `pointer-events: none`), so every edge gets a generous hitbox
            // without changing how anything actually looks. Both lines get
            // identical coordinates every tick — see `ticked()`.
            g.append("line").attr("class", "edge-hit");
            g.append("line").attr("class", edgeClass);
            g.append("text").attr("class", "edge-label").attr("text-anchor", "middle").attr("dy", -3);
            // Click used to act immediately on a dedup edge (unlink, or
            // force-block on shift-click) — with only two outcomes that was
            // fine, but RELATE_KINDS adds a whole taxonomy of possible
            // connections, and a raw click can't safely disambiguate "unlink"
            // from "remove the cover relation" from "this is actually a
            // same_artist edge, add that too" without either guessing or
            // losing the shift-click gesture entirely. Click now always opens
            // the same detail panel a node's click does, with explicit
            // buttons for whatever's actually possible on that edge's kind —
            // see `showEdgeDetail`. Bound to every edge, structural included
            // (read-only there, but still worth surfacing disc/track position
            // without needing to hover).
            g.on("click", (event, d) => showEdgeDetail(d));
            g.on("mouseenter", showEdgeHoverLabel)
              .on("mousemove", showEdgeHoverLabel)
              .on("mouseleave", hideHoverLabel);
            return g;
          },
          (update) => update,
          (exit) => exit.transition().duration(200).attr("opacity", 0).remove()
        );
      // Set on every update, not just on enter: a refetch can give an
      // existing edge a direction (derive) or take it away (removed).
      edgeJoinSel.select(".edge-label").text((d) => (d.edgeType === "tree" ? d.kindText || "" : ""));
      edgeJoinSel
        .select("line:nth-of-type(2)")
        .attr("class", edgeClass)
        .attr("marker-end", edgeMarker)
        .style("stroke-width", edgeStrokeWidth);
      updateHulls();

      simulation.nodes(nodes);
      linkForce.links(links);
      simulation.alpha(Math.max(simulation.alpha(), 0.4));
      // The settle runs as a fixed, synchronous number of `.tick()` calls
      // rather than letting the browser's live frame timer animate it —
      // "animate live until alpha decays past alphaMin" sounds equivalent
      // but isn't: the *number of ticks* that actually execute before that
      // point depends on however many animation frames the browser
      // delivered in that stretch of wall-clock time, which varies slightly
      // run to run. For a handful of nodes that never mattered (everything
      // converges to the same equilibrium regardless of a few ticks either
      // way), but for a few hundred mutually-repelling nodes it was enough
      // to tip the whole layout into a genuinely different stable
      // arrangement on reload — not cosmetic jitter, an actually different
      // graph shape (the same class of chaotic sensitivity Cytoscape's cose
      // layout turned out to have, just resurfacing here instead).
      // Ticking a fixed count synchronously has no such dependency: same
      // inputs, same iteration count, same output, always. `.restart()`
      // afterward re-arms the live timer purely so a later drag's reheat
      // still works — alpha is already low enough that nothing visibly
      // animates again until then.
      for (let i = 0; i < 300; i++) simulation.tick();
      simulation.restart();

      // Play the visual move from each persisting element's prior spot
      // (`fromPositions`) to the position the settle above just computed,
      // fading entering ones in (opacity 0 -> 1, set on creation above) at
      // the same time — one transition per element covers both position and
      // opacity together (see the join comment above for why it can't be
      // two separate `.transition()` calls). `ticked()` is suppressed for
      // the duration (`morphing`) so the live timer's next tick event
      // doesn't snap everything straight there first. Elements with no
      // `fromPositions` entry (brand new) just get set directly to their
      // final spot — a same-to-same *position* transition (only opacity
      // actually moves), which is what a new node/edge should do anyway.
      // Exiting elements fade out entirely inside their own join's `exit`
      // callback above and never reach here — `nodeJoinSel`/`labelJoinSel`/
      // `edgeJoinSel` are enter+update only.
      morphing = true;
      const myMorphGeneration = ++morphGeneration;

      nodeJoinSel.each(function (d) {
        const from = fromPositions.get(d.id) || d;
        d3.select(this).attr("transform", `translate(${from.x},${from.y})`);
      });
      const nodeTransition = nodeJoinSel
        .transition()
        .duration(300)
        .ease(d3.easeCubicOut)
        .attr("transform", (d) => `translate(${d.x},${d.y})`)
        .attr("opacity", 1);

      labelJoinSel.each(function (d) {
        const from = fromPositions.get(d.id) || d;
        d3.select(this).attr("transform", labelTransform(from));
      });
      labelJoinSel
        .transition()
        .duration(300)
        .ease(d3.easeCubicOut)
        .attr("transform", labelTransform)
        .attr("opacity", 1);

      edgeJoinSel.each(function (d) {
        const from = edgeLineCoords(d, fromPositions.get(d.source.id) || d.source, fromPositions.get(d.target.id) || d.target);
        d3.select(this).selectAll("line").attr("x1", from.x1).attr("y1", from.y1).attr("x2", from.x2).attr("y2", from.y2);
      });
      // Opacity lives on the `.edge-item` group, position on its `<line>`
      // children — different elements, so these are two independent
      // transitions rather than a conflict.
      edgeJoinSel.transition().duration(300).ease(d3.easeCubicOut).attr("opacity", 1);
      edgeJoinSel
        .selectAll("line")
        .transition()
        .duration(300)
        .ease(d3.easeCubicOut)
        .attr("x1", (d) => edgeLineCoords(d, d.source, d.target).x1)
        .attr("y1", (d) => edgeLineCoords(d, d.source, d.target).y1)
        .attr("x2", (d) => edgeLineCoords(d, d.source, d.target).x2)
        .attr("y2", (d) => edgeLineCoords(d, d.source, d.target).y2);

      // One element's `.end()` stands in for "the morph is done" — every
      // transition above shares the same duration and started together.
      // Rejects if interrupted (e.g. a rapid second re-anchor landing new
      // transitions on the same elements) — that's fine, it just means a
      // newer morph is already driving; only clear `morphing` if this is
      // still the most recent one.
      nodeTransition
        .end()
        .catch(() => {})
        .finally(() => {
          if (myMorphGeneration !== morphGeneration) return;
          morphing = false;
          ticked();
        });
    }

    async function renderGraph() {
      const myToken = ++loadToken;
      let data;
      try {
        data = await api(`/api/entries/${currentEntryId}/relations`);
      } catch (err) {
        if (myToken !== loadToken) return;
        showError(err.message);
        return;
      }
      if (myToken !== loadToken) return;
      lastData = data;
      buildGraph(data);
    }

    // Turns a relations response into nodes and links and joins them in.
    // Disabled rows are left out unless `showRemoved` is on or this session
    // edited the pair, and so is everything no longer connected to the
    // anchor without them. An edition row with a known direction runs
    // original → derived (`directed`), the way structural edges run
    // release → track.
    function buildGraph(data) {
      syncToolbar();
      const members = viewMode === "song" ? songMembers(data) : null;
      if (members) {
        buildSongGraph(data, members);
        return;
      }
      buildRawGraph(data);
    }

    const anchorOriginal = () => lastData?.nodes.find((n) => n.entry_id === currentEntryId)?.song_original ?? null;

    // The anchor's song: every track node in its edition group. Null when
    // the anchor isn't a track (song view then shows all relations).
    function songMembers(data) {
      const anchor = data.nodes.find((n) => n.entry_id === currentEntryId);
      if (!anchor || anchor.entry_type !== "track") return null;
      return data.nodes.filter((n) => n.entry_type === "track" && n.edition_group === anchor.edition_group);
    }

    // The fields every node datum carries, from a relations-response node.
    function nodeFields(n) {
      return {
        id: String(n.entry_id),
        entry_id: n.entry_id,
        title: n.title,
        entry_type: n.entry_type,
        sources: n.sources,
        artists: n.artists || [],
        release_date: n.release_date,
        duration_ms: n.duration_ms,
        identity: n.identity,
        identitySize: n.identity_size || 1,
        editionGroup: n.edition_group,
        editionSize: n.edition_size,
        defaultEdition: n.default_edition,
        foldsInto: n.folds_into,
        songOriginal: n.song_original,
        songParent: n.song_parent,
        songKind: n.song_kind,
      };
    }

    // One node per recording (its uploads collapsed unless `expanded`),
    // each version under what it was made from, else under the original
    // (the server names one for every song).
    function buildSongGraph(data, members) {
      removedToggleText.textContent = "Show removed links";
      const anchor = members.find((n) => n.entry_id === currentEntryId);
      const original = anchor.song_original;
      const identityOf = new Map(data.nodes.map((n) => [n.entry_id, n.identity ?? n.entry_id]));
      // An edition row inside one recording's uploads contradicts itself
      // (a cover of its own upload): flag that recording.
      const conflicted = new Set(
        data.edges
          .filter((e) => e.enabled && EDITION_KIND_SET.has(e.kind))
          .filter((e) => identityOf.get(e.entry_a) === identityOf.get(e.entry_b))
          .map((e) => identityOf.get(e.entry_a))
      );
      const byIdentity = new Map();
      for (const n of members) {
        if (!byIdentity.has(n.identity)) byIdentity.set(n.identity, []);
        byIdentity.get(n.identity).push(n);
      }
      const nodes = [];
      const links = [];
      for (const [identity, uploads] of byIdentity) {
        const rep = uploads.find((n) => n.entry_id === identity) || uploads[0];
        const open = expanded.has(identity) && uploads.length > 1;
        const base = {
          ...nodeFields(rep),
          id: String(identity),
          entry_id: identity,
          subtitle: rep.artists?.[0],
          sources: open ? rep.sources : uploads.flatMap((n) => n.sources || []),
          inSong: true,
          isOriginal: identity === original,
          conflict: conflicted.has(identity),
          kind: uploads.some((n) => n.entry_id === currentEntryId) && !open ? "self" : "member",
        };
        if (open && rep.entry_id === currentEntryId) base.kind = "self";
        nodes.push(base);
        if (!open) continue;
        for (const upload of uploads) {
          if (upload === rep) continue;
          nodes.push({
            ...nodeFields(upload),
            subtitle: upload.artists?.[0],
            inSong: true,
            uploadOf: identity,
            kind: upload.entry_id === currentEntryId ? "self" : "member",
          });
          links.push({
            id: `upload-${upload.entry_id}`,
            source: String(identity),
            target: String(upload.entry_id),
            edgeType: "identity",
            entry_a: identity,
            entry_b: upload.entry_id,
          });
        }
      }
      for (const [identity, ghost] of detachedHere) {
        if (byIdentity.has(identity)) continue; // put back since
        nodes.push({ ...ghost, id: String(identity), entry_id: identity, inSong: false, detached: true, kind: "member" });
      }
      for (const [identity, uploads] of byIdentity) {
        if (identity === original) continue;
        const rep = uploads.find((n) => n.entry_id === identity) || uploads[0];
        const parent = rep.song_parent ?? original;
        links.push({
          id: `tree-${identity}`,
          source: String(parent),
          target: String(identity),
          edgeType: "tree",
          kindText: songKindText(rep.song_kind),
          child: identity,
          parent,
        });
      }
      layoutSongTree(nodes, links, String(original));
      update(nodes, links);
      // Every node is pinned, so the simulation has nothing to settle and
      // its "end" (which frames the view) may never come.
      suppressNextFit = false;
      fitToContent();
    }

    // Rings by depth around the root: the original's versions on the
    // first, versions made from those further out, spaced by leaf count so
    // a 50-version song still has room. Uploads sit beside their recording.
    function layoutSongTree(nodes, links, rootId) {
      const children = new Map();
      for (const l of links) {
        if (l.edgeType !== "tree") continue;
        if (!children.has(l.source)) children.set(l.source, []);
        children.get(l.source).push(l.target);
      }
      for (const list of children.values()) list.sort((a, b) => Number(a) - Number(b));
      const root = d3.hierarchy(rootId, (id) => children.get(id));
      const leaves = root.leaves().length;
      const radius = Math.max(130, (leaves * 74) / (2 * Math.PI));
      d3.tree()
        .size([2 * Math.PI, 1])
        .separation((a, b) => (a.parent === b.parent ? 1 : 2) / a.depth)(root);
      const byId = new Map(nodes.map((n) => [n.id, n]));
      for (const h of root.descendants()) {
        const node = byId.get(h.data);
        if (!node) continue;
        const r = h.depth === 0 ? 0 : radius + (h.depth - 1) * 120;
        node.treeX = r * Math.sin(h.x);
        node.treeY = -r * Math.cos(h.x);
      }
      const ghosts = nodes.filter((n) => n.detached);
      const outer = radius + Math.max((root.height || 1) - 1, 0) * 120 + 90;
      ghosts.forEach((n, i) => {
        const angle = (2 * Math.PI * (i + 0.5)) / Math.max(ghosts.length, 8) - Math.PI / 2;
        n.treeX = outer * Math.cos(angle);
        n.treeY = outer * Math.sin(angle);
      });
      const uploadsOf = new Map();
      for (const n of nodes) {
        if (n.uploadOf == null) continue;
        if (!uploadsOf.has(n.uploadOf)) uploadsOf.set(n.uploadOf, []);
        uploadsOf.get(n.uploadOf).push(n);
      }
      for (const [identity, uploads] of uploadsOf) {
        const owner = byId.get(String(identity));
        if (owner?.treeX == null) continue;
        uploads.forEach((n, i) => {
          const angle = (2 * Math.PI * (i + 0.5)) / uploads.length;
          n.treeX = owner.treeX + 56 * Math.cos(angle);
          n.treeY = owner.treeY + 56 * Math.sin(angle);
        });
      }
    }

    function buildRawGraph(data) {
      const removedCount = data.edges.filter((e) => !e.enabled).length;
      removedToggleText.textContent = removedCount ? `Show removed links (${removedCount})` : "Show removed links";
      const shownEdges = data.edges.filter(
        (e) => e.enabled || showRemoved || touchedPairs.has(pairKey(e.entry_a, e.entry_b))
      );
      const structuralEdges = data.structural_edges || [];
      const neighbors = new Map();
      const connect = (a, b) => {
        if (!neighbors.has(a)) neighbors.set(a, []);
        if (!neighbors.has(b)) neighbors.set(b, []);
        neighbors.get(a).push(b);
        neighbors.get(b).push(a);
      };
      for (const e of shownEdges) connect(e.entry_a, e.entry_b);
      for (const e of structuralEdges) connect(e.parent_entry_id, e.child_entry_id);
      const reachable = new Set([currentEntryId]);
      const queue = [currentEntryId];
      while (queue.length) {
        for (const next of neighbors.get(queue.pop()) || []) {
          if (!reachable.has(next)) {
            reachable.add(next);
            queue.push(next);
          }
        }
      }
      const dedupEdges = shownEdges.filter((e) => reachable.has(e.entry_a) && reachable.has(e.entry_b));
      const memberIds = new Set();
      for (const e of dedupEdges) {
        memberIds.add(e.entry_a);
        memberIds.add(e.entry_b);
      }

      const nodes = data.nodes
        .filter((n) => reachable.has(n.entry_id))
        .map((n) => ({
          ...nodeFields(n),
          kind: n.entry_id === currentEntryId ? "self" : memberIds.has(n.entry_id) ? "member" : "structural",
        }));
      const links = [];
      for (const e of dedupEdges) {
        const direction = editionDirection(e);
        links.push({
          id: `dedup-${e.entry_a}-${e.entry_b}-${e.kind}`,
          source: String(direction ? direction.original : e.entry_a),
          target: String(direction ? direction.derived : e.entry_b),
          directed: Boolean(direction),
          edgeType: "dedup",
          entry_a: e.entry_a,
          entry_b: e.entry_b,
          kind: e.kind,
          origin: e.origin,
          enabled: e.enabled,
          confidence: e.confidence,
          extra: e.extra,
          transformation: transformationOf(e.extra),
          state: dedupEdgeState(e),
        });
      }
      for (const e of structuralEdges) {
        links.push({
          id: `struct-${e.parent_entry_id}-${e.child_entry_id}`,
          source: String(e.parent_entry_id),
          target: String(e.child_entry_id),
          edgeType: "structural",
          discNo: e.disc_no,
          trackNo: e.track_no,
        });
      }

      update(nodes, links);
    }

    // Every dedup edit (link/unlink/relate/unrelate/force-block/…) lands
    // here — refresh just the graph and the card fields that can actually
    // change as a result (title/date/stamps are a union across soft-linked
    // members, see `refreshAfterEdit`), never the whole detail view.
    //
    // `a`/`b` is the pair edited: it stays drawn even once disabled (see
    // `touchedPairs`), so the edit can be undone from the same edge.
    // Keeps an edited pair drawn in All relations even once disabled, so
    // the edit can be undone from the same edge.
    function touch(a, b) {
      touchedPairs.add(pairKey(a, b));
    }

    // The node-picking half of "create a link": first click arms `selected`
    // (and the dangling `pendingLine`, see `updatePendingLine`); a second,
    // different node hands the pair to `showCreateLinkPicker` to choose
    // *what kind* of connection it should be, rather than assuming
    // same-identity the way a bare click used to. Clicking the same node
    // again cancels. A stray click on a node while the kind picker from a
    // previous pair is still open (`pickerOpen`) abandons that pair first —
    // `resetSelection()` — and starts fresh from the node just clicked,
    // rather than leaving an orphaned picker no longer reachable from any
    // visible selection.
    function onNodeClick(id) {
      if (pickerOpen) resetSelection();
      if (selected === null) {
        selected = id;
        pendingMouseX = currentNodesById.get(String(id))?.x ?? 0;
        pendingMouseY = currentNodesById.get(String(id))?.y ?? 0;
        updatePendingLine();
      } else if (selected === id) {
        selected = null;
        updatePendingLine();
      } else {
        const a = selected;
        selected = null;
        updatePendingLine();
        showCreateLinkPicker(a, id);
      }
      // A pure selection-highlight change needs no re-fetch — the node set
      // is unchanged, only which one carries `.selected-for-link` is.
      d3.select(nodeLayer).selectAll(".node").attr("class", nodeClass);
    }

    // The kind-picking half: both endpoints are already fixed, so this is
    // just "what is this connection" — same identity, an edition (with
    // which side is the original), or another relation kind — shown in the
    // same detail panel an existing node/edge click would use. See
    // `connectionControls`.
    function showCreateLinkPicker(a, b) {
      pickerOpen = true;
      const nodeA = currentNodesById.get(String(a));
      const nodeB = currentNodesById.get(String(b));
      detailPanel.innerHTML = "";
      detailPanel.appendChild(el("p", { className: "graph-detail-title", text: "New connection" }));
      if (viewMode === "song") {
        // First click: what it was made from; second: the version.
        let [from, to] = [nodeA, nodeB];
        const line = el("p", { className: "graph-detail-type" });
        const sync = () => (line.textContent = `${nodeName(to)} was made from ${nodeName(from)}`);
        sync();
        detailPanel.appendChild(line);
        const kind = kindSelect("cover");
        detailPanel.appendChild(el("div", { className: "graph-detail-fields" }, [kind]));
        detailPanel.appendChild(
          el("div", { className: "graph-detail-actions" }, [
            button("Save", () => chooseParent({ nodes: [to], transformation: kind.value }, from)),
            button("Swap", () => {
              [from, to] = [to, from];
              sync();
            }),
            button("Same recording instead", () => {
              touch(a, b);
              identityEdit(`Link ${nodeName(nodeA)} and ${nodeName(nodeB)} as one recording`, linkCall(a, b), unlinkCall(a, b));
            }),
            button("Cancel", () => resetSelection()),
          ])
        );
        return;
      }
      detailPanel.appendChild(
        el("p", { className: "graph-detail-type", text: `${nodeName(nodeA)} ↔ ${nodeName(nodeB)}` })
      );
      const connection = connectionControls(
        (side) => `${truncateLabel(nodeName(side === "a" ? nodeA : nodeB), 40)} (${catalogNo(side === "a" ? a : b)})`,
        { identity: true }
      );
      detailPanel.appendChild(el("div", { className: "graph-detail-fields" }, connection.elements));
      const [kindEl, originalEl] = connection.elements;
      const create = () => {
        touch(a, b);
        const value = kindEl.value;
        if (value === "identity") {
          identityEdit(`Link ${nodeName(nodeA)} and ${nodeName(nodeB)}`, linkCall(a, b), unlinkCall(a, b));
        } else if (value.startsWith("edition:")) {
          if (!originalEl.value) {
            showError("Pick which entry is the original.");
            return;
          }
          const [original, derived] = originalEl.value === "a" ? [a, b] : [b, a];
          const transformation = value.slice("edition:".length) || null;
          songEdit(`Mark ${nodeName(currentNodesById.get(String(derived)))} as ${friendlyType(transformation || "version")}`, {
            op: "derive",
            original,
            derived,
            transformation,
          });
        } else {
          songEdit(`Relate as ${friendlyType(value)}`, { op: "relate", a, b, kind: value });
        }
      };
      detailPanel.appendChild(
        el("div", { className: "graph-detail-actions" }, [button("Create", create), button("Cancel", () => resetSelection())])
      );
    }

    // Buttons for whatever the server accepts on this edge's kind: the
    // identity ledger's link/unlink/force-block/soften-block for
    // same_identity/variant/different_identity; remove or restore for a
    // `derived_from` row (`TOGGLE_KINDS`) or a `RELATE_KINDS` row; nothing
    // for any other kind (provider `arrangement`, pipeline-only rows).
    function edgeDetailActions(d) {
      const actions = el("div", { className: "graph-detail-actions" });
      const { entry_a: a, entry_b: b } = d;
      const names = `${nodeName(currentNodesById.get(String(a)))} and ${nodeName(currentNodesById.get(String(b)))}`;
      const rows = [{ a, b, kind: d.kind }];
      const toggle = (enable, label) =>
        button(label, () => {
          touch(a, b);
          songEdit(`${label}: ${names}`, { op: enable ? "enable" : "disable", rows });
        });
      if (IDENTITY_KIND_SET.has(d.kind) || d.kind === "different_identity") {
        const linked = d.state === "active";
        const blocked = d.state === "blocked";
        const identity = (label, call, inverse) =>
          button(label, () => {
            touch(a, b);
            identityEdit(`${label}: ${names}`, call, inverse);
          });
        if (!linked) {
          actions.appendChild(
            identity(blocked ? "Link anyway (same identity)" : "Link (same identity)", linkCall(a, b), unlinkCall(a, b, blocked))
          );
        }
        if (linked) actions.appendChild(identity("Unlink", unlinkCall(a, b), linkCall(a, b)));
        actions.appendChild(
          blocked
            ? identity("Soften block", unlinkCall(a, b), unlinkCall(a, b, true))
            : identity("Force block", unlinkCall(a, b, true), linked ? linkCall(a, b) : unlinkCall(a, b))
        );
      } else if (d.kind === "different_song") {
        actions.appendChild(d.enabled ? toggle(false, "Lift block") : toggle(true, "Restore block"));
      } else if (TOGGLE_RELATION_KIND_SET.has(d.kind) || RELATE_KIND_SET.has(d.kind)) {
        actions.appendChild(d.enabled ? toggle(false, "Remove relation") : toggle(true, "Restore relation"));
      }
      return actions;
    }

    function isEditableKind(kind) {
      return (
        kind === "different_song" ||
        IDENTITY_KIND_SET.has(kind) ||
        kind === "different_identity" ||
        TOGGLE_RELATION_KIND_SET.has(kind) ||
        RELATE_KIND_SET.has(kind)
      );
    }

    // Tags the pair with an additional non-edition relation (medley,
    // same_artist, ...) on top of whatever it already has. Edition kinds
    // live in `editionEditor`, which records a direction.
    function otherRelationPicker(entryA, entryB) {
      if (!OTHER_RELATE_KINDS.length) return null;
      const select = el(
        "select",
        { className: "graph-detail-relate-select", "aria-label": "Other relation" },
        OTHER_RELATE_KINDS.map((kind) => el("option", { value: kind, text: friendlyType(kind) }))
      );
      return el("div", { className: "graph-detail-relate" }, [
        select,
        el("button", {
          className: "ghost-btn",
          type: "button",
          text: "Add relation",
          onclick: () => {
            touch(entryA, entryB);
            songEdit(`Relate as ${friendlyType(select.value)}`, { op: "relate", a: entryA, b: entryB, kind: select.value });
          },
        }),
      ]);
    }

    // Rewrites an edition edge as "the other side is a <kind> of <original>"
    // through `/api/relations/derive`, the now-playing drawer's fix for any
    // pair. Saving replaces the pair's `derived_from` row (manual, full
    // confidence) and tombstones its other non-provider edition rows, so
    // it also turns a mislabeled `cover` guess into the right kind.
    // Provider rows (MusicBrainz covers, remixes) aren't offered: derive
    // leaves those as they are.
    function editionEditor(d) {
      const extra = d.extra && typeof d.extra === "object" ? d.extra : {};
      const known = TRANSFORMATIONS.flatMap(([, opts]) => opts.map(([v]) => v));
      const marker = [extra.transformation].flat()[0];
      const currentKind = known.includes(marker) ? marker : known.includes(d.kind) ? d.kind : "";
      const kind = el(
        "select",
        { className: "graph-detail-relate-select", "aria-label": "Edition kind" },
        TRANSFORMATIONS.map(([group, opts]) =>
          el(
            "optgroup",
            { label: group },
            opts.map(([v, label]) => el("option", { value: v, text: label, selected: v === currentKind }))
          )
        )
      );
      // Which side is the original, when the row records it; otherwise
      // the user has to say, rather than the editor guessing a direction.
      const sourceId = [d.entry_a, d.entry_b].includes(extra.source_entry) ? extra.source_entry : null;
      const nameOf = (id) => `${endpointLabel(currentNodesById.get(String(id)))} (${catalogNo(id)})`;
      const original = el("select", { className: "graph-detail-relate-select", "aria-label": "Original" }, [
        sourceId == null ? el("option", { value: "", text: "Which is the original?", selected: true, disabled: true }) : null,
        ...[d.entry_a, d.entry_b].map((id) =>
          el("option", { value: String(id), text: `${nameOf(id)} is the original`, selected: id === sourceId })
        ),
      ]);
      const save = () => {
        const from = Number(original.value);
        if (!from) {
          showError("Pick which entry is the original.");
          return;
        }
        const derived = from === d.entry_a ? d.entry_b : d.entry_a;
        touch(d.entry_a, d.entry_b);
        songEdit(`Mark ${nodeName(currentNodesById.get(String(derived)))} as ${friendlyType(kind.value || "version")}`, {
          op: "derive",
          original: from,
          derived,
          transformation: kind.value || null,
        });
      };
      return el("div", { className: "graph-detail-edition" }, [
        el("p", { className: "graph-detail-empty", text: d.enabled ? "Edit as an edition:" : "Accept as an edition:" }),
        el("div", { className: "graph-detail-relate" }, [
          original,
          kind,
          el("button", { className: "ghost-btn", type: "button", text: "Save", onclick: save }),
        ]),
      ]);
    }

    function endpointLabel(node) {
      return node ? node.title || catalogNo(node.entry_id) : "?";
    }

    function showEdgeDetail(d) {
      detailPanel.innerHTML = "";
      errorEl.hidden = true;
      if (d.edgeType === "tree") {
        const child = d.target;
        const kindText = d.kindText || "version";
        detailPanel.appendChild(
          el("p", {
            className: "graph-detail-title",
            text: `${capitalize(kindText)} of ${nodeName(d.source)}`,
          })
        );
        detailPanel.appendChild(el("p", { className: "graph-detail-type", text: `${nodeName(child)} · ${nodeMeta(child)}` }));
        if (!editing) {
          detailPanel.appendChild(el("p", { className: "graph-detail-empty", text: "Switch to Edit to change it." }));
          return;
        }
        detailPanel.appendChild(songActions([child]));
        return;
      }
      if (d.edgeType === "identity") {
        detailPanel.appendChild(el("p", { className: "graph-detail-title", text: "Same recording" }));
        detailPanel.appendChild(
          el("p", { className: "graph-detail-type", text: `${nodeName(d.target)} is another upload of ${nodeName(d.source)}` })
        );
        if (editing) {
          detailPanel.appendChild(
            el("div", { className: "graph-detail-actions" }, [button("Separate this upload", () => separateUpload(d.target.entry_id))])
          );
        }
        return;
      }
      if (d.edgeType === "structural") {
        detailPanel.appendChild(el("p", { className: "graph-detail-title", text: "Release/track structure" }));
        detailPanel.appendChild(
          el("p", {
            className: "graph-detail-type",
            text: `${endpointLabel(d.source)} → ${endpointLabel(d.target)} · disc ${d.discNo ?? "?"} · track ${d.trackNo ?? "?"}`,
          })
        );
        detailPanel.appendChild(
          el("p", { className: "graph-detail-empty", text: "Importer-owned structure — not editable here." })
        );
        return;
      }
      detailPanel.appendChild(el("p", { className: "graph-detail-title", text: edgeKindLabel(d) }));
      // `d.source` is the original for a directed edge (see `buildGraph`).
      const ends = d.directed
        ? `${endpointLabel(d.source)} (original) → ${endpointLabel(d.target)}`
        : `${endpointLabel(d.source)} ↔ ${endpointLabel(d.target)}`;
      const bits = [ends, EDITION_KIND_SET.has(d.kind) && !d.directed ? "original unknown" : null];
      if (d.transformation) bits.push(friendlyType(d.kind));
      bits.push(d.origin, EDGE_STATE_LABEL[d.state]);
      if (typeof d.confidence === "number") bits.push(`${Math.round(d.confidence * 100)}% confidence`);
      detailPanel.appendChild(el("p", { className: "graph-detail-type", text: bits.filter(Boolean).join(" · ") }));
      // `extra` (entry_relation.extra) carries the RELATE reason and the
      // script's metadata map. `reason` goes first; the direction and
      // transformation fields are already in the lines above.
      if (d.extra && typeof d.extra === "object") {
        const { reason, source_entry, derived_entry, transformation, ...rest } = d.extra;
        const lines = [];
        if (reason) lines.push(reason);
        for (const [k, v] of Object.entries(rest)) lines.push(`${friendlyType(k)}: ${v}`);
        for (const line of lines) {
          detailPanel.appendChild(el("p", { className: "graph-detail-empty", text: line }));
        }
      }
      if (!isEditableKind(d.kind)) {
        detailPanel.appendChild(
          el("p", {
            className: "graph-detail-empty",
            text:
              d.origin === "provider"
                ? "Asserted by a provider (e.g. MusicBrainz) — not editable here."
                : "Asserted by the dedup pipeline — not editable here.",
          })
        );
      }
      if (!editing) {
        if (isEditableKind(d.kind)) {
          detailPanel.appendChild(el("p", { className: "graph-detail-empty", text: "Switch to Edit to change it." }));
        }
        return;
      }
      detailPanel.appendChild(edgeDetailActions(d));
      if (EDITION_KIND_SET.has(d.kind) && d.origin !== "provider") {
        detailPanel.appendChild(editionEditor(d));
      }
      const other = otherRelationPicker(d.entry_a, d.entry_b);
      if (other) detailPanel.appendChild(other);
    }

    // Unlinks every `same_identity` row on `entryId`, so that upload stands
    // as its own recording; undo links them again.
    function separateUpload(entryId) {
      const rows = (lastData?.edges || []).filter(
        (e) => e.enabled && IDENTITY_KIND_SET.has(e.kind) && (e.entry_a === entryId || e.entry_b === entryId)
      );
      if (!rows.length) {
        showError("No direct link on this upload: it's joined through another one. Use All relations to unlink it there.");
        return;
      }
      identityEditMany(
        `Separate ${catalogNo(entryId)} from its recording`,
        rows.map((r) => unlinkCall(r.entry_a, r.entry_b)),
        rows.map((r) => linkCall(r.entry_a, r.entry_b))
      );
    }
    async function identityEditMany(label, calls, inverse) {
      errorEl.hidden = true;
      try {
        for (const call of calls) await postJson(call.path, call.body);
      } catch (err) {
        showError(err.message);
        refreshAfterEdit(currentEntryId);
        return;
      }
      record({ label, calls, inverse });
      flash(label);
      refreshAfterEdit(currentEntryId);
    }

    // ---- the Cut tool: drag a stroke across lines to cut them ----
    let cutting = null;
    function drawCut() {
      cutPath.setAttribute("points", (cutting || []).map((p) => p.join(",")).join(" "));
      cutPath.classList.toggle("visible", Boolean(cutting));
    }
    svg.addEventListener("pointerdown", (event) => {
      if (!(editing && tool === "cut") || event.button !== 0 || event.target.closest(".node")) return;
      cutting = [d3.pointer(event, viewport)];
      svg.setPointerCapture(event.pointerId);
      drawCut();
    });
    svg.addEventListener("pointermove", (event) => {
      if (!cutting) return;
      cutting.push(d3.pointer(event, viewport));
      drawCut();
    });
    svg.addEventListener("pointerup", () => {
      if (!cutting) return;
      const stroke = cutting;
      cutting = null;
      drawCut();
      if (stroke.length > 1) cutEdges(edgesCrossing(stroke));
    });
    // Proper segment intersection (orientation test); touching endpoints
    // don't count, so a stroke ending on a node doesn't cut its edges.
    function segmentsCross([ax, ay], [bx, by], [cx, cy], [dx, dy]) {
      const orient = (px, py, qx, qy, rx, ry) => Math.sign((qx - px) * (ry - py) - (qy - py) * (rx - px));
      return (
        orient(ax, ay, bx, by, cx, cy) * orient(ax, ay, bx, by, dx, dy) < 0 &&
        orient(cx, cy, dx, dy, ax, ay) * orient(cx, cy, dx, dy, bx, by) < 0
      );
    }
    function edgesCrossing(stroke) {
      return currentLinks.filter((l) => {
        const from = [l.source.x, l.source.y];
        const to = [l.target.x, l.target.y];
        for (let i = 1; i < stroke.length; i++) {
          if (segmentsCross(stroke[i - 1], stroke[i], from, to)) return true;
        }
        return false;
      });
    }
    function cutEdges(edges) {
      if (!edges.length) {
        flash("The stroke didn't cross any line.");
        return;
      }
      const identityRows = [];
      if (viewMode === "song") {
        const children = [...new Set(edges.filter((e) => e.edgeType === "tree").map((e) => e.child))];
        if (children.length) {
          detachNodes(children.map((id) => currentNodesById.get(String(id))).filter(Boolean));
        }
        for (const e of edges.filter((e) => e.edgeType === "identity")) separateUpload(e.target.entry_id);
        return;
      }
      const rows = [];
      for (const e of edges) {
        if (e.edgeType !== "dedup" || !e.enabled) continue;
        touch(e.entry_a, e.entry_b);
        if (IDENTITY_KIND_SET.has(e.kind)) identityRows.push(e);
        else if (e.kind !== "different_identity") rows.push({ a: e.entry_a, b: e.entry_b, kind: e.kind });
      }
      if (rows.length) songEdit(`Cut ${rows.length} relation${rows.length > 1 ? "s" : ""}`, { op: "disable", rows });
      if (identityRows.length) {
        identityEditMany(
          `Unlink ${identityRows.length} identity link${identityRows.length > 1 ? "s" : ""}`,
          identityRows.map((e) => unlinkCall(e.entry_a, e.entry_b)),
          identityRows.map((e) => linkCall(e.entry_a, e.entry_b))
        );
      }
      if (!rows.length && !identityRows.length) flash("Nothing editable on those lines.");
    }

    graphHost.addEventListener("dragover", (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = "copy";
      graphHost.classList.add("drag-over");
    });
    graphHost.addEventListener("dragleave", () => graphHost.classList.remove("drag-over"));
    graphHost.addEventListener("drop", async (e) => {
      e.preventDefault();
      graphHost.classList.remove("drag-over");
      const droppedId = Number(e.dataTransfer.getData("text/plain"));
      if (!Number.isInteger(droppedId) || currentNodesById.has(String(droppedId))) return;
      let dropped;
      try {
        dropped = await api(`/api/entries/${droppedId}`);
      } catch (err) {
        showError(err.message);
        return;
      }
      const ownMember = (dropped.members || []).find((m) => m.entry_id === dropped.entry_id);
      const [x, y] = d3.pointer(e, viewport);
      const newNode = {
        id: String(dropped.entry_id),
        entry_id: dropped.entry_id,
        // This node's own title, not the soft-dedup-merged `dropped.title`
        // — see the same fix in the relations graph's node builder.
        title: ownMember?.title ?? dropped.title,
        entry_type: dropped.entry_type,
        sources: ownMember?.sources || dropped.sources || [],
        kind: "member",
        inSong: false,
        // No other versions: attaching it can't split anything.
        alone: (dropped.editions || []).length <= 1,
        x,
        y,
        fx: x,
        fy: y,
        userPinned: true,
      };
      update(Array.from(currentNodesById.values()).concat([newNode]), currentLinks);
      selection.clear();
      selection.add(newNode.id);
      d3.select(nodeLayer).selectAll(".node").attr("class", nodeClass);
      renderDetail(newNode);
    });

    const mergeBtn = el("button", { className: "ghost-btn", type: "button", text: "Merge with…" });
    const pickerHost = el("div", { className: "merge-picker", hidden: true });
    mergeBtn.addEventListener("click", () => {
      pickerHost.hidden = !pickerHost.hidden;
      if (!pickerHost.hidden) {
        mountMergePicker(pickerHost, currentEntryId, currentEntryType, new Set(currentSoftLinkedIds), showError);
      }
    });
    toolbar.appendChild(mergeBtn);
    section.appendChild(pickerHost);

    const relateBtn = el("button", { className: "ghost-btn", type: "button", text: "Relate as…" });
    const relatePickerHost = el("div", { className: "merge-picker", hidden: true });
    relateBtn.addEventListener("click", () => {
      relatePickerHost.hidden = !relatePickerHost.hidden;
      if (!relatePickerHost.hidden) {
        mountRelatePicker(relatePickerHost, currentEntryId, currentEntryType, showError);
      }
    });
    toolbar.appendChild(relateBtn);
    section.appendChild(relatePickerHost);

    section.appendChild(errorEl);
    section.appendChild(stage);

    // Back to the placeholder state and a clean selection — used when
    // switching to a different anchor entry, after an edit settles, and to
    // cancel an in-progress create-a-link gesture (a background click, its
    // own node clicked a second time, or the kind picker's Cancel button),
    // so a stale "click a node for details" panel never lingers on a
    // node/edge that edit may have just removed, and a half-finished link
    // never survives a navigation or an unrelated click.
    function resetSelection() {
      selected = null;
      pickerOpen = false;
      pickParent = null;
      selection.clear();
      cutting = null;
      drawCut();
      syncToolbar();
      updatePendingLine();
      d3.select(nodeLayer).selectAll(".node").attr("class", nodeClass);
      detailPanel.innerHTML = "";
      detailPanel.appendChild(el("p", { className: "graph-detail-empty", text: "Click a version for its details." }));
      errorEl.hidden = true;
    }

    // Called by `viewGraph` on every Graph-mode navigation, including to the
    // entry already showing (e.g. the initial mount) — re-anchors the graph
    // on `entryId` and re-fetches/re-joins onto the live node/link data,
    // which is what produces the morph described above.
    function load(entryId, entryType, softLinkedIds) {
      if (entryId !== currentEntryId) {
        touchedPairs.clear();
        detachedHere.clear();
      }
      currentEntryId = entryId;
      currentEntryType = entryType;
      currentSoftLinkedIds = softLinkedIds || [];
      resetSelection();
      renderGraph();
    }

    // Called after a dedup edit on the entry already showing — same
    // re-fetch/re-join as `load()`, just without touching which entry is
    // anchored.
    function refresh() {
      resetSelection();
      renderGraph();
    }

    return { section, load, refresh };
  }

  // Built once for the app's lifetime and mounted permanently in `#view-graph`
  // (see `setMode`'s sibling-view comment above) — Graph mode is now its own
  // screen, so nothing ever wholesale-replaces the container it lives in the
  // way `viewEntry`/`renderError`/`showInvite` used to when the graph was
  // nested inside the entry-detail card. No parking spot needed anymore.
  const graphEditor = createGraphEditor();
  const graphEmptyEl = el("div", { className: "graph-empty" }, [
    el("p", { className: "lede", text: "Nothing to show yet." }),
    el("p", { className: "sub", text: "Search your library on the left to inspect an entry's relations." }),
  ]);
  viewGraphEl.appendChild(graphEmptyEl);
  viewGraphEl.appendChild(graphEditor.section);
  graphEditor.section.hidden = true;

  // Graph mode's own router entry point (mirrors `viewEntry` for Library
  // mode) — anchors the persistent graph editor on `entryId` and shows it
  // full-screen instead of inside a card.
  async function viewGraph(entryId, opts = {}) {
    graphActiveId = entryId;
    for (const btn of resultsEl.querySelectorAll(".result")) {
      btn.setAttribute("aria-selected", String(btn.dataset.entryId === String(entryId)));
    }
    let entry;
    try {
      entry = await api(`/api/entries/${entryId}`);
    } catch (err) {
      graphEditor.section.hidden = true;
      graphEmptyEl.hidden = false;
      graphEmptyEl.innerHTML = "";
      graphEmptyEl.appendChild(el("p", { className: "lede", text: "Something went wrong." }));
      graphEmptyEl.appendChild(el("p", { className: "sub", text: err.message }));
      setMode("graph");
      return;
    }
    const url = `/graph/${entryId}`;
    if (opts.push !== false && location.pathname !== url) {
      history.pushState({ graphEntryId: entryId }, "", url);
    } else {
      history.replaceState({ graphEntryId: entryId }, "", url);
    }
    graphEmptyEl.hidden = true;
    graphEditor.section.hidden = false;
    graphEditor.load(entryId, entry.entry_type, entry.soft_linked_ids || []);
    setMode("graph");
  }

  // The single post-edit refresh path for every dedup mutation (graph
  // clicks, the merge/relate pickers below) — replaces the old
  // `viewEntry(entryId, {push:false})` full detail-view reload. Re-fetches
  // just the two things an edit can actually change: the relations graph
  // (via `graphEditor.refresh()`) and this card's title/date/stamps, which
  // are a union across soft-linked members and so can shift on link/unlink
  // (see `entries.rs`). Tracklist/play-CTA are untouched — dedup edits
  // don't affect release structure or playable sources.
  // A link to an entry's page: a plain click opens it in place, a modified
  // or middle click leaves it to the browser (a new tab).
  function entryLink(entryId, text, className) {
    const link = el("a", { className, href: `/entry/${entryId}`, text });
    link.addEventListener("click", (e) => {
      if (e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      viewEntry(entryId);
    });
    return link;
  }

  // An inline editor for a display name: type one, or pick one of the
  // `aliases` its sources know. `onSave(name)` gets `null` for "go back to
  // `resetLabel`'s name" and resolves to the new `{ value, aliases, renamed }`,
  // or `null` when the caller has re-rendered this editor away; a throw
  // keeps the form open with the error.
  function nameEditor({ label, value, aliases, renamed, resetLabel, className, onSave }) {
    let state = { value, aliases, renamed };
    const root = el("div", { className: `rename ${className || ""}` });
    const toggle = el("button", { className: "rename-toggle", type: "button", text: label });
    const mark = el("span", { className: "rename-mark", text: "renamed" });
    root.append(toggle, mark);
    let form = null;

    function sync() {
      mark.hidden = !state.renamed;
    }

    function close() {
      form?.remove();
      form = null;
      toggle.hidden = false;
      sync();
      if (toggle.isConnected) toggle.focus();
    }

    function open() {
      toggle.hidden = true;
      mark.hidden = true;
      const input = el("input", {
        type: "text",
        className: "rename-input",
        "aria-label": "Name",
        spellcheck: "false",
        autocomplete: "off",
      });
      input.value = state.value;
      const chips = state.aliases.map((alias) =>
        el("button", {
          type: "button",
          className: "rename-alias",
          text: alias,
          title: "Use this name",
          onclick: () => {
            input.value = alias;
            markChosen();
            input.focus();
          },
        })
      );
      function markChosen() {
        for (const chip of chips) {
          chip.setAttribute("aria-pressed", String(chip.textContent === input.value.trim()));
        }
      }
      input.addEventListener("input", markChosen);
      markChosen();

      const status = el("span", { className: "rename-status", role: "status" });
      const buttons = [];
      async function save(name) {
        for (const b of buttons) b.disabled = true;
        status.textContent = "Saving…";
        try {
          const next = await onSave(name);
          if (!next) return;
          state = next;
          close();
        } catch (err) {
          status.textContent = err.message;
          for (const b of buttons) b.disabled = false;
        }
      }
      const saveBtn = el("button", { type: "button", className: "ghost-btn", text: "Save", onclick: () => save(input.value.trim() || null) });
      buttons.push(saveBtn);
      if (state.renamed) {
        buttons.push(el("button", { type: "button", className: "ghost-btn", text: resetLabel, onclick: () => save(null) }));
      }
      buttons.push(el("button", { type: "button", className: "ghost-btn", text: "Cancel", onclick: close }));

      form = el("div", { className: "rename-form" }, [
        input,
        chips.length ? el("div", { className: "rename-aliases", role: "group", "aria-label": "Known names" }, chips) : null,
        el("div", { className: "rename-actions" }, [...buttons, status]),
      ]);
      form.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          e.preventDefault();
          close();
        } else if (e.key === "Enter" && e.target === input) {
          e.preventDefault();
          saveBtn.click();
        }
      });
      root.appendChild(form);
      input.focus();
      input.select();
    }

    toggle.addEventListener("click", open);
    sync();
    return root;
  }

  // The artists `entryId` credits, each a link to the artist with a rename
  // for how this entry credits them.
  async function loadCredits(entryId, container, byline) {
    let credits;
    try {
      ({ credits } = await api(`/api/entries/${entryId}/credits`));
    } catch {
      return;
    }
    if (activeId === entryId) fillCredits(entryId, container, credits, byline);
  }

  // `byline` (the card meta's "by …" span) gets the credited names as
  // links plus a toggle for `container`, the rename editors, which stay
  // closed until asked for.
  function fillCredits(entryId, container, credits, byline) {
    byline.replaceChildren();
    if (credits.length) {
      byline.appendChild(document.createTextNode("by "));
      credits.forEach((c, i) => {
        if (i) byline.appendChild(document.createTextNode(", "));
        byline.appendChild(entryLink(c.artist_id, c.name, "credit-name"));
      });
      byline.appendChild(
        el("button", {
          className: "rename-toggle byline-edit",
          type: "button",
          text: "edit credits",
          onclick: () => {
            container.hidden = !container.hidden;
          },
        })
      );
    }
    container.replaceChildren();
    if (!credits.length) {
      container.hidden = true;
      return;
    }
    container.appendChild(el("h2", { className: "section-label", text: "Credited artists" }));
    for (const c of credits) {
      const row = el("div", { className: "credit" }, [entryLink(c.artist_id, c.name, "credit-name")]);
      if (c.renamed) row.appendChild(el("span", { className: "credit-artist", text: c.artist_name }));
      row.appendChild(
        nameEditor({
          label: "rename here",
          value: c.name,
          aliases: c.aliases,
          renamed: c.renamed,
          resetLabel: `Use “${c.artist_name}”`,
          onSave: async (name) => {
            const next = await postJson(`/api/entries/${entryId}/credits/${c.artist_id}/display-name`, { name });
            fillCredits(entryId, container, next.credits, byline);
            return null;
          },
        })
      );
      container.appendChild(row);
    }
  }

  async function refreshAfterEdit(entryId) {
    refreshSearchIfActive();
    graphEditor.refresh();
    // The user may have navigated to a different entry while the edit's
    // request was in flight — only patch the card if it's still the one on
    // screen. `graphEditor.refresh()` above is always safe regardless
    // (it re-reads `currentEntryId` itself and no-ops via its own load
    // token if superseded).
    if (activeId !== entryId || !cardEls) return;
    let entry;
    try {
      entry = await api(`/api/entries/${entryId}`);
    } catch {
      return;
    }
    if (activeId !== entryId || !cardEls) return;
    cardEls.title.textContent = entry.title || "(untitled)";
    if (entry.entry_type !== "artist" || entry.release_date) {
      cardEls.date.textContent = releasedText(entry.release_date || cardEls.fallbackDate);
    }
    fillEditionList(cardEls.editions, entry.editions);
    fillSources(cardEls.sources, entry);
  }

  function releasedText(raw) {
    const date = friendlyDate(raw);
    return date ? `Released ${date}` : "Release date unknown";
  }

  // Same search-and-pick shell as `mountMergePicker`, but for a
  // RELATE_KINDS connection instead of a same-identity link: a kind picked
  // up front, then a target entry search that posts to
  // `/api/relations/relate` instead of `/api/relations/link`. Kept as a
  // separate function rather than parameterizing `mountMergePicker` — the
  // two pickers write to genuinely different endpoints with different
  // semantics (identity merge vs. an independent, non-identity annotation),
  // and sharing one function for both would mean threading that difference
  // through every call site anyway.
  function mountRelatePicker(host, entryId, entryType, showError) {
    host.innerHTML = "";
    host.appendChild(
      el("p", {
        className: "merge-picker-hint",
        text: "Pick a relation kind, then the other entry — reversible any time from that edge's details.",
      })
    );
    const connection = connectionControls((side) => (side === "a" ? "This entry" : "The picked entry"));
    host.appendChild(el("div", { className: "graph-detail-fields" }, connection.elements));
    const input = el("input", {
      type: "search",
      className: "merge-picker-input",
      placeholder: `Search ${friendlyType(entryType)}s…`,
    });
    const results = el("ul", { className: "merge-picker-results" });
    host.appendChild(input);
    host.appendChild(results);

    let token = 0;
    let debounceHandle;
    input.addEventListener("input", () => {
      clearTimeout(debounceHandle);
      debounceHandle = setTimeout(runPickerSearch, 200);
    });

    async function runPickerSearch() {
      const q = input.value.trim();
      const myToken = ++token;
      if (!q) {
        results.innerHTML = "";
        return;
      }
      let data;
      try {
        data = await api(`/api/library/search?q=${encodeURIComponent(q)}`);
      } catch {
        return;
      }
      if (myToken !== token) return;
      results.innerHTML = "";
      const candidates = data.results.filter((r) => r.entry_id !== entryId && r.entry_type === entryType);
      if (!candidates.length) {
        results.appendChild(el("li", { className: "merge-picker-empty", text: "No matches." }));
        return;
      }
      for (const r of candidates) {
        results.appendChild(
          el("li", {}, [
            el("button", {
              className: "merge-picker-option",
              type: "button",
              text: `${catalogNo(r.entry_id)} — ${r.title || "(untitled)"}`,
              onclick: async () => {
                try {
                  await connection.request(entryId, r.entry_id);
                  refreshAfterEdit(entryId);
                } catch (err) {
                  showError(err.message);
                }
              },
            }),
          ])
        );
      }
    }

    input.focus();
  }

  function mountMergePicker(host, entryId, entryType, excludeIds, showError) {
    host.innerHTML = "";
    host.appendChild(
      el("p", {
        className: "merge-picker-hint",
        text: "Pick the other entry it's a duplicate of — this links them softly, reversible any time.",
      })
    );
    const input = el("input", {
      type: "search",
      className: "merge-picker-input",
      placeholder: `Search ${friendlyType(entryType)}s…`,
    });
    const results = el("ul", { className: "merge-picker-results" });
    host.appendChild(input);
    host.appendChild(results);

    let token = 0;
    let debounceHandle;
    input.addEventListener("input", () => {
      clearTimeout(debounceHandle);
      debounceHandle = setTimeout(runPickerSearch, 200);
    });

    async function runPickerSearch() {
      const q = input.value.trim();
      const myToken = ++token;
      if (!q) {
        results.innerHTML = "";
        return;
      }
      let data;
      try {
        data = await api(`/api/library/search?q=${encodeURIComponent(q)}`);
      } catch {
        return;
      }
      if (myToken !== token) return;
      results.innerHTML = "";
      // Same entry_type only — the server rejects a mismatched link anyway,
      // this just keeps the picker from offering options that would fail.
      const candidates = data.results.filter(
        (r) => r.entry_id !== entryId && r.entry_type === entryType && !excludeIds.has(r.entry_id)
      );
      if (!candidates.length) {
        results.appendChild(el("li", { className: "merge-picker-empty", text: "No matches." }));
        return;
      }
      for (const r of candidates) {
        results.appendChild(
          el("li", {}, [
            el("button", {
              className: "merge-picker-option",
              type: "button",
              text: `${catalogNo(r.entry_id)} — ${r.title || "(untitled)"}`,
              onclick: async () => {
                try {
                  await postJson("/api/relations/link", { a: entryId, b: r.entry_id });
                  refreshAfterEdit(entryId);
                } catch (err) {
                  showError(err.message);
                }
              },
            }),
          ])
        );
      }
    }

    input.focus();
  }

  function buildPlayCta(entryId, title, sources) {
    const playing = Player.isPlayingEntry(entryId);
    const iconEl = el("span", { className: "play-cta-icon" });
    iconEl.innerHTML = svgIcon(playing ? "pause" : "play", 13);
    const btn = el(
      "button",
      {
        id: "play-cta",
        className: "play-cta" + (playing ? " is-playing" : ""),
        type: "button",
        "data-entry-id": String(entryId),
        onclick: () => {
          if (Player.isPlayingEntry(entryId)) {
            Player.togglePlay();
          } else {
            playStandalone(entryId, title, sources);
          }
        },
      },
      [iconEl, el("span", { className: "play-cta-label", text: playing ? "Playing" : "Play" })]
    );
    const queueIconEl = el("span", { className: "queue-cta-icon" });
    queueIconEl.innerHTML = svgIcon("plus", 12);
    const queueBtn = el(
      "button",
      {
        className: "ghost-btn queue-cta",
        type: "button",
        "aria-label": "Add to queue",
        onclick: () => queueTrack(entryId, title),
      },
      [queueIconEl, el("span", { text: "Queue" })]
    );
    const row = el("div", { className: "play-cta-row" }, [btn, queueBtn]);
    if (sources.length > 1) {
      const providers = [...new Set(sortByProviderPreference(sources).map((s) => providerLabel(s.provider)))];
      row.appendChild(el("span", { className: "play-cta-hint", text: providers.join(" · ") }));
    }
    return row;
  }

  // A track with nothing to play: where its play button would be, a way to
  // find it a source (`Player.openFinder`, in a panel of its own since the
  // dock only shows while something plays). Attaching one swaps this for
  // the play button and starts the track.
  function buildFindCta(entry) {
    const entryId = entry.entry_id;
    const panel = el("div", { className: "player-dock-find entry-find", hidden: true });
    const find = () =>
      Player.openFinder({
        entryId,
        title: entry.title,
        artist: entry.editions?.find((ed) => ed.is_current)?.artists?.[0] ?? null,
        host: panel,
        onAttached: async () => {
          playStandalone(entryId, entry.title);
          if (activeId !== entryId || !wrap.isConnected) return;
          const playable = await api(`/api/entries/${entryId}/playable-sources`).catch(() => ({ sources: [] }));
          if (activeId !== entryId || !wrap.isConnected) return;
          if (playable.sources.length) wrap.replaceWith(buildPlayCta(entryId, entry.title, playable.sources));
          refreshAfterEdit(entryId);
        },
      });
    const iconEl = el("span", { className: "play-cta-icon" });
    iconEl.innerHTML = svgIcon("search", 13);
    const wrap = el("div", { className: "find-cta" }, [
      el("div", { className: "play-cta-row" }, [
        el("button", { className: "play-cta find-cta-btn", type: "button", onclick: find }, [
          iconEl,
          el("span", { className: "play-cta-label", text: "Find source" }),
        ]),
        el("span", { className: "play-cta-hint", text: "Nothing to play yet: search YouTube Music and Spotify" }),
      ]),
      panel,
    ]);
    return wrap;
  }

  // ---------- pictures: `GET /api/entries/{id}/cover` (cover.rs) ----------
  //
  // The server picks each entry's picture and redirects to it, or answers
  // 404 when there is none; the browser caches the answer for a day.

  function coverUrl(entryId) {
    return `/api/entries/${entryId}/cover`;
  }

  // A picture box: the entry's cover, faded in once loaded, over the title's
  // first letter, which stays when there's no cover. `loading="lazy"`
  // defers covers far down a long list.
  function artBox(entryId, className, title) {
    const initial = [...(title || "").trim()][0] || "♪";
    const box = el("span", { className: `art ${className}`, "aria-hidden": "true" }, [
      el("span", { className: "art-initial", text: initial }),
    ]);
    if (entryId == null) return box;
    const img = el("img", { alt: "", loading: "lazy", decoding: "async" });
    img.onload = () => box.classList.add("has-art");
    img.onerror = () => img.remove();
    img.src = coverUrl(entryId);
    box.appendChild(img);
    return box;
  }

  // ---------- an artist's page: what `GET /api/entries/{id}/discography`
  // (discography.rs) ties to the artist, as a release grid and a track
  // list, each with filter chips ----------

  const RELEASE_FILTERS = [
    { label: "All", test: (r) => r.main && r.kind !== "playlist" },
    { label: "Albums", test: (r) => r.main && (r.kind === "album" || r.kind === "compilation") },
    { label: "EPs", test: (r) => r.main && r.kind === "ep" },
    { label: "Singles", test: (r) => r.main && r.kind === "single" },
    { label: "Other", test: (r) => r.main && r.kind === "other" },
    { label: "Live", test: (r) => r.main && r.kind === "broadcast" },
    { label: "Appears on", test: (r) => !r.main && r.kind !== "playlist" },
    { label: "Playlists", test: (r) => r.kind === "playlist" },
  ];
  const RELEASE_KIND_LABEL = {
    album: "Album",
    ep: "EP",
    single: "Single",
    compilation: "Compilation",
    broadcast: "Live",
    playlist: "Playlist",
    other: "Other",
  };
  const RELEASE_KIND_RANK = ["album", "compilation", "ep", "single", "other", "broadcast", "playlist"];
  const RELEASE_PREVIEW = 12;
  const TRACK_PREVIEW = 15;
  const TOP_TRACKS = 5;

  function plural(n, one, many = one + "s") {
    return `${n} ${n === 1 ? one : many}`;
  }

  // Release dates come at any precision (`2022`, `2022-XX-XX`, a full
  // timestamp): the year is the part every one of them has.
  function releaseYear(raw) {
    return /^\d{4}/.test(raw || "") ? raw.slice(0, 4) : "—";
  }

  function sourceDots(kinds) {
    const dots = el("span", { className: "edition-dots" });
    for (const kind of kinds || []) {
      if (!PLATFORM_COLOR[kind]) continue;
      const dot = el("span", { className: "dot", title: providerLabel(kind) });
      dot.style.background = PLATFORM_COLOR[kind];
      dots.appendChild(dot);
    }
    return dots;
  }

  // A row of filter chips, each with its count; chips with nothing to show
  // are left out. `onPick(index)` fires on click and once for the default.
  function filterChips(filters, items, onPick) {
    const host = el("div", { className: "disco-filters", role: "group" });
    const buttons = [];
    filters.forEach((f, i) => {
      const count = items.filter(f.test).length;
      if (!count) return;
      const btn = el(
        "button",
        {
          className: "disco-filter",
          type: "button",
          "aria-pressed": "false",
          onclick: () => pick(i, btn),
        },
        [el("span", { text: f.label }), el("span", { className: "disco-filter-count", text: String(count) })]
      );
      buttons.push([i, btn]);
      host.appendChild(btn);
    });
    function pick(i, btn) {
      for (const [, b] of buttons) b.setAttribute("aria-pressed", String(b === btn));
      onPick(i);
    }
    if (buttons.length) pick(...buttons[0]);
    return host;
  }

  // Shows the first `preview` of `rows` (elements) in `list`, with a
  // "Show all" button after it for the rest.
  function fillPreviewList(list, rows, preview, noun) {
    list.replaceChildren(...rows);
    if (list.nextElementSibling?.classList.contains("list-more")) list.nextElementSibling.remove();
    if (rows.length <= preview) return;
    rows.slice(preview).forEach((r) => (r.hidden = true));
    const more = el("button", {
      className: "ghost-btn list-more",
      type: "button",
      text: `Show all ${plural(rows.length, noun)}`,
      onclick: () => {
        rows.forEach((r) => (r.hidden = false));
        more.remove();
      },
    });
    list.after(more);
  }

  // `position` (a track's "Track 5", see `trackPosition`) leads the tile's
  // meta line. `track_count` counts every disc, so "Track 5 of 12" holds
  // only on disc 1; later discs list the count on its own.
  function releaseTile(r, { position } = {}) {
    const meta = [];
    if (position && r.track_count && !(r.disc_no > 1)) meta.push(`${position} of ${r.track_count}`);
    else {
      if (position) meta.push(position);
      if (r.track_count) meta.push(plural(r.track_count, "track"));
    }
    const tile = el("li", { className: "release-tile", "data-kind": r.kind }, [
      el(
        "button",
        {
          className: "release-open",
          type: "button",
          title: `${catalogNo(r.entry_id)} — ${r.title || "(untitled)"}`,
          onclick: () => viewEntry(r.entry_id),
        },
        [
          artBox(r.entry_id, "release-cover", r.title),
          el("span", { className: "release-top" }, [
            el("span", { className: "release-kind", text: RELEASE_KIND_LABEL[r.kind] || r.kind }),
            el("span", { text: releaseYear(r.release_date) }),
          ]),
          el("span", { className: "release-title", text: r.title || "(untitled)" }),
          el("span", { className: "release-meta" }, [el("span", { text: meta.join(" · ") }), sourceDots(r.source_kinds)]),
        ]
      ),
    ]);
    // Same-title entries the server folded in but the library doesn't link:
    // reachable here so they can be opened (and merged) by hand.
    if (r.also?.length) {
      tile.appendChild(
        el("div", { className: "release-also", title: "Same title, not linked in the library" }, [
          el("span", { text: "also" }),
          ...r.also.map((id) => el("button", { type: "button", text: catalogNo(id), onclick: () => viewEntry(id) })),
        ])
      );
    }
    return tile;
  }

  // One track row; `queue` is the list a click on its play button starts.
  function artistTrackRow(t, queue, { showDate = true } = {}) {
    const playing = Player.isPlayingEntry(t.entry_id);
    const playIcon = el("span", { className: "manifest-play-icon" });
    playIcon.innerHTML = svgIcon(playing ? "pause" : "play", 12);
    const queueIcon = el("span", { className: "manifest-play-icon" });
    queueIcon.innerHTML = svgIcon("plus", 12);
    return el("li", {}, [
      el(
        "div",
        {
          className: "manifest-row" + (playing ? " is-playing" : ""),
          "data-entry-id": String(t.entry_id),
          "data-dim": t.playable ? null : "",
        },
        [
          el("button", {
            className: "manifest-play",
            type: "button",
            disabled: !t.playable,
            "aria-label": playing ? "Pause" : "Play",
            onclick: t.playable
              ? () => {
                  if (Player.isPlayingEntry(t.entry_id)) Player.togglePlay();
                  else startQueue(queue, queue.findIndex((q) => q.entry_id === t.entry_id));
                }
              : null,
          }, [playIcon]),
          artBox(t.entry_id, "track-thumb", t.title),
          el("button", {
            className: "manifest-title",
            type: "button",
            text: t.title || "(untitled)",
            onclick: () => viewEntry(t.entry_id),
          }),
          !t.main && t.roles.length ? el("span", { className: "manifest-role", text: t.roles.join(", ") }) : null,
          showDate ? el("span", { className: "manifest-date", text: friendlyDate(t.release_date) || "—" }) : null,
          el("span", { className: "manifest-plays", text: t.plays ? plural(t.plays, "play") : "" }),
          el("button", {
            className: "manifest-queue",
            type: "button",
