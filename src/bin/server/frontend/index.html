      cardEls.stamps.appendChild(stamp(s.source, s.identifier, s.source in PLATFORM_COLOR));
    }
    cardEls.stamps.hidden = entry.sources.length === 0;
  }

  // Same search-and-pick shell as `mountMergePicker`, but for a
  // RELATE_KINDS connection instead of a same-identity link: a kind picked
  // up front, then a target entry search that posts to
  // `/api/relations/relate` instead of `/api/relations/link`. Kept as a
  // separate function rather than parameterizing `mountMergePicker` — the
  // two pickers write to genuinely different endpoints with different
  // semantics (identity merge vs. an independent, non-identity annotation),
  // and sharing one function for both would mean threading that difference
  // through every call site anyway.
  function mountRelatePicker(host, entryId, entryType, showError) {
    host.innerHTML = "";
    host.appendChild(
      el("p", {
        className: "merge-picker-hint",
        text: "Pick a relation kind, then the other entry — reversible any time from that edge's details.",
      })
    );
    const kindSelect = el(
      "select",
      { className: "graph-detail-relate-select" },
      RELATE_KINDS.map((kind) => el("option", { value: kind, text: friendlyType(kind) }))
    );
    host.appendChild(kindSelect);
    const input = el("input", {
      type: "search",
      className: "merge-picker-input",
      placeholder: `Search ${friendlyType(entryType)}s…`,
    });
    const results = el("ul", { className: "merge-picker-results" });
    host.appendChild(input);
    host.appendChild(results);

    let token = 0;
    let debounceHandle;
    input.addEventListener("input", () => {
      clearTimeout(debounceHandle);
      debounceHandle = setTimeout(runPickerSearch, 200);
    });

    async function runPickerSearch() {
      const q = input.value.trim();
      const myToken = ++token;
      if (!q) {
        results.innerHTML = "";
        return;
      }
      let data;
      try {
        data = await api(`/api/library/search?q=${encodeURIComponent(q)}`);
      } catch {
        return;
      }
      if (myToken !== token) return;
      results.innerHTML = "";
      const candidates = data.results.filter((r) => r.entry_id !== entryId && r.entry_type === entryType);
      if (!candidates.length) {
        results.appendChild(el("li", { className: "merge-picker-empty", text: "No matches." }));
        return;
      }
      for (const r of candidates) {
        results.appendChild(
          el("li", {}, [
            el("button", {
              className: "merge-picker-option",
              type: "button",
              text: `${catalogNo(r.entry_id)} — ${r.title || "(untitled)"}`,
              onclick: async () => {
                try {
                  await postJson("/api/relations/relate", { a: entryId, b: r.entry_id, kind: kindSelect.value });
                  refreshAfterEdit(entryId);
                } catch (err) {
                  showError(err.message);
                }
              },
            }),
          ])
        );
      }
    }

    input.focus();
  }

  function mountMergePicker(host, entryId, entryType, excludeIds, showError) {
    host.innerHTML = "";
    host.appendChild(
      el("p", {
        className: "merge-picker-hint",
        text: "Pick the other entry it's a duplicate of — this links them softly, reversible any time.",
      })
    );
    const input = el("input", {
      type: "search",
      className: "merge-picker-input",
      placeholder: `Search ${friendlyType(entryType)}s…`,
    });
    const results = el("ul", { className: "merge-picker-results" });
    host.appendChild(input);
    host.appendChild(results);

    let token = 0;
    let debounceHandle;
    input.addEventListener("input", () => {
      clearTimeout(debounceHandle);
      debounceHandle = setTimeout(runPickerSearch, 200);
    });

    async function runPickerSearch() {
      const q = input.value.trim();
      const myToken = ++token;
      if (!q) {
        results.innerHTML = "";
        return;
      }
      let data;
      try {
        data = await api(`/api/library/search?q=${encodeURIComponent(q)}`);
      } catch {
        return;
      }
      if (myToken !== token) return;
      results.innerHTML = "";
      // Same entry_type only — the server rejects a mismatched link anyway,
      // this just keeps the picker from offering options that would fail.
      const candidates = data.results.filter(
        (r) => r.entry_id !== entryId && r.entry_type === entryType && !excludeIds.has(r.entry_id)
      );
      if (!candidates.length) {
        results.appendChild(el("li", { className: "merge-picker-empty", text: "No matches." }));
        return;
      }
      for (const r of candidates) {
        results.appendChild(
          el("li", {}, [
            el("button", {
              className: "merge-picker-option",
              type: "button",
              text: `${catalogNo(r.entry_id)} — ${r.title || "(untitled)"}`,
              onclick: async () => {
                try {
                  await postJson("/api/relations/link", { a: entryId, b: r.entry_id });
                  refreshAfterEdit(entryId);
                } catch (err) {
                  showError(err.message);
                }
              },
            }),
          ])
        );
      }
    }

    input.focus();
  }

  function buildPlayCta(entryId, title, sources) {
    const playing = Player.isPlayingEntry(entryId);
    const iconEl = el("span", { className: "play-cta-icon" });
    iconEl.innerHTML = svgIcon(playing ? "pause" : "play", 13);
    const btn = el(
      "button",
      {
        id: "play-cta",
        className: "play-cta" + (playing ? " is-playing" : ""),
        type: "button",
        "data-entry-id": String(entryId),
        onclick: () => {
          if (Player.isPlayingEntry(entryId)) {
            Player.togglePlay();
          } else {
            playStandalone(entryId, title, sources);
          }
        },
      },
      [iconEl, el("span", { className: "play-cta-label", text: playing ? "Playing" : "Play" })]
    );
    const queueIconEl = el("span", { className: "queue-cta-icon" });
    queueIconEl.innerHTML = svgIcon("plus", 12);
    const queueBtn = el(
      "button",
      {
        className: "ghost-btn queue-cta",
        type: "button",
        "aria-label": "Add to queue",
        onclick: () => queueTrack(entryId, title),
      },
      [queueIconEl, el("span", { text: "Queue" })]
    );
    const row = el("div", { className: "play-cta-row" }, [btn, queueBtn]);
    if (sources.length > 1) {
      row.appendChild(el("span", { className: "play-cta-hint", text: sources.map((s) => s.provider).join(" · ") }));
    }
    return row;
  }

  // `push` (default true): whether this navigation gets its own history
  // entry. A genuine navigation (search result, tracklist row, the player
  // bar's title) should; re-rendering the entry you're already on after a
  // dedup edit shouldn't pile up a redundant back-stack entry — those calls
  // pass `{ push: false }`, which still updates the URL (so a refresh
  // reflects any edit) but replaces the current history entry instead.
  async function viewEntry(entryId, opts = {}) {
    activeId = entryId;
    setMode("library");
    for (const btn of resultsEl.querySelectorAll(".result")) {
      btn.setAttribute("aria-selected", "false");
    }

    let entry;
    try {
      entry = await api(`/api/entries/${entryId}`);
    } catch (err) {
      renderError(err.message);
      return;
    }

    const url = `/entry/${entryId}`;
    if (opts.push !== false && location.pathname !== url) {
      history.pushState({ entryId }, "", url);
    } else {
      history.replaceState({ entryId }, "", url);
    }

    const detail = el("div", { className: "detail enter", id: "card" });

    detail.appendChild(
      el("div", { className: "card-kicker" }, [
        el("span", { text: catalogNo(entry.entry_id) }),
        el("span", { text: friendlyType(entry.entry_type) }),
      ])
    );
    const titleEl = el("h1", { className: "card-title", text: entry.title || "(untitled)" });
    detail.appendChild(titleEl);

    const date = friendlyDate(entry.release_date);
    const metaEl = el("p", { className: "card-meta", text: date ? `Released ${date}` : "Release date unknown" });
    detail.appendChild(metaEl);

    // A track and its instrumental (or other `EDITION_KINDS` relation, see
    // `musicdb::EDITION_KINDS`) are distinct identities, unlike `members`
    // below — the library list already collapsed them into this one row
    // (`dedupe_by_edition`), so switching here just navigates to the other
    // identity's own entry page instead of merging anything. Always mounted
    // (like `stampsEl` below) so `refreshAfterEdit` has a stable element to
    // refill if a manual relate/unrelate edit changes the edition set of the
    // entry already on screen.
    const editionsEl = el("div", { className: "editions" });
    fillEditions(editionsEl, entry.editions);
    detail.appendChild(editionsEl);

    // Always mounted (just hidden when empty) rather than conditionally
    // appended, so `refreshAfterEdit` has a stable element to refill in
    // place if a dedup edit changes the source union from empty to
    // non-empty (or vice versa) without a full re-render.
    const stampsEl = el("div", { className: "stamps", hidden: entry.sources.length === 0 });
    for (const s of entry.sources) {
      stampsEl.appendChild(stamp(s.source, s.identifier, s.source in PLATFORM_COLOR));
    }
    detail.appendChild(stampsEl);
    cardEls = { title: titleEl, meta: metaEl, stamps: stampsEl, editions: editionsEl };

    // Relations/dedup calibration lives in its own full-screen mode now
    // (see `viewGraph`) rather than embedded here — just a way in.
    detail.appendChild(
      el("button", {
        className: "ghost-btn relations-link",
        type: "button",
        text: "View relations →",
        onclick: () => viewGraph(entryId),
      })
    );

    if (entry.entry_type === "artist") {
      detail.appendChild(
        el("p", {
          className: "note",
          text: "Artists aren't playable directly — open a release or track instead.",
        })
      );
    } else {
      const playable = await api(`/api/entries/${entryId}/playable-sources`).catch(() => ({ sources: [] }));
      if (playable.sources.length) {
        detail.appendChild(buildPlayCta(entryId, entry.title, playable.sources));
      } else if (entry.entry_type === "track") {
        detail.appendChild(
          el("p", {
            className: "note",
            text: "No playable source for this track yet — see the stamps above for where it lives.",
          })
        );
      }
    }

    if (entry.entry_type === "release" || entry.entry_type === "release_group") {
      const tracks = await api(`/api/releases/${entryId}/tracks`).catch(() => ({ tracks: [] }));
      if (tracks.tracks.length) {
        // Only playable tracks enter the queue — the rest are still shown
        // (so the tracklist reads as the complete release) but their play
        // button is disabled, per their own `playable` flag from the
        // server. The row itself always navigates to the track's page.
        // `release_id` tells the now-playing drawer which album a track
        // is being played from.
        const playableTracks = tracks.tracks
          .filter((t) => t.playable)
          .map((t) => ({ entry_id: t.entry_id, title: t.title, release_id: entryId }));

        detail.appendChild(el("p", { className: "manifest-label", text: "Tracklist" }));
        const list = el("ul", { className: "manifest" });
        for (const t of tracks.tracks) {
          const queuePos = playableTracks.findIndex((pt) => pt.entry_id === t.entry_id);
          const playIcon = el("span", { className: "manifest-play-icon" });
          playIcon.innerHTML = svgIcon(Player.isPlayingEntry(t.entry_id) ? "pause" : "play", 12);
          const queueIcon = el("span", { className: "manifest-play-icon" });
          queueIcon.innerHTML = svgIcon("plus", 12);
          list.appendChild(
            el("li", {}, [
              el(
                "div",
                {
                  className: "manifest-row" + (Player.isPlayingEntry(t.entry_id) ? " is-playing" : ""),
                  "data-entry-id": String(t.entry_id),
                },
                [
                  el("span", { className: "manifest-no", text: t.track_no != null ? String(t.track_no) : "—" }),
                  el("button", {
                    className: "manifest-play",
                    type: "button",
                    disabled: !t.playable,
                    "aria-label": Player.isPlayingEntry(t.entry_id) ? "Pause" : "Play",
                    onclick: t.playable
                      ? (ev) => {
                          ev.stopPropagation();
                          if (Player.isPlayingEntry(t.entry_id)) {
                            Player.togglePlay();
                          } else {
                            startQueue(playableTracks, queuePos);
                          }
                        }
                      : null,
                  }, [playIcon]),
                  el("button", {
                    className: "manifest-title",
                    type: "button",
                    text: t.title || "(untitled)",
                    onclick: () => viewEntry(t.entry_id),
                  }),
                  el("button", {
                    className: "manifest-queue",
                    type: "button",
                    disabled: !t.playable,
                    "aria-label": "Add to queue",
                    onclick: t.playable
                      ? (ev) => {
                          ev.stopPropagation();
                          queueTrack(t.entry_id, t.title);
                        }
                      : null,
                  }, [queueIcon]),
                ]
              ),
            ])
          );
        }
        detail.appendChild(list);
      }
    }

    mainEl.innerHTML = "";
    mainEl.appendChild(detail);

    for (const btn of resultsEl.querySelectorAll(".result")) {
      if (btn.dataset.entryId === String(entryId)) btn.setAttribute("aria-selected", "true");
    }
  }

  function renderError(message) {
    cardEls = null;
    mainEl.innerHTML = "";
    mainEl.appendChild(
      el("div", { className: "invite error" }, [
        el("p", { className: "lede", text: "Something went wrong." }),
        el("p", { className: "sub", text: message }),
      ])
    );
  }

  function showInvite() {
    activeId = null;
    cardEls = null;
    setMode("library");
    for (const btn of resultsEl.querySelectorAll(".result")) {
      btn.setAttribute("aria-selected", "false");
    }
    mainEl.innerHTML = "";
    mainEl.appendChild(
      el("div", { className: "invite", id: "invite" }, [
        el("p", { className: "lede", text: "Find something to play." }),
        el("p", { className: "sub" }, [
          document.createTextNode("Search across every source you've catalogued — press "),
          el("kbd", { text: "/" }),
          document.createTextNode(" to jump to search."),
        ]),
      ])
    );
  }

  // ---------- URL routing ----------
  //
  // `/entry/{id}`, `/graph`, `/graph/{id}`, and `/player` are the
  // client-side routes besides `/` — reading them on load means an F5 (or a
  // shared link) lands back on the mode/entry you were looking at instead of
  // always resetting to the empty invite screen. The server serves the
  // identical SPA shell for all of them (see player.rs `handles`/`route`);
  // everything past that is client-side.
  function routeFromUrl(push) {
    const path = location.pathname;
    let m;
    if ((m = path.match(/^\/entry\/(\d+)$/))) {
      viewEntry(Number(m[1]), { push });
    } else if ((m = path.match(/^\/graph\/(\d+)$/))) {
      viewGraph(Number(m[1]), { push });
    } else if (path === "/graph") {
      setMode("graph");
    } else if (path === "/player") {
      setMode("player");
    } else if (path === "/import") {
      setMode("import");
    } else if (path === "/settings") {
      setMode("settings");
    } else {
      showInvite();
    }
  }

  window.addEventListener("popstate", () => routeFromUrl(false));
  routeFromUrl(false);

  Ingest.render();
  Settings.render();
  Spotify.render();
  Spotify.handleRedirect();
})();
</script>
</body>
</html>
