        sourceRank(a.s.source) - sourceRank(b.s.source) ||
        a.s.source.localeCompare(b.s.source) ||
        (a.via != null) - (b.via != null) ||
        a.i - b.i
    );

    for (const r of rows) {
      if (CODE_SOURCES.includes(r.s.source)) r.tag = r.s.identifier;
      else if (LINK_SOURCES.includes(r.s.source)) r.tag = hostOf(r.s.identifier);
      else if (counts.get(r.s.source) > 1) r.tag = shortSourceId(r.s.identifier);
    }
    // Two URLs for one id (Apple Music's `us/` and `jp/` storefronts) give
    // the same short id; their paths tell them apart instead.
    for (const r of rows) {
      if (r.tag && !LINK_SOURCES.includes(r.s.source)
          && rows.some((o) => o !== r && o.s.source === r.s.source && o.tag === r.tag)) {
        r.collides = true;
      }
    }
    for (const r of rows) if (r.collides) r.tag = urlPath(r.s.identifier);

    const privacy = new Map((entry.privacy || []).map((p) => [`${p.source}\u0000${p.identifier}`, p]));
    for (const [section, label] of SOURCE_SECTIONS) {
      const inSection = rows.filter((r) => sourceSection(r.s.source) === section);
      if (!inSection.length) continue;
      const stamps = el("div", { className: "stamps" });
      for (const { s, tag, via } of inSection) {
        const stamp = sourceStamp(s, tag, via);
        if (s.source !== "youtube") {
          stamps.appendChild(stamp);
          continue;
        }
        const key = `${s.source}\u0000${s.identifier}`;
        const row = privacy.get(key) || { source: s.source, identifier: s.identifier, provider: null, manual: null };
        privacy.set(key, row);
        stamps.appendChild(el("span", { className: "stamp-group" }, [stamp, privacyChip(row)]));
      }
      host.appendChild(
        el("div", { className: "source-section" }, [el("span", { className: "source-section-label", text: label }), stamps])
      );
    }
  }

  // ---------- splitting an entry's sources apart (see `unmerge.rs`) ----------
  //
  // An entry's own sources and the links that merged them (with what stated
  // each), so the ones that belong to something else can be split off. A
  // split is stored as a barrier: the two sides stay apart from then on,
  // re-imports included, until it's undone from the list below.
  function mountUnmerge(host, entry) {
    const entryId = entry.entry_id;
    const panel = el("div", { className: "merge-picker", hidden: true });
    const toggle = el("button", {
      className: "ghost-btn",
      type: "button",
      text: "Unmerge…",
      onclick: () => {
        panel.hidden = !panel.hidden;
        if (!panel.hidden) loadUnmerge(panel, entryId);
      },
    });
    host.replaceChildren(toggle, panel);
  }

  async function loadUnmerge(panel, entryId) {
    panel.replaceChildren(el("p", { className: "merge-picker-hint", text: "Loading…" }));
    let data;
    try {
      data = await api(`/api/entries/${entryId}/identity`);
    } catch (err) {
      panel.replaceChildren(el("p", { className: "merge-picker-error", text: err.message }));
      return;
    }
    panel.replaceChildren();
    const key = (p) => `${p.source}\u0000${p.identifier}`;
    const names = new Map(data.pairs.map((p) => [key(p), p.name]));
    // The same tag `fillSources` gives a stamp: an ISRC in full, a link's host.
    const tagOf = (p) =>
      CODE_SOURCES.includes(p.source)
        ? p.identifier
        : LINK_SOURCES.includes(p.source)
          ? hostOf(p.identifier)
          : shortSourceId(p.identifier);
    const pairLabel = (p) => {
      const source = SOURCE_LABEL[p.source] || friendlyType(p.source);
      const name = names.get(key(p));
      return name ? `${source} “${name}”` : `${source} ${tagOf(p)}`;
    };
    const errorEl = el("p", { className: "merge-picker-error", hidden: true });

    if (data.pairs.length < 2) {
      panel.appendChild(el("p", { className: "merge-picker-hint", text: "Only one source here; nothing to split off." }));
    } else {
      panel.appendChild(
        el("p", {
          className: "merge-picker-hint",
          text: "Tick the sources that belong to something else. They become their own entry and stay apart from the rest, re-imports included.",
        })
      );
      if (!data.links_complete) {
        panel.appendChild(
          el("p", {
            className: "merge-picker-hint",
            text: "This library's links aren't all recorded yet, so a split re-fetches these sources and may take a while.",
          })
        );
      }
      const picked = new Set();
      const degree = new Map();
      for (const l of data.links) {
        for (const end of [l.a, l.b]) degree.set(key(end), (degree.get(key(end)) || 0) + 1);
      }
      const list = el("ul", { className: "unmerge-list" });
      const cutLabel = el("p", { className: "merge-picker-hint", hidden: true });
      const cutList = el("ul", { className: "unmerge-cut" });
      const submit = el("button", { className: "ghost-btn", type: "button", text: "Split off", disabled: true });
      const update = () => {
        const crossing = data.links.filter((l) => picked.has(key(l.a)) !== picked.has(key(l.b)));
        cutList.replaceChildren(
          ...crossing.map((l) => {
            const by = l.stated_by.map((s) => `${pairLabel(s)}${s.via === "listing" ? " (listing)" : ""}`).join(", ");
            return el("li", { text: `${pairLabel(l.a)} ↔ ${pairLabel(l.b)} — stated by ${by}` });
          })
        );
        cutLabel.hidden = !picked.size;
        cutLabel.textContent = crossing.length
          ? `Links this cuts (${crossing.length}):`
          : "No recorded link joins these to the rest.";
        const n = picked.size;
        submit.disabled = n === 0 || n === data.pairs.length;
        submit.textContent = n ? `Split off ${n} source${n === 1 ? "" : "s"}` : "Split off";
      };
      for (const p of data.pairs) {
        const box = el("input", { type: "checkbox" });
        box.onchange = () => {
          if (box.checked) picked.add(key(p));
          else picked.delete(key(p));
          update();
        };
        const flags = [];
        if (!p.fetched) flags.push("only linked");
        const links = degree.get(key(p)) || 0;
        flags.push(`${links} link${links === 1 ? "" : "s"}`);
        list.appendChild(
          el("li", {}, [
            el("label", { className: "unmerge-row" }, [
              box,
              sourceStamp(p, tagOf(p)),
              p.name ? el("span", { className: "unmerge-name", text: p.name }) : null,
              el("span", { className: "unmerge-flag", text: flags.join(" · ") }),
            ]),
          ])
        );
      }
      submit.onclick = async () => {
        submit.disabled = true;
        errorEl.hidden = true;
        const move = data.pairs
          .filter((p) => picked.has(key(p)))
          .map(({ source, identifier }) => ({ source, identifier }));
        try {
          const res = await postJson(`/api/entries/${entryId}/split`, { move });
          setStatus(`Split ${move.length} source${move.length === 1 ? "" : "s"} off into ${catalogNo(res.split_entry_id)}`);
          await refreshAfterEdit(entryId);
          await loadUnmerge(panel, entryId);
        } catch (err) {
          errorEl.textContent = err.message;
          errorEl.hidden = false;
          update();
        }
      };
      panel.append(list, cutLabel, cutList, submit);
    }

    if (data.barriers.length) {
      panel.appendChild(el("p", { className: "merge-picker-hint", text: "Kept apart" }));
      for (const b of data.barriers) {
        const others = [
          ...new Set(
            b.anchors.flatMap((a) => a.pairs.map((p) => p.entry_id)).filter((id) => id != null && id !== entryId)
          ),
        ];
        const origin = b.origin === "ui"
          ? `split ${new Date(b.created_at * 1000).toLocaleDateString()}`
          : b.origin.replace(/^yaml:/, "from ");
        const undo = el("button", { className: "ghost-btn", type: "button", text: "Undo" });
        undo.onclick = async () => {
          undo.disabled = true;
          errorEl.hidden = true;
          try {
            await del(`/api/barriers/${b.id}`);
            setStatus(`Removed “${b.name}”; whatever links still join them is merged back`);
            await refreshAfterEdit(entryId);
            await loadUnmerge(panel, entryId);
          } catch (err) {
            errorEl.textContent = err.message;
            errorEl.hidden = false;
            undo.disabled = false;
          }
        };
        panel.appendChild(
          el("div", { className: "unmerge-barrier" }, [
            el("span", { className: "unmerge-barrier-name", text: b.name }),
            el("span", { className: "unmerge-flag", text: origin }),
            ...others.map((id) => entryLink(id, catalogNo(id))),
            undo,
          ])
        );
      }
    }
    panel.appendChild(errorEl);
  }

  // Who can see a YouTube source, as the server decides what it may share
  // (the player's Discord status): the user's call, else YouTube's. Only
  // "public" is shared; every other provider's sources always are.
  // Clicking flips it between public and private; flipping back to what
  // YouTube says drops the user's call.
  function privacyChip(row) {
    const byProvider = row.provider;
    const effective = row.manual || byProvider;
    const shared = effective === "public";
    const said = byProvider ? `YouTube says ${byProvider}` : "Privacy unknown";
    const lines = [
      shared ? "Shared (Discord status)" : "Not shared (Discord status)",
      row.manual ? `Set by you; ${said.charAt(0).toLowerCase()}${said.slice(1)}` : said,
      `Click to mark ${shared ? "private" : "public"}`,
    ];
    const chip = el("button", {
      type: "button",
      className:
        "privacy-chip" +
        (shared ? "" : effective ? " is-hidden" : " is-unknown") +
        (row.manual ? " is-manual" : ""),
      text: effective || "unknown",
      title: lines.join("\n"),
      "aria-label": `${effective || "unknown"} — click to mark ${shared ? "private" : "public"}`,
    });
    chip.onclick = () => {
      const want = shared ? "private" : "public";
      const providerShared = byProvider === "public";
      // Back to the provider's word when it already agrees.
      const manual = byProvider && (want === "public") === providerShared ? null : want;
      const before = row.manual;
      row.manual = manual;
      const next = privacyChip(row);
      chip.replaceWith(next);
      next.focus();
      postJson("/api/source-privacy", { source: row.source, identifier: row.identifier, privacy: manual }).catch((err) => {
        row.manual = before;
        next.replaceWith(privacyChip(row));
        setStatus(err.message);
      });
    };
    return chip;
  }

  function sourceStamp(s, tag, via) {
    const href = s.identifier.startsWith("http") ? s.identifier : null;
    const dot = el("span", { className: "dot" });
    dot.style.background = PLATFORM_COLOR[s.source] || "var(--verdigris)";
    const name = LINK_SOURCES.includes(s.source) ? null : SOURCE_LABEL[s.source] || friendlyType(s.source);
    const children = [
      dot,
      name ? el("span", { text: name }) : null,
      tag ? el("span", { className: "stamp-tag", text: tag }) : null,
    ];
    const gone = s.gone_at != null ? `\ndeleted upstream (seen ${new Date(s.gone_at * 1000).toLocaleDateString()})` : "";
    const title = s.identifier + (via != null ? `\nvia ${catalogNo(via)}` : "") + gone;
    const className = "stamp" + (via != null ? " is-via" : "") + (gone ? " is-gone" : "");
    if (href) {
      return el("a", { className, href, target: "_blank", rel: "noopener noreferrer", title }, children);
    }
    return el("span", { className, title }, children);
  }

  // ---------- relations graph (dedup calibration + structure browsing) ----------
  //
  // A soft-identity component is a graph, not a hierarchy — entries link in
  // transitively (A same_identity B, B variant C), so a flattened "list of
  // other members" can't show which specific pair an edge connects, or tell
  // a manual link apart from an automatic one. Rendering the actual graph
  // and editing it directly (click a node pair to link, click an edge to
  // unlink) is both more honest and the only UI that can't silently no-op
  // on the wrong pair. Every edit goes through the server's
  // `record_identity_feedback` — reversible, and logged as real calibration
  // data (`dedup_feedback`), not a UI-only toggle.
  //
  // Structural (`entry_child`) edges ride along in the same graph as
  // read-only context — they're importer-owned facts, not something this UI
  // offers feedback on, so they're rendered distinctly (directed, dashed)
  // and never enter the click-to-link/unlink flow below.

  // A plain string hash (FNV-1a), used in place of Math.random() to seed
  // node starting positions — the same entry_id always hashes to the same
  // spot, so reloading the same graph settles into the same arrangement
  // instead of a fresh random one every time. `salt` gets two independent
  // values (x and y) out of one id without needing a second hash function.
  function hashUnit(id, salt) {
    let h = 0x811c9dc5;
    const s = salt + id;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return (h >>> 0) / 4294967296;
  }

  // d3-force's own internals (forceCollide in particular) call into a
  // random source to jiggle nodes that end up exactly — or, at floating
  // point precision, near enough — coincident, which a graph dense enough
  // to have several hundred nodes settling in a small area hits often
  // enough to matter: that randomness was still leaking into the
  // "deterministic" fixed-tick-count settle (see its call site), degrading
  // right back into "different layout every reload" for large graphs
  // despite the tick count itself being fixed. d3-force has a first-class,
  // documented hook for exactly this — `simulation.randomSource(fn)` swaps
  // in a seeded PRNG (mulberry32) that every force pulls from instead of
  // `Math.random` directly (used at the simulation's creation, below,
  // rather than monkeypatching the global `Math.random` — which wouldn't
  // even reliably work if d3's own module scope cached a reference to it
  // before this code ever runs).
  function mulberry32(seed) {
    return function () {
      seed |= 0;
      seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // The kinds `/api/relations/relate` accepts — mirrors the server's
  // `RELATE_KINDS` allowlist (`src/bin/server/player.rs`). `unrelate` and
  // `restore` also take `derived_from` (the server's `TOGGLE_KINDS`).
  // Every other kind (provider `arrangement` rows, pipeline-only
  // predicates) is read-only here.
  const RELATE_KINDS = [
    "alt_version",
    "live",
    "remix",
    "instrumental",
    "cover",
    "medley",
    "release_variant",
    "in_release_group",
    "same_artist",
  ];
  const RELATE_KIND_SET = new Set(RELATE_KINDS);
  const TOGGLE_RELATION_KIND_SET = new Set(["derived_from"]);
  // The soft-identity ledger's own kinds, owned by link/unlink.
  const IDENTITY_KIND_SET = new Set(["same_identity", "variant"]);
  // `musicdb::EDITION_KINDS`: rows that make two entries editions of one
  // work. New ones go through `/api/relations/derive` (see
  // `connectionControls`), which records which side is the original —
  // what the edition projection needs for the default edition and the
  // rank target.
  const EDITION_KIND_SET = new Set(["derived_from", "alt_version", "live", "remix", "instrumental", "cover", "arrangement"]);
  // What's left to offer as a plain relation once editions go through
  // derive.
  const OTHER_RELATE_KINDS = RELATE_KINDS.filter((kind) => !EDITION_KIND_SET.has(kind));

  // "active" is a live identity link, "blocked" an enabled
  // different_identity row, "edition" an enabled edition row, "related"
  // any other enabled row. "removed" is any disabled row — an unlinked
  // link, a softened block, a rejected suggestion — which the graph hides
  // unless asked (see `showRemoved`). Classified by rule rather than by
  // listing every kind, so a kind this file doesn't know yet can never
  // pass for an identity link.
  function dedupEdgeState(edge) {
    if (!edge.enabled) return "removed";
    if (IDENTITY_KIND_SET.has(edge.kind)) return "active";
    if (edge.kind === "different_identity" || edge.kind === "different_song") return "blocked";
    if (EDITION_KIND_SET.has(edge.kind)) return "edition";
    return "related";
  }

  // The original and derived side of an edition row, from its `extra`
  // (`source_entry`/`derived_entry`); either one alone is enough, the
  // other being the row's other endpoint — `build_edition_projection`
  // reads `derived_entry` the same way. Null when the row records neither,
  // or names an entry that isn't one of its endpoints.
  function editionDirection(edge) {
    if (!EDITION_KIND_SET.has(edge.kind)) return null;
    const ends = [edge.entry_a, edge.entry_b];
    let { source_entry: original, derived_entry: derived } = edge.extra || {};
    if (ends.includes(derived) && !ends.includes(original)) original = ends.find((id) => id !== derived);
    if (ends.includes(original) && !ends.includes(derived)) derived = ends.find((id) => id !== original);
    if (!ends.includes(original) || !ends.includes(derived) || original === derived) return null;
    return { original, derived };
  }

  // `extra.transformation` as one label — the match script emits an array
  // when a track carries several markers.
  function transformationOf(extra) {
    return [extra?.transformation].flat().filter(Boolean).join(" ") || null;
  }

  function pairKey(a, b) {
    return a < b ? `${a}-${b}` : `${b}-${a}`;
  }

  // Kind — and, for an edition, which side is the original — for a new
  // connection between two entries: the graph's "New connection" panel and
  // the "Relate as…" picker. Editions are recorded through
  // `/api/relations/derive`, other kinds through `/api/relations/relate`,
  // and identity through `/api/relations/link`. `nameOf("a"|"b")` labels
  // each side in the original picker; `request(a, b)` sends the choice.
  function connectionControls(nameOf, { identity = false } = {}) {
    const kind = el("select", { className: "graph-detail-relate-select", "aria-label": "Connection kind" }, [
      identity ? el("option", { value: "identity", text: "Same identity (link)" }) : null,
      ...TRANSFORMATIONS.map(([group, opts]) =>
        el(
          "optgroup",
          { label: `Edition: ${group.toLowerCase()}` },
          opts.map(([value, label]) => el("option", { value: `edition:${value}`, text: label }))
        )
      ),
      OTHER_RELATE_KINDS.length
        ? el(
            "optgroup",
            { label: "Other relation" },
            OTHER_RELATE_KINDS.map((k) => el("option", { value: k, text: friendlyType(k) }))
          )
        : null,
    ]);
    const original = el("select", { className: "graph-detail-relate-select", "aria-label": "Original" }, [
      el("option", { value: "", text: "Which is the original?", selected: true, disabled: true }),
      el("option", { value: "a", text: `${nameOf("a")} is the original` }),
      el("option", { value: "b", text: `${nameOf("b")} is the original` }),
    ]);
    const sync = () => {
      original.hidden = !kind.value.startsWith("edition:");
    };
    kind.addEventListener("change", sync);
    sync();
    function request(a, b) {
      if (kind.value === "identity") return postJson("/api/relations/link", { a, b });
      if (kind.value.startsWith("edition:")) {
        if (!original.value) return Promise.reject(new Error("Pick which entry is the original."));
        const [from, to] = original.value === "a" ? [a, b] : [b, a];
        const transformation = kind.value.slice("edition:".length) || null;
        return postJson("/api/relations/derive", { original: from, derived: to, transformation });
      }
      return postJson("/api/relations/relate", { a, b, kind: kind.value });
    }
    return { elements: [kind, original], request };
  }

  const SVG_NS = "http://www.w3.org/2000/svg";
  function svgEl(tag, attrs) {
    const node = document.createElementNS(SVG_NS, tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v !== null && v !== undefined) node.setAttribute(k, v);
    }
    return node;
  }

  // Long titles (often CJK plus emoji, with no clean word-wrap boundary) are
  // truncated rather than wrapped across multiple <tspan> lines — simpler
  // than measuring text metrics to wrap, and the details panel always shows
  // the untruncated title anyway. `Array.from` (not `.slice`) is required
  // here: titles routinely contain emoji outside the BMP, which JS strings
  // store as UTF-16 surrogate pairs — slicing by raw index can cut a pair
  // in half and render as a "�" replacement character.
  function truncateLabel(text, max) {
    if (!text) return text;
    const chars = Array.from(text);
    return chars.length > max ? chars.slice(0, max - 1).join("") + "…" : text;
  }

  // Fixed simulation-space dimensions — the `viewBox` set on the SVG once
  // at creation and never touched again, regardless of how big the
  // `.dedup-graph` container actually renders (window resizes, side panels
  // opening/closing, entry-card vs. fullscreen). The container's CSS
  // `width:100%; height:100%` still scales it to fit visually, but the
  // coordinate space the force simulation itself runs in — node seeding,
  // the centering force, `fitToContent`'s fit math — stays constant, so a
  // resize can't jitter node positions or shift the layout's center out
  // from under an edit/navigation that happened to land mid-resize.
  const GRAPH_CANVAS_WIDTH = 1000;
  const GRAPH_CANVAS_HEIGHT = 640;
  const GRAPH_NODE_RADIUS = 11;
  // Collision radius used to keep labels from overlapping — deliberately
  // much bigger than GRAPH_NODE_RADIUS (the node shape itself), since it's
  // really standing in for "node + its label" and truncateLabel's ~22
  // characters of monospace 10px text run wider than the node alone.
  const GRAPH_LABEL_RADIUS = 46;
  // Screen-space label metrics — must track the `.node-label` CSS rule
  // (10px, monospace) and the `dy` set when a label is created. Since
  // labels are counter-scaled to a fixed screen size (see zoomBehavior's
  // "zoom" handler), these are also fixed screen-pixel values regardless
  // of zoom, not model units. Monospace makes width a cheap, close-enough
  // estimate straight from character count — no per-node getBBox() call
  // (forces a layout reflow) needed just to decide what to hide.
  const LABEL_FONT_SIZE = 10;
  const LABEL_CHAR_WIDTH = LABEL_FONT_SIZE * 0.62;
  const LABEL_LINE_HEIGHT = LABEL_FONT_SIZE * 1.4;
  const LABEL_OFFSET_Y = GRAPH_NODE_RADIUS + 14;
  // Which node kind's label wins when two overlap — the entry you're
  // looking at, then the things you can actually act on (dedup links),
  // then read-only structural context last.
  const GRAPH_LABEL_PRIORITY = { self: 0, member: 1, structural: 2 };
  // Arrowheads: release → track structure, and original → derived edition.
  const STRUCTURAL_MARKER_ID = "graph-arrow-main";
  const EDITION_MARKER_ID = "graph-arrow-edition";

  // The key under the hint. Swatches reuse the graph's own classes and
  // arrow markers (a marker id resolves across inline SVGs in one
  // document), so the legend can't drift from what the graph draws.
  function buildGraphLegend() {
    const lineSwatch = (cls, marker) => {
      const swatch = svgEl("svg", { width: 28, height: 10, "aria-hidden": "true" });
      swatch.appendChild(
        svgEl("line", {
          class: cls,
          x1: 1,
          y1: 5,
          x2: marker ? 22 : 27,
          y2: 5,
          "marker-end": marker ? `url(#${marker})` : null,
        })
      );
      return swatch;
    };
    const nodeSwatch = (cls) => {
      const swatch = svgEl("svg", { width: 16, height: 16, "aria-hidden": "true" });
      const layer = svgEl("g", { class: "nodes", transform: "translate(8,8) scale(0.6)" });
      const node = svgEl("g", { class: `node type-track ${cls}` });
      node.appendChild(svgEl("circle", { r: GRAPH_NODE_RADIUS }));
      node.appendChild(svgEl("circle", { class: "edition-badge", cx: 8, cy: -8, r: 4 }));
      layer.appendChild(node);
      swatch.appendChild(layer);
      return swatch;
    };
    const hullSwatch = svgEl("svg", { width: 18, height: 12, "aria-hidden": "true" });
    hullSwatch.appendChild(
      svgEl("rect", { class: "edition-hull", x: 1, y: 1, width: 16, height: 10, rx: 5, style: "stroke-width:0;opacity:0.3" })
    );
    const items = [
      [lineSwatch("edge dedup active-manual"), "same identity"],
      [lineSwatch("edge dedup edition", EDITION_MARKER_ID), "edition, arrow to derived"],
      [lineSwatch("edge dedup related"), "other relation"],
      [lineSwatch("edge dedup blocked"), "blocked"],
      [lineSwatch("edge dedup removed"), "removed"],
      [lineSwatch("edge structural", STRUCTURAL_MARKER_ID), "release to track"],
      [hullSwatch, "edition group"],
      [nodeSwatch("edition-default"), "default edition"],
      [nodeSwatch("edition-folded"), "scores its original"],
    ];
    return el(
      "ul",
      { className: "graph-legend" },
      items.map(([swatch, text]) => el("li", {}, [swatch, el("span", { text })]))
    );
  }

  // Song view's key: what its tree edges, rings and badges mean.
  function buildSongLegend() {
    const swatch = (draw, w = 28, h = 16) => {
      const svg = svgEl("svg", { width: w, height: h, "aria-hidden": "true" });
      draw(svg);
      return svg;
    };
    const node = (cls, r = 6) =>
      swatch((svg) => {
        const layer = svgEl("g", { class: "nodes", transform: "translate(8,8)" });
        const g = svgEl("g", { class: `node type-track ${cls}` });
        g.appendChild(svgEl("circle", { r }));
        layer.appendChild(g);
        svg.appendChild(layer);
      }, 16);
    const items = [
      [
        swatch((svg) =>
          svg.appendChild(svgEl("line", { class: "edge tree", x1: 1, y1: 8, x2: 22, y2: 8, "marker-end": `url(#${EDITION_MARKER_ID})` }))
        ),
        "made from → version",
      ],
      [node("song-original"), "the original"],
      [node("stacked"), "several uploads of one recording"],
      [node("edition-folded"), "scores its original"],
      [node("conflict"), "contradictory relations"],
    ];
    return el(
      "ul",
      { className: "graph-legend" },
      items.map(([svg, text]) => el("li", {}, [svg, el("span", { text })]))
    );
  }

  // The relations graph is built exactly once (see `graphEditor` below) and
  // its DOM/simulation/node-position state is reused across every entry
  // shown thereafter, rather than torn down and recreated per `viewGraph`
  // call as `buildDedupSection` used to be. That's what makes two things
  // possible:
  //
  //   - Navigating to a different entry morphs the graph instead of
  //     replacing it: `load()` re-fetches and re-joins onto the *same*
  //     node/link data (`currentNodesById`/`currentLinks`) that `update()`
  //     already carries positions over from — nodes common to both entries
  //     keep their spot, newly-relevant ones fade in, no-longer-relevant
  //     ones are removed by d3's own join-exit, all in the same simulation.
  //   - A dedup edit (link/unlink/relate/…) can call `refresh()` — re-fetch
  //     plus the same join — without touching anything outside the graph at
  //     all, instead of the old `viewEntry(entryId, {push:false})` full
  //     detail-view rebuild.
  function createGraphEditor() {
    const section = el("div", { className: "merge-section" });
    // Mutable "what entry is this graph currently anchored on" state —
    // `load()` below is the only thing that changes these. Everything in
    // this function that used to read the old per-call `entryId`/
    // `entryType`/`softLinkedIds` parameters reads these instead.
    let currentEntryId = null;
    let currentEntryType = null;
    let currentSoftLinkedIds = [];
    const labelEl = el("p", { className: "merge-label", text: "Relations" });
    const hintEl = el("p", { className: "merge-picker-hint" });
    // Song view draws the anchor's song as a tree: one node per recording
    // (duplicate uploads collapsed, see `expanded`), each version under
    // what it was made from (`song_parent`, else the original). "All
    // relations" is the raw row graph. View mode only inspects; Edit mode
    // adds the tools (`tool`) and the panel's actions.
    let viewMode = "song";
    let editing = false;
    let tool = "select";
    // Node ids selected in Edit mode (Ctrl+click adds), and identities
    // whose uploads song view draws one by one.
    const selection = new Set();
    const expanded = new Set();
    // Entries waiting for "Move under…": the next node clicked becomes
    // what they were made from, with this transformation.
    let pickParent = null;
    // Versions detached from the anchor's song while it's on screen, by
    // identity: song view keeps drawing them, faded and unattached, so a
    // detach (a Cut stroke included) visibly happens instead of a node just
    // vanishing, and stays one click from "Put back". Cleared on re-anchor.
    const detachedHere = new Map();
    const graphHost = el("div", { className: "dedup-graph" });
    const detailPanel = el("div", { className: "graph-detail-panel" }, [
      el("p", { className: "graph-detail-empty", text: "Click a node for details." }),
    ]);
    const errorEl = el("p", { className: "merge-picker-error", hidden: true });
    // Disabled rows stay hidden unless this is on, or their pair was edited
    // since the anchor last changed (`touchedPairs`) — so a link someone
    // just unlinked stays on screen with its one-click undo.
    let showRemoved = false;
    const touchedPairs = new Set();
    const removedToggle = el("input", { type: "checkbox" });
    const removedToggleText = el("span", { text: "Show removed links" });
    removedToggle.addEventListener("change", () => {
      showRemoved = removedToggle.checked;
      resetSelection();
      if (lastData) buildGraph(lastData);
    });
    const removedLabel = el("label", { className: "graph-removed-toggle" }, [removedToggle, removedToggleText]);

    // A row of mutually exclusive buttons (`aria-pressed`).
    function segmented(name, options, onPick) {
      const buttons = options.map(([value, text]) =>
        el("button", { type: "button", className: "graph-seg-btn", text, "data-value": value, onclick: () => onPick(value) })
      );
      const group = el("div", { className: "graph-seg", role: "group", "aria-label": name }, buttons);
      group.sync = (current) => {
        for (const b of buttons) b.setAttribute("aria-pressed", String(b.dataset.value === current));
      };
      return group;
    }
    const modeSeg = segmented("Mode", [["view", "View"], ["edit", "Edit"]], (value) => {
      editing = value === "edit";
      tool = "select";
      resetSelection();
      if (lastData) buildGraph(lastData);
    });
    const viewSeg = segmented("Show", [["song", "Song"], ["raw", "All relations"]], (value) => {
      viewMode = value;
      resetSelection();
      if (lastData) buildGraph(lastData);
    });
    const toolSeg = segmented("Tool", [["select", "Select"], ["connect", "Connect"], ["cut", "Cut"]], (value) => {
      tool = value;
      resetSelection();
    });
    const undoBtn = el("button", { className: "ghost-btn", type: "button", text: "Undo", onclick: () => undo() });
    const redoBtn = el("button", { className: "ghost-btn", type: "button", text: "Redo", onclick: () => redo() });
    const toolbar = el("div", { className: "graph-toolbar" }, [modeSeg, viewSeg, toolSeg, undoBtn, redoBtn, removedLabel]);
    const stage = el("div", { className: "graph-stage" }, [graphHost, detailPanel]);
    const songLegend = buildSongLegend();
    const rawLegend = buildGraphLegend();
    section.appendChild(labelEl);
    section.appendChild(hintEl);
    section.appendChild(songLegend);
    section.appendChild(rawLegend);
    section.appendChild(toolbar);

    const HINTS = {
      view: "Click a version for its details. Shift+click focuses the graph on it. Switch to Edit to change the song.",
      select:
        "Click a version to select it; Ctrl+click adds to the selection. The panel below detaches, moves or relabels " +
        "what's selected; Delete detaches. Drag an entry in from search to add it.",
      connect: "Click the version something was made from, then the version made from it.",
      cut: "Drag across lines to cut them.",
    };
    function syncToolbar() {
      modeSeg.sync(editing ? "edit" : "view");
      viewSeg.sync(viewMode);
      toolSeg.sync(tool);
      toolSeg.hidden = !editing;
      removedLabel.hidden = viewMode !== "raw";
      songLegend.hidden = viewMode !== "song";
      rawLegend.hidden = viewMode !== "raw";
      undoBtn.disabled = !undoStack.length;
      redoBtn.disabled = !redoStack.length;
      undoBtn.title = undoStack.length ? `Undo: ${undoStack[undoStack.length - 1].label} (Ctrl+Z)` : "Nothing to undo";
      redoBtn.title = redoStack.length ? `Redo: ${redoStack[redoStack.length - 1].label} (Ctrl+Shift+Z)` : "Nothing to redo";
      let hint = editing ? HINTS[tool] : HINTS.view;
      if (editing && tool === "cut" && viewMode === "song") hint = "Drag across lines to detach the versions at their ends.";
      if (pickParent) hint = "Click the version they were made from. Esc cancels.";
      hintEl.textContent = hint;
      graphHost.classList.toggle("tool-cut", editing && tool === "cut");
      graphHost.classList.toggle("tool-connect", editing && tool === "connect");
    }

    // ---- undo/redo ----
    // An entry is either `rows` (relation rows as an edit found them;
    // `/api/relations/rows` writes them back and answers with the rows it
    // replaced, which redo writes back the same way) or a list of identity
    // `calls` with their `inverse` (link/unlink go through the dedup
    // ledger, so they're undone by the opposite judgment).
    const undoStack = [];
    const redoStack = [];
    function record(entry) {
      undoStack.push(entry);
      if (undoStack.length > 100) undoStack.shift();
      redoStack.length = 0;
      syncToolbar();
    }
    async function replay(entry) {
      if (entry.rows) {
        const res = await postJson("/api/relations/rows", { rows: entry.rows });
        return { label: entry.label, rows: res.redo };
      }
      for (const call of entry.calls) await postJson(call.path, call.body);
      return { label: entry.label, calls: entry.inverse, inverse: entry.calls };
    }
    let replaying = false;
    async function step(from, to, verb) {
      if (replaying || !from.length) return;
      replaying = true;
      const entry = from.pop();
      try {
        to.push(await replay(entry));
        flash(`${verb}: ${entry.label}`);
      } catch (err) {
        from.push(entry);
        showError(err.message);
      } finally {
        replaying = false;
        syncToolbar();
        refreshAfterEdit(currentEntryId);
      }
    }
    const undo = () => step(undoStack, redoStack, "Undid");
    const redo = () => step(redoStack, undoStack, "Redid");

    // A short note under the toolbar for what just happened.
    const flashEl = el("p", { className: "graph-flash", hidden: true });
    let flashTimer = null;
    function flash(text) {
      flashEl.textContent = text;
      flashEl.hidden = false;
      clearTimeout(flashTimer);
      flashTimer = setTimeout(() => (flashEl.hidden = true), 4000);
    }
    section.appendChild(flashEl);

    // Sends a `/api/songs/edit` operation and records its undo. A
    // `different_song` block answers 409; `onBlocked` gets its message.
    async function songEdit(label, payload, { onBlocked } = {}) {
      errorEl.hidden = true;
      const res = await fetch("/api/songs/edit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      let body = {};
      try {
        body = await res.json();
      } catch {}
      if (!res.ok) {
        if (res.status === 409 && onBlocked) onBlocked(body.message || "These are marked as different songs.");
        else showError(body.message || `request failed (${res.status})`);
        return false;
      }
      if (body.undo?.length) record({ label, rows: body.undo });
      flash(label);
      refreshAfterEdit(currentEntryId);
      return true;
    }

    // Identity links go through the dedup ledger; undo sends the opposite.
    async function identityEdit(label, call, inverse) {
      errorEl.hidden = true;
      try {
        await postJson(call.path, call.body);
      } catch (err) {
        showError(err.message);
        return;
      }
      record({ label, calls: [call], inverse: [inverse] });
      flash(label);
      refreshAfterEdit(currentEntryId);
    }
    const linkCall = (a, b) => ({ path: "/api/relations/link", body: { a, b } });
    const unlinkCall = (a, b, force = false) => ({ path: "/api/relations/unlink", body: { a, b, force } });

    document.addEventListener("keydown", (e) => {
      if (currentMode !== "graph" || section.hidden) return;
      const active = document.activeElement;
      const typing = active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA" || active.tagName === "SELECT");
      if (typing) return;
      const mod = e.ctrlKey || e.metaKey;
      if (mod && e.key.toLowerCase() === "z") {
        e.preventDefault();
        if (e.shiftKey) redo();
        else undo();
      } else if (mod && e.key.toLowerCase() === "y") {
        e.preventDefault();
        redo();
      } else if (e.key === "Escape") {
        resetSelection();
      } else if (editing && viewMode === "song" && (e.key === "Delete" || e.key === "Backspace") && selection.size) {
        e.preventDefault();
        detachSelection();
      }
    });

    function showError(message) {
      errorEl.hidden = false;
      errorEl.textContent = message;
    }

    // What tells versions with one title apart.
    function nodeMeta(d) {
      const bits = [];
      if (d.artists?.length) bits.push(d.artists.join(", "));
      const year = d.release_date && releaseYear(d.release_date);
      if (year && year !== "—") bits.push(year);
      if (d.duration_ms) bits.push(clockTime(d.duration_ms));
      bits.push(catalogNo(d.entry_id));
      if (d.identitySize > 1) bits.push(`${d.identitySize} uploads`);
      return bits.join(" · ");
    }
    function clockTime(ms) {
      const total = Math.round(ms / 1000);
      return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, "0")}`;
    }
    // A node's name with its first artist, for pickers and role lines.
    function nodeName(n) {
      if (!n) return "?";
      const title = n.title || catalogNo(n.entry_id);
      if (!n.title) return title;
      // Versions mostly share a title: name the performer, else the entry.
      return `${title} (${n.artists?.length ? n.artists[0] : catalogNo(n.entry_id)})`;
    }
    // "cover", "instrumental", ... for a `song_kind`; null when unknown.
    function songKindText(kind) {
      if (!kind) return null;
      const text = kind.transformation || (kind.kind === "derived_from" ? null : kind.kind);
      return text ? friendlyType(text.split(" ")[0]) : null;
    }
    const capitalize = (text) => text.charAt(0).toUpperCase() + text.slice(1);
    function roleText(d) {
      if (d.detached) return "Detached from this song. It stays here, faded, until you leave this song.";
      if (!d.inSong) return viewMode === "song" ? "Not in this song." : null;
      if (d.isOriginal) return "The original.";
      const kind = songKindText(d.songKind);
      const parent = d.songParent ?? d.songOriginal;
      const what = kind ? capitalize(kind) : "A version";
      return `${what} of ${nodeName(currentNodesById.get(String(parent))) || catalogNo(parent)}.`;
    }
    const button = (text, onclick, extra = {}) => el("button", { className: "ghost-btn", type: "button", text, onclick, ...extra });

    // The transformation select, preset to `current`.
    function kindSelect(current) {
      return el(
        "select",
        { className: "graph-detail-relate-select", "aria-label": "Kind of version" },
        TRANSFORMATIONS.map(([group, opts]) =>
          el(
            "optgroup",
            { label: group },
            opts.map(([value, label]) => el("option", { value, text: label, selected: value === (current || "") }))
          )
        )
      );
    }
    const kindOf = (d) => d.songKind?.transformation?.split(" ")[0] || (d.songKind && d.songKind.kind !== "derived_from" ? d.songKind.kind : "");

    function renderDetail(data) {
      detailPanel.innerHTML = "";
      detailPanel.appendChild(el("p", { className: "graph-detail-title", text: data.title || catalogNo(data.entry_id) }));
      const meta = nodeMeta(data);
      detailPanel.appendChild(
        el("p", { className: "graph-detail-type", text: [friendlyType(data.entry_type), meta].filter(Boolean).join(" · ") })
      );
      const role = roleText(data);
      if (role) detailPanel.appendChild(el("p", { className: "graph-detail-role", text: role }));
      const sources = data.sources || [];
      if (sources.length) {
        const stamps = el("div", { className: "stamps" });
        for (const s of sources) stamps.appendChild(stamp(s.source, s.identifier, s.source in PLATFORM_COLOR));
        detailPanel.appendChild(stamps);
      } else {
        detailPanel.appendChild(el("p", { className: "graph-detail-empty", text: "No sources." }));
      }
      if (data.foldsInto != null) {
        const target = currentNodesById.get(String(data.foldsInto));
        detailPanel.appendChild(
          el("p", { className: "graph-detail-empty", text: `Plays score ${target ? nodeName(target) : catalogNo(data.foldsInto)}.` })
        );
      }
      const actions = el("div", { className: "graph-detail-actions" });
      if (viewMode === "song" && data.identitySize > 1) {
        const open = expanded.has(data.identity);
        actions.appendChild(
          button(open ? "Collapse uploads" : `Show ${data.identitySize} uploads`, () => {
            if (open) expanded.delete(data.identity);
            else expanded.add(data.identity);
            if (lastData) buildGraph(lastData);
          })
        );
      }
      if (data.entry_id !== currentEntryId) {
        actions.appendChild(button("Focus graph here", () => viewGraph(data.entry_id)));
      }
      if (actions.children.length) detailPanel.appendChild(actions);
      if (data.detached) {
        const parent = currentNodesById.get(String(data.formerParent));
        detailPanel.appendChild(
          el("div", { className: "graph-detail-actions" }, [
            button(editing ? "Put back" : "Put back (switch to Edit)", () => {
              if (!editing) return;
              songEdit(`Put back ${nodeName(data)}`, {
                op: "set_parent",
                entries: [data.entry_id],
                parent: parent ? data.formerParent : anchorOriginal(),
                transformation: data.formerKind || null,
                unblock: true,
              });
            }),
          ])
        );
        return;
      }
      if (editing && viewMode === "song") detailPanel.appendChild(songActions([data]));
    }

    // Edit actions for one or more versions in song view.
    function songActions(nodes) {
      const box = el("div", { className: "graph-detail-edition" });
      const inSong = nodes.filter((n) => n.inSong);
      const outside = nodes.filter((n) => !n.inSong);
      const ids = (list) => list.map((n) => n.entry_id);
      if (outside.length) {
        box.appendChild(
          el("p", { className: "graph-detail-empty", text: "Attach to this song: pick what it was made from." })
        );
        const kind = kindSelect("cover");
        box.appendChild(
          el("div", { className: "graph-detail-relate" }, [
            kind,
            button("Attach under…", () => startPickParent(outside, kind.value)),
          ])
        );
      }
      if (!inSong.length) return box;
      const single = inSong.length === 1 ? inSong[0] : null;
      const kind = kindSelect(single ? kindOf(single) : "");
      const relabel = button(single ? "Save kind" : "Apply kind", async () => {
        // Each version keeps what it was made from; only the kind changes.
        const byParent = new Map();
        for (const n of inSong) {
          const parent = n.songParent ?? n.songOriginal;
          if (parent == null || n.isOriginal) continue;
          if (!byParent.has(parent)) byParent.set(parent, []);
          byParent.get(parent).push(n.entry_id);
        }
        if (!byParent.size) {
          showError("The original isn't made from anything: pick a version to give it a kind.");
          return;
        }
        const rows = [];
        const label = `Mark ${inSong.length > 1 ? `${inSong.length} versions` : nodeName(single)} as ${friendlyType(kind.value || "other version")}`;
        for (const [parent, entries] of byParent) {
          const res = await rawSongEdit({ op: "set_parent", entries, parent, transformation: kind.value || null });
          if (!res) break;
          rows.push(...res);
        }
        if (rows.length) record({ label, rows });
        flash(label);
        refreshAfterEdit(currentEntryId);
      });
      box.appendChild(el("div", { className: "graph-detail-relate" }, [kind, relabel]));
      const actions = el("div", { className: "graph-detail-actions" });
      if (single && !single.isOriginal) {
        actions.appendChild(
          button("Set as original", () =>
            songEdit(`Make ${nodeName(single)} the original`, { op: "set_original", entry: single.entry_id })
          )
        );
      }
      actions.appendChild(button("Move under…", () => startPickParent(inSong, kind.value)));
      actions.appendChild(
        button(inSong.length > 1 ? `Detach ${inSong.length} versions` : "Detach from song", () => detachNodes(inSong), {
          title: "Take it out of this song for good (Delete)",
        })
      );
      box.appendChild(actions);
      return box;
    }

    // `songEdit` without the bookkeeping, for an action that sends several
    // operations and records them as one undo step. Returns the undo rows,
    // or null after showing the error.
    async function rawSongEdit(payload) {
      try {
        return (await postJson("/api/songs/edit", payload)).undo || [];
      } catch (err) {
        showError(err.message);
        return null;
      }
    }

    function detachNodes(nodes) {
      const leaving = nodes.filter((n) => n.inSong && !n.detached);
      const entries = leaving.map((n) => n.entry_id);
      if (!entries.length) return;
      for (const n of leaving) {
        detachedHere.set(n.identity ?? n.entry_id, {
          ...n,
          formerParent: n.songParent ?? n.songOriginal,
          formerKind: kindOf(n),
        });
      }
      const label = entries.length > 1 ? `Detach ${entries.length} versions` : `Detach ${nodeName(leaving[0])}`;
      songEdit(label, { op: "detach", entries }).then((ok) => {
        if (!ok) for (const n of leaving) detachedHere.delete(n.identity ?? n.entry_id);
      });
    }
    function detachSelection() {
      detachNodes([...selection].map((id) => currentNodesById.get(id)).filter(Boolean));
    }

    function renderSelection() {
      const nodes = [...selection].map((id) => currentNodesById.get(id)).filter(Boolean);
      detailPanel.innerHTML = "";
      detailPanel.appendChild(el("p", { className: "graph-detail-title", text: `${nodes.length} selected` }));
      const list = el("ul", { className: "graph-selection-list" });
      for (const n of nodes) list.appendChild(el("li", { text: `${nodeName(n)} · ${catalogNo(n.entry_id)}` }));
      detailPanel.appendChild(list);
      if (editing && viewMode === "song") detailPanel.appendChild(songActions(nodes));
    }

    function startPickParent(nodes, transformation) {
      pickParent = { nodes, transformation };
      syncToolbar();
      detailPanel.innerHTML = "";
      detailPanel.appendChild(el("p", { className: "graph-detail-title", text: "Move under…" }));
      detailPanel.appendChild(
        el("p", {
          className: "graph-detail-empty",
          text: `Click the version ${nodes.length > 1 ? "these were" : `${nodeName(nodes[0])} was`} made from. Esc cancels.`,
        })
      );
      detailPanel.appendChild(el("div", { className: "graph-detail-actions" }, [button("Cancel", () => resetSelection())]));
    }

    // The second half of "Move under…" (and of Connect in song view):
    // `nodes` were made from `parent`.
    function chooseParent({ nodes, transformation }, parent) {
      pickParent = null;
      syncToolbar();
      const entries = nodes.map((n) => n.entry_id).filter((id) => id !== parent.entry_id);
      if (!entries.length) return;
      const who = entries.length > 1 ? `${entries.length} versions` : nodeName(nodes.find((n) => n.entry_id === entries[0]));
      const kind = transformation ? friendlyType(transformation) : "version";
      const label = `Put ${who} under ${nodeName(parent)} as ${kind}`;
      const payload = { op: "set_parent", entries, parent: parent.entry_id, transformation: transformation || null };
      const blocked = (message) => showBlocked(message, () => songEdit(label, { ...payload, unblock: true }));
      const sameSong = parent.inSong && nodes.every((n) => n.inSong);
      if (sameSong || nodes.every((n) => n.inSong || n.alone)) {
        songEdit(label, payload, { onBlocked: blocked });
        return;
      }
      // Across songs: either take just these versions over, or merge the
      // songs they're in.
      detailPanel.innerHTML = "";
      detailPanel.appendChild(el("p", { className: "graph-detail-title", text: label }));
      detailPanel.appendChild(
        el("p", {
          className: "graph-detail-empty",
          text: "These belong to another song. Move only them, or merge their whole song into this one?",
        })
      );
      detailPanel.appendChild(
        el("div", { className: "graph-detail-actions" }, [
          button("Move only these", () =>
            songEdit(label, { op: "move", entries, parent: parent.entry_id, transformation: transformation || null })
          ),
          button("Merge the songs", () => songEdit(`Merge songs: ${label}`, payload, { onBlocked: blocked })),
          button("Cancel", () => resetSelection()),
        ])
      );
    }

    function showBlocked(message, retry) {
      detailPanel.innerHTML = "";
      detailPanel.appendChild(el("p", { className: "graph-detail-title", text: "Marked as different songs" }));
      detailPanel.appendChild(
        el("p", { className: "graph-detail-empty", text: `${message}. Someone detached one from the other earlier.` })
      );
      detailPanel.appendChild(
        el("div", { className: "graph-detail-actions" }, [
          button("Attach anyway", retry, { title: "Lifts the block between the two songs" }),
          button("Cancel", () => resetSelection()),
        ])
      );
    }

    // ---- SVG skeleton, built once — renderGraph()/update() below only
    // touch the node/edge data joins inside it from here on. ----
    const svg = svgEl("svg", {
      class: "graph-svg",
      viewBox: `0 0 ${GRAPH_CANVAS_WIDTH} ${GRAPH_CANVAS_HEIGHT}`,
    });
    // A single persistent graph editor only ever needs one id per marker —
    // no per-entry suffix needed now that this SVG isn't rebuilt per entry.
    const defs = svgEl("defs");
    for (const [id, cls] of [
      [STRUCTURAL_MARKER_ID, "graph-arrowhead"],
      [EDITION_MARKER_ID, "graph-arrowhead edition"],
    ]) {
      const marker = svgEl("marker", {
        id,
        viewBox: "0 0 10 10",
        refX: 9,
        refY: 5,
        // Fixed size: in the default stroke-width units an edition arrow
        // would grow with its confidence-scaled stroke (`edgeStrokeWidth`).
        markerUnits: "userSpaceOnUse",
        markerWidth: 9,
        markerHeight: 9,
        orient: "auto-start-reverse",
        class: cls,
      });
      marker.appendChild(svgEl("path", { d: "M0,0 L10,5 L0,10 Z" }));
      defs.appendChild(marker);
    }
    const viewport = svgEl("g", { class: "viewport" });
    // Edition-group blobs, painted under everything else (see `updateHulls`).
    const hullLayer = svgEl("g", { class: "hulls" });
    const edgeLayer = svgEl("g", { class: "edges" });
    const nodeLayer = svgEl("g", { class: "nodes" });
    // Labels live in their own layer, stacked above every node — SVG paints
    // in document order, so a label nested inside its own node's <g> (as it
    // used to be) could still end up underneath a *different*, later node's
    // shape wherever the two overlap. Splitting it out means every label
    // paints over every node shape regardless of who's on top of whom
    // otherwise. It's a separate, non-interactive tree: labels already had
    // `pointer-events: none` (see .node-label), so nothing about
    // drag/click/hover handling changes by moving them out of the
    // draggable node <g>.
    const labelLayer = svgEl("g", { class: "labels" });
    // The in-progress "creating a link" line — one node picked, the other
    // end trails the pointer until a second node is clicked (or the
    // gesture is cancelled). Lives in `viewport` (not its own top-level
    // layer) so it shares the same world coordinate space as node
    // positions/zoom-pan; appended last so it always paints over every
    // node/edge it crosses. See `updatePendingLine`.
    const pendingLine = svgEl("line", { class: "pending-link-line" });
    // The Cut tool's stroke, in world coordinates like the edges it cuts.
    const cutPath = svgEl("polyline", { class: "cut-path" });
    viewport.appendChild(hullLayer);
    viewport.appendChild(edgeLayer);
    viewport.appendChild(nodeLayer);
    viewport.appendChild(labelLayer);
    viewport.appendChild(pendingLine);
    viewport.appendChild(cutPath);
    svg.appendChild(defs);
    svg.appendChild(viewport);
    graphHost.appendChild(svg);
    const hoverLabel = el("div", { className: "graph-hover-label", hidden: true });
    graphHost.appendChild(hoverLabel);

    // Labels stay a fixed screen size/offset regardless of zoom, the same
    // way map labels don't grow with the terrain: each label's own
    // `translate(x,y) scale(1/k)` places it at its node's position (same
    // as the node <g>'s own translate) but then cancels the viewport's
    // `scale(k)` for that element alone, leaving everything else's size —
    // the node shapes, the edges — scaling normally. Recomputed on every
    // zoom/pan since the *cancellation factor* depends on the current k,
    // not on anything about the node; recomputed on every tick since the
    // translate half depends on the node's (possibly still-moving)
    // position.
    let currentZoomK = 1;
    function labelTransform(d) {
      return `translate(${d.x},${d.y}) scale(${1 / currentZoomK})`;
    }
    const zoomBehavior = d3
      .zoom()
      .scaleExtent([0.15, 3])
      // The Cut tool drags across the canvas; only the wheel zooms then.
      .filter((event) => !(editing && tool === "cut") || event.type === "wheel")
      .on("zoom", (event) => {
        viewport.setAttribute("transform", event.transform.toString());
        currentZoomK = event.transform.k;
        d3.select(labelLayer).selectAll(".node-label").attr("transform", labelTransform);
        updateLabelVisibility();
      });
    d3.select(svg).call(zoomBehavior);

    // Cytoscape's `cy.fit()` used to re-center/re-scale the camera onto
    // whatever the layout actually produced — seeding node positions inside
    // the container bounds only keeps the *starting* layout framed; once
    // the force simulation's repulsion pushes nodes outward from there,
    // nothing else re-frames the view, so content silently drifts past the
    // visible edges. This is the same idea via d3-zoom's own programmatic
    // transform instead: compute a bounding box over the current node
    // positions and pan/scale to fit it, with a mild zoom-in cap so a
    // single-node graph doesn't fill the container edge-to-edge.
    function fitToContent() {
      if (suppressNextFit) {
        suppressNextFit = false;
        return;
      }
      const nodes = Array.from(currentNodesById.values());
      if (!nodes.length) return;
      const minX = Math.min(...nodes.map((n) => n.x));
      const maxX = Math.max(...nodes.map((n) => n.x));
      const minY = Math.min(...nodes.map((n) => n.y));
      const maxY = Math.max(...nodes.map((n) => n.y));
      const rect = graphHost.getBoundingClientRect();
      const w = Math.max(rect.width, 200);
      // The detail panel floats over the canvas bottom in Graph mode: fit
      // the graph into what it leaves visible.
      const panelCover = detailPanel.parentElement === stage ? detailPanel.offsetHeight : 0;
      const h = Math.max(rect.height - panelCover, 200);
      // Labels keep their screen size at any zoom, so their room is
      // reserved in screen pixels: half a label's width beside the
      // outermost nodes, two lines below the lowest.
      const sidePad = 22 * LABEL_CHAR_WIDTH * 0.5 + 8;
      const topPad = GRAPH_NODE_RADIUS + 12;
      const bottomPad = LABEL_OFFSET_Y + LABEL_LINE_HEIGHT * 2 + 8;
      const scale = Math.min(
        1.5,
        Math.max(w - 2 * sidePad, 50) / Math.max(maxX - minX, 1),
        Math.max(h - topPad - bottomPad, 50) / Math.max(maxY - minY, 1)
      );
      const tx = w / 2 - (scale * (minX + maxX)) / 2;
      const ty = topPad + (h - topPad - bottomPad) / 2 - (scale * (minY + maxY)) / 2;
      d3.select(svg)
        .transition()
        .duration(300)
        .call(zoomBehavior.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
    }

    function showHoverLabel(d) {
      const t = d3.zoomTransform(svg);
      const [x, y] = t.apply([d.x, d.y]);
      hoverLabel.textContent = nodeName(d);
      hoverLabel.style.left = `${x}px`;
      hoverLabel.style.top = `${y}px`;
      hoverLabel.hidden = false;
    }
    function hideHoverLabel() {
      hoverLabel.hidden = true;
    }

    // Edges carry real, otherwise-invisible data (kind/origin/confidence
    // for a dedup edge, disc/track position for a structural one) that
    // color/dash-pattern alone only hints at. Surfaced on hover rather than
    // click since click is already spoken for (link/unlink/force-block —
    // see the hint text above the graph), the same split as a node's own
    // hover-for-title vs. click-for-select/link.
    function edgeHoverText(d) {
      if (d.edgeType === "tree") {
        return `${capitalize(d.kindText || "version")} of ${truncateLabel(nodeName(d.source), 40)}`;
      }
      if (d.edgeType === "identity") return "same recording, another upload";
      if (d.edgeType === "structural") {
        const parts = ["structural"];
        if (d.discNo != null || d.trackNo != null) {
          parts.push(`disc ${d.discNo ?? "?"} · track ${d.trackNo ?? "?"}`);
        }
        return parts.join(" · ");
      }
      const parts = [edgeKindLabel(d)];
      if (d.directed) parts[0] += ` of ${truncateLabel(endpointLabel(d.source), 28)}`;
      else if (EDITION_KIND_SET.has(d.kind)) parts.push("original unknown");
      parts.push(d.origin, EDGE_STATE_LABEL[d.state]);
      if (typeof d.confidence === "number") parts.push(`${Math.round(d.confidence * 100)}% confidence`);
      return parts.filter(Boolean).join(" · ");
    }
    // What an edge says, most specific first: the edition's transformation
    // ("instrumental"), else its kind.
    function edgeKindLabel(d) {
      if (d.transformation) return friendlyType(d.transformation);
      return d.kind === "derived_from" ? "other version" : friendlyType(d.kind);
    }
    // Only the states that change what an edge means; an edition or a
    // relation is just that.
    const EDGE_STATE_LABEL = { active: "linked", blocked: "blocked", removed: "removed" };
    function showEdgeHoverLabel(event, d) {
      const [x, y] = d3.pointer(event, graphHost);
      hoverLabel.textContent = edgeHoverText(d);
      hoverLabel.style.left = `${x}px`;
      hoverLabel.style.top = `${y}px`;
      hoverLabel.hidden = false;
    }

    let selected = null;
    // True while the "pick a kind" panel from a completed node-pair click
    // is showing (see `showCreateLinkPicker`) — distinct from `selected`,
    // which is already back to null by then (the *node*-picking half of the
    // gesture is done; only the kind choice is still pending). Tracked so a
    // background click or a third node click knows there's still an
    // in-progress gesture to cancel/replace even though `selected` alone
    // wouldn't show it.
    let pickerOpen = false;
    // Last known pointer position, in the same world coordinate space as
    // node `x`/`y` (see `updatePendingLine`) — updated on every `mousemove`
    // over the graph, read from both that handler and `ticked()` so the
    // dangling line keeps tracking the pointer even while only the
    // selected node itself is drifting (simulation still settling) and
    // vice versa.
    let pendingMouseX = 0;
    let pendingMouseY = 0;
    // The current node/link datum objects, keyed by id — the single source
    // of truth for both the simulation and the DOM. Kept across renderGraph
    // calls (rather than rebuilt from scratch) so a re-fetch after a click
    // or edit carries over each existing node's live position/velocity/pin
    // instead of visibly resetting it.
    let currentNodesById = new Map();
    let currentLinks = [];
    // The simulation's "end" event also fires after a drag's reheat cools
    // back down — fitting the camera to content at that point would yank
    // the view out from under a rearrangement the user just made by hand.
    // Only a genuine data change (fresh load, a dropped-in node) should
    // trigger a re-fit; dragStarted sets this so the next settle is skipped.
    let suppressNextFit = false;
    // True for the ~300ms window right after `update()` plays the
    // old-position -> new-position morph transition (see `update()`'s end)
    // — `ticked()` skips repositioning while this is set, since the physics
    // has *already* fully settled by then (the fixed-tick-count settle
    // below runs synchronously before any of this) and the live timer's
    // first post-restart tick would otherwise snap every node straight to
    // its final spot, canceling the transition out from under it.
    let morphing = false;
    // Bumped every time `update()` starts a new morph — its `.end()`
    // handler only clears `morphing` if it's still the most recent one, so
    // a morph interrupted by a rapid second re-anchor (its transitions
    // literally cancelled by the new ones landing on the same elements)
    // doesn't clear the flag out from under the newer morph that's still
    // running.
    let morphGeneration = 0;
    // Bumped on every `load()`/`refresh()` call; a fetch that resolves after
    // a newer one started (e.g. a slow relations fetch for an entry the user
    // has since navigated away from) checks this before touching the DOM, so
    // it can't clobber a more recent render with stale data.
    let loadToken = 0;
    // The last relations response, rebuilt without a refetch when "Show
    // removed links" is toggled.
    let lastData = null;

    // Positions/hides the dangling "creating a link" line every frame it
    // could plausibly need to move: on `mousemove` (pointer moved, node
    // stationary) and from `ticked()` (node still settling, pointer
    // stationary). Reads `selected`'s *live* position from
    // `currentNodesById` rather than the stale datum captured at click time
    // — the node keeps moving under the simulation right after it's picked.
    function updatePendingLine() {
      if (selected === null) {
        pendingLine.classList.remove("visible");
        return;
      }
      const node = currentNodesById.get(String(selected));
      if (!node) return;
      pendingLine.classList.add("visible");
      pendingLine.setAttribute("x1", node.x);
      pendingLine.setAttribute("y1", node.y);
      pendingLine.setAttribute("x2", pendingMouseX);
      pendingLine.setAttribute("y2", pendingMouseY);
    }
    svg.addEventListener("mousemove", (event) => {
      if (selected === null) return;
      [pendingMouseX, pendingMouseY] = d3.pointer(event, viewport);
      updatePendingLine();
    });
    // A click that lands on neither a node nor an edge — i.e. empty canvas
    // (or a pan-drag's synthetic click, which d3-zoom itself suppresses
    // before it ever reaches here) — cancels whichever half of the
    // create-a-link gesture is still in progress. Left alone when nothing
    // is pending so an ordinary background click doesn't also blow away an
    // already-open node detail panel.
    svg.addEventListener("click", (event) => {
      if (selected === null && !pickerOpen) return;
      if (event.target.closest(".node") || event.target.closest(".edge-item")) return;
      resetSelection();
    });

    // `distance`/`strength` vary per dedup edge by `d.confidence` (see
    // `edgeLinkDistance`/`edgeLinkStrength` below) — a manual/high-confidence
    // link pulls its pair in tight, a weak automatic suggestion sits looser.
    // For a hub with many same-kind neighbors this turns the uniform
    // charge/link equilibrium (which otherwise settles into an
    // undifferentiated ring, since every spoke has identical distance and
    // strength) into a radial gradient that actually encodes something,
    // instead of only being visible as a stroke-width difference.
    const linkForce = d3
      .forceLink()
      .id((d) => d.id)
      .distance(edgeLinkDistance)
      .strength(edgeLinkStrength);
    // A gentle pull toward the viewport center replaces the old hack of
    // hard-pinning the anchor node (`fx`/`fy` fixed forever) to keep the
    // graph from drifting off-center: that pin froze one node in place while
    // charge/link forces kept moving everything else around it, which reads
    // as an obviously fake "everything orbits a nailed-down point" layout.
    // A low-strength forceX/forceY has no privileged node — it nudges the
    // whole graph's center of mass back toward the middle without ever
    // fully overriding what charge/link settle on, so the layout still
    // looks like one physical system. Target is recomputed in `update()`
    // (the container can resize) and read fresh on every `simulation.nodes()`
    // re-initialization via the closure.
    let centerX = 0;
    let centerY = 0;
    const simulation = d3
      .forceSimulation()
      .randomSource(mulberry32(0x9e3779b9))
      .force("charge", d3.forceManyBody().strength(-60).distanceMin(15).distanceMax(300))
      .force("link", linkForce)
      .force("x", d3.forceX(() => centerX).strength(0.03))
      .force("y", d3.forceY(() => centerY).strength(0.03))
      // Distance/strength jitter alone spreads edges apart, but nothing
      // stopped two nodes from landing on top of each other regardless —
      // that needs actual collision resolution. `randomSource` above exists
      // specifically to make forceCollide's own internal tie-breaking
      // (nudging exactly-coincident nodes apart) deterministic, so this was
      // always meant to be paired with it. Full strength (the default, 1)
      // snaps overlaps back apart hard enough that dragging one node through
      // a dense cluster reads as everything else jiggling rather than
      // settling — softened strength plus a couple of resolution passes
      // spreads that correction out more smoothly instead of overshooting
      // and correcting every tick.
      .force("collide", d3.forceCollide(GRAPH_LABEL_RADIUS).strength(0.6).iterations(2))
      .velocityDecay(0.75)
      .on("tick", ticked)
      .on("end", fitToContent)
      .stop();
    // Reheating this hot during a drag is what feeds the collide jiggle
    // above: alpha scales every force's per-tick impulse, so a high sustained
    // alphaTarget makes neighbors overreact to the dragged node shoving
    // through their collision radius. Lower keeps the drag visibly live
    // (link tension still follows immediately) without amplifying every
    // nearby collision into a visible shudder.
    const ALPHA_DRAG = 0.2;

    // Shared by `ticked()` and `update()`'s morph transition (see
    // `morphing`) — both need the exact same source/target -> line-endpoint
    // math, just fed live simulation positions vs. a transition's
    // interpolated ones, so it takes plain `{x,y}` points rather than
    // reading `d.source`/`d.target` itself.
    function edgeLineCoords(d, source, target) {
      if (d.edgeType === "structural" || d.edgeType === "tree" || d.directed) {
        // Shorten the line short of the target node's edge so the
        // arrowhead is visible instead of hiding under the node shape.
        const dx = target.x - source.x;
        const dy = target.y - source.y;
        const dist = Math.hypot(dx, dy) || 1;
        const r = GRAPH_NODE_RADIUS + 2;
        return { x1: source.x, y1: source.y, x2: target.x - (dx / dist) * r, y2: target.y - (dy / dist) * r };
      }
      return { x1: source.x, y1: source.y, x2: target.x, y2: target.y };
    }

    function ticked() {
      if (morphing) return;
      d3.select(nodeLayer)
        .selectAll(".node")
        .attr("transform", (d) => `translate(${d.x},${d.y})`);
      d3.select(labelLayer).selectAll(".node-label").attr("transform", labelTransform);
      d3.select(edgeLayer)
        .selectAll(".edge-item")
        .each(function (d) {
          // Both the visible line and its wider invisible hitbox sibling
          // (see the edge join in `update()`) share one path — position
          // both at once rather than picking them apart here.
          const { x1, y1, x2, y2 } = edgeLineCoords(d, d.source, d.target);
          d3.select(this).selectAll("line").attr("x1", x1).attr("y1", y1).attr("x2", x2).attr("y2", y2);
          d3.select(this)
            .select(".edge-label")
            .attr("x", (x1 + x2) / 2)
            .attr("y", (y1 + y2) / 2);
        });
      updateHulls();
      updateLabelVisibility();
      updatePendingLine();
    }

    // One blob per edition group with two or more nodes on screen (see
    // `.edition-hull`); a group's nodes all carry its `editionGroup`.
    function updateHulls() {
      const groups = new Map();
      for (const n of viewMode === "raw" ? currentNodesById.values() : []) {
        if (n.editionGroup == null || !(n.editionSize > 1)) continue;
        if (!groups.has(n.editionGroup)) groups.set(n.editionGroup, []);
        groups.get(n.editionGroup).push([n.x, n.y]);
      }
      const hulls = Array.from(groups, ([group, points]) => ({ group, points })).filter((h) => h.points.length > 1);
      d3.select(hullLayer)
        .selectAll(".edition-hull")
        .data(hulls, (h) => h.group)
        .join("path")
        .attr("class", "edition-hull")
        .attr("d", (h) => {
          const ring = (h.points.length > 2 && d3.polygonHull(h.points)) || h.points;
          return `M${ring.map((point) => point.join(",")).join("L")}Z`;
        });
    }

    // Greedy priority-based label culling — the same idea map apps use:
    // place the highest-priority labels first, then skip any lower-
    // priority one whose screen-space box would overlap an already-placed
    // label, rather than letting them pile into unreadable noise. The node
    // shape itself stays visible either way (only `.node-label` is hidden
    // via CSS), and the hover label (showHoverLabel) is what surfaces a
    // culled title on demand, so nothing actually becomes undiscoverable.
    // Recomputed on every tick and every zoom/pan: node *screen* spacing
    // changes with both (zooming in spreads nodes apart in screen space
    // even though each label's own screen size stays fixed), so what's
    // droppable changes too — zooming in should reveal previously-hidden
    // labels once there's room, exactly like a map.
    // A node's label: its title, then (song view) who performs it, since
    // a song's versions mostly share one title.
    function labelLines(n) {
      const lines = [truncateLabel(n.title, 22) || catalogNo(n.entry_id)];
      if (n.subtitle) lines.push(truncateLabel(n.subtitle, 22));
      return lines;
    }
    function updateLabelVisibility() {
      const t = d3.zoomTransform(svg);
      const boxes = Array.from(currentNodesById.values()).map((n) => {
        const [sx, sy] = t.apply([n.x, n.y]);
        const lines = labelLines(n);
        const halfWidth = (Math.max(...lines.map((l) => Array.from(l).length)) * LABEL_CHAR_WIDTH) / 2;
        return {
          id: n.id,
          priority: GRAPH_LABEL_PRIORITY[n.kind] ?? 3,
          left: sx - halfWidth,
          right: sx + halfWidth,
          top: sy + LABEL_OFFSET_Y,
          bottom: sy + LABEL_OFFSET_Y + LABEL_LINE_HEIGHT * lines.length,
        };
      });
      boxes.sort((a, b) => a.priority - b.priority);
      const placed = [];
      const visible = new Set();
      for (const box of boxes) {
        const overlaps = placed.some(
          (p) => box.left < p.right && box.right > p.left && box.top < p.bottom && box.bottom > p.top
        );
        if (!overlaps) {
          placed.push(box);
          visible.add(box.id);
        }
      }
      d3.select(labelLayer)
        .selectAll(".node-label")
        .classed("label-hidden", (d) => !visible.has(d.id));
    }

    function nodeClass(d) {
      return [
        "node",
        d.kind,
        `type-${d.entry_type || "unknown"}`,
        d.entry_id === selected ? "selected-for-link" : "",
        selection.has(d.id) ? "selected" : "",
        d.editionSize > 1 && d.defaultEdition && viewMode === "raw" ? "edition-default" : "",
        d.foldsInto != null ? "edition-folded" : "",
        d.isOriginal ? "song-original" : "",
        d.detached ? "detached" : "",
        d.identitySize > 1 && !expanded.has(d.identity) ? "stacked" : "",
        d.conflict ? "conflict" : "",
      ]
        .filter(Boolean)
        .join(" ");
    }
    function edgeClass(d) {
      if (d.edgeType === "structural") return "edge structural";
      if (d.edgeType === "tree") return "edge tree";
      if (d.edgeType === "identity") return "edge identity-link";
      return [
        "edge",
        "dedup",
        d.state,
        d.state === "active" ? (d.origin === "manual" ? "active-manual" : "active-heuristic") : "",
      ]
        .filter(Boolean)
        .join(" ");
    }

    // Dedup edges carry a real confidence value (manual links are 1.0;
    // automatic RELATE-tier links carry the model's probability) — using it
    // for stroke width means a hub with many same-kind neighbors (identical
    // color/dash pattern otherwise) still reads as "some of these are more
    // certain than others" instead of forty identical spokes. `null` leaves
    // the CSS class's own stroke-width alone (structural edges, or any
    // dedup edge missing a confidence value).
    function edgeMarker(d) {
      if (d.edgeType === "structural") return `url(#${STRUCTURAL_MARKER_ID})`;
      if (d.edgeType === "tree") return `url(#${EDITION_MARKER_ID})`;
      return d.directed && d.enabled ? `url(#${EDITION_MARKER_ID})` : null;
    }
    function edgeStrokeWidth(d) {
      if (d.edgeType !== "dedup" || typeof d.confidence !== "number") return null;
      return `${(1 + d.confidence * 2.5).toFixed(2)}px`;
    }
    // Confidence alone doesn't actually vary in practice — a component's
    // members are overwhelmingly manual/RELATE-confirmed links that all sit
    // at confidence 1.0 — so scaling distance by confidence collapsed to the
    // same constant for every edge and a hub with many members still settled
    // into one perfectly uniform ring (identical distance *and* identical
    // mutual repulsion is exactly the equilibrium that produces a circle).
    // The same is true, worse, for structural (release→track) edges — no
    // confidence field at all, so a release with dozens of tracks is the
    // single most common way to hit this: every child sits at the exact
    // same fixed distance/strength from the same parent, the textbook
    // "spokes settle into a perfect ring" equilibrium.
    //
    // What actually breaks the circle is giving each edge its own
    // distance/strength at all, dedup or structural alike. `hashUnit`
    // (already used to seed node starting positions, see above) gives a
    // per-edge offset that's random-*looking* but stable across reloads —
    // same graph, same jitter, same layout — rather than reintroducing the
    // "different shape every reload" problem the deterministic tick count
    // and seeded random source above exist to avoid.
    function edgeLinkDistance(d) {
      const conf = d.edgeType === "structural" ? 0.7 : typeof d.confidence === "number" ? d.confidence : 0.5;
      const base = 110 - conf * 40; // 82 (structural) / 70 (confident dedup) .. 110 (weak dedup)
      const jitter = (hashUnit(d.id, "link-dist") - 0.5) * 60; // ±30px, stable per edge
      return Math.max(30, base + jitter);
    }
    function edgeLinkStrength(d) {
      const conf = d.edgeType === "structural" ? 0.7 : typeof d.confidence === "number" ? d.confidence : 0.5;
      return 0.35 + conf * 0.25 + hashUnit(d.id, "link-strength") * 0.15;
    }

    // Click vs. drag disambiguation: d3-drag fires start/drag/end for every
    // pointer-down, including a plain click with no movement, and a native
    // `click` listener on the same element would double up with it. Track
    // the *pointer's* total displacement (not the node's) and treat
    // anything under a few pixels as a click — the same "select, then click
    // a target to link" flow as before, just driven by dragend rather than
    // a separate tap event. This has to be the pointer's own movement,
    // specifically not `d.x`/`d.y`: those are also being driven by the
    // simulation independently of the user's input (e.g. residual motion
    // left over from another node's drag-reheat), so comparing the node's
    // position at drag-start vs drag-end could measure the simulation's
    // motion instead of the click and misfire as a drag.
    function dragStarted(event, d) {
      d.__dragStartEventX = event.x;
      d.__dragStartEventY = event.y;
      suppressNextFit = true;
      // Reheating here (on mousedown, before any movement) used to mean a
      // plain press-and-hold with the pointer never moving still kept the
      // whole simulation "hot" for as long as the button stayed down —
      // every neighboring node visibly jiggling even though nothing was
      // actually being dragged anywhere. The reheat now happens in
      // `dragged()` instead, which only fires on real pointer movement, so
      // a stationary hold does nothing and the graph only comes alive once
      // there's an actual drag to respond to.
    }
    function dragged(event, d) {
