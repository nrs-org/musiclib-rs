        frameborder: "no",
      });
      wrapper.appendChild(iframe);
      surfaceEl.appendChild(wrapper);
      const token = mountToken;
      loadSoundcloudApi().then((SC) => {
        // Same staleness guard as `mountYoutube` — the user may have moved
        // on to a different source before the widget API script loaded.
        if (!wrapper.isConnected || token !== mountToken) return;
        const widget = new SC.Widget(iframe);
        widget.bind(SC.Widget.Events.READY, () => {
          if (token !== mountToken) return;
          scWidget = widget;
          applyVolume();
          if (startAt > 0) widget.seekTo(startAt * 1000);
          if (autoplay) widget.play();
          else engineState(false, true);
        });
        widget.bind(SC.Widget.Events.PLAY, () => token === mountToken && engineState(true, true));
        widget.bind(SC.Widget.Events.PAUSE, () => token === mountToken && engineState(false, true));
        widget.bind(SC.Widget.Events.FINISH, () => reportEnded(token));
        widget.bind(SC.Widget.Events.ERROR, () => sourceFailed(token));
      });
      return wrapper;
    }

    // ---- NicoNico: `postMessage`-based `jsapi=1` protocol over a plain
    // iframe (no widget object — unlike YouTube/SoundCloud there's no JS
    // library to load, just a message contract with the embed) ----
    //
    // Unofficial reference (no first-party docs exist —
    // https://gist.github.com/wkurosawa/903630fbcd01b300672053564c3a2916,
    // matches plst4's `Niconico` player): the embed posts `playerStatusChange`
    // ({ data: { playerStatus } }, 2 = playing / 3 = paused / 4 = ended) and
    // `playerMetadataChange` ({ data: { currentTime, duration, ... } }) events,
    // and accepts `play`/`pause`/`seek` ({ data: { time } }) and `volumeChange`
    // ({ data: { volume } }) commands. Every message is tagged with a
    // `playerId` both sides echo back — `nicoPlayerId` is bumped per mount so
    // a message from a since-replaced iframe (still in flight when the user
    // skips tracks) is ignored rather than corrupting the new one's state.
    // `currentTime`/`duration`/`seek`'s `time` are all **milliseconds** —
    // confirmed by watching a live embed's messages, not documented anywhere
    // (the gist above, and plst4, only ever pass/observe `time: 0`, which is
    // unit-ambiguous).
    const NICONICO_ORIGIN = "https://embed.nicovideo.jp";

    window.addEventListener("message", (e) => {
      if (e.origin !== NICONICO_ORIGIN || !nicoIframe) return;
      const msg = e.data;
      if (!msg || String(msg.playerId) !== String(nicoPlayerId)) return;
      const token = mountToken;
      if (msg.eventName === "playerStatusChange") {
        const status = msg.data?.playerStatus;
        if (status === 2) {
          nicoPlaying = true;
          engineState(true, true);
        } else if (status === 3) {
          nicoPlaying = false;
          engineState(false, true);
        } else if (status === 4) {
          nicoPlaying = false;
          reportEnded(token);
        }
      } else if (msg.eventName === "playerMetadataChange") {
        // `currentTime`/`duration` are milliseconds, confirmed against a
        // live embed (undocumented — see the adapter's module doc above);
        // `engineProgress` takes seconds, same as every other provider.
        const { currentTime, duration } = msg.data || {};
        if (typeof currentTime === "number" && typeof duration === "number" && duration > 0) {
          engineProgress(currentTime / 1000, duration / 1000);
        }
      } else if (msg.eventName === "error") {
        sourceFailed(token);
      }
    });

    function nicoPostMessage(msg) {
      if (!nicoIframe) return;
      nicoIframe.contentWindow?.postMessage(
        Object.assign({ sourceConnectorType: 1, playerId: String(nicoPlayerId) }, msg),
        NICONICO_ORIGIN
      );
    }

    function mountNicovideo(embedUrl, { startAt, autoplay }) {
      nicoPlayerId++;
      nicoPlaying = false;
      const myPlayerId = nicoPlayerId;
      const wrapper = el("div", { className: "yt-mount" });
      const iframe = el("iframe", {
        src: `${embedUrl}&playerId=${myPlayerId}`,
        allow: "autoplay; fullscreen",
      });
      wrapper.appendChild(iframe);
      surfaceEl.appendChild(wrapper);
      iframe.addEventListener("load", () => {
        if (!wrapper.isConnected || myPlayerId !== nicoPlayerId) return;
        nicoIframe = iframe;
        localControllable = true;
        renderPlayPause();
        if (autoplay) nicoPostMessage({ eventName: "play" });
        if (startAt > 0) nicoPostMessage({ eventName: "seek", data: { time: startAt * 1000 } });
        if (!autoplay) engineState(false, true);
      });
      return wrapper;
    }

    // Tears down whatever the engine has mounted. Spotify plays via a
    // Connect device, not the DOM — clearing the surface doesn't stop it
    // like it would an iframe, so it has to be released explicitly (which
    // also covers a play request still in flight).
    function clearSurface() {
      if (provider === "spotify") Spotify.release();
      mountToken++;
      surfaceEl.innerHTML = "";
      ytPlayer = null;
      scWidget = null;
      nicoIframe = null;
      spotifyPending = null;
      provider = null;
      engineArtist = "";
      lastMounted = null;
      stopProgressPolling();
    }

    function unmountEngine() {
      clearSurface();
      PlayLog.finish();
      mountedKey = null;
      mountedTrackSeq = null;
      localPlaying = null;
      localControllable = false;
      remoteCardKey = null;
    }

    function mountSource(source, opts) {
      PlayLog.sourceChanged();
      const isSpotify =
        source.provider === "spotify" && Spotify.isConnected() && source.identifier.startsWith(SPOTIFY_TRACK_PREFIX);
      clearSurface();
      const token = mountToken;
      // The source's own provider (a Spotify track without a Spotify
      // connection is still "Spotify" to a remote, just as a bare preview
      // embed), plus whether this engine can actually control it.
      const mounted = () => {
        lastMounted = {
          provider: source.provider,
          identifier: source.identifier,
          controllable: provider !== "other",
        };
        reportMounted();
      };
      surfaceEl.className = "player-dock-surface " + (isSpotify ? "compact" : "video");
      if (isSpotify) {
        provider = "spotify";
        const spotifyId = source.identifier.slice(SPOTIFY_TRACK_PREFIX.length);
        mountSpotify(spotifyId, currentTitle, snap?.current?.entry_id, opts);
        mounted();
        startSpotifyProgressPolling(token);
      } else if (source.provider === "youtube") {
        provider = "youtube";
        const videoId = source.embed_url.split("/").pop();
        mountYoutube(videoId, source.identifier, opts);
        mounted();
        startYoutubeProgressPolling();
      } else if (source.provider === "soundcloud") {
        provider = "soundcloud";
        mountSoundcloud(source.embed_url, opts);
        mounted();
        startSoundcloudProgressPolling();
      } else if (source.provider === "nicovideo") {
        provider = "nicovideo";
        mountNicovideo(source.embed_url, opts);
        mounted();
      } else {
        provider = "other";
        surfaceEl.appendChild(
          el("iframe", { src: source.embed_url, allow: "autoplay; encrypted-media", allowFullscreen: true })
        );
        mounted();
        // No programmatic control over a bare embed at all — it has
        // whatever built-in controls it ships with, if any.
        engineState(true, false);
      }
      // The player dial is per-provider — refresh it to whichever value is
      // stored for the provider just mounted.
      setVolumeUI();
    }

    // Playable sources per entry, for both the engine (what to mount) and
    // the switcher (what else there is). Small and per-session.
    const sourcesCache = new Map();
    function loadSources(entryId) {
      if (!sourcesCache.has(entryId)) {
        const p = api(`/api/entries/${entryId}/playable-sources`)
          .then((r) => r.sources)
          .catch(() => {
            sourcesCache.delete(entryId);
            return [];
          });
        sourcesCache.set(entryId, p);
      }
      return sourcesCache.get(entryId);
    }

    // `loadSources`, fetched again if the cached list lacks `identifier`: a
    // source the finder just attached, maybe from another device.
    function loadSourcesWith(entryId, identifier) {
      return loadSources(entryId).then((list) => {
        if (!identifier || list.some((x) => x.identifier === identifier)) return list;
        sourcesCache.delete(entryId);
        return loadSources(entryId);
      });
    }

    // Mounts what the snapshot says is current, picking up where the
    // session is (a transfer, or a reload resuming): from its position, and
    // playing only if the session is.
    function mountEngine(s, key) {
      clearSurface();
      if (s.track_seq !== mountedTrackSeq) PlayLog.start(s.current.entry_id);
      mountedKey = key;
      mountedTrackSeq = s.track_seq;
      lastSeekSeq = s.seek_seq;
      lastSnapPlaying = s.playing;
      localPlaying = null;
      localControllable = false;
      endedReported = false;
      remoteCardKey = null;
      const startAt = s.position_ms > 1500 ? s.position_ms / 1000 : 0;
      const opts = { startAt, autoplay: s.playing };
      progress = { pos: startAt, at: performance.now(), playing: false, duration: (s.duration_ms || 0) / 1000 };
      renderPlayPause();
      // `Spotify.ready`: a reload resuming a Spotify track must know the
      // server's login before `mountSource` checks `isConnected()`.
      Promise.all([loadSourcesWith(s.current.entry_id, s.source), Spotify.ready]).then(([list]) => {
        if (mountedKey !== key) return;
        // Ordered by this device's Settings-mode source preference, not
        // playable-sources' own (DB-row) order — see
        // `sortByProviderPreference` — starting from an explicit pick if
        // there is one. `sourceFailed` walks on down the list.
        const ordered = sortByProviderPreference(list);
        if (!ordered.length) {
          // Nothing this device can play: offer the finder, then skip,
          // same as when every source fails.
          surfaceEl.className = "player-dock-surface compact";
          surfaceEl.appendChild(el("p", { className: "player-dock-spotify-sub", text: "No playable source." }));
          offerFinder(mountToken, "This track has no playable source.");
          return;
        }
        currentSources = ordered;
        const picked = s.source ? ordered.findIndex((x) => x.identifier === s.source) : -1;
        mountSourceAt(Math.max(picked, 0), opts);
      });
    }

    // Mounts `currentSources[idx]`: the preferred (or explicitly picked)
    // source, or the next one after a failure. Its `mounted` report moves
    // the switcher's pressed button on every device.
    function mountSourceAt(idx, opts) {
      currentSourceIdx = idx;
      mountSource(currentSources[idx], opts);
    }

    // Brings the engine in line with a snapshot while this tab is active:
    // remount on a new track/source, seek on a new `seek_seq`, and
    // play/pause only when the server's `playing` *changes* — a level
    // check would undo a pause made in the embed itself if any other
    // snapshot arrived before that pause's report did.
    function reconcileEngine(s) {
      if (!s.current) {
        if (mountedKey !== null) unmountEngine();
        return;
      }
      const key = `${s.track_seq}|${s.source || ""}`;
      if (key !== mountedKey) {
        mountEngine(s, key);
        return;
      }
      if (s.seek_seq !== lastSeekSeq) {
        lastSeekSeq = s.seek_seq;
        engineSeek(s.position_ms / 1000);
      }
      if (s.playing !== lastSnapPlaying) {
        lastSnapPlaying = s.playing;
        if (s.playing !== localPlaying) s.playing ? enginePlay() : enginePause();
      }
      applyVolume();
    }

    function deviceLabel(id) {
      const d = snap?.devices.find((x) => x.id === id);
      if (!d) return "another device";
      // Two tabs in the same browser share a name; tell them apart.
      const twins = snap.devices.filter((x) => x.name === d.name).length > 1;
      return twins ? `${d.name} (${d.id.slice(0, 4)})` : d.name;
    }

    // What the dock shows on a device that isn't playing: the track, where
    // it's playing (if anywhere), and a way to take it over.
    let remoteCardKey = null;
    function renderRemoteCard() {
      const s = snap;
      const where = s.active_device
        ? `${s.playing ? "Playing" : "Paused"} on ${deviceLabel(s.active_device)}`
        : "Not playing on any device";
      const key = [s.current.entry_id, where].join("|");
      if (key === remoteCardKey) return;
      remoteCardKey = key;
      surfaceEl.className = "player-dock-surface compact";
      surfaceEl.innerHTML = "";
      surfaceEl.appendChild(
        el("div", { className: "player-dock-remote" }, [
          el("img", { src: coverUrl(s.current.entry_id), alt: "", onerror: (e) => e.target.remove() }),
          el("div", { className: "player-dock-remote-text" }, [
            el("p", { className: "player-dock-spotify-title", text: s.current.title || "(untitled)" }),
            el("p", { className: "player-dock-spotify-sub", text: where }),
            el("button", {
              type: "button",
              text: "Play here",
              onclick: () => Remote.command({ type: "transfer", to: Remote.deviceId }).catch(() => {}),
            }),
          ]),
        ].filter(Boolean))
      );
    }

    // ---- video mirror: audio is Spotify-Connect-style (one device), but
    // video is just a view — every other screen shows a muted copy of the
    // active device's video, steered to the session position ----
    //
    // YouTube only: it's the one video provider that can be muted (NicoNico
    // ignores volume/mute, see `volumeControllable`) — a mirror that can't
    // be silenced would just be a second audio device. Anything else shows
    // `renderRemoteCard` instead. Only loaded while this tab is visible and
    // its dock is showing; a hidden or collapsed one doesn't need to stream.
    const MIRROR_DRIFT = 0.75; // seconds off before re-seeking while playing
    const MIRROR_SEEK_COOLDOWN = 2000; // ms: let a seek land before judging it
    let mirror = null; // { key, wrapper, player, ready, lastSeekAt }

    function mirrorVideoId(s) {
      const m = s?.mounted;
      if (!m || m.provider !== "youtube") return null;
      const match = /youtu\.be\/([\w-]+)/.exec(m.identifier) || /[?&]v=([\w-]+)/.exec(m.identifier);
      return match ? match[1] : null;
    }

    function teardownMirror() {
      if (!mirror) return;
      mirror.wrapper.remove();
      mirror = null;
      remoteCardKey = null;
      remoteStripEl.hidden = true;
    }

    function mountMirror(key, videoId) {
      teardownMirror();
      surfaceEl.innerHTML = "";
      surfaceEl.className = "player-dock-surface video";
      const wrapper = el("div", { className: "yt-mount" });
      const placeholder = el("div");
      wrapper.appendChild(placeholder);
      surfaceEl.appendChild(wrapper);
      const m = { key, wrapper, player: null, ready: false, lastSeekAt: 0 };
      mirror = m;
      loadYoutubeApi().then((YT) => {
        if (mirror !== m) return;
        m.player = new YT.Player(placeholder, {
          videoId,
          // No controls: the mirror follows the session, so its own
          // play/seek UI would only fight `syncMirror`.
          playerVars: { playsinline: 1, mute: 1, controls: 0, disablekb: 1, start: Math.floor(progressNow()) },
          events: {
            onReady: (e) => {
              if (mirror !== m) return;
              e.target.mute();
              m.ready = true;
              syncMirror();
            },
            onStateChange: () => mirror === m && syncMirror(),
          },
        });
      });
    }

    // Steers the mirror to the session: play/pause to match, and re-seek
    // when it has drifted (a remote's position is the snapshot
    // extrapolated, re-anchored whenever the server rebroadcasts).
    function syncMirror() {
      const m = mirror;
      if (!m?.ready) return;
      const p = m.player;
      const S = window.YT.PlayerState;
      const st = p.getPlayerState();
      if (st === S.ENDED) return;
      const want = progressNow();
      if (progress.playing && st !== S.PLAYING && st !== S.BUFFERING) p.playVideo();
      else if (!progress.playing && st === S.PLAYING) p.pauseVideo();
      if (st === S.BUFFERING) return;
      const now = performance.now();
      const drift = Math.abs(p.getCurrentTime() - want);
      if (drift > (progress.playing ? MIRROR_DRIFT : 0.3) && now - m.lastSeekAt > MIRROR_SEEK_COOLDOWN) {
        m.lastSeekAt = now;
        p.seekTo(want, true);
      }
    }

    setInterval(syncMirror, 1000);

    // "Playing on … / Play here", under the mirror (the card carries it
    // otherwise).
    function renderRemoteStrip() {
      const s = snap;
      const where = s.active_device
        ? `${s.playing ? "Playing" : "Paused"} on ${deviceLabel(s.active_device)}`
        : "Not playing on any device";
      remoteStripEl.hidden = false;
      remoteStripEl.querySelector(".player-dock-remote-strip-where").textContent = where;
    }

    // The dock surface on a device that isn't playing: the mirror when
    // there's a video to mirror and somewhere to show it, the card
    // otherwise.
    function renderRemoteSurface() {
      if (!snap?.current || isActive()) return;
      const videoId =
        !dockEl.hidden && document.visibilityState === "visible" ? mirrorVideoId(snap) : null;
      if (!videoId) {
        teardownMirror();
        renderRemoteCard();
        return;
      }
      const key = `${snap.track_seq}|${videoId}`;
      if (mirror?.key !== key) mountMirror(key, videoId);
      syncMirror();
      renderRemoteStrip();
    }

    document.addEventListener("visibilitychange", renderRemoteSurface);

    // Source switcher: every playable source of the current track, the
    // mounted one pressed. Picking one is a command, so a remote can switch
    // what the active device plays too.
    let switcherKey = null;
    // ★ Prefer on either dock strip: their pills show −/+ weights instead
    // of switching, until Done.
    let preferEditing = false;
    function renderSwitcher() {
      const s = snap;
      if (finder && finder.trackSeq !== (s?.track_seq ?? null)) closeFinder();
      if (!s?.current) {
        switchEl.innerHTML = "";
        switcherKey = null;
        return;
      }
      const entryId = s.current.entry_id;
      const picked = s.mounted?.identifier || s.source || null;
      loadSourcesWith(entryId, picked).then((list) => {
        if (snap?.current?.entry_id !== entryId) return;
        const ordered = sortByProviderPreference(list);
        const key = [
          entryId,
          picked,
          preferEditing,
          dockFinderOpen(),
          ordered.map((x) => `${x.identifier}=${x.preferred_weight || 0}`).join(","),
        ].join("|");
        if (key === switcherKey) return;
        switcherKey = key;
        switchEl.innerHTML = "";
        const findBtn = el("button", {
          className: "find-btn",
          type: "button",
          text: "Find source",
          title: "Search YouTube Music and Spotify for this track",
          "aria-expanded": String(dockFinderOpen()),
          onclick: () => (dockFinderOpen() ? closeFinder() : findForCurrent()),
        });
        if (ordered.length <= 1) {
          switchEl.appendChild(findBtn);
          return;
        }
        for (const src of ordered) {
          switchEl.appendChild(
            preferPill({
              className: "",
              label: src.provider,
              current: src.identifier === picked,
              weight: src.preferred_weight || 0,
              editing: preferEditing,
              onPick: () => Remote.command({ type: "select_source", identifier: src.identifier }).catch(() => {}),
              setWeight: (w) => setSourceWeight(src, w),
            })
          );
        }
        switchEl.appendChild(findBtn);
        switchEl.appendChild(preferToggle(preferEditing, togglePreferEditing));
      });
    }

    function togglePreferEditing() {
      preferEditing = !preferEditing;
      renderSwitcher();
      fillDockEditions();
    }

    // `src` is the cached `loadSources` row, so updating it in place keeps
    // the switcher right without refetching.
    function setSourceWeight(src, weight) {
      const before = src.preferred_weight || 0;
      src.preferred_weight = weight;
      renderSwitcher();
      postJson("/api/preferred-source", { source: src.provider, identifier: src.identifier, weight }).catch((err) => {
        src.preferred_weight = before;
        renderSwitcher();
        setStatus(err.message);
      });
    }

    // Edition switcher (the dock strip under the source switcher): the
    // current track's other editions, e.g. the instrumental. Picking one
    // replaces it in the queue for every device. Editions aren't all
    // playable, so look before replacing.
    let editionsEntryId = null;
    let dockEditions = [];
    let editionsRequest = 0;
    // `reload` refetches the current track's editions (the library
    // changed), keeping the strip shown until they arrive.
    function renderEditions(reload = false) {
      const entryId = snap?.current?.entry_id ?? null;
      if (entryId === editionsEntryId && !reload) return;
      if (entryId !== editionsEntryId) {
        editionsEntryId = entryId;
        dockEditions = [];
        fillDockEditions();
      }
      if (entryId == null) return;
      const my = ++editionsRequest;
      api(`/api/entries/${entryId}`)
        .then((entry) => {
          if (my !== editionsRequest) return;
          dockEditions = entry.editions || [];
          fillDockEditions();
        })
        .catch(() => {});
    }

    LibraryChanges.subscribe(() => {
      sourcesCache.clear();
      renderSwitcher();
      renderEditions(true);
    });

    function fillDockEditions() {
      fillEditions(dockEditionsEl, dockEditions, switchEdition, {
        editing: preferEditing,
        setWeight: setEditionWeight,
        toggle: togglePreferEditing,
      });
    }

    function setEditionWeight(ed, weight) {
      const before = ed.preferred_weight || 0;
      ed.preferred_weight = weight;
      fillDockEditions();
      postJson(`/api/entries/${ed.entry_id}/preferred-edition`, { weight }).catch((err) => {
        ed.preferred_weight = before;
        fillDockEditions();
        setStatus(err.message);
      });
    }

    async function switchEdition(ed) {
      const current = snap?.current;
      if (!current) return;
      const sources = await loadSources(ed.entry_id);
      if (snap?.current?.entry_id !== current.entry_id) return;
      const item = { entry_id: ed.entry_id, title: ed.title || current.title || null };
      const play = () => Remote.command({ type: "replace_current", item }).catch((err) => setStatus(err.message));
      if (!sources.length) {
        // An unlinked edition: find it a source, then play it.
        openFinder({
          entryId: ed.entry_id,
          title: ed.title || current.title,
          artist: ed.artists?.[0] ?? null,
          reason: `The ${friendlyType(editionKind(ed))} edition has nothing to play yet.`,
          onAttached: () => {
            sourcesCache.delete(ed.entry_id);
            if (snap?.current?.entry_id === current.entry_id) play();
          },
        });
        return;
      }
      play();
    }

    // ---- source finder (`find_source.rs`) ----
    //
    // Searches YouTube Music and Spotify for a track and attaches the pick
    // as one of its sources (imported, then linked as the same recording).
    // Opened by hand from the source strip's "Find source" or an unlinked
    // edition, and by itself when every source of the playing track failed
    // here (a geoblocked upload): the track then still skips after
    // `FIND_SKIP_S`, unless the finder is touched first. An entry page with
    // nothing to play opens it in its own `host` instead of the dock, which
    // only shows while a track is loaded. One finder is open at a time.
    const findEl = document.getElementById("player-dock-find");
    const FIND_SKIP_S = 15;
    // Off by more than this from the track's own length: probably another cut.
    const FIND_LENGTH_SLACK_MS = 5000;
    let finder = null;

    function openFinder({ entryId, title, artist = null, reason = null, skipToken = null, onAttached = null, host = findEl }) {
      closeFinder();
      const query = [title, artist].filter(Boolean).join(" ");
      finder = {
        host,
        entryId,
        title,
        reason,
        onAttached,
        trackSeq: snap?.track_seq ?? null,
        input: el("input", {
          type: "search",
          value: query,
          placeholder: "Search YouTube Music and Spotify",
          "aria-label": "Search for a source",
        }),
        results: null,
        errors: [],
        durationMs: null,
        searching: false,
        attaching: null,
        status: null,
        request: 0,
        skipToken,
        skipLeft: skipToken != null ? FIND_SKIP_S : null,
        skipEl: null,
        timer: null,
      };
      if (skipToken != null) {
        const f = finder;
        f.timer = setInterval(() => {
          if (finder !== f || f.skipLeft == null) return;
          f.skipLeft -= 1;
          if (f.skipLeft > 0) {
            if (f.skipEl) f.skipEl.textContent = `skipping in ${f.skipLeft}s`;
            return;
          }
          closeFinder();
          reportEnded(f.skipToken);
        }, 1000);
      }
      renderFinder();
      renderSwitcher();
      runFind();
    }

    function findForCurrent() {
      const cur = snap?.current;
      if (!cur) return;
      openFinder({
        entryId: cur.entry_id,
        title: cur.title,
        artist: snap.artist || null,
        onAttached: (res) => playAttached(cur.entry_id, res),
      });
    }

    // Every source of the playing track failed on this device (or it has
    // none): open the finder on it, with the skip counting down.
    function offerFinder(token, reason) {
      const cur = snap?.current;
      if (!cur) {
        setTimeout(() => reportEnded(token), 1200);
        return;
      }
      openFinder({
        entryId: cur.entry_id,
        title: cur.title,
        artist: snap.artist || null,
        reason,
        skipToken: token,
        onAttached: (res) => playAttached(cur.entry_id, res),
      });
      setExpanded(true);
    }

    function playAttached(entryId, res) {
      sourcesCache.delete(entryId);
      if (snap?.current?.entry_id !== entryId) return;
      Remote.command({ type: "select_source", identifier: res.identifier }).catch((err) => setStatus(err.message));
    }

    function stopFinderSkip() {
      if (!finder) return;
      clearInterval(finder.timer);
      finder.timer = null;
      finder.skipLeft = null;
      if (finder.skipEl) finder.skipEl.textContent = "skip paused";
    }

    function closeFinder() {
      if (!finder) return;
      const { host } = finder;
      clearInterval(finder.timer);
      finder = null;
      host.hidden = true;
      host.innerHTML = "";
      renderSwitcher();
    }

    function dockFinderOpen() {
      return finder?.host === findEl;
    }

    // Touching the finder means someone's looking: hold the skip. Only the
    // countdown text changes, so the press still lands on its button.
    for (const type of ["pointerdown", "keydown", "focusin"]) {
      findEl.addEventListener(type, () => {
        if (finder?.skipLeft != null) stopFinderSkip();
      });
    }

    async function runFind() {
      const f = finder;
      if (!f) return;
      const q = f.input.value.trim();
      if (!q) return;
      const my = ++f.request;
      f.searching = true;
      f.status = null;
      renderFinder();
      try {
        const r = await api(`/api/entries/${f.entryId}/find-sources?q=${encodeURIComponent(q)}`);
        if (finder !== f || my !== f.request) return;
        f.results = r.results || [];
        f.errors = r.errors || [];
        f.durationMs = r.duration_ms ?? null;
      } catch (err) {
        if (finder !== f || my !== f.request) return;
        f.results = [];
        f.status = err.message;
      }
      f.searching = false;
      renderFinder();
    }

    async function attachPick(c) {
      const f = finder;
      if (!f || f.attaching) return;
      stopFinderSkip();
      f.attaching = c.identifier;
      f.status = c.entry_id ? "Linking…" : "Importing…";
      renderFinder();
      try {
        const { job_id } = await postJson(`/api/entries/${f.entryId}/attach-source`, { url: c.identifier });
        let view;
        for (;;) {
          view = await api(`/api/jobs/${job_id}`);
          if (view.status !== "pending" && view.status !== "running") break;
          if (finder === f && view.progress?.message) {
            f.status = view.progress.message;
            renderFinder();
          }
          await new Promise((r) => setTimeout(r, 700));
        }
        if (view.status !== "succeeded") throw new Error(view.error?.message || `Attaching ${view.status}.`);
        LibraryChanges.changed();
        if (finder === f) closeFinder();
        f.onAttached?.(view.result);
      } catch (err) {
        if (finder !== f) {
          setStatus(err.message);
          return;
        }
        f.attaching = null;
        f.status = err.message;
        renderFinder();
      }
    }

    function renderFinder() {
      const f = finder;
      if (!f) return;
      f.host.hidden = false;
      f.skipEl =
        f.skipToken != null
          ? el("span", { className: "find-skip", text: f.skipLeft != null ? `skipping in ${f.skipLeft}s` : "skip paused" })
          : null;
      const head = el("div", { className: "find-head" }, [
        el("span", { className: "find-title", text: `Find a source · ${f.title || "this track"}`, title: f.title || null }),
        f.skipEl,
        f.skipToken != null
          ? el("button", {
              type: "button",
              text: "Skip",
              onclick: () => {
                const token = f.skipToken;
                closeFinder();
                reportEnded(token);
              },
            })
          : null,
        el("button", { type: "button", text: "Close", onclick: closeFinder }),
      ]);
      const form = el(
        "form",
        {
          className: "find-form",
          onsubmit: (e) => {
            e.preventDefault();
            runFind();
          },
        },
        [f.input, el("button", { type: "submit", text: f.searching ? "Searching…" : "Search", disabled: f.searching })]
      );
      const notes = [];
      if (f.durationMs) notes.push(`Track length ${formatTime(f.durationMs / 1000)}`);
      for (const e of f.errors) notes.push(`${e.provider}: ${e.message}`);
      const rows = (f.results || []).map((c) => {
        const tags = [c.provider === "spotify" ? "spotify" : `yt ${c.kind}`];
        if (c.linked) tags.push("this track");
        else if (c.entry_id) tags.push("in library");
        const off = f.durationMs && c.duration_ms && Math.abs(c.duration_ms - f.durationMs) > FIND_LENGTH_SLACK_MS;
        return el(
          "button",
          {
            className: "find-row",
            type: "button",
            disabled: c.linked || !!f.attaching,
            "aria-busy": String(f.attaching === c.identifier),
            title: c.linked ? "Already a source of this track" : c.identifier,
            onclick: () => attachPick(c),
          },
          [
            c.thumbnail
              ? el("img", { className: "find-thumb", src: c.thumbnail, alt: "", loading: "lazy", referrerpolicy: "no-referrer" })
              : el("span", { className: "find-thumb" }),
            el("div", {}, [
              el("div", { className: "find-name", text: c.title || c.identifier }),
              el("div", { className: "find-sub" }, [
                el("span", { className: "find-tag", text: tags.join(" · ") }),
                el("span", { text: [c.artists.join(", "), c.album].filter(Boolean).join(" · ") }),
              ]),
            ]),
            el("span", {
              className: "find-len",
              "data-off": off ? "" : null,
              title: off ? "Not the track's length: maybe another cut" : null,
              text: c.duration_ms ? formatTime(c.duration_ms / 1000) : "",
            }),
          ]
        );
      });
      f.host.replaceChildren(
        ...[
          head,
          f.reason ? el("p", { className: "find-reason", text: f.reason }) : null,
          form,
          notes.length ? el("p", { className: "find-note", text: notes.join(" · ") }) : null,
          f.status ? el("p", { className: "find-note", text: f.status }) : null,
          rows.length
            ? el("div", { className: "find-results" }, rows)
            : f.results && !f.searching
              ? el("p", { className: "find-note", text: "No results. Try other words." })
              : null,
        ].filter(Boolean)
      );
    }

    // Renders either "up next" (default, floating dock) or the full queue
    // with the current track marked (stage mode, Player mode's big screen)
    // — same panel, reused rather than duplicated. Only rebuilt when the
    // queue's shape actually changed, not on every progress snapshot, so
    // it doesn't flicker under the pointer.
    let lastQueueKey = null;
    function renderDockQueue() {
      const rows = snap?.queue || [];
      const pos = rows.findIndex((r) => r.is_current);
      const items = stageMode ? rows : rows.slice(pos + 1);
      const key = [stageMode, hasTrack(), JSON.stringify(items)].join("|");
      if (key === lastQueueKey) return;
      lastQueueKey = key;
      dockQueueEl.innerHTML = "";
      if (!hasTrack()) {
        dockQueueEl.hidden = true;
        return;
      }
      dockQueueEl.hidden = false;
      dockQueueEl.appendChild(el("p", { className: "player-dock-queue-label", text: stageMode ? "Queue" : "Up next" }));
      if (!items.length) {
        dockQueueEl.appendChild(el("p", { className: "player-dock-queue-empty", text: "Nothing queued." }));
        return;
      }
      // Divider between the explicitly-queued layer and Post-queue (the
      // background playlist — shuffle-all/tracklist continuation/
      // auto-recommend filler): shown once, right before the first
      // Post-queue row, and only if something (current or queued) actually
      // preceded it — otherwise the panel's own header already says it all.
      let sawNonPostQueueRow = false;
      for (const item of items) {
        const isCurrent = !!item.is_current;
        if (isCurrent || !item.is_post_queue) {
          sawNonPostQueueRow = true;
        } else if (sawNonPostQueueRow) {
          dockQueueEl.appendChild(el("p", { className: "player-dock-queue-divider", text: "Post-queue" }));
          sawNonPostQueueRow = false;
        }
        const removeBtn = el("button", {
          type: "button",
          className: "player-dock-queue-remove",
          "aria-label": "Remove from queue",
          disabled: isCurrent,
          onclick: isCurrent
            ? null
            : () => Remote.command({ type: "remove", order_index: item.order_index }).catch(() => {}),
        });
        removeBtn.innerHTML = svgIcon("x", 12);
        dockQueueEl.appendChild(
          el("div", { className: "player-dock-queue-row" + (isCurrent ? " is-current" : "") }, [
            artBox(item.entry_id, "queue-thumb", item.title),
            el("button", {
              type: "button",
              className: "player-dock-queue-jump",
              text: item.title || "(untitled)",
              onclick: () => Remote.command({ type: "jump", order_index: item.order_index }).catch(() => {}),
            }),
            removeBtn,
          ])
        );
      }
    }

    function renderDevices() {
      devicesBtn.classList.toggle("is-remote", !!snap?.active_device && !isActive());
      if (devicesEl.hidden || !snap) return;
      devicesEl.innerHTML = "";
      devicesEl.appendChild(el("p", { className: "player-devices-label", text: "Play on" }));
      for (const d of snap.devices) {
        const self = d.id === Remote.deviceId;
        const active = d.id === snap.active_device;
        devicesEl.appendChild(
          el(
            "button",
            {
              type: "button",
              role: "menuitemradio",
              "aria-checked": String(active),
              onclick: () => {
                closeDevices();
                if (!active) Remote.command({ type: "transfer", to: d.id }).catch(() => {});
              },
            },
            [
              el("span", { text: deviceLabel(d.id) }),
              self ? el("span", { className: "player-devices-note", text: "this tab" }) : null,
            ].filter(Boolean)
          )
        );
      }
    }

    function closeDevices() {
      devicesEl.hidden = true;
      devicesBtn.setAttribute("aria-expanded", "false");
    }

    devicesBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      devicesEl.hidden = !devicesEl.hidden;
      devicesBtn.setAttribute("aria-expanded", String(!devicesEl.hidden));
      renderDevices();
    });
    document.addEventListener("click", (e) => {
      if (!devicesEl.hidden && !devicesEl.contains(e.target)) closeDevices();
    });

    function onSnapshot(s) {
      snap = s;
      currentTitle = s.current?.title || "";
      if (s.volume) {
        if (performance.now() - volumeEditedAt > 600) {
          volumeGlobal = s.volume.global;
          volumeByProvider = { ...s.volume.by_provider };
          muted = s.volume.muted;
        }
      } else {
        seedVolume();
      }

      if (isActive()) {
        teardownMirror();
        reconcileEngine(s);
      } else {
        if (mountedKey !== null) unmountEngine();
        progress = {
          pos: s.position_ms / 1000,
          at: performance.now(),
          playing: s.playing,
          duration: (s.duration_ms || 0) / 1000,
        };
        if (!s.current) {
          teardownMirror();
          surfaceEl.innerHTML = "";
          remoteCardKey = null;
        }
      }

      const has = hasTrack();
      barEl.hidden = !has;
      document.body.classList.toggle("has-player", has);
      if (!has) dockEl.hidden = true;
      else if (dockEl.hidden && (expanded || stageMode)) setExpanded(expanded);
      // After the dock's visibility is settled — the mirror only loads
      // into a dock that's showing.
      renderRemoteSurface();
      if (has) {
        const p = s.mounted?.provider;
        const artists = s.artists || [];
        const rest = artists.length ? [] : [currentArtist() || (p ? providerLabel(p) : null)];
        if (!isActive()) {
          rest.push(s.active_device ? `on ${deviceLabel(s.active_device)}` : "not playing");
        }
        updateBarMeta(currentTitle, artists, rest.filter(Boolean), coverUrl(s.current.entry_id));
      }
      prevBtn.disabled = !s.has_prev;
      nextBtn.disabled = !s.has_next;
      shuffleBtn.setAttribute("aria-pressed", String(s.shuffled));
      repeatBtn.setAttribute("aria-pressed", String(s.repeat !== "off"));
      repeatBtn.innerHTML = svgIcon(s.repeat === "one" ? "repeat-1" : "repeat", 13);
      repeatBtn.setAttribute(
        "aria-label",
        s.repeat === "off" ? "Repeat off" : s.repeat === "all" ? "Repeat all" : "Repeat one"
      );
      renderPlayPause();
      renderProgress();
      syncMediaSession(true);
      setVolumeUI();
      renderSwitcher();
      renderEditions();
      renderDockQueue();
      renderDevices();
      if (stageMode) syncStagePosition();
      onChangeCallback?.();
    }

    // Play/pause. On the active device this drives the embed directly
    // (inside the click's user gesture, which autoplay policies want) and
    // the embed's report updates everyone else; anywhere else it's a
    // command — and with nobody playing, "play" makes this tab the player.
    function togglePlay() {
      if (isActive() && localControllable) {
        if (localPlaying) enginePause();
        else enginePlay();
        return;
      }
      if (!snap?.current) return;
      Remote.command({ type: snap.active_device ? "toggle" : "play" }).catch(() => {});
    }

    function isPlayingEntry(entryId) {
      return snap?.current?.entry_id === entryId;
    }

    prevBtn.addEventListener("click", () => Remote.command({ type: "prev" }).catch(() => {}));
    nextBtn.addEventListener("click", () => Remote.command({ type: "next" }).catch(() => {}));
    playPauseBtn.addEventListener("click", togglePlay);
    shuffleBtn.addEventListener("click", () => Remote.command({ type: "toggle_shuffle" }).catch(() => {}));
    repeatBtn.addEventListener("click", () => Remote.command({ type: "cycle_repeat" }).catch(() => {}));

    // ---- Media Session: the OS media controls of this device (a phone's
    // lock screen and notification, headset keys) ----
    //
    // Describes the session's track from the library rather than the
    // embed's own idea of it (a YouTube embed publishes its video title and
    // channel), and routes the OS buttons through the bar's paths. Which
    // session the OS shows when the audio comes from a cross-origin iframe
    // is still the browser's call. On the machine running the server, the
    // server publishes the session itself (`media_controls.rs`), whichever
    // device plays.
    function isPlayingNow() {
      return isActive() ? !!localPlaying : !!snap?.playing;
    }

    // Browsers hand the OS controls to a frame that's playing audio, and
    // the audio is in the embed's cross-origin iframe, whose own session
    // (the video's title, no queue) wins over this frame's. A looping,
    // effectively silent clip here, playing while the engine plays, makes
    // this frame a playing one too.
    let silentAudio = null;

    function silentClipUrl() {
      const rate = 8000;
      const samples = rate;
      const buf = new ArrayBuffer(44 + samples * 2);
      const v = new DataView(buf);
      const ascii = (at, s) => [...s].forEach((c, i) => v.setUint8(at + i, c.charCodeAt(0)));
      ascii(0, "RIFF");
      v.setUint32(4, 36 + samples * 2, true);
      ascii(8, "WAVE");
      ascii(12, "fmt ");
      v.setUint32(16, 16, true);
      v.setUint16(20, 1, true); // PCM
      v.setUint16(22, 1, true); // mono
      v.setUint32(24, rate, true);
      v.setUint32(28, rate * 2, true);
      v.setUint16(32, 2, true);
      v.setUint16(34, 16, true);
      ascii(36, "data");
      v.setUint32(40, samples * 2, true);
      // ±1 LSB rather than zeros: about −90 dBFS, inaudible, but a browser
      // that treats digitally silent media as not playing still counts it.
      for (let i = 0; i < samples; i++) v.setInt16(44 + i * 2, i % 2 ? 1 : -1, true);
      return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
    }

    function syncSilentAudio() {
      if (!(isActive() && localPlaying)) {
        silentAudio?.pause();
        return;
      }
      if (!silentAudio) {
        silentAudio = new Audio(silentClipUrl());
        silentAudio.loop = true;
      }
      // Refused without a user gesture yet; a later sync retries.
      if (silentAudio.paused) silentAudio.play().catch(() => {});
    }

    // The library's credits, else what the playing source says (this
    // device's embed first: it knows before the session does).
    function currentArtist() {
      return snap?.artist || engineArtist || snap?.mounted?.artist || "";
    }

    function setEngineArtist(artist) {
      if ((artist || "") === engineArtist) return;
      engineArtist = artist || "";
      reportMounted();
      syncMediaSession();
    }

    /// What this device mounted, with the source's artist once it's known
    /// (often after mounting): the session hands it on to remotes and the
    /// server's OS media controls.
    function reportMounted() {
      if (lastMounted) report({ mounted: { ...lastMounted, artist: engineArtist || null } });
    }

    /// Sets an action's handler only when it changes, so the OS's buttons
    /// enable and disable with the bar's.
    function setMediaAction(action, fn) {
      if (mediaActions[action] === fn) return;
      mediaActions[action] = fn;
      try {
        mediaSession.setActionHandler(action, fn);
      } catch {
        // An action this browser doesn't support.
      }
    }

    const mediaPrev = () => Remote.command({ type: "prev" }).catch(() => {});
    const mediaNext = () => Remote.command({ type: "next" }).catch(() => {});

    /// `force` sends the position now; otherwise at most every few seconds,
    /// since the OS extrapolates it between updates.
    function syncMediaSession(force) {
      if (!mediaSession) return;
      syncSilentAudio();
      if (!hasTrack()) {
        mediaSession.metadata = null;
        mediaSession.playbackState = "none";
        mediaMetaKey = null;
        return;
      }
      const art = new URL(coverUrl(snap.current.entry_id), location.href).href;
      const artist = currentArtist();
      const key = JSON.stringify([snap.current.entry_id, currentTitle, artist, art]);
      if (key !== mediaMetaKey) {
        mediaMetaKey = key;
        mediaSession.metadata = new MediaMetadata({
          title: currentTitle || "(untitled)",
          artist,
          artwork: [{ src: art }],
        });
        force = true;
      }
      mediaSession.playbackState = isPlayingNow() ? "playing" : "paused";
      setMediaAction("previoustrack", snap.has_prev ? mediaPrev : null);
      setMediaAction("nexttrack", snap.has_next ? mediaNext : null);
      const now = performance.now();
      if (!force && now - mediaPositionAt < 5000) return;
      mediaPositionAt = now;
      const duration = progress.duration;
      if (!(duration > 0) || !mediaSession.setPositionState) return;
      try {
        mediaSession.setPositionState({ duration, position: Math.min(progressNow(), duration), playbackRate: 1 });
      } catch {}
    }

    if (mediaSession) {
      const pauseIfPlaying = () => {
        if (isPlayingNow()) togglePlay();
      };
      const handlers = {
        play: () => {
          if (!isPlayingNow()) togglePlay();
        },
        pause: pauseIfPlaying,
        stop: pauseIfPlaying,
        seekto: (d) => seekToSeconds(d.seekTime),
        seekbackward: (d) => seekToSeconds(progressNow() - (d.seekOffset || 10)),
        seekforward: (d) => seekToSeconds(progressNow() + (d.seekOffset || 10)),
      };
      for (const [action, fn] of Object.entries(handlers)) setMediaAction(action, fn);
    }
    expandBtn.addEventListener("click", () => setExpanded(!expanded));
    artBtn.addEventListener("click", () => setExpanded(!expanded));
    titleBtn.addEventListener("click", () => {
      if (snap?.current) viewEntry(snap.current.entry_id);
    });

    Remote.subscribe(onSnapshot);

    return {
      togglePlay,
      isPlayingEntry,
      openFinder,
      closeFinder,
      setStageMode,
      syncStagePosition,
      hasTrack,
      onChange: (fn) => {
        onChangeCallback = fn;
      },
    };
  })();

  function refreshPlayIndicators() {
    const cta = document.getElementById("play-cta");
    if (cta) {
      const playing = Player.isPlayingEntry(Number(cta.dataset.entryId));
      cta.classList.toggle("is-playing", playing);
      cta.querySelector(".play-cta-icon").innerHTML = svgIcon(playing ? "pause" : "play", 13);
      cta.querySelector(".play-cta-label").textContent = playing ? "Playing" : "Play";
    }
    for (const row of document.querySelectorAll(".manifest-row[data-entry-id]")) {
      const playing = Player.isPlayingEntry(Number(row.dataset.entryId));
      row.classList.toggle("is-playing", playing);
      const icon = row.querySelector(".manifest-play-icon");
      if (icon) icon.innerHTML = svgIcon(playing ? "pause" : "play", 12);
      const playBtn = row.querySelector(".manifest-play");
      if (playBtn) playBtn.setAttribute("aria-label", playing ? "Pause" : "Play");
    }
  }

  // Player mode's empty state ("nothing playing") vs. its stage/queue
  // wrapper — kept in sync on every session change rather than only when
  // the mode switch happens, so playback started from Library/the rail (or
  // from another device) while Player mode is open updates it live.
  function refreshPlayerStageVisibility() {
    const has = Player.hasTrack();
    playerStageWrapEl.hidden = !has;
    playerStageEmptyEl.hidden = has;
    // Unhiding the wrap just now is what gives `#player-stage-mount` its
    // real on-page size/position — re-sync the overlay against it.
    Player.syncStagePosition();
  }

  Player.onChange(() => {
    refreshPlayIndicators();
    refreshPlayerStageVisibility();
  });

  // ---------- queue actions: commands to the shared session ----------
  //
  // The queue itself (play order, shuffle/repeat, the Queue vs Post-queue
  // layers, auto-recommend top-up) lives server-side now — see
  // playback.rs's `Queue`. These just say what the library UI wants; the
  // result arrives as a snapshot, on every device. They play on whichever
  // device is active, or on this one if none is.
  async function playbackCommand(cmd) {
    try {
      await Remote.command(cmd);
      return true;
    } catch (err) {
      setStatus(err.message);
      return false;
    }
  }

  // What the server's queue stores of a track (`playback::QueueItem`);
  // `release_id` is the album a tracklist was played from, for the
  // now-playing drawer.
  function queueItem(t) {
    return { entry_id: t.entry_id, title: t.title ?? null, release_id: t.release_id ?? null };
  }

  function startQueue(items, index) {
    playbackCommand({
      type: "set_queue",
      items: items.map(queueItem),
      start_index: index,
    });
  }

  function playStandalone(entryId, title) {
    startQueue([{ entry_id: entryId, title }], 0);
  }

  // The "Queue" affordance on a track's play button / tracklist row: adds
  // it to the Queue layer, ahead of Post-queue, without disturbing what's
  // playing — or just starts it, if nothing is.
  async function queueTrack(entryId, title) {
    const wasPlaying = Player.hasTrack();
    if ((await playbackCommand({ type: "queue", item: { entry_id: entryId, title: title ?? null } })) && wasPlaying) {
      setStatus(`Queued "${title || "track"}".`);
    }
  }

  /// "Shuffle all" in the rail header — there's no playlist concept yet, so
  /// this is the closest equivalent to Spotify's Liked-Songs shuffle: a
  /// playable batch mixing familiar and new tracks (see `ShuffleMix`),
  /// played on the shared session in the order the mix arranged it.
  async function shuffleLibrary() {
    setStatus("Shuffling your library…");
    let tracks = [];
    try {
      tracks = await ShuffleMix.generate(ShuffleMix.batchSize());
    } catch (err) {
      setStatus(`Couldn't shuffle the library: ${err.message}`);
      return;
    }
    if (!tracks.length) {
      setStatus("No playable tracks found to shuffle.");
      return;
    }
    if (await playMixBatch(tracks)) setStatus("");
  }

  /// Plays a `ShuffleMix` batch ("Shuffle all", or the settings preview) on
  /// the shared session, in the order the mix arranged it.
  function playMixBatch(tracks) {
    return playbackCommand({ type: "shuffle_library", items: tracks.map(queueItem) });
  }

  // Auto-recommend: the server flags `wants_recommend` when fewer than a
  // few tracks are left ahead (repeat off), and the active device answers
  // with a shuffle-mix batch, since the mix's settings and play log live in
  // this browser. One request at a time; after a failure or an empty batch,
  // wait before asking again instead of retrying on every snapshot.
  const RECOMMEND_RETRY_MS = 15000;
  let recommendInFlight = false;
  let recommendFailedAt = -Infinity;
  Remote.subscribe(async (s) => {
    if (!s.wants_recommend || s.active_device !== Remote.deviceId) return;
    if (recommendInFlight || performance.now() - recommendFailedAt < RECOMMEND_RETRY_MS) return;
    recommendInFlight = true;
    try {
      const skip = s.queue.map((r) => r.entry_id);
      const tracks = await ShuffleMix.generate(20, { skip });
      if (!tracks.length) throw new Error("nothing to recommend");
      await Remote.command({ type: "recommend", items: tracks.map(queueItem) });
    } catch {
      recommendFailedAt = performance.now();
    } finally {
      recommendInFlight = false;
    }
  });

  // The now-playing drawer follows the session's current track on every
  // device, so a remote can score what another device is playing.
  Remote.subscribe((s) => {
    if (s.current) NowPlaying.track(s.current.entry_id, s.current.release_id ?? null);
  });

  Remote.connect();

  let dupePanels = 0;

  /// One song bound to several NRS entries (each bound on its own, then
  /// linked in the library): pick the one to keep, preview, and merge the
  /// rest into it (`POST /api/nrs/merge`). The drawer and entry pages both
  /// show it; `onMerged` reloads whichever asked.
  function nrsDuplicatesPanel(dupes, onMerged) {
    const weight = (e) => e.impacts + e.relations;
    let keep = dupes.reduce((best, e) => (weight(e) > weight(best) ? e : best)).id;
    let previewed = null;
    const name = `nrs-keep-${++dupePanels}`;
    const summary = el("div");
    const statusEl = el("p", { className: "np-status" });
    const previewBtn = el("button", { className: "ghost-btn", type: "button", text: "Preview merge" });
    const mergeBtn = el("button", { className: "ghost-btn", type: "button", text: "Merge", hidden: true });
    const picks = dupes.map((e) =>
      el("label", { className: "np-dupe" }, [
        el("input", {
          type: "radio",
          name,
          value: e.id,
          checked: e.id === keep,
          onchange: () => {
            keep = e.id;
            previewed = null;
            mergeBtn.hidden = true;
            summary.replaceChildren();
            statusEl.textContent = "";
          },
        }),
        el("span", { text: ` keep ${e.title || e.id} · ${e.impacts} impact${e.impacts === 1 ? "" : "s"} · ${e.relations} relation${e.relations === 1 ? "" : "s"} · ` }),
        el("a", { href: e.link, target: "_blank", rel: "noopener", text: "Open in NRS ↗" }),
        el("span", { className: "np-dupe-bind", text: e.store_id || e.id }),
      ])
    );
    const others = () => dupes.filter((e) => e.id !== keep);
    const describe = (from, r) => {
      const plan = r.plan;
      const c = r.cleanup;
      const lines = [`${from.title || from.id}: moves ${plan.impacts.length} impact(s), ${plan.relations.length} relation(s)`];
      const params = (i) => Object.entries(i.params).filter(([k]) => k !== "source" && k !== "kind").map(([k, v]) => `${k} ${v}`).join(", ");
      for (const i of c.drop_impacts) lines.push(`drops its ${i.kind} (${params(i)})`);
      if (c.consumed) lines.push(`listening ${c.consumed.minutes_before.toFixed(2)} → ${c.consumed.minutes_after.toFixed(2)} min`);
      for (const rel of c.drop_relations) lines.push(`drops a repeated ${rel.kind} with ${rel.other}`);
      for (const conflict of plan.conflicts) lines.push(`blocked: ${conflict}`);
      return lines;
    };
    const busy = async (btn, text, run) => {
      if (btn.getAttribute("aria-busy") === "true") return;
      btn.setAttribute("aria-busy", "true");
      statusEl.className = "np-status";
      statusEl.textContent = text;
      try {
        statusEl.textContent = (await run()) || "";
      } catch (e) {
        statusEl.className = "np-status is-error";
        statusEl.textContent = e.message;
      } finally {
        btn.removeAttribute("aria-busy");
      }
    };
    previewBtn.onclick = () =>
      busy(previewBtn, "Previewing…", async () => {
        const results = [];
        for (const from of others()) results.push([from, await postJson("/api/nrs/merge", { from: from.id, into: keep })]);
        summary.replaceChildren(...results.flatMap(([from, r]) => describe(from, r)).map((line) => el("p", { className: "np-sub", text: line })));
        previewed = keep;
        mergeBtn.hidden = results.some(([, r]) => r.plan.conflicts.length);
      });
    mergeBtn.onclick = () =>
      busy(mergeBtn, "Merging…", async () => {
        if (previewed !== keep) throw new Error("Preview first.");
        for (const from of others()) await postJson("/api/nrs/merge", { from: from.id, into: keep, apply: true });
        await onMerged();
        return "Merged.";
      });
    return el("div", { className: "nrs-dupes" }, [...picks, summary, el("div", { className: "np-actions" }, [previewBtn, mergeBtn]), statusEl]);
  }

  /// The entry page's warning when what it ranks as in NRS is several NRS
  /// entries. Stays hidden without NRS, or with one entry or none.
  async function loadNrsDuplicates(entryId, box) {
    let data = null;
    try {
      data = await api(`/api/nrs/duplicates/${entryId}`);
    } catch {}
    const dupes = data?.duplicates || [];
    box.hidden = dupes.length < 2;
    if (box.hidden) return;
    box.replaceChildren(
      el("p", { className: "nrs-dupes-title", text: `${dupes.length} NRS entries for this ${box.dataset.kind || "entry"}` }),
      el("p", { className: "np-sub", text: "Each was added to NRS before the library linked them, so scores and listening time are split between them. Merge them into one:" }),
      nrsDuplicatesPanel(dupes, () => loadNrsDuplicates(entryId, box))
    );
  }

  async function api(path) {
    const res = await fetch(path);
    if (!res.ok) {
      let message = res.statusText;
      try {
        message = (await res.json()).message || message;
      } catch {}
      throw new Error(message || `request failed (${res.status})`);
    }
    return res.json();
  }

  async function postJson(path, payload) {
    const res = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      let message = res.statusText;
      try {
        message = (await res.json()).message || message;
      } catch {}
      throw new Error(message || `request failed (${res.status})`);
    }
    LibraryChanges.wrote(path);
    return res.json();
  }

  async function del(path) {
    const res = await fetch(path, { method: "DELETE" });
    if (!res.ok) {
      let message = res.statusText;
      try {
        message = (await res.json()).message || message;
      } catch {}
      throw new Error(message || `request failed (${res.status})`);
    }
    LibraryChanges.wrote(path);
    return res.json();
  }

  function setStatus(text) {
    railStatus.hidden = !text;
    railStatus.textContent = text || "";
  }

  function catalogNo(id) {
    return "No. " + String(id).padStart(6, "0");
  }

  function friendlyDate(raw) {
    if (!raw) return null;
    return raw.split(" ")[0];
  }

  function friendlyType(t) {
    return (t || "unknown").replace(/_/g, " ");
  }

  // What kind of edition `ed` is: the `derived_from` edge's transformation
  // (cover, instrumental, ...), else the relation kind itself — the importer
  // files a cover either way (`kind: "cover"`, or `derived_from` with
  // `transformation: "cover"`), and both must read and group the same.
  // `transformation` may carry extra `key:value` markers after the kind.
  // An edition related only transitively (through a third one) has neither.
  function editionKind(ed) {
    if (ed.is_default) return "original";
    const marker = (ed.transformation || "").split(/\s+/).find((t) => t && !t.includes(":"));
    if (marker) return marker;
    if (ed.kind && ed.kind !== "derived_from") return ed.kind;
    return "version";
  }

  const EDITION_GROUP_LABEL = {
    original: "Original",
    cover: "Covers",
    remix: "Remixes",
    arrangement: "Arrangements",
    live: "Live",
    edit: "Edits",
    medley: "Medleys",
    alt_version: "Alternate versions",
    instrumental: "Instrumentals",
    short_ver: "Short versions",
    tv_size: "TV size",
    game_ver: "Game versions",
    version: "Other versions",
  };

  // Groups with more rows than this show only the first few (and the
  // current edition) behind a "show all".
  const EDITION_GROUP_PREVIEW = 5;

  // The dock's compact edition strip (`EntrySummary.editions`, see
  // `musicdb::EDITION_KINDS`) for the playing track, or empty/hidden for a
  // solo entry. Each pill names its performer, so a strip of covers isn't
  // just "cover" over and over.
  //
  // With `prefs` (`{ editing, setWeight, toggle }`), each pill also carries
  // its preference weight (`preferPill`) and the strip ends in the ★ toggle.
  // Hover notes for the dock's editions that have nothing to play
  // (`EditionRef::playability`).
  const PLAYABILITY_NOTE = {
    unlinked: "No playable source yet",
    unavailable: "Only a local file — nothing to play",
  };

  function fillEditions(host, editionsList, onPick = (ed) => viewEntry(ed.entry_id), prefs = null) {
    host.innerHTML = "";
    const list = editionsList || [];
    host.hidden = list.length <= 1;
    for (const ed of list) {
      const who = ed.artists?.length ? ` · ${ed.artists.join(", ")}` : "";
      const label = friendlyType(editionKind(ed)) + who;
      if (prefs) {
        const playability = ed.is_current ? null : ed.playability;
        const note = PLAYABILITY_NOTE[playability];
        host.appendChild(
          preferPill({
            className: "edition-btn",
            label,
            title: [ed.title, note].filter(Boolean).join(" — ") || null,
            current: !!ed.is_current,
            playability: note ? playability : null,
            weight: ed.preferred_weight || 0,
            editing: prefs.editing,
            onPick: ed.is_current || playability === "unavailable" ? null : () => onPick(ed),
            setWeight: (w) => prefs.setWeight(ed, w),
          })
        );
        continue;
      }
      host.appendChild(
        el("button", {
          className: "edition-btn",
          type: "button",
          "aria-current": String(!!ed.is_current),
          disabled: ed.is_current,
          text: label,
          title: ed.title || null,
          onclick: ed.is_current ? null : () => onPick(ed),
        })
      );
    }
    if (prefs && list.length > 1) host.appendChild(preferToggle(prefs.editing, prefs.toggle));
  }

  // Preference weights cap (`preferences::MAX_WEIGHT`).
  const MAX_PREFER_WEIGHT = 99;

  // One option (an edition, a source) of the dock's strips with its
  // preference weight: a ★ marks a preferred one (with its weight when
  // above 1) and picking it does what the strip does. While editing, the
  // name toggles it preferred and −/+ set its weight instead. Whatever is
  // preferred plays when the track comes up; several take turns at random,
  // in proportion to their weights (`preferences::resolve`).
  function preferPill({ className, label, title, current, playability = null, weight, editing, onPick, setWeight }) {
    const star = weight > 0 ? el("span", { className: "prefer-star", text: weight > 1 ? `★${weight}` : "★" }) : null;
    if (!editing) {
      return el(
        "button",
        {
          className,
          type: "button",
          // Editions mark the playing one as current, sources as pressed
          // (see their strips' styles).
          [className === "edition-btn" ? "aria-current" : "aria-pressed"]: String(current),
          disabled: !onPick,
          "data-playability": playability,
          title: title || null,
          onclick: onPick,
        },
        [star, el("span", { text: label })]
      );
    }
    const step = (delta) => setWeight(Math.max(0, Math.min(MAX_PREFER_WEIGHT, weight + delta)));
    return el("span", { className: "prefer-edit" + (weight > 0 ? " is-preferred" : "") }, [
      el(
        "button",
        {
          className: "prefer-name",
          type: "button",
          "aria-pressed": String(weight > 0),
          title: weight > 0 ? "Stop preferring" : "Prefer",
          onclick: () => setWeight(weight > 0 ? 0 : 1),
        },
        [star, el("span", { text: label })]
      ),
      el("button", {
        className: "prefer-step",
        type: "button",
        text: "−",
        "aria-label": "Lower weight",
        disabled: weight === 0,
        onclick: () => step(-1),
      }),
      el("span", { className: "prefer-weight", text: String(weight), title: "Weight" }),
      el("button", {
        className: "prefer-step",
        type: "button",
        text: "+",
        "aria-label": "Raise weight",
        disabled: weight >= MAX_PREFER_WEIGHT,
        onclick: () => step(1),
      }),
    ]);
  }

  function preferToggle(editing, toggle) {
    return el("button", {
      className: "prefer-toggle",
      type: "button",
      "aria-pressed": String(editing),
      text: editing ? "Done" : "★ Prefer",
      title: editing
        ? null
        : "Choose what plays when this track comes up. Several preferred ones take turns at random, by weight.",
      onclick: toggle,
    });
  }

  // The entry page's edition list: editions grouped by kind (in the
  // server's order — original, full versions, then degenerate ones), each
  // group by release date, each row led by who performs it. Shared by
  // `viewEntry` and `refreshAfterEdit` (a relate/unrelate edit can change
  // the edition set without a full card reload).
  function fillEditionList(host, editionsList) {
    host.replaceChildren();
    const list = editionsList || [];
    host.hidden = list.length <= 1;
    if (list.length <= 1) return;
    host.appendChild(el("h2", { className: "section-label", text: `Editions · ${list.length}` }));

    const original = list.find((ed) => ed.is_default);
    const originalTitle = (original?.title || "").trim().toLowerCase();
    // Performers only tell editions apart when they differ — the same
    // artist's remix and instrumental read better by title.
    const originalArtists = (original?.artists || []).join(", ");
    const showArtists = list.some((ed) => (ed.artists || []).join(", ") !== originalArtists);
    const groups = new Map();
    for (const ed of list) {
      const kind = editionKind(ed);
      if (!groups.has(kind)) groups.set(kind, []);
      groups.get(kind).push(ed);
    }
    for (const [kind, eds] of groups) {
      eds.sort(
        (a, b) =>
          (a.release_date || "￿").localeCompare(b.release_date || "￿") || a.entry_id - b.entry_id
      );
      const rows = el("ul", { className: "edition-rows" });
      const collapse = eds.length > EDITION_GROUP_PREVIEW + 1;
      const hiddenRows = [];
      eds.forEach((ed, i) => {
        const row = editionRow(ed, originalTitle, showArtists);
        if (collapse && i >= EDITION_GROUP_PREVIEW && !ed.is_current) {
          row.hidden = true;
          hiddenRows.push(row);
        }
        rows.appendChild(row);
      });
      const group = el("div", { className: "edition-group" }, [
        el("h3", { className: "edition-group-label" }, [
          el("span", { text: EDITION_GROUP_LABEL[kind] || friendlyType(kind) }),
          eds.length > 1 ? el("span", { className: "edition-group-count", text: String(eds.length) }) : null,
        ]),
        rows,
      ]);
      if (hiddenRows.length) {
        const more = el("button", {
          className: "edition-more",
          type: "button",
          text: `Show ${hiddenRows.length} more`,
          onclick: () => {
            for (const row of hiddenRows) row.hidden = false;
            more.remove();
          },
        });
        group.appendChild(more);
      }
      host.appendChild(group);
    }
  }

  // One edition row: its performers (the thing that tells covers apart)
  // when `showArtists`, its own title when that says more than the
  // original's, the platforms it plays on, and its date.
  function editionRow(ed, originalTitle, showArtists) {
    const who = showArtists && ed.artists?.length ? ed.artists.join(", ") : null;
    const title = ed.title || "(untitled)";
    const titleSaysMore = title.trim().toLowerCase() !== originalTitle;
    const dots = el("span", { className: "edition-dots" });
    for (const kind of ed.source_kinds || []) {
      if (!PLATFORM_COLOR[kind]) continue;
      const dot = el("span", { className: "dot", title: providerLabel(kind) });
      dot.style.background = PLATFORM_COLOR[kind];
      dots.appendChild(dot);
    }
    const preferred = ed.preferred_weight > 0;
    const body = el("span", { className: "edition-body" }, [
      el("span", { className: "edition-who" }, [
        preferred
          ? el("span", {
              className: "prefer-star",
              text: ed.preferred_weight > 1 ? `★${ed.preferred_weight}` : "★",
              title: "Preferred: plays when this track comes up",
            })
          : null,
        el("span", { text: who || title }),
      ]),
      who && titleSaysMore ? el("span", { className: "edition-title", text: title }) : null,
    ]);
    return el("li", {}, [
      el(
        "button",
        {
          className: "edition-row",
          type: "button",
          "aria-current": String(!!ed.is_current),
          disabled: ed.is_current,
          title: `${catalogNo(ed.entry_id)} — ${title}`,
          onclick: ed.is_current ? null : () => viewEntry(ed.entry_id),
        },
        [
          body,
          dots,
          el("span", { className: "edition-date", text: friendlyDate(ed.release_date) || "—" }),
        ]
      ),
    ]);
  }

  // ---------- search ----------

  shuffleLibraryBtn.addEventListener("click", shuffleLibrary);
  shuffleMixBtn.addEventListener("click", () => {
    goToMode("settings");
    document.getElementById("shuffle-mix-settings")?.scrollIntoView({ block: "start" });
  });

  let debounceHandle;
  searchEl.addEventListener("input", () => {
    clearTimeout(debounceHandle);
    debounceHandle = setTimeout(runSearch, 200);
  });

  document.addEventListener("keydown", (e) => {
    // Only steal "/" as the jump-to-search shortcut when focus isn't already
    // in some other text field — originally just excluded `searchEl` itself,
    // which meant typing a literal "/" (as in a pasted-by-hand URL) into any
    // other input, e.g. the ingest panel's URL field or the Spotify Client ID
    // field, got hijacked mid-keystroke.
    const active = document.activeElement;
    const inTextField = active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA");
    if (e.key === "/" && active !== searchEl && !inTextField) {
      e.preventDefault();
      searchEl.focus();
      searchEl.select();
    }
  });

  resultsEl.addEventListener("keydown", (e) => {
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    const rows = Array.from(resultsEl.querySelectorAll(".result"));
    const i = rows.indexOf(document.activeElement);
    if (i === -1) return;
    e.preventDefault();
    const next = e.key === "ArrowDown" ? rows[i + 1] : rows[i - 1];
    if (next) next.focus();
  });

  // A link/unlink edit can change which entries a live query matches (a
  // newly-hidden duplicate, a newly-restored one) — re-run the visible
  // search so the results list doesn't go stale next to a graph that just
  // updated.
  function refreshSearchIfActive() {
    if (searchEl.value.trim()) runSearch();
  }

  async function runSearch() {
    const q = searchEl.value.trim();
    const token = ++searchToken;
    resultsEl.innerHTML = "";
    if (!q) {
      setStatus("");
      return;
    }
    setStatus("Searching…");
    let data;
    try {
      data = await api(`/api/library/search?q=${encodeURIComponent(q)}`);
    } catch (err) {
      if (token !== searchToken) return;
      setStatus(`Couldn't search: ${err.message}`);
      return;
    }
    if (token !== searchToken) return;

    if (!data.results.length) {
      setStatus(`No matches for "${q}".`);
      return;
    }
    setStatus("");
    const groups = new Map();
    for (const r of data.results) {
      const key = r.entry_type || "unknown";
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(r);
    }
    const orderedKeys = [
      ...TYPE_ORDER.filter((k) => groups.has(k)),
      ...[...groups.keys()].filter((k) => !TYPE_ORDER.includes(k)),
    ];
    for (const key of orderedKeys) {
      resultsEl.appendChild(
        el("li", { className: "result-group-label", role: "presentation" }, [
          el("span", { text: TYPE_LABEL[key] || friendlyType(key) }),
        ])
      );
      for (const r of groups.get(key)) {
        // The row shows its group's default edition; when another edition's
        // name is what matched (`matched_edition`), name it under the title
        // and show that edition's cover and open it instead.
        const matched = r.matched_edition != null && (r.editions || []).find((ed) => ed.entry_id === r.matched_edition);
        const targetId = matched ? matched.entry_id : r.entry_id;
        resultsEl.appendChild(
          el(
            "li",
            {
              // Draggable so a graph view open elsewhere can pick this
              // entry up and drop it in as a node (see graph drop handler).
              draggable: "true",
              ondragstart: (e) => {
                e.dataTransfer.setData("text/plain", String(targetId));
                e.dataTransfer.effectAllowed = "copy";
              },
            },
            [
              el(
                "button",
                {
                  className: "result",
                  role: "option",
                  type: "button",
                  "data-entry-id": String(targetId),
                  "aria-selected":
                    String(targetId) === String(currentMode === "graph" ? graphActiveId : activeId),
                  // In Graph mode, a result re-anchors the open graph in
                  // place instead of navigating away to Library mode — the
                  // graph stays the thing on screen, just pointed at a
                  // different entry.
                  onclick: () => (currentMode === "graph" ? viewGraph(targetId) : viewEntry(targetId)),
                },
                [
                  artBox(targetId, "result-thumb", r.title),
                  el("span", { className: "result-text" }, [
                    el("span", { className: "result-title", text: r.title || "(untitled)" }),
                    matched ? el("span", { className: "result-edition", text: matchedEditionLabel(matched, r.title) }) : null,
                  ]),
                ]
              ),
            ]
          )
        );
      }
    }
  }

  // "Arrangement · Truths, Ironies, The Secret Lyrics": the subtitle of a
  // search result whose match was edition `ed` of the row titled `rowTitle`.
  // The title is left out when it only repeats the row's.
  function matchedEditionLabel(ed, rowTitle) {
    const kind = friendlyType(editionKind(ed));
    const label = kind.charAt(0).toUpperCase() + kind.slice(1);
    const title = (ed.title || "").trim();
    return title && title.toLowerCase() !== (rowTitle || "").trim().toLowerCase() ? `${label} · ${title}` : label;
  }

  // ---------- entry detail (browsing only — never touches Player) ----------

  function stamp(source, identifier, isPlatform) {
    const href = identifier && identifier.startsWith("http") ? identifier : null;
    const dot = el("span", { className: "dot" });
    dot.style.background = isPlatform && PLATFORM_COLOR[source] ? PLATFORM_COLOR[source] : "var(--verdigris)";
    const label = el("span", { text: source });
    if (href) {
      return el("a", { className: "stamp", href, target: "_blank", rel: "noopener noreferrer" }, [dot, label]);
    }
    return el("span", { className: "stamp" }, [dot, label]);
  }

  const SOURCE_LABEL = {
    ...PROVIDER_LABEL,
    apple_music: "Apple Music",
    deezer: "Deezer",
    tidal: "TIDAL",
    musicbrainz: "MusicBrainz",
    discogs: "Discogs",
    vgmdb: "VGMdb",
    lastfm: "Last.fm",
    local: "Local file",
    isrc: "ISRC",
    upc: "UPC",
  };

  // Stores that hold the audio but that this player can't mount; listed
  // after the playable providers.
  const STORE_SOURCES = ["apple_music", "deezer", "tidal"];
  const CATALOG_ORDER = ["musicbrainz", "discogs", "vgmdb", "lastfm"];
  const CODE_SOURCES = ["isrc", "upc"];
  const LINK_SOURCES = ["unknown_url", "url"];

  // The entry page's source sections, in display order.
  const SOURCE_SECTIONS = [
    ["listen", "Listen"],
    ["catalog", "Catalog"],
    ["codes", "Codes"],
    ["links", "Links"],
  ];

  function sourceSection(source) {
    if (source in PLATFORM_COLOR || STORE_SOURCES.includes(source)) return "listen";
    if (CODE_SOURCES.includes(source)) return "codes";
    if (LINK_SOURCES.includes(source)) return "links";
    return "catalog";
  }

  // Sort rank of `source` within its section: playable providers in the
  // Settings preference order (so the first is what Play mounts), then
  // stores; known catalogs first; anything else after, by name.
  function sourceRank(source) {
    const order = [...getProviderPreference(), ...STORE_SOURCES, ...CATALOG_ORDER, ...CODE_SOURCES];
    const i = order.indexOf(source);
    return i === -1 ? order.length : i;
  }

  // A short tag telling apart two sources of one provider: the last path
  // segment of its URL (a YouTube video id, a MusicBrainz MBID's first
  // block), or the start of a bare identifier.
  function shortSourceId(identifier) {
    try {
      const url = new URL(identifier);
      const last = url.pathname.split("/").filter(Boolean).pop() || url.hostname;
      const id = decodeURIComponent(last);
      return id.length > 14 ? id.slice(0, 8) : id;
    } catch {
      return identifier.slice(0, 10);
    }
  }

  function urlPath(identifier) {
    try {
      const url = new URL(identifier);
      return decodeURIComponent(url.pathname.replace(/^\/+/, "")) + url.search;
    } catch {
      return identifier;
    }
  }

  function hostOf(identifier) {
    try {
      return new URL(identifier).hostname.replace(/^www\./, "");
    } catch {
      return identifier;
    }
  }

  // The entry page's sources, grouped by what they're for (listen, look up,
  // codes, other links) and sorted within each. A provider's label gets a
  // short id only when it appears more than once; codes always show their
  // value, plain links their host. Sources that come from a soft-linked
  // duplicate rather than this entry itself sort after its own, and say so
  // in their tooltip.
  function fillSources(host, entry) {
    host.replaceChildren();
    const sources = entry.sources || [];
    host.hidden = sources.length === 0;
    const memberOf = new Map();
    for (const m of entry.members || []) {
      for (const s of m.sources) memberOf.set(`${s.source}\u0000${s.identifier}`, m.entry_id);
    }
    const counts = new Map();
    for (const s of sources) counts.set(s.source, (counts.get(s.source) || 0) + 1);
    const rows = sources.map((s, i) => {
      const member = memberOf.get(`${s.source}\u0000${s.identifier}`);
      return { s, i, via: member != null && member !== entry.entry_id ? member : null };
    });
    rows.sort(
      (a, b) =>
