<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Library</title>
<script>
  // YouTube's embed-permission check treats a raw IP-literal origin
  // differently from a named host, so this app only actually embeds videos
  // when browsed via `localhost` — bounce there immediately, before the
  // rest of the page (fonts, app script) even loads. Skipped mid-Spotify-
  // callback (code/state/error present): that round trip has to land back
  // on the same origin (127.0.0.1) its PKCE verifier was stored under —
  // Spotify.handleRedirect() does its own bounce to localhost once it's
  // done, after the token exchange completes.
  (function () {
    if (location.hostname !== "127.0.0.1") return;
    const params = new URLSearchParams(location.search);
    if (params.has("code") || params.has("state") || params.has("error") || params.has("spotify_connect")) return;
    const port = location.port ? ":" + location.port : "";
    location.replace(location.protocol + "//localhost" + port + location.pathname + location.search + location.hash);
  })();
</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>
  :root {
    color-scheme: light;
    --paper: #e7e1cc;
    --paper-deep: #dbd3b8;
    --paper-deeper: #cfc6a6;
    --ink: #24281f;
    --ink-soft: #5b5e4f;
    --ink-faint: #85886f;
    --rail: #c7bc9c;
    --brass: #8a6a34;
    --brass-ink: #6b4f21;
    --verdigris: #4b6b5e;
    --danger: #8c3b2e;
    --type-artist: #6d5788;
    --type-release-group: #3f6690;
    --type-release: #5f7a30;
    --type-track: #9c4f74;
    --serif: "Fraunces", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --sans: "IBM Plex Sans", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", ui-monospace, monospace;
    --player-bar-h: 92px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --paper: #1b1f18;
      --paper-deep: #242820;
      --paper-deeper: #2f342a;
      --ink: #e7e2d1;
      --ink-soft: #a8ab97;
      --ink-faint: #767a65;
      --rail: #3a3e30;
      --brass: #cda45c;
      --brass-ink: #e3c079;
      --verdigris: #7fa391;
      --danger: #d98b7a;
      --type-artist: #b79ad1;
      --type-release-group: #8fb4dd;
      --type-release: #a3c26e;
      --type-track: #d692ae;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--paper);
  }

  button, input {
    font: inherit;
    color: inherit;
  }

  :focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  .app {
    display: grid;
    grid-template-columns: 320px 1fr;
    height: 100vh;
  }

  /* ---------- rail: the drawer ---------- */

  .rail {
    border-right: 1px solid var(--rail);
    display: flex;
    flex-direction: column;
    min-width: 0;
    /* Grid items don't clip their own overflow by default — without this,
       a rail-foot taller than the available height (a short/narrow
       viewport, or the Spotify setup form) bleeds past the grid cell and
       overlaps `main` instead of scrolling within the rail. */
    overflow-y: auto;
  }

  .rail-head {
    padding: 20px 18px 14px;
    border-bottom: 1px solid var(--rail);
  }

  .rail-head-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 0 0 12px;
  }

  .wordmark {
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 500;
    margin: 0;
    letter-spacing: 0.01em;
  }

  /* ---------- mode switcher: Library / Graph / Player ---------- */

  .mode-switcher {
    display: flex;
    gap: 6px;
    margin: 0 0 12px;
  }

  .mode-switcher button {
    flex: 1;
    border: 1px solid var(--rail);
    background: var(--paper-deep);
    color: var(--ink-soft);
    padding: 6px 4px;
    font-size: 12px;
    cursor: pointer;
  }

  .mode-switcher button:hover { color: var(--ink); }

  .mode-switcher button[aria-pressed="true"] {
    border-color: var(--brass);
    background: var(--paper);
    color: var(--brass-ink);
  }

  .search-slot {
    border: 1px solid var(--rail);
    background: var(--paper-deep);
    display: flex;
    align-items: center;
    padding: 0 10px;
  }

  .search-slot svg {
    flex: none;
    opacity: 0.6;
  }

  #search {
    flex: 1;
    background: transparent;
    border: none;
    padding: 9px 8px;
    font-size: 14px;
    min-width: 0;
  }

  #search:focus { outline: none; }
  #search::placeholder { color: var(--ink-faint); }

  .results {
    list-style: none;
    margin: 0;
    padding: 0;
    overflow-y: auto;
    flex: 1;
  }

  .result {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--rail);
    padding: 10px 18px 10px 15px;
    cursor: pointer;
    position: relative;
  }

  .result::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: transparent;
  }

  .result:hover { background: var(--paper-deep); }

  .result[aria-selected="true"] {
    background: var(--paper-deep);
  }

  .result[aria-selected="true"]::before {
    background: var(--brass);
  }

  .result-title {
    display: block;
    overflow-wrap: anywhere;
  }

  .result-group-label {
    padding: 10px 18px 4px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
  }

  .result-group-label:first-child {
    padding-top: 14px;
  }

  .rail-status {
    margin: 0;
    padding: 14px 18px;
    color: var(--ink-soft);
  }

  .rail-foot {
    border-top: 1px solid var(--rail);
    padding: 12px 18px 16px;
    flex: none;
  }

  .rail-foot-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    margin: 0 0 8px;
  }

  .rail-foot-label .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ink-faint);
    flex: none;
  }

  .rail-foot-label .dot.on { background: var(--verdigris); }

  .rail-foot p.hint {
    margin: 0 0 8px;
    color: var(--ink-soft);
    font-size: 12px;
    line-height: 1.4;
  }

  .rail-foot-row {
    display: flex;
    gap: 6px;
  }

  .rail-foot input[type="text"] {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--rail);
    background: var(--paper-deep);
    padding: 6px 8px;
    font-size: 12px;
    font-family: var(--mono);
  }

  .ghost-btn {
    border: 1px solid var(--rail);
    background: transparent;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }

  .ghost-btn:hover { border-color: var(--brass); color: var(--brass-ink); }

  .ghost-btn[disabled] {
    opacity: 0.4;
    cursor: default;
  }

  .ghost-btn[disabled]:hover {
    border-color: var(--rail);
    color: inherit;
  }

  .redirect-box {
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--rail);
    background: var(--paper-deep);
    padding: 5px 6px 5px 8px;
  }

  .redirect-box code {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: var(--mono);
    font-size: 11px;
  }

  .rail-foot-error {
    margin: 8px 0 0;
    color: var(--danger);
    font-size: 12px;
  }

  /* ---------- main: browsing / entry detail ---------- */

  main {
    overflow-y: auto;
    min-width: 0;
  }

  .invite {
    max-width: 420px;
    margin: 14vh auto 0;
    padding: 0 24px;
    text-align: left;
  }

  .invite p.lede {
    font-family: var(--serif);
    font-size: 24px;
    font-weight: 400;
    line-height: 1.3;
    margin: 0 0 8px;
  }

  .invite p.sub {
    color: var(--ink-soft);
    margin: 0;
  }

  .invite.error p.lede {
    color: var(--danger);
  }

  .invite kbd {
    font-family: var(--mono);
    background: var(--paper-deep);
    border: 1px solid var(--rail);
    padding: 1px 5px;
    font-size: 12px;
  }

  .detail {
    max-width: 760px;
    margin: 0 auto;
    padding: 44px 28px 40px;
  }

  .detail.enter {
    animation: rise 260ms ease-out;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-kicker {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 18px;
  }

  .card-title {
    font-family: var(--serif);
    font-size: 30px;
    font-weight: 500;
    line-height: 1.25;
    margin: 0 0 10px;
    overflow-wrap: anywhere;
  }

  .card-meta {
    color: var(--ink-soft);
    margin: 0 0 20px;
  }

  .stamps {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 28px;
  }

  .stamp {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--rail);
    padding: 4px 9px 4px 7px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    text-decoration: none;
    background: var(--paper-deep);
  }

  a.stamp:hover { border-color: var(--ink-soft); color: var(--ink); }

  .stamp .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--ink-faint);
    flex: none;
  }

  .note {
    color: var(--ink-soft);
    border-left: 2px solid var(--rail);
    padding: 2px 0 2px 12px;
    margin-bottom: 28px;
  }

  .relations-link {
    display: inline-block;
    margin-bottom: 28px;
  }

  /* ---------- manual soft-merge (dedup calibration) ---------- */

  .merge-section {
    margin-bottom: 28px;
  }

  .merge-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--verdigris);
    margin: 0 0 8px;
  }

  .dedup-graph {
    position: relative;
    border: 1px solid var(--rail);
    background: var(--paper-deep);
    margin-bottom: 10px;
    width: 100%;
    height: 320px;
    overflow: hidden;
  }

  .dedup-graph.drag-over {
    border-color: var(--brass);
    box-shadow: inset 0 0 0 1px var(--brass);
  }

  /* ---------- graph mode: the same editor, given a full screen instead of
     a 320px box inside the entry-detail card ---------- */

  #view-graph {
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 24px 28px;
    overflow: hidden;
  }

  #view-graph[hidden] { display: none; }

  #view-graph .merge-section {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    margin-bottom: 0;
    /* Positioning context for `.graph-detail-panel` below, which floats
       over the canvas rather than sitting in the flex flow. */
    position: relative;
  }

  #view-graph .dedup-graph {
    /* The canvas is now the *only* flex item competing for height here —
       the detail panel is taken out of flow (see below) — so its size
       stays constant regardless of how much the panel's content grows or
       shrinks (a long edge/relation-kind picker used to visibly steal
       height from the canvas since both were flex siblings). */
    flex: 1;
    min-height: 0;
    height: auto;
  }

  #view-graph .graph-detail-panel {
    /* Floats over the bottom of the canvas instead of pushing it — its own
       content (node details, edge actions, the create-link kind picker)
       can grow or shrink freely without ever resizing the graph beneath
       it. Scrolls internally past `max-height` rather than growing further. */
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    max-height: 28vh;
    overflow-y: auto;
    box-shadow: 0 -6px 16px rgba(0, 0, 0, 0.18);
  }

  .graph-empty {
    max-width: 420px;
    margin: 14vh auto 0;
    padding: 0 24px;
    text-align: left;
    color: var(--ink-soft);
  }

  .graph-svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  .node circle,
  .node rect {
    fill: var(--paper);
    stroke: var(--ink-faint);
    stroke-width: 1.5px;
    cursor: pointer;
  }

  /* Fill hue is the entry's type (track/release/release_group/artist);
     shape (circle vs. square, set in JS by `.node.structural`) and stroke
     stay reserved for dedup-graph role, so the two encodings never fight
     over the same channel. Nodes with no known type keep the plain paper
     fill from the base rule above. */
  .node.type-artist circle,
  .node.type-artist rect {
    fill: var(--type-artist);
  }
  .node.type-release_group circle,
  .node.type-release_group rect {
    fill: var(--type-release-group);
  }
  .node.type-release circle,
  .node.type-release rect {
    fill: var(--type-release);
  }
  .node.type-track circle,
  .node.type-track rect {
    fill: var(--type-track);
  }

  /* Structural nodes stay visually "recessed" relative to dedup-graph
     members — same type hue, just faded — rather than losing the type
     color to a flat override. */
  .node.structural circle,
  .node.structural rect {
    fill-opacity: 0.45;
  }

  .node.self circle {
    stroke: var(--brass-ink);
    stroke-width: 3px;
  }

  .node.selected-for-link circle,
  .node.selected-for-link rect {
    stroke: var(--verdigris);
    stroke-width: 3px;
  }

  /* `paint-order: stroke` + a wide stroke in the page background color fakes
     a label background halo without measuring text width for a real <rect>
     behind it — the text itself is unaffected since fill paints on top.
     Labels live in their own layer stacked above every node shape (see
     labelLayer), not nested in their own node's <g>, so one node's shape
     can never paint over a different node's label. */
  .node-label {
    font-family: var(--mono);
    font-size: 10px;
    fill: var(--ink);
    paint-order: stroke;
    stroke: var(--paper-deep);
    stroke-width: 3px;
    stroke-linejoin: round;
    pointer-events: none;
    user-select: none;
  }

  /* Culled by updateLabelVisibility() when it would overlap a
     higher-priority label — the node shape stays put, only the text goes;
     hovering still shows the title via the floating .graph-hover-label. */
  .node-label.label-hidden {
    display: none;
  }

  .edge {
    stroke: var(--ink-faint);
    stroke-width: 2px;
    /* Purely decorative now — all pointer events go to the wider
       `.edge-hit` line stacked on the same path (see the edge join in
       `update()`), so a 1.5–4px visible stroke doesn't also mean a
       1.5–4px-wide click/hover target. */
    pointer-events: none;
  }

  .edge.dedup {
    cursor: pointer;
  }

  .edge-hit {
    fill: none;
    stroke: transparent;
    stroke-width: 14px;
    pointer-events: stroke;
    /* Every edge opens its details on click now, structural included (see
       the edge join in `update()`), so every edge gets the pointer cursor —
       not just dedup edges like before the click behavior was unified. */
    cursor: pointer;
  }

  /* active: a live link. hover hints "click unlinks" (red). */
  .edge.dedup.active-manual {
    stroke: var(--verdigris);
  }
  .edge.dedup.active-heuristic {
    stroke: var(--verdigris);
    stroke-dasharray: 5 3;
  }
  /* The visible line is `pointer-events: none` (see `.edge` above) so it can
     never itself match `:hover` — the interactive element is `.edge-hit`,
     a sibling under the same `.edge-item` group, so hover state has to key
     off that ancestor instead of the line being recolored. */
  .edge-item:hover .edge.dedup.active-manual,
  .edge-item:hover .edge.dedup.active-heuristic {
    stroke: var(--danger);
  }

  /* suggested: plain-unlinked, disabled but the row survives — dashed,
     faint, one click from being restored. hover hints "click re-links". */
  .edge.dedup.suggested {
    stroke-dasharray: 3 4;
    opacity: 0.6;
  }
  .edge-item:hover .edge.dedup.suggested {
    stroke: var(--verdigris);
    opacity: 1;
  }

  /* blocked: force-unlinked (different_identity) — a hard "no", shown
     solid red. hover hints "click softens it back", not "click restores". */
  .edge.dedup.blocked {
    stroke: var(--danger);
    stroke-width: 2.5px;
  }
  .edge-item:hover .edge.dedup.blocked {
    stroke: var(--brass);
  }

  /* related: a RELATE_KINDS version-kind annotation (cover/remix/same_artist/…)
     — a real connection, but not an identity assertion, so it gets its own
     hue (brass) rather than borrowing active's verdigris. */
  .edge.dedup.related {
    stroke: var(--brass-ink);
    stroke-dasharray: 2 3;
  }
  .edge-item:hover .edge.dedup.related {
    stroke: var(--brass);
  }

  /* cleared: a disabled different_identity or RELATE_KINDS row — asserts
     nothing right now, but the row survives and is one click from being
     restored, so it still gets a (very faint) line rather than vanishing. */
  .edge.dedup.cleared {
    stroke-dasharray: 1 4;
    opacity: 0.35;
  }
  .edge-item:hover .edge.dedup.cleared {
    stroke: var(--ink-faint);
    opacity: 0.8;
  }

  .edge.structural {
    stroke-dasharray: 5 3;
    stroke-width: 1.5px;
  }
  .edge-item:hover .edge.structural {
    stroke: var(--brass-ink);
  }

  /* The dangling "creating a link" line — see `pendingLine` — is purely
     decorative (the real hit-testing for picking the second node stays on
     the node shapes themselves), so it never intercepts pointer events. */
  .pending-link-line {
    stroke: var(--verdigris);
    stroke-width: 2px;
    stroke-dasharray: 4 3;
    pointer-events: none;
    opacity: 0;
  }
  .pending-link-line.visible {
    opacity: 0.85;
  }

  .graph-arrowhead path {
    fill: var(--ink-faint);
  }

  .graph-hover-label {
    position: absolute;
    z-index: 5;
    pointer-events: none;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--mono);
    font-size: 11px;
    padding: 3px 6px;
    max-width: 220px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transform: translate(-50%, -130%);
  }

  .graph-detail-panel {
    border: 1px solid var(--rail);
    background: var(--paper-deep);
    padding: 10px;
    margin-bottom: 10px;
  }

  .graph-detail-title {
    font-size: 14px;
    margin: 0 0 4px;
  }

  .graph-detail-type {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    margin: 0 0 8px;
  }

  .graph-detail-empty {
    color: var(--ink-faint);
    font-size: 12px;
    margin: 0;
  }

  .graph-detail-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }

  .graph-detail-relate {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--rail);
  }

  .graph-detail-relate-select {
    flex: 1;
    font-family: var(--mono);
    font-size: 11px;
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--rail);
    padding: 3px 4px;
  }

  .merge-picker {
    margin-top: 10px;
    border: 1px solid var(--rail);
    background: var(--paper-deep);
    padding: 10px;
  }

  .merge-picker-hint {
    color: var(--ink-soft);
    font-size: 12px;
    margin: 0 0 8px;
  }

  .merge-picker-input {
    display: block;
    width: 100%;
    border: 1px solid var(--rail);
    background: var(--paper);
    padding: 6px 8px;
    font-size: 13px;
    margin-bottom: 8px;
  }

  .merge-picker-input:focus { outline: none; border-color: var(--brass); }

  .merge-picker-results {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 220px;
    overflow-y: auto;
  }

  .merge-picker-option {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--rail);
    padding: 8px 4px;
    cursor: pointer;
    font-size: 13px;
  }

  .merge-picker-option:hover { background: var(--paper-deeper); }

  .merge-picker-empty {
    color: var(--ink-faint);
    font-size: 12px;
    padding: 6px 4px;
  }

  .merge-picker-error {
    color: var(--danger);
    font-size: 12px;
    margin: 8px 0 0;
  }

  /* ---------- play call-to-action (on an entry's own page) ---------- */

  .play-cta-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 4px 0 28px;
  }

  .play-cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: none;
    border-radius: 999px;
    background: var(--verdigris);
    color: var(--paper);
    padding: 10px 22px 10px 18px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }

  .play-cta:hover { filter: brightness(1.1); }

  .play-cta.is-playing {
    background: var(--paper-deep);
    color: var(--ink);
    border: 1px solid var(--rail);
  }

  .play-cta-icon { font-size: 13px; }

  .play-cta-hint {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
  }

  .manifest-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    margin: 0 0 4px;
    padding-top: 4px;
    border-top: 1px solid var(--rail);
  }

  .manifest {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .manifest-row {
    display: flex;
    width: 100%;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--rail);
    padding: 6px 4px;
  }

  .manifest-no {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-faint);
    flex: none;
    width: 2em;
    text-align: right;
  }

  .manifest-play {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    padding: 0;
    background: transparent;
    border: none;
    border-radius: 50%;
    color: var(--ink-soft);
    cursor: pointer;
  }

  .manifest-play:hover { background: var(--paper-deeper); color: var(--ink); }

  .manifest-play[disabled] {
    color: var(--ink-faint);
    cursor: default;
  }

  .manifest-play[disabled]:hover { background: transparent; }

  .manifest-title {
    flex: 1;
    text-align: left;
    background: transparent;
    border: none;
    padding: 4px;
    margin: -4px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    overflow-wrap: anywhere;
  }

  .manifest-title:hover { text-decoration: underline; }

  .manifest-row.is-playing .manifest-no,
  .manifest-row.is-playing .manifest-play,
  .manifest-row.is-playing .manifest-title {
    color: var(--verdigris);
  }

  .manifest-row.is-playing .manifest-title {
    font-weight: 500;
  }

  /* ---------- persistent player: floating dock + bottom bar ---------- */
  /*
   * Deliberately kept OUTSIDE `.app` and never touched by an entry-view
   * re-render: browsing the library only ever rewrites `main`'s contents,
   * so whatever's mounted here — the YouTube iframe, the Spotify SDK
   * connection — keeps running undisturbed while you look around.
   */

  #player-dock {
    position: fixed;
    right: 20px;
    bottom: calc(var(--player-bar-h) + 20px);
    width: min(400px, calc(100vw - 40px));
    z-index: 60;
    border: 1px solid var(--rail);
    background: var(--ink);
    box-shadow: 0 20px 44px rgba(0, 0, 0, 0.35);
  }

  #player-dock[hidden] { display: none; }

  .player-dock-surface {
    position: relative;
    overflow: hidden;
  }

  .player-dock-surface.video {
    aspect-ratio: 16 / 9;
  }

  .player-dock-surface.video iframe,
  .player-dock-surface.video .yt-mount,
  .player-dock-surface.video .yt-mount iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  .player-dock-surface.video .yt-mount {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 16px;
    text-align: center;
  }

  .player-dock-surface.video .yt-mount .note {
    color: var(--paper);
    border-left: none;
    margin: 0;
    padding: 0;
    font-size: 12px;
  }

  .player-dock-surface.compact {
    padding: 20px 16px;
    background: var(--paper-deep);
    color: var(--ink);
  }

  .player-dock-spotify-title {
    font-weight: 500;
    overflow-wrap: anywhere;
    margin: 0 0 4px;
  }

  .player-dock-spotify-sub {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    margin: 0;
  }

  .player-dock-switch {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px;
    border-top: 1px solid var(--rail);
    background: var(--paper-deep);
  }

  .player-dock-switch button {
    border: 1px solid var(--rail);
    background: var(--paper);
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
  }

  .player-dock-switch button[aria-pressed="true"] {
    border-color: var(--brass);
    color: var(--brass-ink);
  }

  /* ---------- dock "up next" queue list ---------- */

  .player-dock-queue {
    max-height: 240px;
    overflow-y: auto;
    border-top: 1px solid var(--rail);
    background: var(--paper);
  }

  .player-dock-queue[hidden] { display: none; }

  .player-dock-queue-label {
    margin: 0;
    padding: 8px 10px 4px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .player-dock-queue-empty {
    margin: 0;
    padding: 0 10px 10px;
    font-size: 11px;
    color: var(--ink-soft);
  }

  .player-dock-queue-row {
    display: flex;
    align-items: center;
    gap: 4px;
    border-bottom: 1px solid var(--rail);
  }

  .player-dock-queue-row:last-child { border-bottom: none; }

  .player-dock-queue-jump {
    flex: 1;
    min-width: 0;
    display: block;
    border: none;
    background: none;
    text-align: left;
    padding: 7px 4px 7px 10px;
    font-size: 12px;
    color: var(--ink);
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .player-dock-queue-jump:hover { text-decoration: underline; }

  .player-dock-queue-remove {
    flex: none;
    border: none;
    background: none;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 12px;
    padding: 6px 10px;
  }

  .player-dock-queue-remove:hover { color: var(--danger); }

  .player-dock-queue-row.is-current .player-dock-queue-jump {
    color: var(--brass-ink);
    font-weight: 500;
  }

  .player-dock-queue-row.is-current .player-dock-queue-remove {
    visibility: hidden;
  }

  /* ---------- player mode: the same dock, reparented and given the whole
     screen instead of floating in a corner ---------- */

  #view-player {
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 32px 28px;
  }

  #view-player[hidden] { display: none; }

  .player-stage-wrap {
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }

  .player-stage-wrap[hidden] { display: none; }

  /* Still `position: fixed` in stage mode — see `syncStagePosition` in
     `Player` for why the dock is never actually reparented into
     `#player-stage-mount`, only overlaid on top of it. */
  #player-dock.stage {
    box-shadow: none;
  }

  #player-dock.stage .player-dock-spotify {
    padding: 36px 24px;
  }

  #player-dock.stage .player-dock-spotify-title {
    font-size: 22px;
  }

  #player-dock.stage .player-dock-spotify-sub {
    font-size: 13px;
  }

  #player-dock.stage .player-dock-queue {
    max-height: none;
  }

  /* The expand/collapse chevron toggles `dockEl.hidden`, which would just
     blank the stage on a dedicated Player-mode page — disabled there in
     favor of the mode switcher as the only way in/out. */
  body.player-stage #player-bar-expand {
    visibility: hidden;
    pointer-events: none;
  }

  .player-stage-empty {
    max-width: 420px;
    margin: 14vh auto 0;
    padding: 0 24px;
    text-align: left;
    color: var(--ink-soft);
  }

  .player-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: var(--player-bar-h);

    grid-template-columns: auto 1fr auto auto auto;
    align-items: center;
    gap: 16px;
    padding: 0 16px;
    background: var(--paper-deeper);
    border-top: 1px solid var(--rail);
    z-index: 70;

  .player-bar[hidden] { display: none; }

  body.has-player #main,
  body.has-player .rail {
    padding-bottom: var(--player-bar-h);
  }

  .player-bar-art {

  .player-bar-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    min-width: 220px;
  }

  .player-bar-transport {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .bar-btn {
    flex: none;
    border: none;
    background: transparent;
    color: var(--ink-soft);

    width: 32px;
    height: 32px;

    align-items: center;

  .bar-btn-toggle {

  .bar-btn-accent {

  .bar-btn-accent:hover:not(:disabled) { filter: brightness(1.2); }
  .bar-btn-accent:disabled { background: var(--rail); color: var(--paper); }

  .player-bar-progress {
    display: flex;
    align-items: center;

  .player-bar-progress[hidden] { display: none; }

  .player-bar-time {

    width: 32px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-soft);
    text-align: center;

  .player-bar-seek {
    flex: 1;
    min-width: 0;
    height: 3px;
    accent-color: var(--verdigris);
    cursor: pointer;
  }

  .player-bar-volume {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
  }

  .player-bar-volume[hidden] { display: none; }

  .player-bar-volume-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .player-bar-volume-icon {
    flex: none;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    width: 16px;
    height: 16px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .player-bar-volume-mute { cursor: pointer; }
  .player-bar-volume-mute:hover:not(:disabled) { color: var(--ink); }
  .player-bar-volume-mute:disabled { opacity: 0.35; cursor: default; }
  .player-bar-volume-mute[aria-pressed="true"] { color: var(--brass-ink); }

  .player-bar-volume-slider {
    width: 64px;
    height: 3px;
    accent-color: var(--verdigris);

  .player-bar-volume-slider:disabled {

    cursor: default;
  }

  @media (max-width: 900px) {
    .player-bar-volume { display: none; }
  }

  @media (max-width: 760px) {
    .app {
      grid-template-columns: 1fr;
      grid-template-rows: 46vh 1fr;
    }
    .rail { border-right: none; border-bottom: 1px solid var(--rail); }
    .invite { margin-top: 8vh; }
    :root { --player-bar-h: 76px; }
    .player-bar { gap: 10px; padding: 0 10px; }
    .player-bar-transport { gap: 0; }
    .player-bar-center { min-width: 0; }
    .player-bar-time { display: none; }
    #player-dock { right: 10px; left: 10px; width: auto; }
  }
</style>
</head>
<body>
  <div class="app">
    <aside class="rail" aria-label="Library">
      <div class="rail-head">
        <div class="rail-head-row">
          <p class="wordmark">Library</p>

          <button type="button" data-mode="graph" aria-pressed="false">Graph</button>
          <button type="button" data-mode="player" aria-pressed="false">Player</button>
        </nav>
        <div class="search-slot">

            <line x1="11" y1="11" x2="15" y2="15" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>

  <div id="player-dock" class="player-dock" hidden>

    <div class="player-bar-center">
      <div class="player-bar-transport">
        <button id="player-bar-shuffle" class="bar-btn bar-btn-toggle" type="button" aria-label="Shuffle" aria-pressed="false"></button>
        <button id="player-bar-prev" class="bar-btn" type="button" aria-label="Previous" disabled></button>
        <button id="player-bar-playpause" class="bar-btn bar-btn-accent" type="button" aria-label="Play">

      </div>

        <span id="player-bar-time-elapsed" class="player-bar-time">0:00</span>

        <input id="player-bar-volume-player-slider" class="player-bar-volume-slider" type="range" min="0" max="100" value="100" step="1" aria-label="Player volume" title="Player volume — balance between sources" />

<!-- The relations graph renders as plain SVG driven by d3-force/d3-drag/
     d3-zoom — only d3-force's own dist bundle expects d3-quadtree/
     d3-dispatch/d3-timer as separate globals rather than bundling them, so
     the full d3 bundle (self-contained, one script tag) is what's loaded
     rather than stitching those together by hand for one module. -->
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
(() => {
  "use strict";

  const railStatus = document.getElementById("rail-status");
  const resultsEl = document.getElementById("results");
  const searchEl = document.getElementById("search");
  // `mainEl` is the Library-mode content area specifically — Graph and
  // Player each got their own permanent sibling view once the app grew
  // dedicated modes (see `setMode` below); Library-mode functions
  // (`viewEntry`/`renderError`/`showInvite`) still just wholesale-replace
  // this one, same as before.
  const mainEl = document.getElementById("view-library");
  const modeSwitcherEl = document.getElementById("mode-switcher");
  const viewLibraryEl = mainEl;
  const viewGraphEl = document.getElementById("view-graph");
  const viewPlayerEl = document.getElementById("view-player");
  const playerStageWrapEl = document.getElementById("player-stage-wrap");
  const playerStageMountEl = document.getElementById("player-stage-mount");
  const playerStageEmptyEl = document.getElementById("player-stage-empty");
  const shuffleLibraryBtn = document.getElementById("shuffle-library");

  const PLATFORM_COLOR = {
    youtube: "#b5342f",
    spotify: "#3c8c5b",
    soundcloud: "#b5651d",
    nicovideo: "#5b5b52",
  };

  const TYPE_ORDER = ["track", "release", "release_group", "artist"];
  const TYPE_LABEL = {
    track: "Tracks",
    release: "Releases",
    release_group: "Release groups",
    artist: "Artists",
  };

  let searchToken = 0;
  let activeId = null;
  // The card header elements (kicker/title/meta/stamps) currently mounted
  // for `activeId`, kept around so a dedup edit can patch their text/stamps
  // in place (`refreshAfterEdit`) instead of tearing down and rebuilding the
  // whole detail view — see that function for why.
  let cardEls = null;

  // Which entry Graph mode is anchored on — independent of `activeId`
  // (Library mode's own "what's open" pointer): browsing Library and
  // inspecting relations can point at two different entries at once, each
  // remembered separately so switching modes doesn't clobber the other.
  let graphActiveId = null;

  // ---------- modes: Library / Graph / Player ----------
  //
  // One `main` element, three permanent view containers (see the body HTML)
  // instead of one that gets wholesale-replaced per screen. Switching modes
  // never touches the other two views' DOM, which is what lets Graph mode's
  // d3 simulation and Player mode's reparented dock (see `Player.setStageMode`
  // below) survive a mode switch instead of being torn down and rebuilt.
  let currentMode = "library";

  function setMode(mode) {
    currentMode = mode;
    viewLibraryEl.hidden = mode !== "library";
    viewGraphEl.hidden = mode !== "graph";
    viewPlayerEl.hidden = mode !== "player";
    for (const btn of modeSwitcherEl.querySelectorAll("button[data-mode]")) {
      btn.setAttribute("aria-pressed", String(btn.dataset.mode === mode));
    }
    Player.setStageMode(mode === "player", playerStageMountEl);
    if (mode === "player") refreshPlayerStageVisibility();
  }

  modeSwitcherEl.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-mode]");
    if (!btn) return;
    goToMode(btn.dataset.mode);
  });

  function goToMode(mode) {
    if (mode === "library") {
      if (activeId) viewEntry(activeId);
      else {
        history.pushState({}, "", "/");
        setMode("library");
      }
    } else if (mode === "graph") {
      if (graphActiveId) viewGraph(graphActiveId);
      else {
        history.pushState({}, "", "/graph");
        setMode("graph");
      }
    } else if (mode === "player") {
      history.pushState({}, "", "/player");
      setMode("player");
    }
  }

  function el(tag, attrs, children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined) continue;
      if (k === "text") node.textContent = v;
      else if (k === "className") node.className = v;
      else if (k.startsWith("on") && typeof v === "function") node[k] = v;
      else if (typeof v === "boolean" && !k.startsWith("aria-")) {
        // Plain HTML boolean attributes (disabled, allowfullscreen, ...) are
        // presence-based: any value, including the string "false", means
        // true. ARIA state attributes are the opposite — they need the
        // literal "true"/"false" string — so those still fall through below.
        if (v) node.setAttribute(k, "");
      } else {
        node.setAttribute(k, typeof v === "boolean" ? String(v) : v);
      }
    }
    for (const c of children || []) {
      if (c) node.appendChild(c);
    }
    return node;
  }

  // ---------- transport icons: inline SVG, no icon font/CDN ----------
  //
  // Hand-drawn (not pulled from a specific library's asset file) in a plain
  // Feather/Lucide-style stroke — 24x24 viewBox, currentColor, no fills —
  // so buttons stay crisp at any size and recolor with the surrounding
  // text/hover state for free. Kept inline rather than fetched from a CDN:
  // this is a self-hosted, single-file app meant to work without a network
  // round trip just to render its own chrome.
  const ICON_PATHS = {
    play: '<polygon points="6 3 20 12 6 21 6 3"></polygon>',
    pause: '<rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect>',
    "skip-back": '<polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line>',
    "skip-forward": '<polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line>',
    shuffle:
      '<polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line>',
    repeat:
      '<polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path>',
    "repeat-1":
      '<polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path><text x="12.5" y="15.5" text-anchor="middle" font-size="8" font-family="sans-serif" font-weight="700" stroke="none" fill="currentColor">1</text>',
    "chevron-down": '<polyline points="6 9 12 15 18 9"></polyline>',
    "chevron-up": '<polyline points="18 15 12 9 6 15"></polyline>',
    x: '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>',
    "volume-2":
      '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 5a10 10 0 0 1 0 14"></path>',
    "volume-x":
      '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>',
    headphones:
      '<path d="M4 13v-1a8 8 0 0 1 16 0v1"></path><rect x="2" y="13" width="5" height="7" rx="2"></rect><rect x="17" y="13" width="5" height="7" rx="2"></rect>',
    // Simplified, hand-drawn nods to each provider's mark (rounded-rect +
    // play triangle / circle + rising bars) rather than a traced reproduction
    // of the real logo — enough to read as "YouTube" / "Spotify" at a glance
    // in the per-player volume dial, in the same outline style as every
    // other icon here.
    youtube:
      '<rect x="2" y="5" width="20" height="14" rx="5"></rect><polygon points="10 9 16 12 10 15 10 9" fill="currentColor" stroke="none"></polygon>',
    spotify:
      '<circle cx="12" cy="12" r="10"></circle><path d="M6.5 9.5c3.5-1.2 8-1.2 11.5 1"></path><path d="M7 13c2.8-0.9 6.2-0.9 9.5 1"></path><path d="M7.5 16.3c2.2-0.6 5-0.6 7.5 0.8"></path>',
  };

  function svgIcon(name, size = 16) {
    return (
      `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" ` +
      `stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[name]}</svg>`
    );
  }

  // ---------- spotify: connect + playback, entirely client-side ----------
  //
  // Authorization Code with PKCE (https://developer.spotify.com/documentation/web-api/tutorials/code-pkce-flow)
  // needs no client secret and no server involvement, so the whole flow —
  // and the token store — lives here in the browser via localStorage. This
  // is a personal, single-user, localhost app: that's an appropriate place
  // to keep it, not a backend concern.
  const Spotify = (() => {
    const SCOPES = "streaming user-read-email user-read-private user-modify-playback-state user-read-playback-state";
    // YouTube's embed-permission check treats the raw IP-literal origin
    // differently from a named host, so the app is now browsed via
    // `localhost` (see Player's YouTube mount for its own localhost-only
    // trick) — but the Spotify app's redirect URI is registered as
    // `127.0.0.1`. Normalize back down to that so Connect keeps working
    // without having to re-register anything in the Spotify dashboard.
    //
    // Pinned to `/`, not `location.pathname`: a registered OAuth redirect
    // URI has to be a single static value, but the app now also serves
    // `/entry/{id}` deep links (see the URL-routing section near the bottom
    // of this file) — building this from whatever page happens to be open
    // would send Spotify a different redirect_uri per entry and break
    // Connect everywhere except whichever one URI got registered.
    const REDIRECT_URI = (location.origin + "/").replace("localhost", "127.0.0.1");
    const panelEl = document.getElementById("spotify-panel");

    let player = null;
    let playerReady = null;
    let deviceId = null;
    let lastError = "";
    let stateListener = null;

    function b64url(buffer) {
      return btoa(String.fromCharCode(...new Uint8Array(buffer)))
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");
    }

    function randomToken(len) {
      const bytes = new Uint8Array(len);
      crypto.getRandomValues(bytes);
      return b64url(bytes.buffer).slice(0, len);
    }

    async function challengeFor(verifier) {
      const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier));
      return b64url(digest);
    }

    function getClientId() {
      return localStorage.getItem("spotify_client_id") || "";
    }

    function getTokens() {
      try {
        return JSON.parse(localStorage.getItem("spotify_tokens") || "null");
      } catch {
        return null;
      }
    }

    function setTokens(t) {
      localStorage.setItem("spotify_tokens", JSON.stringify(t));
    }

    function clearTokens() {
      localStorage.removeItem("spotify_tokens");
    }

    function isConnected() {
      return !!getTokens();
    }

    // The other half of handleRedirect()'s 127.0.0.1 → localhost bounce:
    // tokens can't cross that origin boundary via localStorage, so they ride
    // in the URL fragment instead. Runs synchronously at module init, before
    // the caller's first render(), so "Connected" is correct on first paint.
    (function pickUpCarriedTokens() {
      const prefix = "#spotify_tokens=";
      if (!location.hash.startsWith(prefix)) return;
      try {
        setTokens(JSON.parse(decodeURIComponent(location.hash.slice(prefix.length))));
      } catch {
        // Malformed fragment — nothing to recover, just drop it below.
      }
      history.replaceState({}, "", location.pathname + location.search);
    })();

    // The other other half: connect() stores its PKCE verifier/state under
    // whatever origin it runs on, but the callback is forced to land on
    // 127.0.0.1 (REDIRECT_URI is pinned there — see above) since that's
    // where the Spotify app's redirect URI is registered. If connect() ran
    // on localhost, the callback would look for a verifier that only exists
    // in localhost's localStorage and never find it — a silent "state
    // mismatch" with no visible error, since handleRedirect()'s own bounce
    // then wipes the in-memory error message too. So: hop to 127.0.0.1
    // *before* generating the verifier, carrying the client id along (it's
    // not secret — Spotify's own /authorize URL exposes it anyway), and
    // resume the real connect() once actually there.
    (function resumeConnectIfRequested() {
      const clientId = new URLSearchParams(location.search).get("spotify_connect");
      if (!clientId) return;
      localStorage.setItem("spotify_client_id", clientId);
      history.replaceState({}, "", location.pathname);
      connect();
    })();

    function startConnect() {
      if (location.hostname === "127.0.0.1") {
        connect();
        return;
      }
      const port = location.port ? ":" + location.port : "";
      const cid = encodeURIComponent(getClientId());
      location.href =
        location.protocol + "//127.0.0.1" + port + location.pathname + "?spotify_connect=" + cid;
    }

    async function exchangeToken(body) {
      const res = await fetch("https://accounts.spotify.com/api/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body,
      });
      if (!res.ok) return null;
      const json = await res.json();
      return {
        access_token: json.access_token,
        refresh_token: json.refresh_token || getTokens()?.refresh_token,
        expires_at: Date.now() + json.expires_in * 1000,
      };
    }

    async function getValidAccessToken() {
      let tokens = getTokens();
      if (!tokens) return null;
      if (tokens.expires_at - Date.now() > 60000) return tokens.access_token;
      const clientId = getClientId();
      const refreshed = await exchangeToken(
        new URLSearchParams({ client_id: clientId, grant_type: "refresh_token", refresh_token: tokens.refresh_token })
      );
      if (!refreshed) {
        clearTokens();
        return null;
      }
      setTokens(refreshed);
      return refreshed.access_token;
    }

    async function connect() {
      const clientId = getClientId();
      if (!clientId) return;
      const verifier = randomToken(64);
      const state = randomToken(16);
      localStorage.setItem("spotify_pkce_verifier", verifier);
      localStorage.setItem("spotify_pkce_state", state);
      const challenge = await challengeFor(verifier);
      const params = new URLSearchParams({
        client_id: clientId,
        response_type: "code",
        redirect_uri: REDIRECT_URI,
        scope: SCOPES,
        code_challenge_method: "S256",
        code_challenge: challenge,
        state,
      });
      location.href = `https://accounts.spotify.com/authorize?${params}`;
    }

    function disconnect() {
      clearTokens();
      player?.disconnect();
      player = null;
      playerReady = null;
      deviceId = null;
      render();
    }

    async function handleRedirect() {
      const url = new URL(location.href);
      const code = url.searchParams.get("code");
      const state = url.searchParams.get("state");
      const error = url.searchParams.get("error");
      if (!code && !error) return;
      url.searchParams.delete("code");
      url.searchParams.delete("state");
      url.searchParams.delete("error");
      history.replaceState({}, "", url.pathname + url.search + url.hash);

      const expectedState = localStorage.getItem("spotify_pkce_state");
      const verifier = localStorage.getItem("spotify_pkce_verifier");
      localStorage.removeItem("spotify_pkce_state");
      localStorage.removeItem("spotify_pkce_verifier");

      if (error) {
        lastError = `Spotify declined: ${error}`;
      } else if (!verifier || state !== expectedState) {
        lastError = "Spotify connection failed (state mismatch). Try again.";
      } else {
        const tokens = await exchangeToken(
          new URLSearchParams({
            client_id: getClientId(),
            grant_type: "authorization_code",
            code,
            redirect_uri: REDIRECT_URI,
            code_verifier: verifier,
          })
        );
        if (tokens) {
          setTokens(tokens);
        } else {
          lastError = "Spotify connection failed while exchanging the code.";
        }
      }

      // The callback had to land on 127.0.0.1 (REDIRECT_URI is pinned to
      // it), but the rest of the app wants localhost — bounce now that the
      // token exchange is done. localStorage doesn't cross that origin
      // boundary, so whatever we just stored has to ride along in the URL
      // fragment for the localhost side to pick up (see the top of this
      // module) — otherwise the tokens exist but "Connected" never shows.
      if (location.hostname === "127.0.0.1") {
        const port = location.port ? ":" + location.port : "";
        const tokens = getTokens();
        const carry = tokens ? "#spotify_tokens=" + encodeURIComponent(JSON.stringify(tokens)) : "";
        location.replace(location.protocol + "//localhost" + port + location.pathname + location.search + carry);
        return;
      }
      render();
    }

    function loadSdk() {
      if (window.Spotify) return Promise.resolve(window.Spotify);
      return new Promise((resolve) => {
        window.onSpotifyWebPlaybackSDKReady = () => resolve(window.Spotify);
        const script = document.createElement("script");
        script.src = "https://sdk.scdn.co/spotify-player.js";
        document.head.appendChild(script);
      });
    }

    function ensurePlayer() {
      if (playerReady) return playerReady;
      playerReady = (async () => {
        const SpotifySdk = await loadSdk();
        const p = new SpotifySdk.Player({
          name: "Library",
          getOAuthToken: async (cb) => cb(await getValidAccessToken()),
          volume: 0.8,
        });
        p.addListener("ready", ({ device_id }) => {
          deviceId = device_id;
        });
        p.addListener("not_ready", () => {
          deviceId = null;
        });
        p.addListener("initialization_error", ({ message }) => {
          lastError = message;
          render();
        });
        p.addListener("authentication_error", ({ message }) => {
          lastError = message;
          clearTokens();
          render();
        });
        p.addListener("account_error", () => {
          lastError = "Spotify Premium is required for in-app playback.";
          render();
        });
        p.addListener("player_state_changed", (state) => stateListener?.(state));
        await p.connect();
        player = p;
        return p;
      })();
      return playerReady;
    }

    async function waitForDevice(timeoutMs) {
      const start = Date.now();
      while (!deviceId && Date.now() - start < timeoutMs) {
        await new Promise((r) => setTimeout(r, 150));
      }
      return deviceId;
    }

    /// Play `spotifyId` (a bare track id) on this app's Spotify Connect
    /// device, creating the device (and prompting the SDK's own connection
    /// handshake) on first use. Returns once playback has been requested —
    /// UI state (playing/paused) comes from `player_state_changed` events.
    async function play(spotifyId) {
      await ensurePlayer();
      const device = await waitForDevice(8000);
      if (!device) throw new Error("Spotify player didn't come online in time.");
      const token = await getValidAccessToken();
      const res = await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${device}`, {
        method: "PUT",
        headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({ uris: [`spotify:track:${spotifyId}`] }),
      });
      if (!res.ok && res.status !== 204) {
        throw new Error(`Spotify refused to play (${res.status}).`);
      }
    }

    /// Replaces the single active `player_state_changed` callback (the SDK
    /// listener itself is registered once, in `ensurePlayer`) — callers
    /// switching between tracks just call this again rather than stacking
    /// listeners.
    function setStateListener(cb) {
      stateListener = cb;
    }

    async function togglePlay() {
      if (player) await player.togglePlay();
    }

    /// Unlike the iframe-based providers, Spotify plays through a Connect
    /// device that keeps streaming even after the dock's visible surface is
    /// torn down or swapped to a different source — it has to be told to
    /// stop explicitly.
    async function pause() {
      if (player) await player.pause();
    }

    /// Raw SDK state (position/duration in ms, paused, current track id) —
    /// polled from Player's progress ticker since, unlike YouTube's IFrame
    /// API, the SDK only pushes `player_state_changed` on play/pause/seek/
    /// track-change, not continuously.
    async function getCurrentState() {
      return player ? player.getCurrentState() : null;
    }

    async function seek(positionMs) {
      if (player) await player.seek(positionMs);
    }

    /// `volume` is 0..1 — the SDK's own scale — unlike the bar's 0..100 UI
    /// slider or YouTube's IFrame API, which each use their own range.
    async function setVolume(volume) {
      if (player) await player.setVolume(volume);
    }

    /// Looks up the track's album art for the player bar thumbnail — the
    /// SDK's `player_state_changed` payload does carry `album.images`, but
    /// only once playback has actually started, which is too late for the
    /// bar to show art right away. A direct `/v1/tracks` lookup gets it
    /// as soon as mounting starts. Returns null on any failure (not
    /// connected, track not found, network error); callers fall back to
    /// the existing icon placeholder.
    async function getTrackArt(spotifyId) {
      try {
        const token = await getValidAccessToken();
        const res = await fetch(`https://api.spotify.com/v1/tracks/${spotifyId}`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        if (!res.ok) return null;
        const json = await res.json();
        const images = json.album?.images || [];
        // Spotify returns images largest-first (typically 640/300/64) —
        // the middle size is the closest analogue to YouTube's mqdefault.
        return images[1]?.url || images[0]?.url || null;
      } catch {
        return null;
      }
    }

    let editingClientId = false;

    function renderClientIdForm(cancelable) {
      const existing = getClientId();
      panelEl.appendChild(
        el("p", {
          className: "hint",
          text: existing
            ? "Update the Client ID, or cancel to keep the current one."
            : "Paste a Spotify app's Client ID to enable in-app playback.",
        })
      );
      const input = el("input", { type: "text", placeholder: "Client ID", value: existing });
      const buttons = [
        el("button", {
          className: "ghost-btn",
          type: "button",
          text: "Save",
          onclick: () => {
            const id = input.value.trim();
            if (!id) return;
            localStorage.setItem("spotify_client_id", id);
            editingClientId = false;
            render();
          },
        }),
      ];
      if (cancelable) {
        buttons.push(
          el("button", {
            className: "ghost-btn",
            type: "button",
            text: "Cancel",
            onclick: () => {
              editingClientId = false;
              render();
            },
          })
        );
      }
      panelEl.appendChild(el("div", { className: "rail-foot-row" }, [input, ...buttons]));
      panelEl.appendChild(
        el("div", { className: "redirect-box" }, [
          el("code", { text: REDIRECT_URI }),
          el("button", {
            className: "ghost-btn",
            type: "button",
            text: "Copy",
            onclick: () => navigator.clipboard?.writeText(REDIRECT_URI),
          }),
        ])
      );
      panelEl.appendChild(
        el("p", {
          className: "hint",
          style: "margin-top: 8px;",
          text: "Add that as a Redirect URI on developer.spotify.com/dashboard, then paste the app's Client ID above.",
        })
      );
    }

    function render() {
      panelEl.innerHTML = "";
      const dot = el("span", { className: "dot" + (isConnected() ? " on" : "") });
      const label = el("span", { text: isConnected() ? "Spotify connected" : "Spotify" });
      panelEl.appendChild(el("p", { className: "rail-foot-label" }, [dot, label]));

      if (isConnected()) {
        panelEl.appendChild(
          el("button", { className: "ghost-btn", type: "button", onclick: disconnect, text: "Disconnect" })
        );
      } else if (getClientId() && !editingClientId) {
        panelEl.appendChild(
          el("div", { className: "rail-foot-row" }, [
            el("button", { className: "ghost-btn", type: "button", onclick: startConnect, text: "Connect" }),
            el("button", {
              className: "ghost-btn",
              type: "button",
              text: "Edit",
              onclick: () => {
                editingClientId = true;
                render();
              },
            }),
          ])
        );
      } else {
        renderClientIdForm(!!getClientId());
      }

      if (lastError) {
        panelEl.appendChild(el("p", { className: "rail-foot-error", text: lastError }));
      }
    }

    return {
      render,
      handleRedirect,
      isConnected,
      play,
      togglePlay,
      pause,
      setStateListener,
      getCurrentState,
      seek,
      setVolume,
      getTrackArt,
    };
  })();

  const SPOTIFY_TRACK_PREFIX = "https://open.spotify.com/track/";

  // ---------- player: persistent bottom bar + floating dock ----------
  //
  // Lives outside `main` and is never rebuilt when the library view
  // re-renders — browsing to a different entry only ever touches `main`'s
  // contents, so whatever's mounted here (a YouTube iframe, a Spotify
  // Connect session) keeps running. The bar is always-visible transport
  // (title, prev/play-pause/next); the dock is the actual video/embed
  // surface, collapsible without tearing down what's mounted in it.
  const Player = (() => {
    const barEl = document.getElementById("player-bar");
    const dockEl = document.getElementById("player-dock");
    const surfaceEl = document.getElementById("player-dock-surface");
    const switchEl = document.getElementById("player-dock-switch");
    const dockQueueEl = document.getElementById("player-dock-queue");
    const artBtn = document.getElementById("player-bar-art");
    const thumbImg = document.getElementById("player-bar-thumb");
    const titleBtn = document.getElementById("player-bar-title");
    const subEl = document.getElementById("player-bar-sub");
    const shuffleBtn = document.getElementById("player-bar-shuffle");
    const prevBtn = document.getElementById("player-bar-prev");
    const playPauseBtn = document.getElementById("player-bar-playpause");
    const playPauseIcon = document.getElementById("player-bar-playpause-icon");
    const nextBtn = document.getElementById("player-bar-next");
    const repeatBtn = document.getElementById("player-bar-repeat");
    const expandBtn = document.getElementById("player-bar-expand");
    const expandIcon = document.getElementById("player-bar-expand-icon");
    const progressEl = document.getElementById("player-bar-progress");
    const seekInput = document.getElementById("player-bar-seek");
    const timeElapsedEl = document.getElementById("player-bar-time-elapsed");
    const timeTotalEl = document.getElementById("player-bar-time-total");
    const muteBtn = document.getElementById("player-bar-mute");
    const volumePlayerSlider = document.getElementById("player-bar-volume-player-slider");
    const volumeGlobalSlider = document.getElementById("player-bar-volume-global-slider");
    const volumePlayerIcon = document.getElementById("player-bar-volume-player-icon");

    // Static icons that never change; the dynamic ones (play/pause, expand,
    // repeat's off/all/one, mute) are (re)rendered by setPlayPauseUI/
    // setExpanded/setQueueUI/setVolumeUI as state changes.
    shuffleBtn.innerHTML = svgIcon("shuffle", 13);
    prevBtn.innerHTML = svgIcon("skip-back", 16);
    nextBtn.innerHTML = svgIcon("skip-forward", 16);
    playPauseIcon.innerHTML = svgIcon("play", 15);
    repeatBtn.innerHTML = svgIcon("repeat", 13);
    expandIcon.innerHTML = svgIcon("chevron-down", 14);

    let currentEntryId = null;
    let currentTitle = "";
    let provider = null;
    let ytPlayer = null;
    let expanded = true;
    // Whether the dock is currently reparented into Player mode's big stage
    // (see `setStageMode`) instead of floating over Library/Graph. Affects
    // whether the "up next" panel renders the full queue or just what's
    // ahead (`renderDockQueue`) and whether the bar's collapse chevron is
    // allowed to hide the dock (it isn't, in stage mode — see the CSS rule
    // for `body.player-stage #player-bar-expand`).
    let stageMode = false;
    // The `#player-stage-mount` placeholder to overlay the dock onto while
    // `stageMode` is active — see `syncStagePosition`.
    let stageMountEl = null;
    let onEndedCallback = null;
    let onPrevHandler = null;
    let onNextHandler = null;
    let onShuffleHandler = null;
    let onRepeatHandler = null;
    let onQueueJumpHandler = null;
    let onQueueRemoveHandler = null;
    // Bumped on every mountSource() call. Spotify.play() is async and can
    // still resolve after the user has switched to a different source —
    // mountSpotify() checks its own snapshot against the live value to
    // notice it's stale and pause the now-unwanted stream instead of
    // letting it start audio behind whatever's mounted now.
    let mountToken = 0;

    // ---- uniform progress: elapsed/duration + seek, polled the same way ----
    //
    // Neither embed pushes a continuous time update: YouTube's IFrame API is
    // pull-only (getCurrentTime/getDuration) and Spotify's SDK only fires
    // `player_state_changed` on play/pause/seek/track-change. A single poll
    // loop, swapped out per-provider in mountSource(), covers both uniformly
    // and doubles as the Spotify end-of-track detector (see below) since the
    // SDK has no `ended` event of its own.
    let progressTimer = null;
    let seeking = false;
    let lastSpotifyPlaying = false;
    let lastSpotifyPosition = 0;

    function formatTime(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) seconds = 0;
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m}:${String(s).padStart(2, "0")}`;
    }

    function showProgress(show) {
      progressEl.hidden = !show;
    }

    function updateProgressUI(position, duration) {
      if (seeking) return;
      seekInput.max = String(Math.max(1, Math.round(duration)));
      seekInput.value = String(Math.round(position));
      timeElapsedEl.textContent = formatTime(position);
      timeTotalEl.textContent = formatTime(duration);
    }

    function stopProgressPolling() {
      if (progressTimer) {
        clearInterval(progressTimer);
        progressTimer = null;
      }
    }

    function startYoutubeProgressPolling() {
      stopProgressPolling();
      showProgress(true);
      progressTimer = setInterval(() => {
        if (!ytPlayer || typeof ytPlayer.getCurrentTime !== "function") return;
        const duration = ytPlayer.getDuration();
        if (!duration) return;
        updateProgressUI(ytPlayer.getCurrentTime(), duration);
      }, 500);
    }

    function startSpotifyProgressPolling(token) {
      stopProgressPolling();
      showProgress(true);
      lastSpotifyPlaying = false;
      lastSpotifyPosition = 0;
      progressTimer = setInterval(async () => {
        const state = await Spotify.getCurrentState();
        if (!state || token !== mountToken) return;
        const position = state.position / 1000;
        const duration = state.duration / 1000;
        updateProgressUI(position, duration);
        // The SDK has no distinct "ended" event — a track that finished on
        // its own reports paused at position 0 right after having been
        // playing near the end, which a user pause/seek back to 0 wouldn't.
        const wasNearEnd = duration > 0 && lastSpotifyPosition >= duration - 1.2;
        if (lastSpotifyPlaying && state.paused && state.position === 0 && wasNearEnd) {
          onEndedCallback?.();
        }
        lastSpotifyPlaying = !state.paused;
        lastSpotifyPosition = position;
      }, 500);
    }

    seekInput.addEventListener("input", () => {
      seeking = true;
      timeElapsedEl.textContent = formatTime(Number(seekInput.value));
    });
    seekInput.addEventListener("change", () => {
      const value = Number(seekInput.value);
      if (provider === "youtube" && ytPlayer) ytPlayer.seekTo(value, true);
      else if (provider === "spotify") Spotify.seek(value * 1000).catch(() => {});
      seeking = false;
    });

    // ---- volume: two 0..100 dials whose product is the effective volume,
    // applied to whichever provider is mounted in its own scale (YouTube:
    // 0..100, Spotify SDK: 0..1) ----
    //
    // - "global" scales everything together.
    // - "player" is per-provider — it persists a separate value for
    //   youtube/spotify and swaps in the one for whichever is mounted, so it
    //   doubles as a balance control between the two.
    //
    // Both persisted so they carry across tracks and page reloads instead of
    // resetting to a default every time something new gets mounted.
    let volumeGlobal = 80;
    let volumeByProvider = {};
    let muted = false;
    // Whether the mounted provider exposes any volume control at all (false
    // for a bare "other" embed) — distinct from `muted`, which disables the
    // sliders on top of a controllable provider rather than because there's
    // nothing to control.
    let volumeControllable = true;
    try {
      // getItem returns null, not a numeric string, when nothing's been
      // saved yet — Number(null) is 0, not NaN, so that has to be checked
      // for explicitly or every first-time visitor would start muted.
      const raw = localStorage.getItem("player_volume_global");
      const saved = raw === null ? NaN : Number(raw);
      if (Number.isFinite(saved) && saved >= 0 && saved <= 100) {
        volumeGlobal = saved;
      } else {
        // Migrate the pre-split single-dial value, if any, so upgrading
        // doesn't silently reset an existing visitor's volume.
        const rawLegacy = localStorage.getItem("player_volume");
        const savedLegacy = rawLegacy === null ? NaN : Number(rawLegacy);
        if (Number.isFinite(savedLegacy) && savedLegacy >= 0 && savedLegacy <= 100) {
          volumeGlobal = savedLegacy;
        }
      }
      const rawByProvider = localStorage.getItem("player_volume_by_provider");
      if (rawByProvider) {
        const parsed = JSON.parse(rawByProvider);
        for (const key of ["youtube", "spotify"]) {
          const v = parsed?.[key];
          if (Number.isFinite(v) && v >= 0 && v <= 100) volumeByProvider[key] = v;
        }
      }
    } catch {}

    function playerVolume() {
      return volumeByProvider[provider] ?? 100;
    }

    function setVolumeUI() {
      volumeGlobalSlider.value = String(volumeGlobal);
      volumePlayerSlider.value = String(playerVolume());
      // Muted disables both dials on top of whatever `volumeControllable`
      // already dictates — there's nothing to drag them to while the
      // effective volume is pinned to zero.
      volumeGlobalSlider.disabled = !volumeControllable || muted;
      volumePlayerSlider.disabled = !volumeControllable || muted;
      const silent = muted || volumeGlobal === 0 || playerVolume() === 0;
      muteBtn.disabled = !volumeControllable;
      muteBtn.innerHTML = svgIcon(silent ? "volume-x" : "volume-2", 14);
      muteBtn.setAttribute("aria-label", silent ? "Unmute" : "Mute");
      muteBtn.setAttribute("aria-pressed", String(muted));
      // The per-player dial's icon names whichever provider it's actually
      // scoped to right now — headphones is the fallback for "other"
      // embeds and the no-track-loaded state, which have no such mark.
      const iconName = provider === "youtube" || provider === "spotify" ? provider : "headphones";
      volumePlayerIcon.innerHTML = svgIcon(iconName, 14);
      volumePlayerIcon.style.color = PLATFORM_COLOR[provider] || "";
    }

    function applyVolume() {
      const effective = muted ? 0 : (volumeGlobal / 100) * (playerVolume() / 100) * 100;
      if (provider === "youtube" && ytPlayer) ytPlayer.setVolume(effective);
      else if (provider === "spotify") Spotify.setVolume(effective / 100).catch(() => {});
    }

    setVolumeUI();

    volumeGlobalSlider.addEventListener("input", () => {
      volumeGlobal = Number(volumeGlobalSlider.value);
      muted = false;
      try {
        localStorage.setItem("player_volume_global", String(volumeGlobal));
      } catch {}
      applyVolume();
      setVolumeUI();
    });

    volumePlayerSlider.addEventListener("input", () => {
      volumeByProvider[provider] = Number(volumePlayerSlider.value);
      muted = false;
      try {
        localStorage.setItem("player_volume_by_provider", JSON.stringify(volumeByProvider));
      } catch {}
      applyVolume();
      setVolumeUI();
    });

    muteBtn.addEventListener("click", () => {
      muted = !muted;
      applyVolume();
      setVolumeUI();
    });

    // ---- YouTube: IFrame Player API, not a bare <iframe> ----
    //
    // A plain `<iframe src="…/embed/ID">` can't tell us when playback ends
    // or let the bar's play/pause button control it, so there'd be no way
    // to advance the queue or reflect state. The IFrame Player API creates
    // the iframe itself (given a mount element) and exposes both.
    let ytApiPromise = null;
    function loadYoutubeApi() {
      if (window.YT && window.YT.Player) return Promise.resolve(window.YT);
      if (ytApiPromise) return ytApiPromise;
      ytApiPromise = new Promise((resolve) => {
        window.onYouTubeIframeAPIReady = () => resolve(window.YT);
        const script = document.createElement("script");
        script.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(script);
      });
      return ytApiPromise;
    }

    // YouTube's numeric player error codes. 101/150 (the same restriction,
    // just two historical codes for it) is what a "does not allow
    // embedding" video reports — this covers both an explicit owner opt-out
    // *and* age-restricted videos, which YouTube blocks from every
    // third-party embed regardless of the owner's own embedding preference.
    const YT_ERROR_MESSAGES = {
      2: "That video's ID looks invalid.",
      5: "This video can't be played in an embedded player right now.",
      100: "This video was removed or made private.",
      101: "The video's owner doesn't allow it to play in embedded players like this one.",
      150: "The video's owner doesn't allow it to play in embedded players like this one.",
    };

    function setExpanded(v) {
      expanded = v;
      dockEl.hidden = (!v && !stageMode) || !currentEntryId;
      expandBtn.setAttribute("aria-pressed", String(v));
      expandBtn.setAttribute("aria-label", v ? "Collapse player" : "Expand player");
      expandIcon.innerHTML = svgIcon(v ? "chevron-down" : "chevron-up", 14);
      if (stageMode) syncStagePosition();
    }

    // Lines the dock's `position: fixed` box up with `#player-stage-mount`'s
    // on-page rect. The dock itself is NEVER reparented there (see
    // `setStageMode`) — this overlay is the whole point.
    function syncStagePosition() {
      if (!stageMode || !stageMountEl || dockEl.hidden) return;
      const r = stageMountEl.getBoundingClientRect();
      dockEl.style.left = `${r.left}px`;
      dockEl.style.top = `${r.top}px`;
      dockEl.style.width = `${r.width}px`;
      dockEl.style.right = "auto";
      dockEl.style.bottom = "auto";
    }

    // Toggles Player mode's big stage look for the dock (video/Spotify
    // surface, provider switcher, "up next" panel) by overlaying it on top
    // of `#player-stage-mount` with `position: fixed`, instead of actually
    // moving the node there. A real `appendChild` reparent survives fine for
    // the Spotify Connect surface (nothing but plain DOM), but browsers
    // reload a cross-origin `<iframe>` — the YouTube embed included — when
    // it's moved to a new place in the tree, which used to restart playback
    // every time Player mode was opened. Staying put in `document.body` and
    // only overlaying keeps a live YouTube iframe or Spotify SDK session
    // running exactly like it already does across a Library-mode
    // navigation.
    function setStageMode(active, stageHost) {
      if (active === stageMode) return;
      stageMode = active;
      stageMountEl = active ? stageHost : null;
      document.body.classList.toggle("player-stage", active);
      dockEl.classList.toggle("stage", active);
      if (active) {
        setExpanded(true);
      } else {
        dockEl.style.left = "";
        dockEl.style.top = "";
        dockEl.style.width = "";
        dockEl.style.right = "";
        dockEl.style.bottom = "";
        dockEl.hidden = !expanded || !currentEntryId;
      }
      renderDockQueue();
    }

    // The stage overlay tracks a fixed-positioned rect, not a real DOM
    // parent, so anything that can move `#player-stage-mount` on the page —
    // resizing the window, or scrolling `#view-player` itself — has to
    // re-measure it explicitly.
    window.addEventListener("resize", syncStagePosition);
    document.getElementById("view-player").addEventListener("scroll", syncStagePosition);

    function hasTrack() {
      return currentEntryId != null;
    }

    function updateBarMeta(title, sub, thumbUrl) {
      titleBtn.textContent = title || "(untitled)";
      subEl.textContent = sub || "";
      if (thumbUrl) {
        thumbImg.src = thumbUrl;
        thumbImg.hidden = false;
      } else {
        thumbImg.removeAttribute("src");
        thumbImg.hidden = true;
      }
    }

    function setPlayPauseUI(isPlaying, controllable) {
      playPauseBtn.disabled = !controllable;
      playPauseIcon.innerHTML = svgIcon(isPlaying ? "pause" : "play", 15);
      playPauseBtn.setAttribute("aria-label", isPlaying ? "Pause" : "Play");
    }

    function mountYoutube(videoId, watchUrl) {
      const wrapper = el("div", { className: "yt-mount" });
      const placeholder = el("div");
      wrapper.appendChild(placeholder);
      surfaceEl.appendChild(wrapper);
      setPlayPauseUI(false, false);
      loadYoutubeApi().then((YT) => {
        // The user may have skipped to a different track before the API
        // finished loading — the player would still spin up detached from
        // the dock, so bail rather than create an orphaned instance.
        if (!wrapper.isConnected) return;
        ytPlayer = new YT.Player(placeholder, {
          videoId,
          playerVars: { playsinline: 1, autoplay: 1, enablejsapi: 1 },
          events: {
            // Autoplay can be silently blocked (e.g. no prior user gesture,
            // or the browser's policy for unmuted video) — asserting
            // "playing" here regardless of that would desync the bar's icon
            // from reality, so read the actual state instead of assuming.
            onReady: (e) => {
              setPlayPauseUI(e.target.getPlayerState() === 1, true);
              applyVolume();
            },
            onStateChange: (e) => {
              if (e.data === YT.PlayerState.PLAYING) setPlayPauseUI(true, true);
              else if (e.data === YT.PlayerState.PAUSED) setPlayPauseUI(false, true);
              else if (e.data === YT.PlayerState.ENDED) onEndedCallback?.();
            },
            onError: (e) => {
              if (!wrapper.isConnected) return;
              const message = YT_ERROR_MESSAGES[e.data] || "This video can't be played here.";
              const willSkip = !!onEndedCallback;
              wrapper.innerHTML = "";
              wrapper.appendChild(
                el("p", { className: "note", text: message + (willSkip ? " Skipping…" : "") })
              );
              wrapper.appendChild(
                el("a", { className: "stamp", href: watchUrl, target: "_blank", rel: "noopener noreferrer" }, [
                  el("span", { className: "dot" }),
                  el("span", { text: "Watch on YouTube" }),
                ])
              );
              setPlayPauseUI(false, false);
              if (willSkip) setTimeout(() => onEndedCallback?.(), 1800);
            },
          },
        });
      });
      return wrapper;
    }

    function mountSpotify(spotifyId, title, token) {
      const status = el("p", { className: "player-dock-spotify-sub", text: "Connecting to Spotify…" });
      surfaceEl.appendChild(
        el("div", { className: "player-dock-spotify" }, [
          el("p", { className: "player-dock-spotify-title", text: title || "(untitled)" }),
          status,
        ])
      );
      setPlayPauseUI(false, false);
      Spotify.setStateListener((state) => {
        if (!state || token !== mountToken) return;
        const playingThis = state.track_window?.current_track?.id === spotifyId;
        if (!playingThis) return;
        setPlayPauseUI(!state.paused, true);
        status.textContent = state.paused ? "Paused" : "Playing via your Spotify account";
      });
      Spotify.play(spotifyId)
        .then(() => {
          // The user may have switched to a different source while this
          // request was in flight — the device would otherwise start
          // playing this track anyway, underneath whatever's mounted now.
          if (token !== mountToken) {
            Spotify.pause().catch(() => {});
            return;
          }
          status.textContent = "Playing via your Spotify account";
          applyVolume();
        })
        .catch((err) => {
          if (token !== mountToken) return;
          status.textContent = err.message;
        });
    }

    function mountSource(source) {
      const isSpotify =
        source.provider === "spotify" && Spotify.isConnected() && source.identifier.startsWith(SPOTIFY_TRACK_PREFIX);
      // Spotify plays via a Connect device, not the DOM — clearing/replacing
      // surfaceEl below doesn't stop it like it would a YouTube iframe, so
      // switching away from an active Spotify source has to pause it
      // explicitly (switching Spotify -> Spotify doesn't need this: the
      // follow-up play() call below just replaces what the device streams).
      if (provider === "spotify" && !isSpotify) {
        Spotify.pause().catch(() => {});
      }
      mountToken++;
