            disabled: !t.playable,
            "aria-label": "Add to queue",
            onclick: t.playable ? () => queueTrack(t.entry_id, t.title) : null,
          }, [queueIcon]),
        ]
      ),
    ]);
  }

  function sectionLabel(text, aside) {
    return el("h2", { className: "section-label" }, [
      el("span", { text }),
      aside ? el("span", { text: aside }) : null,
    ]);
  }

  // Fills an artist's page: a summary into `metaEl`, then a shuffle button,
  // most-played tracks, the release grid and the track list into `host`.
  function fillArtistPage(host, metaEl, disco) {
    const { releases, tracks } = disco;
    const mainReleases = releases.filter((r) => r.main && r.kind !== "playlist");
    const count = (kinds) => mainReleases.filter((r) => kinds.includes(r.kind)).length;
    const totalPlays = tracks.reduce((n, t) => n + t.plays, 0);
    metaEl.textContent = [
      count(["album", "compilation"]) && plural(count(["album", "compilation"]), "album"),
      count(["ep"]) && plural(count(["ep"]), "EP"),
      count(["single"]) && plural(count(["single"]), "single"),
      tracks.length && plural(tracks.length, "track"),
      totalPlays && plural(totalPlays, "play"),
    ]
      .filter(Boolean)
      .join(" · ");

    if (!releases.length && !tracks.length) {
      host.appendChild(
        el("p", {
          className: "note artist-empty",
          text: "Nothing by this artist is in the library yet — import their discography from Import.",
        })
      );
      return;
    }

    const playable = tracks.filter((t) => t.playable).map((t) => ({ entry_id: t.entry_id, title: t.title }));
    if (playable.length) {
      const icon = el("span", { className: "play-cta-icon" });
      icon.innerHTML = svgIcon("shuffle", 14);
      const mainPlayable = tracks
        .filter((t) => t.playable && t.main)
        .map((t) => ({ entry_id: t.entry_id, title: t.title }));
      host.appendChild(
        el("div", { className: "play-cta-row" }, [
          el(
            "button",
            {
              className: "play-cta",
              type: "button",
              onclick: () => {
                const pool = mainPlayable.length ? mainPlayable : playable;
                startQueue(shuffleArray(pool), 0);
              },
            },
            [icon, el("span", { text: "Shuffle" })]
          ),
          el("span", { className: "play-cta-hint", text: `${plural(playable.length, "playable track")}` }),
        ])
      );
    }

    const top = tracks
      .filter((t) => t.plays > 0)
      .sort((a, b) => b.plays - a.plays || (b.release_date || "").localeCompare(a.release_date || ""))
      .slice(0, TOP_TRACKS);
    if (top.length) {
      const queue = top.filter((t) => t.playable).map((t) => ({ entry_id: t.entry_id, title: t.title }));
      host.appendChild(
        el("section", { className: "artist-section" }, [
          sectionLabel("Most played"),
          el("ul", { className: "manifest" }, top.map((t) => artistTrackRow(t, queue, { showDate: false }))),
        ])
      );
    }

    if (releases.length) {
      const grid = el("ul", { className: "release-grid" });
      const chips = filterChips(RELEASE_FILTERS, releases, (i) => {
        const shown = releases.filter(RELEASE_FILTERS[i].test);
        // "All" is the overview: albums first, then EPs, singles, ... —
        // newest first within each (the server's order). The other chips
        // hold one kind each and stay purely chronological.
        if (i === 0) shown.sort((a, b) => RELEASE_KIND_RANK.indexOf(a.kind) - RELEASE_KIND_RANK.indexOf(b.kind));
        fillPreviewList(grid, shown.map(releaseTile), RELEASE_PREVIEW, "release");
      });
      host.appendChild(
        el("section", { className: "artist-section" }, [
          sectionLabel("Discography", plural(releases.length, "release")),
          chips,
          grid,
        ])
      );
    }

    if (tracks.length) {
      const filters = [
        { label: "All", test: () => true },
        { label: "Main", test: (t) => t.main },
        { label: "Featured & credits", test: (t) => !t.main },
      ];
      // "Main" only says something next to a non-empty "Featured".
      if (tracks.every((t) => t.main)) filters.splice(1, 2);
      const list = el("ul", { className: "manifest" });
      let filter = filters[0];
      const search = el("input", {
        className: "track-filter",
        type: "search",
        placeholder: "Filter tracks",
        "aria-label": "Filter tracks",
      });
      const render = () => {
        const q = search.value.trim().toLowerCase();
        const shown = tracks.filter((t) => filter.test(t) && (!q || (t.title || "").toLowerCase().includes(q)));
        const queue = shown.filter((t) => t.playable).map((t) => ({ entry_id: t.entry_id, title: t.title }));
        fillPreviewList(list, shown.map((t) => artistTrackRow(t, queue)), q ? Infinity : TRACK_PREVIEW, "track");
      };
      search.addEventListener("input", render);
      const chips = filterChips(filters, tracks, (i) => {
        filter = filters[i];
        render();
      });
      chips.appendChild(search);
      host.appendChild(
        el("section", { className: "artist-section" }, [
          sectionLabel("Tracks", plural(tracks.length, "track")),
          chips,
          list,
        ])
      );
    }
  }

  // Fills a track's page from `GET /api/entries/{id}/appearances`: the
  // meta line's "from <release>" (the first one, the oldest by the track's
  // own artists), a release date when the track carries none of its own,
  // and the "Appears on" grid into `host`.
  function fillAppearances(host, releases, entry, fromEl, dateEl) {
    const home = releases[0];
    fromEl.replaceChildren(
      document.createTextNode("from "),
      entryLink(home.entry_id, home.title || "(untitled)", "credit-name")
    );
    const earliest = releases.map((r) => r.release_date).filter(Boolean).sort()[0];
    if (!entry.release_date && earliest) {
      dateEl.textContent = releasedText(earliest);
      if (cardEls) cardEls.fallbackDate = earliest;
    }
    const grid = el("ul", { className: "release-grid" });
    host.appendChild(
      el("section", { className: "artist-section appearances" }, [
        sectionLabel("Appears on", plural(releases.length, "release")),
        grid,
      ])
    );
    fillPreviewList(
      grid,
      releases.map((r) => releaseTile(r, { position: trackPosition(r) })),
      RELEASE_PREVIEW,
      "release"
    );
  }

  // Where a release lists the track: "Track 5", or "Disc 2 · Track 5".
  function trackPosition(r) {
    if (r.track_no == null) return "";
    return r.disc_no > 1 ? `Disc ${r.disc_no} · Track ${r.track_no}` : `Track ${r.track_no}`;
  }

  function shuffleArray(items) {
    const a = items.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // `push` (default true): whether this navigation gets its own history
  // entry. A genuine navigation (search result, tracklist row, the player
  // bar's title) should; re-rendering the entry you're already on after a
  // dedup edit shouldn't pile up a redundant back-stack entry — those calls
  // pass `{ push: false }`, which still updates the URL (so a refresh
  // reflects any edit) but replaces the current history entry instead.
  async function viewEntry(entryId, opts = {}) {
    activeId = entryId;
    setMode("library");
    for (const btn of resultsEl.querySelectorAll(".result")) {
      btn.setAttribute("aria-selected", "false");
    }

    let entry;
    try {
      entry = await api(`/api/entries/${entryId}`);
    } catch (err) {
      renderError(err.message);
      return;
    }

    const url = `/entry/${entryId}`;
    if (opts.push !== false && location.pathname !== url) {
      history.pushState({ entryId }, "", url);
    } else {
      history.replaceState({ entryId }, "", url);
    }

    const detail = el("div", { className: "detail enter", id: "card" });

    detail.appendChild(
      el("div", { className: "card-kicker" }, [
        el("span", { text: catalogNo(entry.entry_id) }),
        el("span", { text: friendlyType(entry.entry_type) }),
      ])
    );
    const titleEl = el("h1", { className: "card-title", text: entry.title || "(untitled)" });
    const headingEl = el("div", { className: "entry-heading" }, [titleEl]);
    headingEl.appendChild(
      nameEditor({
        label: "rename",
        className: "card-rename",
        value: entry.title || "",
        aliases: entry.aliases || [],
        renamed: entry.renamed,
        resetLabel: "Use the sources' name",
        onSave: async (name) => {
          const next = await postJson(`/api/entries/${entryId}/display-name`, { name });
          titleEl.textContent = next.title || "(untitled)";
          refreshSearchIfActive();
          return { value: next.title || "", aliases: next.aliases || [], renamed: next.renamed };
        },
      })
    );

    // A track's releases: its "from" link, its fallback release date, and
    // the "Appears on" grid at the bottom. Fetched alongside the rest.
    const appearancesReq =
      entry.entry_type === "track"
        ? api(`/api/entries/${entryId}/appearances`).catch(() => ({ releases: [] }))
        : null;

    // "by <credits> · from <release> · Released <date>" — the credits and
    // the release fill in once loaded.
    const bylineEl = el("span", { className: "card-byline" });
    const fromEl = el("span", { className: "card-from" });
    // Artists have no release date; don't announce its absence.
    const dateEl = el("span", {
      className: "card-date",
      text: entry.entry_type === "artist" && !entry.release_date ? "" : releasedText(entry.release_date),
    });
    headingEl.appendChild(el("p", { className: "card-meta" }, [bylineEl, fromEl, dateEl]));
    // Every entry shows its picture beside the heading (see `cover.rs` for
    // where it comes from — a track's is usually its release's).
    detail.appendChild(
      el("div", { className: "entry-hero", "data-type": entry.entry_type }, [
        artBox(entry.entry_id, "hero-art", entry.title),
        headingEl,
      ])
    );

    const dupesEl = el("section", { className: "nrs-dupes-warning", hidden: true, "data-kind": friendlyType(entry.entry_type).toLowerCase() });
    detail.appendChild(dupesEl);
    loadNrsDuplicates(entryId, dupesEl);

    if (entry.entry_type !== "artist") {
      const creditsEl = el("div", { className: "credits", hidden: true });
      detail.appendChild(creditsEl);
      loadCredits(entryId, creditsEl, bylineEl);
    }

    // A track and its instrumental (or other `EDITION_KINDS` relation, see
    // `musicdb::EDITION_KINDS`) are distinct identities, unlike `members`
    // — the library list already collapsed them into this one row
    // (`dedupe_by_edition`), so picking one here just navigates to the other
    // identity's own entry page instead of merging anything. Editions and
    // sources are always mounted (just hidden when empty) so
    // `refreshAfterEdit` has stable elements to refill in place when a
    // relate or dedup edit changes them.
    const editionsEl = el("section", { className: "edition-list" });
    fillEditionList(editionsEl, entry.editions);
    const sourcesEl = el("section", { className: "sources" });
    fillSources(sourcesEl, entry);
    cardEls = { title: titleEl, date: dateEl, sources: sourcesEl, editions: editionsEl };

    if (entry.entry_type === "artist") {
      const others = (entry.aliases || []).filter((a) => a !== entry.title);
      if (others.length) {
        titleEl.after(el("p", { className: "artist-aliases", text: others.join(" · ") }));
      }
      const disco = await api(`/api/entries/${entryId}/discography`).catch(() => null);
      if (disco) {
        fillArtistPage(detail, dateEl, disco);
      } else {
        detail.appendChild(el("p", { className: "note", text: "Couldn't load this artist's discography." }));
      }
    } else {
      const playable = await api(`/api/entries/${entryId}/playable-sources`).catch(() => ({ sources: [] }));
      if (playable.sources.length) {
        detail.appendChild(buildPlayCta(entryId, entry.title, playable.sources));
      } else if (entry.entry_type === "track") {
        detail.appendChild(buildFindCta(entry));
      }
    }

    detail.appendChild(editionsEl);
    detail.appendChild(sourcesEl);
    const unmergeEl = el("section", { className: "unmerge" });
    mountUnmerge(unmergeEl, entry);
    detail.appendChild(unmergeEl);

    // Relations/dedup calibration lives in its own full-screen mode now
    // (see `viewGraph`) rather than embedded here — just a way in.
    detail.appendChild(
      el("button", {
        className: "ghost-btn relations-link",
        type: "button",
        text: "View relations →",
        onclick: () => viewGraph(entryId),
      })
    );

    if (appearancesReq) {
      const { releases } = await appearancesReq;
      if (releases.length) fillAppearances(detail, releases, entry, fromEl, dateEl);
    }

    if (entry.entry_type === "release" || entry.entry_type === "release_group") {
      const tracks = await api(`/api/releases/${entryId}/tracks`).catch(() => ({ tracks: [] }));
      if (tracks.tracks.length) {
        // Only playable tracks enter the queue — the rest are still shown
        // (so the tracklist reads as the complete release) but their play
        // button is disabled, per their own `playable` flag from the
        // server. The row itself always navigates to the track's page.
        // `release_id` tells the now-playing drawer which album a track
        // is being played from.
        const playableTracks = tracks.tracks
          .filter((t) => t.playable)
          .map((t) => ({ entry_id: t.entry_id, title: t.title, release_id: entryId }));

        detail.appendChild(el("p", { className: "manifest-label", text: "Tracklist" }));
        const list = el("ul", { className: "manifest" });
        // Track numbers restart on each disc, so a multi-disc release gets
        // a heading per disc.
        const multiDisc = tracks.tracks.some((t) => t.disc_no > 1);
        let disc;
        for (const t of tracks.tracks) {
          if (multiDisc && t.disc_no !== disc) {
            disc = t.disc_no;
            list.appendChild(el("li", { className: "manifest-disc", text: disc != null ? `Disc ${disc}` : "No disc" }));
          }
          const queuePos = playableTracks.findIndex((pt) => pt.entry_id === t.entry_id);
          const playIcon = el("span", { className: "manifest-play-icon" });
          playIcon.innerHTML = svgIcon(Player.isPlayingEntry(t.entry_id) ? "pause" : "play", 12);
          const queueIcon = el("span", { className: "manifest-play-icon" });
          queueIcon.innerHTML = svgIcon("plus", 12);
          list.appendChild(
            el("li", {}, [
              el(
                "div",
                {
                  className: "manifest-row" + (Player.isPlayingEntry(t.entry_id) ? " is-playing" : ""),
                  "data-entry-id": String(t.entry_id),
                },
                [
                  el("span", { className: "manifest-no", text: t.track_no != null ? String(t.track_no) : "—" }),
                  el("button", {
                    className: "manifest-play",
                    type: "button",
                    disabled: !t.playable,
                    "aria-label": Player.isPlayingEntry(t.entry_id) ? "Pause" : "Play",
                    onclick: t.playable
                      ? (ev) => {
                          ev.stopPropagation();
                          if (Player.isPlayingEntry(t.entry_id)) {
                            Player.togglePlay();
                          } else {
                            startQueue(playableTracks, queuePos);
                          }
                        }
                      : null,
                  }, [playIcon]),
                  el("button", {
                    className: "manifest-title",
                    type: "button",
                    text: t.title || "(untitled)",
                    onclick: () => viewEntry(t.entry_id),
                  }),
                  el("button", {
                    className: "manifest-queue",
                    type: "button",
                    disabled: !t.playable,
                    "aria-label": "Add to queue",
                    onclick: t.playable
                      ? (ev) => {
                          ev.stopPropagation();
                          queueTrack(t.entry_id, t.title);
                        }
                      : null,
                  }, [queueIcon]),
                ]
              ),
            ])
          );
        }
        detail.appendChild(list);
      }
    }

    mainEl.innerHTML = "";
    mainEl.appendChild(detail);

    for (const btn of resultsEl.querySelectorAll(".result")) {
      if (btn.dataset.entryId === String(entryId)) btn.setAttribute("aria-selected", "true");
    }
  }

  function renderError(message) {
    cardEls = null;
    mainEl.innerHTML = "";
    mainEl.appendChild(
      el("div", { className: "invite error" }, [
        el("p", { className: "lede", text: "Something went wrong." }),
        el("p", { className: "sub", text: message }),
      ])
    );
  }

  function showInvite() {
    activeId = null;
    cardEls = null;
    setMode("library");
    for (const btn of resultsEl.querySelectorAll(".result")) {
      btn.setAttribute("aria-selected", "false");
    }
    mainEl.innerHTML = "";
    mainEl.appendChild(
      el("div", { className: "invite", id: "invite" }, [
        el("p", { className: "lede", text: "Find something to play." }),
        el("p", { className: "sub" }, [
          document.createTextNode("Search across every source you've catalogued — press "),
          el("kbd", { text: "/" }),
          document.createTextNode(" to jump to search."),
        ]),
      ])
    );
  }

  // ---------- URL routing ----------
  //
  // `/entry/{id}`, `/graph`, `/graph/{id}`, and `/player` are the
  // client-side routes besides `/` — reading them on load means an F5 (or a
  // shared link) lands back on the mode/entry you were looking at instead of
  // always resetting to the empty invite screen. The server serves the
  // identical SPA shell for all of them (see player.rs `handles`/`route`);
  // everything past that is client-side.
  function routeFromUrl(push) {
    const path = location.pathname;
    let m;
    if ((m = path.match(/^\/entry\/(\d+)$/))) {
      viewEntry(Number(m[1]), { push });
    } else if ((m = path.match(/^\/graph\/(\d+)$/))) {
      viewGraph(Number(m[1]), { push });
    } else if (path === "/graph") {
      setMode("graph");
    } else if (path === "/player") {
      setMode("player");
    } else if (path === "/import") {
      setMode("import");
    } else if (path === "/settings") {
      setMode("settings");
    } else {
      showInvite();
    }
  }

  window.addEventListener("popstate", () => routeFromUrl(false));
  routeFromUrl(false);

  Ingest.render();
  Settings.render();
  Spotify.render();
  Spotify.handleRedirect();
})();
</script>
</body>
</html>
