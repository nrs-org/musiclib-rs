[project]
name = "musiclib-dedup-poc"
version = "0.1.0"
description = "Read-only candidate retrieval and identity scoring PoC"
requires-python = ">=3.11"
dependencies = ["pykakasi>=2.3,<3"]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0", "torch>=2", "hnswlib>=0.8,<0.9"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
dedup-poc = "dedup_poc.cli:main"
dedup-retrieval-benchmark = "dedup_poc.retrieval_benchmark:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dedup_poc"]
