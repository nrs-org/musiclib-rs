[workspace]
members = ["config/inference"]
resolver = "3"

[package]
name = "musiclib-rs"
version = "0.1.0"
edition = "2024"
autobins = false

[[bin]]
name = "update_fixtures"
path = "src/bin/update_fixtures.rs"

[[bin]]
name = "import"
path = "src/bin/import/main.rs"

[[bin]]
name = "dedup"
path = "src/bin/dedup.rs"

[[bin]]
name = "mb_extract_urls"
path = "src/bin/mb_extract_urls.rs"

[[bin]]
name = "mb_fetch_replication"
path = "src/bin/mb_fetch_replication.rs"

[[bin]]
name = "mb_apply_replication"
path = "src/bin/mb_apply_replication.rs"

[[bin]]
name = "mb_sync_replication"
path = "src/bin/mb_sync_replication.rs"

[[bin]]
name = "ytdlp_server"
path = "src/bin/ytdlp_server.rs"

[[bin]]
name = "softmatch"
path = "src/bin/softmatch.rs"

[[bin]]
name = "server"
path = "src/bin/server/main.rs"

[features]
default = ["store_protocol", "player"]
# Generic C-ABI FFI rhai module (`pipeline::ffi`): bind/call any cdylib from a
# match script. Off by default — enabling it pulls libffi (built from source via
# autotools). See config/match.example.rhai for the inference-cdylib binding.
ffi = ["dep:libffi", "dep:libc"]
# `server` binary route groups (see src/bin/server/). No extra dependencies —
# both are gated purely to let a deployment build one without the other, e.g.
# `cargo build --bin server --no-default-features --features store_protocol`.
store_protocol = []
player = []

[dependencies]
libloading = "0.9"
# Runtime FFI call frames for the generic `ffi` rhai module (call any cdylib);
# gated behind the `ffi` feature (off by default) since it pulls libffi + an
# autotools build step. Vendored build: libffi-sys compiles + statically links
# its bundled libffi, so end users need only a C toolchain + autotools (provided
# by the dev shell), not a system-installed libffi.
libffi = { version = "3", optional = true }
libc = { version = "0.2", optional = true }
anyhow = "1.0.102"
async-trait = "0.1.89"
dashmap = "6.1.0"
dotenv = "0.15.0"
erased-serde = "0.4.10"
owo-colors = "4.3.0"
reqwest = { version = "0.13.3", features = ["json", "blocking"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
serde_yaml_ng = "0.10"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sea-orm = { version = "2.0.0-rc.38", features = [ "sqlx-sqlite", "runtime-tokio-native-tls", "macros", "schema-sync", "entity-registry" ] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "process"] }
hyper = { version = "1.9.0", features = ["server"] }
time = "0.3.47"
http = "1.4.0"
http-body-util = "0.1.3"
hyper-util = { version = "0.1.20", features = ["full"] }
hnsw = "0.11"
rand_pcg = "0.3"
space = "0.17"
urlencoding = "2.1.3"
regex = "1.12.3"
sha2 = "0.10"
fancy-regex = "0.18.0"
base64 = "0.22"
bytes = "1.11.1"
futures = "0.3.32"
clap = { version = "4.6.1", features = ["derive"] }
indicatif = "0.17"
bzip2 = "0.5"
tar = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
directories = "6.0.0"
rhai = "=1.25.1"
strsim = "0.11"
unicode-normalization = "0.1"
sqlite-vec = "0.1.9"
ureq = { version = "3.3.0", features = ["json"] }

[dev-dependencies]
tokio-util = "0.7.18"
tempfile = "3"
