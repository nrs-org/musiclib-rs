[package]
name = "musiclib-rs"
version = "0.1.0"
edition = "2024"
autobins = false

[[bin]]
name = "update_fixtures"
path = "src/bin/update_fixtures.rs"

[[bin]]
name = "import"
path = "src/bin/import/main.rs"

[[bin]]
name = "dedup"
path = "src/bin/dedup.rs"

[[bin]]
name = "mb_extract_urls"
path = "src/bin/mb_extract_urls.rs"

[[bin]]
name = "mb_fetch_replication"
path = "src/bin/mb_fetch_replication.rs"

[[bin]]
name = "mb_apply_replication"
path = "src/bin/mb_apply_replication.rs"

[[bin]]
name = "mb_sync_replication"
path = "src/bin/mb_sync_replication.rs"

[[bin]]
name = "ytdlp_server"
path = "src/bin/ytdlp_server.rs"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
dashmap = "6.1.0"
dotenv = "0.15.0"
erased-serde = "0.4.10"
owo-colors = "4.3.0"
reqwest = { version = "0.13.3", features = ["json", "blocking"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
serde_yaml_ng = "0.10"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sea-orm = { version = "2.0.0-rc.38", features = [ "sqlx-sqlite", "runtime-tokio-native-tls", "macros", "schema-sync", "entity-registry" ] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "process"] }
hyper = { version = "1.9.0", features = ["server"] }
time = "0.3.47"
http = "1.4.0"
http-body-util = "0.1.3"
hyper-util = { version = "0.1.20", features = ["full"] }
urlencoding = "2.1.3"
regex = "1.12.3"
sha2 = "0.10"
const_format = "0.2.36"
fancy-regex = "0.18.0"
base64 = "0.22"
bytes = "1.11.1"
futures = "0.3.32"
clap = { version = "4.6.1", features = ["derive"] }
indicatif = "0.17"
bzip2 = "0.5"
tar = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
directories = "6.0.0"

[dev-dependencies]
tokio-util = "0.7.18"
tempfile = "3"
