[package]
name = "musiclib-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
dashmap = "6.1.0"
dotenv = "0.15.0"
erased-serde = "0.4.10"
owo-colors = "4.3.0"
reqwest = { version = "0.13.3", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml_ng = "0.10"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sea-orm = { version = "2.0.0-rc.38", features = [ "sqlx-sqlite", "runtime-tokio-native-tls", "macros", "schema-sync", "entity-registry" ] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
time = "0.3.47"
http = "1.4.0"
http-body-util = "0.1.3"
hyper-util = { version = "0.1.20", features = ["full"] }
urlencoding = "2.1.3"
regex = "1.12.3"
const_format = "0.2.36"
fancy-regex = "0.18.0"

[dev-dependencies]
hyper = { version = "1.9.0", features = ["server"] }
tokio-util = "0.7.18"
